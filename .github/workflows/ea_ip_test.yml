name: EA IP Test (temporary)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run test (capture all output)
        run: |
          mkdir -p shared/data
          python shared/scripts/ea_ip_test.py > shared/data/ea_ip_test_result.txt 2>&1 || true
          echo "python exit/log captured" >> shared/data/ea_ip_test_result.txt
          cat shared/data/ea_ip_test_result.txt
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add shared/data/ea_ip_test_result.txt
          git commit -m "EA IP test result (temporary)"
          git pull --rebase && git push
