name: ReView (NFL) recon

# Manual only. Probes the ESPN endpoints scrape_review.py uses (scoreboard, summary,
# standings, leader candidates) once from a GitHub-hosted runner and logs status,
# key fields and the leader-id crosswalk. Commits nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests nflreadpy pandas pyarrow
      - name: Probe ESPN endpoints
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import requests, time
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/plain, */*", "Accept-Language": "en-US,en;q=0.9", "Referer": "https://www.espn.com/"}
          B = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/"
          def get(name, url):
              time.sleep(1)
              try:
                  r = requests.get(url, headers=H, timeout=30)
                  print(name, r.status_code, len(r.content), "bytes")
                  return r.json() if r.ok else None
              except Exception as ex:
                  print(name, "FAILED", type(ex).__name__, ex)

          sb = get("scoreboard", B + "scoreboard?seasontype=2&week=1")
          season = sb["season"]["year"]
          s = get("summary", B + "summary?event=" + sb["events"][0]["id"])
          print("  leaders:", [c["name"] for c in s["leaders"][0]["leaders"]], "scoring plays:", len(s.get("scoringPlays", [])))

          st = get("standings", f"https://site.api.espn.com/apis/v2/sports/football/nfl/standings?level=3&season={season}&seasontype=2")
          if st:
              for conf in st["children"]:
                  rows = [e for d in conf["children"] for e in d["standings"]["entries"]]
                  seeds = sorted(int(x["value"]) for e in rows for x in e["stats"] if x["name"] == "playoffSeed")
                  print(" ", conf["name"], "divisions", len(conf["children"]), "teams", len(rows), "playoffSeed", seeds)

          q = f"?season={season}&seasontype=2"
          v3 = get("leaders site v3", "https://site.api.espn.com/apis/site/v3/sports/football/nfl/leaders" + q)
          if v3:
              for c in v3["leaders"]["categories"]:
                  a = c["leaders"][0]
                  print(" ", c["name"], len(c["leaders"]), a["athlete"]["displayName"], a["value"])
          core = get("leaders core", f"https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/{season}/types/2/leaders?limit=10")
          if core:
              print("  core categories:", [c["name"] for c in core["categories"]])
          get("byathlete", f"https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/statistics/byathlete?season={season}&seasontype=2&limit=5")

          import nflreadpy as n
          p = n.load_players().to_pandas()
          print("nflreadpy players with espn_id:", int(p["espn_id"].notna().sum()))
          PY
