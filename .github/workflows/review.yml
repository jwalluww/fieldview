name: ReView (NFL) Monday refresh

# Picks up the weekend's games before Monday night: writes the in-progress week and the
# season file. The Tuesday "Scrape Depth Charts" run completes the week.
on:
  schedule:
    - cron: '0 13 * * 1'  # Every Monday at 13:00 UTC (7am Central standard time, 8am daylight time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests nflreadpy pandas pyarrow

      # Writes only nfl/data/review/; any failed fetch keeps the old files (exit 0).
      - name: Refresh ReView week and season data
        env:
          PYTHONIOENCODING: utf-8
        run: python nfl/scripts/scrape_review.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nfl/data/review/
          git diff --staged --quiet || git commit -m "auto-scrape nfl review"
          git pull --rebase && git push
