name: Scrape Depth Charts

on:
  schedule:
    - cron: '0 10 * * 2'  # Every Tuesday at 10am UTC
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 nflreadpy pandas pyarrow rapidfuzz duckdb

      - name: Run depth chart scraper
        run: python nfl/scripts/scrape_depth.py

      - name: Run OTC contract scraper
        run: python nfl/scripts/scrape_otc.py

      - name: Run stats scraper
        run: python nfl/scripts/scrape_stats.py

      - name: Run Madden scraper
        run: python nfl/scripts/scrape_madden.py

      - name: Run QBR scraper
        run: python nfl/scripts/scrape_qbr.py

      - name: Load raw sources into DuckDB
        run: python nfl/scripts/build_db.py

      - name: Run matching
        run: python nfl/scripts/build_match.py

      - name: Export player master
        run: python nfl/scripts/export_master.py nfl/data/players_master.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nfl/data/
          git diff --staged --quiet || git commit -m "auto-scrape depth charts"
          git pull --rebase && git push

  scrape-nba:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nba_api requests beautifulsoup4 pandas duckdb

      # - name: Run NBA stats scraper
      #   run: python nba/scripts/fetch_stats.py

      - name: Run NBA contracts scraper
        run: python nba/scripts/scrape_contracts_spotrac.py

      # scrape_2kratings.py is NOT run here -- same reasoning as
      # fetch_stats.py above. The local "FieldView NBA 2K Ratings Scrape"
      # Task Scheduler job (daily, 09:15) already owns nba_ratings_2k.json
      # and ratings_2k_scrape_state.json via the same 3-team trickle logic
      # this step would otherwise run again from a second, independent
      # process -- running it here too doesn't add coverage (it's the same
      # rolling-pool state file either way, not a bigger sample), it just
      # doubles the odds of both writers landing in the same run/commit
      # window. This job now reads whatever the local trickle already
      # committed and runs build/match/export against it.
      # - name: Run NBA 2k ratings scraper
      #   run: python nba/scripts/scrape_2kratings.py

      - name: Run NBA depth chart scraper
        run: python nba/scripts/scrape_nbadepthcharts.py

      - name: Load raw sources into DuckDB
        run: python nba/scripts/build_nba_db.py

      - name: Run matching
        run: python nba/scripts/build_nba_match.py

      - name: Export player master
        run: python nba/scripts/export_nba_master.py nba/data/nba_players_master.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nba/data/
          git diff --staged --quiet || git commit -m "auto-scrape nba stats"
          git pull --rebase && git push

  scrape-mlb:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas duckdb

      - name: Run MLB roster scraper
        run: python mlb/scripts/scrape_roster.py

      - name: Run MLB stats scraper
        run: python mlb/scripts/scrape_stats.py

      # theshowratings.com via the ScraperAPI proxy -- same proxy NHL's
      # ratings scraper uses, requires SCRAPERAPI_KEY as a repo secret.
      - name: Run MLB ratings scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python mlb/scripts/scrape_ratings.py

      - name: Run matching
        run: python mlb/scripts/build_mlb_match.py

      - name: Export player master
        run: python mlb/scripts/export_mlb_master.py mlb/data/mlb_players_master.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add mlb/data/
          git diff --staged --quiet || git commit -m "auto-scrape mlb stats"
          git pull --rebase && git push

  scrape-nhl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nhl-api-py requests beautifulsoup4 pandas duckdb

      - name: Run NHL roster scraper
        run: python nhl/scripts/scrape_roster.py

      - name: Run NHL stats scraper
        run: python nhl/scripts/scrape_stats.py

      # nhlratings.net was previously blocked at the site level for every
      # direct request (confirmed a static per-IP WAF rule, not a TLS
      # fingerprint or cloud-vs-residential issue) -- routed through
      # ScraperAPI instead (same proxy MLB's ratings scraper uses), which
      # clears it. Requires SCRAPERAPI_KEY as a repo secret -- see the
      # commit/PR notes for confirmation it's set.
      - name: Run NHL ratings scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python nhl/scripts/scrape_ratings.py

      - name: Run matching
        run: python nhl/scripts/build_nhl_match.py

      - name: Export player master
        run: python nhl/scripts/export_nhl_master.py nhl/data/nhl_players_master.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nhl/data/
          git diff --staged --quiet || git commit -m "auto-scrape nhl stats"
          git pull --rebase && git push

  scrape-epl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas duckdb

      # Mirrors run_epl.bat's step order and fail-and-continue behavior
      # (confirmed clean twice standalone locally, see CLAUDE.md) --
      # continue-on-error on each step so one broken scraper doesn't kill
      # the rest of the pipeline, same as the .bat's per-step FAIL_COUNT
      # logging without stopping.
      - name: Run FPL scraper
        continue-on-error: true
        run: python epl/scripts/scrape_fpl.py

      - name: Run sofifa scraper
        continue-on-error: true
        run: python shared/scripts/scrape_sofifa.py 13 epl/data/sofifa_epl.json

      - name: Load raw sources into DuckDB
        continue-on-error: true
        run: python epl/scripts/build_epl_db.py

      - name: Run matching
        continue-on-error: true
        run: python epl/scripts/build_epl_match.py

      - name: Export player master
        continue-on-error: true
        run: python epl/scripts/export_epl_master.py epl/data/epl_players_master.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add epl/data/
          git diff --staged --quiet || git commit -m "auto-scrape epl stats"
          git pull --rebase && git push

  scrape-mls:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests itscalledsoccer

      # Mirrors run_mls.bat's step order and fail-and-continue behavior
      # (confirmed clean twice standalone locally, including a real
      # transient ASA API timeout absorbed via this same fail-and-continue
      # pattern -- see CLAUDE.md). continue-on-error on each step so that
      # kind of failure never kills the rest of the pipeline.
      - name: Run ESPN roster scraper
        continue-on-error: true
        run: python mls/scripts/scrape_espn_roster.py

      - name: Run ASA stats fetcher
        continue-on-error: true
        run: python mls/scripts/fetch_asa_stats.py

      - name: Run sofifa scraper
        continue-on-error: true
        run: python shared/scripts/scrape_sofifa.py 39 mls/data/mls_sofifa.json

      - name: Run matching
        continue-on-error: true
        run: python mls/scripts/build_mls_match.py

      - name: Export player master
        continue-on-error: true
        run: python mls/scripts/export_mls_master.py mls/data/mls_players_master.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add mls/data/
          git diff --staged --quiet || git commit -m "auto-scrape mls stats"
          git pull --rebase && git push