name: Scrape Depth Charts

on:
  schedule:
    - cron: '0 10 * * 2'  # Every Tuesday at 10am UTC
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 nflreadpy pandas pyarrow rapidfuzz
      
      - name: Run depth chart scraper
        run: python nfl/scripts/scrape_depth.py

      - name: Run OTC contract scraper
        run: python nfl/scripts/scrape_otc.py

      - name: Run stats scraper
        run: python nfl/scripts/scrape_stats.py

      - name: Run Madden scraper
        run: python nfl/scripts/scrape_madden.py

      - name: Build player master
        run: python nfl/scripts/build_master.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nfl/data/
          git diff --staged --quiet || git commit -m "auto-scrape depth charts"
          git push

  scrape-nba:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install nba_api requests beautifulsoup4

      - name: Run NBA stats scraper
        run: python nba/scripts/fetch_stats.py

      - name: Run NBA contracts scraper
        run: python nba/scripts/scrape_contracts_spotrac.py

      - name: Run NBA 2k ratings scraper
        run: python nba/scripts/scrape_2kratings.py

      - name: Run NBA depth chart scraper
        run: python nba/scripts/scrape_nbadepthcharts.py

      - name: Build NBA player master
        run: python nba/scripts/build_nba_master.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add nba/data/
          git diff --staged --quiet || git commit -m "auto-scrape nba stats"
          git push