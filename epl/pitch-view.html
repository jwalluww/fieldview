<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — PitchView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  width: 440px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1130px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: compact pitch ── */
.asof { font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 10px; }

.left-col { flex-shrink: 0; }
:root { --fh: min(calc(100vh - 150px), 806px); }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.formation-select {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 4px 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 12px;
  text-transform: none;
  letter-spacing: normal;
  cursor: pointer;
}

.court-canvas {
  position: relative;
  height: var(--fh);
  width: calc(var(--fh) * 500 / 720);
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 90px;
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: 54px; height: 54px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 15px;
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 14px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100px;
  color: var(--text);
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  /* var(--text-muted) is low-contrast against the green pitch --
     switched to var(--text), matching how NBA's court-view.html
     already handles this same line against its wood court. */
  color: var(--text);
}

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 200px; max-height: 280px; overflow-y: auto;
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; }
.subs-row { display: flex; align-items: center; gap: 8px; padding: 6px 5px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 10px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: full bench list, no scroll ── */
.right-col { flex: 1; min-width: 0; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 9px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }

.bench-stat { width: 42px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }
.bench-stat-label { font-size: 7px; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

/* ── SIDEBAR ── */
.sb-toggle {
  margin-left: auto;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 7px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
}
.sb-toggle:hover { color: var(--text); }
.sb-toggle.on { color: var(--accent); border-color: rgba(0,212,255,.4); }
.sb-toggle + .view-toggle { margin-left: 0; }

/* ── PLAYER SIDEBAR (replaces the batting-order / pitching-staff column while open) ── */
.sidebar {
  display: none;
  position: relative;
  flex: 1;
  min-width: 0;
  align-self: stretch;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 13px;
}
body.sb-open .sidebar { display: block; }
.sb-scroll { position: absolute; inset: 0; overflow-y: auto; border-radius: 8px; }
body.sb-open .right-col { display: none; }

.sb-close {
  position: absolute;
  top: 8px; right: 10px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 22px; line-height: 1;
  cursor: pointer;
}
.sb-close:hover { color: var(--text); }
.sb-head { padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.sb-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: var(--text); line-height: 1.1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sb-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.sb-rating { text-align: center; flex-shrink: 0; }
.sb-rating-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; line-height: 1; }
.sb-rating-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-pill { border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
.sb-pill.inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); }
.sb-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sb-section-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.sb-stat { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-section-title + .sb-stat { border-top: none; }
.sb-stat-top { display: flex; justify-content: space-between; align-items: baseline; }
.sb-stat-label { font-size: 12px; color: var(--text); }
.sb-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; color: var(--text); }
.sb-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.sb-bar-fill { height: 100%; border-radius: 3px; }
.sb-low { font-size: 10px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
.sb-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-def { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-caption { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.sb-cell-label { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); }
.sb-cell-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.2; }
.sb-tbl { display: grid; grid-template-columns: 1fr 80px 80px; align-items: center; }
.sb-tbl > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl > div:nth-child(-n+3) { border-top: none; }
.sb-tbl-h { text-align: right; font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-tbl-l { font-size: 12px; color: var(--text-muted); }
.sb-tbl-v { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); }
.sb-tbl-v.best { font-weight: 800; color: #22c55e; }
.sb-sub { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; cursor: pointer; border-radius: 6px; }
.sb-sub:hover { background: var(--border); }
.sb-sub-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; width: 32px; text-align: center; flex-shrink: 0; }
.sb-sub-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-sub-pos { font-size: 11px; color: var(--text-muted); }
.sb-empty { font-size: 12px; color: var(--text-dim); }
.sb-cmp-actions { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.sb-btn { flex: 1; padding: 8px 0; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.sb-btn:hover { background: var(--border); }
.sb-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.sb-btn.primary:hover { filter: brightness(1.1); }
.sb-cmp-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); }
.sb-cmp-tagline { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-cmp-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.1; }
.sb-cmp-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-cmp-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; line-height: 1; margin-top: 4px; }
.sb-cmp-row { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-cmp-row:first-of-type { border-top: none; }
.sb-cmp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.sb-cmp-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-cmp-tag { width: 104px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-cmp-val { width: 46px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; color: var(--text); }
.sb-cmp-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-note { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.sb-sort { display: flex; align-items: center; justify-content: space-between; }
.sb-tbl3 { display: grid; grid-template-columns: 1fr 84px 84px; align-items: center; }
.sb-tbl3 > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl3 > div:nth-child(-n+3) { border-top: none; }
.sb-pill.sus { background: rgba(245,166,35,.15); color: var(--gold); border: 1px solid rgba(245,166,35,.4); }
.sb-teamlogo { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; margin-right: 3px; }
.reset-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 3px 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); cursor: pointer; }
.reset-btn:hover { color: var(--text); background: var(--border); }
.court-label-r { display: flex; align-items: baseline; gap: 12px; }
.player-card.selected { z-index: 90; }
.player-card.selected .player-dot { box-shadow: 0 0 0 3px var(--accent), 0 0 18px rgba(0,212,255,.55); }
.pop-inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
@media (max-width: 700px) { .sidebar { min-height: 480px; } }

.sort-toggle { display: inline-flex; border: 1px solid var(--border2); border-radius: 5px; overflow: hidden; flex-shrink: 0; margin-left: 10px; vertical-align: middle; }
.sort-toggle button { background: none; border: none; color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .5px; text-transform: uppercase; padding: 2px 7px; cursor: pointer; }
.sort-toggle button.active { background: rgba(0,212,255,.15); color: var(--accent); }
.subs-pop-label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; }
  .left-col { width: 100%; }
  .court-canvas { height: auto; width: 100%; aspect-ratio: 500/720; }
}

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 240px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; color: var(--text); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-muted); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; color: var(--text); }
.popup-stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=epl'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">

<script>
// ══════════════════════════════════════════
// TEAMS -- FPL's 20 real 2026-27 clubs, keyed
// by FPL's own team_short (epl_players_master.json's
// `team_short` field), confirmed live during the EPL build.
// ══════════════════════════════════════════
const TEAMS = {
  ARS: { name: "Arsenal" },
  AVL: { name: "Aston Villa" },
  BOU: { name: "Bournemouth" },
  BRE: { name: "Brentford" },
  BHA: { name: "Brighton" },
  CHE: { name: "Chelsea" },
  COV: { name: "Coventry City" },
  CRY: { name: "Crystal Palace" },
  EVE: { name: "Everton" },
  FUL: { name: "Fulham" },
  HUL: { name: "Hull City" },
  IPS: { name: "Ipswich Town" },
  LEE: { name: "Leeds" },
  LIV: { name: "Liverpool" },
  MCI: { name: "Man City" },
  MUN: { name: "Man Utd" },
  NEW: { name: "Newcastle" },
  NFO: { name: "Nott'm Forest" },
  TOT: { name: "Spurs" },
  SUN: { name: "Sunderland" },
};
const TEAM_ABBRS = Object.keys(TEAMS);

// ESPN's team-logo CDN -- same host as every other sport, but soccer
// keys off ESPN's own numeric team id (not a 3-letter code) under a
// "soccer" sport segment, confirmed live against eng.1's real team list
// (a.espncdn.com/i/teamlogos/soccer/500/{espn_id}.png, all 20 verified
// 200 with real image bytes). Clean 1:1 name match across all 20 clubs
// -- no naming exceptions needed here, unlike NBA's no/utah or MLB's
// ari/chw.
const ESPN_TEAM_CODES = {
  ARS: 359, AVL: 362, BOU: 349, BRE: 337, BHA: 331,
  CHE: 363, COV: 388, CRY: 384, EVE: 368, FUL: 370,
  HUL: 306, IPS: 373, LEE: 357, LIV: 364, MCI: 382,
  MUN: 360, NEW: 361, NFO: 393, TOT: 367, SUN: 366,
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/soccer/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// ══════════════════════════════════════════
// FORMATION (fixed 4-3-3 for every team -- same
// simplification NBA/NHL already use, no real
// tactical detection). Zones are positionless
// WITHIN their group (GK is standalone, DEF/MID/FWD
// each pool their own 4/3/3 players by minutes) --
// same convention as NHL's forward trio / D1-D2 pair.
// ══════════════════════════════════════════
// Formation registry -- each formation is just a different set of
// zones/coordinates. computeStarters()/rankedGroupPool()/
// subEligiblePlayers() below all iterate over whatever ZONE_ORDER
// currently is, so none of that logic needs to know formations exist
// at all -- switching formations just swaps which zone set is active.
const FORMATIONS = {
  '433': { label: '4-3-3', zones: {
    GK:   { x: 50, y: 90 },
    DEF1: { x: 14, y: 74 }, DEF2: { x: 38, y: 79 }, DEF3: { x: 62, y: 79 }, DEF4: { x: 86, y: 74 },
    MID1: { x: 25, y: 50 }, MID2: { x: 50, y: 55 }, MID3: { x: 75, y: 50 },
    FWD1: { x: 18, y: 20 }, FWD2: { x: 50, y: 13 }, FWD3: { x: 82, y: 20 },
  }},
  '442': { label: '4-4-2', zones: {
    GK:   { x: 50, y: 90 },
    DEF1: { x: 14, y: 74 }, DEF2: { x: 38, y: 79 }, DEF3: { x: 62, y: 79 }, DEF4: { x: 86, y: 74 },
    MID1: { x: 12, y: 48 }, MID2: { x: 38, y: 52 }, MID3: { x: 62, y: 52 }, MID4: { x: 88, y: 48 },
    FWD1: { x: 35, y: 16 }, FWD2: { x: 65, y: 16 },
  }},
  '352': { label: '3-5-2', zones: {
    GK:   { x: 50, y: 90 },
    DEF1: { x: 25, y: 78 }, DEF2: { x: 50, y: 82 }, DEF3: { x: 75, y: 78 },
    MID1: { x: 8,  y: 52 }, MID2: { x: 30, y: 56 }, MID3: { x: 50, y: 58 }, MID4: { x: 70, y: 56 }, MID5: { x: 92, y: 52 },
    FWD1: { x: 35, y: 16 }, FWD2: { x: 65, y: 16 },
  }},
  '343': { label: '3-4-3', zones: {
    GK:   { x: 50, y: 90 },
    DEF1: { x: 25, y: 78 }, DEF2: { x: 50, y: 82 }, DEF3: { x: 75, y: 78 },
    MID1: { x: 12, y: 50 }, MID2: { x: 38, y: 54 }, MID3: { x: 62, y: 54 }, MID4: { x: 88, y: 50 },
    FWD1: { x: 18, y: 18 }, FWD2: { x: 50, y: 12 }, FWD3: { x: 82, y: 18 },
  }},
  '451': { label: '4-5-1', zones: {
    GK:   { x: 50, y: 90 },
    DEF1: { x: 14, y: 74 }, DEF2: { x: 38, y: 79 }, DEF3: { x: 62, y: 79 }, DEF4: { x: 86, y: 74 },
    MID1: { x: 8,  y: 48 }, MID2: { x: 29, y: 53 }, MID3: { x: 50, y: 56 }, MID4: { x: 71, y: 53 }, MID5: { x: 92, y: 48 },
    FWD1: { x: 50, y: 14 },
  }},
  '532': { label: '5-3-2', zones: {
    GK:   { x: 50, y: 90 },
    DEF1: { x: 8,  y: 70 }, DEF2: { x: 28, y: 78 }, DEF3: { x: 50, y: 81 }, DEF4: { x: 72, y: 78 }, DEF5: { x: 92, y: 70 },
    MID1: { x: 25, y: 50 }, MID2: { x: 50, y: 55 }, MID3: { x: 75, y: 50 },
    FWD1: { x: 35, y: 16 }, FWD2: { x: 65, y: 16 },
  }},
};

// Derives the position-group from a zone's name prefix instead of
// hand-maintaining a separate ZONE_GROUP dict per formation (6 of
// those would just be six ways to write the same GK/DEF/MID/FWD
// pattern with more chances for a typo).
function groupForZone(zone) {
  if (zone === 'GK') return 'GKP';
  if (zone.startsWith('DEF')) return 'DEF';
  if (zone.startsWith('MID')) return 'MID';
  return 'FWD';
}

let currentFormation = localStorage.getItem('fieldview_epl_formation') || '433';
if (!FORMATIONS[currentFormation]) currentFormation = '433';
let PITCH_ZONES = FORMATIONS[currentFormation].zones;
let ZONE_ORDER = Object.keys(PITCH_ZONES);

let currentTeam = 'ARS';
let allPlayers = [];
let teamPlayers = [];
// Frontend-only view state for manual bench->pitch substitutions -- keyed
// by pitch zone, never written back to epl_players_master.json, reset on
// every team switch, same convention as every other sport's FieldView.
let manualStarters = {};
// Recomputed once per render by computeStarters(), read by both
// renderBenchList() and the substitution/popup handlers so they never
// have to re-derive it themselves.
let currentStarters = {};

// Same 0-99 rating color scale as nba/court-view.html's ratingColor()
// (sofifa's overall_rating uses the identical 0-99 scale as 2K's).
function ratingColor(r) {
  if (r == null) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function mapPlayer(p) {
  const s = p.stats || {};
  return {
    s: p.stats || null,              // raw stats block (the sidebar's advanced/season rows read it)
    id: p.player_id,
    name: p.name,
    webName: p.web_name,
    team: p.team_short,
    positionGroup: p.position_group,   // coarse: GKP/DEF/MID/FWD
    standardPos: p.standard_pos,       // granular sofifa slot, e.g. "RB" -- null for 207/604 (unmatched)
    rating: p.overall_rating,          // null if no sofifa match -- never defaulted, never shown as "NR"
    minutes: s.minutes,
    goals: s.goals_scored,
    assists: s.assists,
    cleanSheets: s.clean_sheets,
    form: s.form,                      // real field is a numeric-string, e.g. "4.3"
    bonus: s.bonus,
  };
}

// "Ratings as of <date>" caption: when EA last changed these ratings (ratings_last_changed in ratings_meta.json); nothing if missing.
async function loadRatingsMeta() {
  try {
    const res = await fetch('data/ratings_meta.json');
    const meta = await res.json();
    if (meta.ratings_last_changed) {
      const [y, m, d] = meta.ratings_last_changed.split('-').map(Number);
      const txt = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('ratingsAsOf').textContent = 'Ratings as of ' + txt;
    }
  } catch (e) {}
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/epl_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
    buildAdv();
    loadRatingsMeta();
  } catch (e) {
    console.error('Failed to load epl_players_master.json:', e);
    allPlayers = [];
  }
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  sidebarZone = null; compareId = null;
  document.body.classList.remove('sb-open');
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderPitch();
  renderBenchList();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING XI (PITCH)
// ══════════════════════════════════════════
function rankedGroupPool(group) {
  return teamPlayers.filter(p => p.positionGroup === group).slice().sort((a,b) => (b.minutes||0) - (a.minutes||0));
}

// Computes the full 11-player XI in ONE pass so multiple zones sharing a
// group (EPL's 4 DEF / 3 MID / 3 FWD zones) never double-book the same
// player. NHL's ice-view.html's getStarter() recomputes each zone
// independently ("top player in this group") with no cross-zone
// claiming -- harmless there only because each forward zone maps to its
// own distinct position_code (L/C/R), and even its D1/D2 pair (which
// DOES share one pool) both naturally resolve to the same top defenseman
// absent a manual override. That shortcut doesn't survive EPL having
// 4/3/3 same-group zones -- claimed here explicitly instead, manual
// overrides resolved first (in ZONE_ORDER) so they always win, then
// remaining zones filled group-by-group by minutes.
function computeStarters() {
  const claimed = new Set();
  const starters = {};

  for (const zone of ZONE_ORDER) {
    if (manualStarters[zone] != null) {
      const p = teamPlayers.find(pl => pl.id === manualStarters[zone]);
      if (p && !claimed.has(p.id)) {
        starters[zone] = p;
        claimed.add(p.id);
      }
    }
  }

  for (const zone of ZONE_ORDER) {
    if (starters[zone]) continue;
    const pool = rankedGroupPool(groupForZone(zone)).filter(p => !claimed.has(p.id));
    starters[zone] = pool.length ? pool[0] : null;
    if (starters[zone]) claimed.add(starters[zone].id);
  }
  return starters;
}

function getStarter(zone) {
  return currentStarters[zone] || null;
}

function renderPitch() {
  currentStarters = computeStarters();
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(zone => {
    const dz = PITCH_ZONES[zone];
    const p = currentStarters[zone];
    if (!p) {
      return `
        <div class="player-card" data-pos="${zone}" style="left:${dz.x}%; top:${dz.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    // Specific sofifa slot label when present (e.g. "RB"), else the
    // coarse FPL group -- design decision 3, never a blank/placeholder.
    const label = p.standardPos || p.positionGroup;
    return `
      <div class="player-card" data-pos="${zone}" data-pid="${p.id}" style="left:${dz.x}%; top:${dz.y}%">
        <div class="player-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="player-name">${p.webName || p.name}</div>
        <div class="player-rank">${label}</div>
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;

  // Keep the sidebar in step with the pitch: refresh it (or close it if its zone has no player now).
  if (sidebarZone) renderSidebar();
  setSelectedHighlight();
  updateResetBtn();
}

// ══════════════════════════════════════════
// BENCH LIST (everyone else, ranked by minutes
// -- single combined list, mirrors CourtView/
// IceView, not MLB's two-list batting/bullpen split)
// ══════════════════════════════════════════
// Shared sub sort (popover, sidebar, bench list): 'rating' or 'min' (minutes played). Nulls last; the other metric breaks ties.
// Default = min (the original order).
const SUBSORT_KEY = 'fieldview_epl_subsort';
let subSort = 'min';
try { const v = localStorage.getItem(SUBSORT_KEY); if (v === 'rating' || v === 'min') subSort = v; } catch (e) {}
function sortSubs(list) {
  const t = p => p.minutes, r = p => p.rating;
  const cmp = (a, b, f) => (f(a) == null) - (f(b) == null) || (f(b) - f(a)) || 0;
  return list.slice().sort(subSort === 'rating' ? (a, b) => cmp(a, b, r) || cmp(a, b, t) : (a, b) => cmp(a, b, t) || cmp(a, b, r));
}
function renderSortToggles() {
  document.querySelectorAll('[data-sort-toggle]').forEach(el => {
    el.innerHTML = `<button data-sort="rating" class="${subSort === 'rating' ? 'active' : ''}">Rating</button>` +
                   `<button data-sort="min" class="${subSort === 'min' ? 'active' : ''}">Min</button>`;
    el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', ev => { ev.stopPropagation(); setSubSort(btn.dataset.sort); }));
  });
}
function setSubSort(mode) {
  subSort = mode;
  try { localStorage.setItem(SUBSORT_KEY, mode); } catch (e) {}
  renderBenchList();
  if (openPopoverPos) fillSubsPopover(openPopoverPos);
  if (sidebarZone && !compareId) renderSidebar();
}

function renderBenchList() {
  const list = document.getElementById('benchList');
  const startingIds = new Set(Object.values(currentStarters).filter(Boolean).map(p => p.id));
  const bench = teamPlayers
    .filter(p => !startingIds.has(p.id));
  bench.splice(0, bench.length, ...sortSubs(bench));
  document.getElementById('benchTitle').textContent = 'Bench (by ' + (subSort === 'rating' ? 'Rating' : 'Minutes Played') + ')';
  renderSortToggles();

  if (!bench.length) {
    list.innerHTML = '<div class="bench-empty">No bench players on this roster yet.</div>';
    return;
  }

  list.innerHTML = bench.map((p, i) => {
    const label = p.standardPos || p.positionGroup;
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.webName || p.name}</div>
          <div class="bench-meta">${label || ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.goals != null ? p.goals : '—'}</div><div class="bench-stat-label">g</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.assists != null ? p.assists : '—'}</div><div class="bench-stat-label">a</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.minutes != null ? p.minutes : '—'}</div><div class="bench-stat-label">min</div></div>
      </div>
    `;
  }).join('');
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP (hover, pitch cards AND
// bench rows -- both wired via the same
// per-node mouseenter/mouseleave mechanics)
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (click a starter -> popover of
// eligible bench players, SAME-GROUP ONLY --
// DEF-for-DEF, MID-for-MID, etc. No positionless
// subbing across groups, unlike NBA.
// ══════════════════════════════════════════
let openPopoverPos = null;

function subEligiblePlayers(zone) {
  const allStarterIds = new Set(Object.values(currentStarters).filter(Boolean).map(p => p.id));
  const group = groupForZone(zone);
  return sortSubs(teamPlayers
    .filter(p => p.positionGroup === group && !allStarterIds.has(p.id)));
}

const GROUP_LABEL = { GKP: 'goalkeepers', DEF: 'defenders', MID: 'midfielders', FWD: 'forwards' };
function subsLabel(zone) {
  return `Sub in (${GROUP_LABEL[groupForZone(zone)] || groupForZone(zone)})`;
}

function fillSubsPopover(zone) {
  const popover = document.getElementById('subsPop');
  const subs = subEligiblePlayers(zone);
  popover.innerHTML = `<div class="subs-pop-label"><span>${subsLabel(zone)}</span><span class="sort-toggle" data-sort-toggle style="margin-left:0"></span></div>` +
    (subs.length ? subs.map(s => `
      <div class="subs-row" data-pid="${s.id}">
        <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating != null ? s.rating : '—'}</div>
        <div class="subs-name">${s.webName || s.name}</div>
        <div class="subs-mpg">${s.minutes != null ? s.minutes + "'" : '—'}</div>
      </div>`).join('') : `<div class="subs-empty">No eligible bench players</div>`);
  renderSortToggles();
  popover.querySelectorAll('.subs-row').forEach(row => {
    row.addEventListener('click', ev => {
      ev.stopPropagation();
      substitutePlayer(row.dataset.pid, zone);
      popover.classList.remove('open');
      openPopoverPos = null;
    });
  });
}

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
      const zone = card.dataset.pos;
      if (sidebarOn) { openSidebar(zone); return; }
      const popover = document.getElementById('subsPop');
      if (openPopoverPos === zone) {
        popover.classList.remove('open');
        openPopoverPos = null;
        return;
      }
      fillSubsPopover(zone);

      const pitchCanvas = card.closest('.court-canvas');
      const rect = card.getBoundingClientRect();
      const parentRect = pitchCanvas.getBoundingClientRect();
      popover.style.left = (rect.left - parentRect.left + 34) + 'px';
      popover.style.top = (rect.top - parentRect.top) + 'px';
      popover.classList.add('open');
      openPopoverPos = zone;

    });
  });
}

function lightPopupHTML(p) {

    ${inj ? `<div class="popup-row"><span class="popup-row-label">Status</span><span class="pop-inj">${inj.pill}</span></div>` : ''}
  `;

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin; // flip to the left of the anchor
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function showPopup(pid, anchorEl) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  const popup = document.getElementById('playerPopup');
  popup.innerHTML = sidebarOn ? lightPopupHTML(p) : popupHTML(p);
  popup.style.display = 'block';
  positionPopup(popup, anchorEl);
}

  document.getElementById('playerPopup').style.display = 'none';

// ── Advanced stats (per 90 minutes, from the FPL stats block) ──
// Percentile color: red at 0, amber at 50, green at 99 (copied from nfl-formation-view.html).
const PCT_RED = [239, 68, 68], PCT_AMBER = [245, 190, 40], PCT_GREEN = [34, 197, 94];
const PCT_NEUTRAL = '#8b93b0';
function pctColor(pct) {
  const [a, b, t] = pct <= 50 ? [PCT_RED, PCT_AMBER, pct / 50] : [PCT_AMBER, PCT_GREEN, (pct - 50) / 49];
  return 'rgb(' + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',') + ')';
}
function ordinal(n) {
  const r = n % 100;
  if (r >= 11 && r <= 13) return n + 'th';
  return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
}


// Qualifier: minutes >= MIN_PER_G x G. FPL has no "team matches played" field, so G is derived from the data:
// the most matches any player has been involved in = max over all players of max(starts, round(minutes / 90)).
const MIN_PER_G = 30;
let leagueG = 0;
let pctIndex = {}; // position group -> stat key -> sorted values of every qualified player
let popN = {};     // position group -> number of qualified players

const isNum = v => typeof v === 'number' && !isNaN(v);
const GROUP_NAME = { GKP: 'goalkeepers', DEF: 'defenders', MID: 'midfielders', FWD: 'forwards' };
// raw: FPL stats block (numeric-strings are parsed by n()); per90 = total / minutes x 90
const n = v => { const x = typeof v === 'number' ? v : parseFloat(v); return isNaN(x) ? null : x; };
const per90 = key => s => { const t = n(s[key]), m = n(s.minutes); return t != null && m > 0 ? t / m * 90 : null; };
const f2 = v => v.toFixed(2);
const OUT_ADV = {
  g90:   { label: 'Goals/90',   val: per90('goals_scored'),               fmt: f2, def: 'Goals scored per 90 minutes.' },
  xg90:  { label: 'xG/90',      val: per90('expected_goals'),             fmt: f2, def: 'Expected goals per 90: the quality of his shots, whether or not they went in.' },
  xa90:  { label: 'xA/90',      val: per90('expected_assists'),           fmt: f2, def: 'Expected assists per 90: the quality of the chances he creates.' },
  xgi90: { label: 'xGI/90',     val: per90('expected_goal_involvements'), fmt: f2, def: 'Expected goals plus expected assists per 90.' },
  dc90:  { label: 'Def. Contrib/90', val: per90('defensive_contribution'), fmt: f2, def: 'Defensive contributions (clearances, blocks, interceptions, tackles, recoveries) per 90.' },
  tk90:  { label: 'Tackles/90', val: per90('tackles'),                    fmt: f2, def: 'Tackles per 90 minutes.' },
  ict90: { label: 'ICT Index/90', val: per90('ict_index'),                fmt: v => v.toFixed(1), def: 'FPL’s Influence-Creativity-Threat index per 90 minutes.' },
};
const GK_ADV = {
  sv90:  { label: 'Saves/90',        val: per90('saves'),             fmt: f2, def: 'Saves per 90 minutes.' },
  gc90:  { label: 'Goals Conceded/90', val: per90('goals_conceded'),  fmt: f2, lower: true, def: 'Goals conceded per 90 minutes. Lower is better.' },
  xgc90: { label: 'xGC/90',          val: per90('expected_goals_conceded'), fmt: f2, lower: true, def: 'Expected goals conceded per 90: the quality of shots his team allowed. Lower is better.' },
  cs90:  { label: 'Clean Sheets/90', val: per90('clean_sheets'),      fmt: f2, def: 'Clean sheets per 90 minutes.' },
};
const advMeta = p => p.positionGroup === 'GKP' ? GK_ADV : OUT_ADV;
const advKeys = p => Object.keys(advMeta(p));

const qualified = p => !!p.s && n(p.s.minutes) != null && leagueG > 0 && n(p.s.minutes) >= MIN_PER_G * leagueG;

function buildAdv() {
  leagueG = 0;
  for (const p of allPlayers) {
    if (!p.s) continue;
    const g = Math.max(n(p.s.starts) || 0, Math.round((n(p.s.minutes) || 0) / 90));
    if (g > leagueG) leagueG = g;
  }
  pctIndex = {}; popN = {};
  for (const p of allPlayers) {
    if (!qualified(p)) continue;
    const g = p.positionGroup, meta = advMeta(p);
    popN[g] = (popN[g] || 0) + 1;
    const idx = (pctIndex[g] ||= {});
    for (const k of advKeys(p)) { const v = meta[k].val(p.s); if (isNum(v)) (idx[k] ||= []).push(v); }
  }
  for (const g in pctIndex) for (const k in pctIndex[g]) pctIndex[g][k].sort((a, b) => a - b);
  console.info('[PitchView] qualifier G =', leagueG, '(minutes >= ' + MIN_PER_G * leagueG + ')');
}

// % of the qualified same-group population he beats (ties count half), inverted for lower-is-better stats.
// Null when unqualified or the population is under 10. (copied from mlb/diamond-view.html)
function percentileOf(p, key) {
  const arr = qualified(p) && pctIndex[p.positionGroup] && pctIndex[p.positionGroup][key];
  const x = p.s ? advMeta(p)[key].val(p.s) : null;
  if (!arr || arr.length < 10 || typeof x !== 'number' || isNaN(x)) return null;
  const lower = !!advMeta(p)[key].lower;
  let beaten = 0, eq = 0;
  for (const y of arr) {
    if (y === x) eq++;
    else if (lower ? y > x : y < x) beaten++;
  }
  beaten += 0.5 * (eq - 1); // he is one of the "tied" players; exclude himself
  return Math.min(99, Math.round(beaten / (arr.length - 1) * 100));
}

function statPct(p, key) {
  const pct = percentileOf(p, key);
  return pct == null ? { pct: null, color: null, text: '' } : { pct, color: pctColor(pct), text: ordinal(pct) + ' pct' };
}

function advStatHtml(p, key) {
  const m = advMeta(p)[key], x = p.s ? m.val(p.s) : null;
  if (!isNum(x)) return '';
  const { pct, color: c, text } = statPct(p, key);
  return `
    <div class="sb-stat">
      <div class="sb-stat-top"><span class="sb-stat-label">${m.label}${!qualified(p) ? ' <span class="sb-low">low sample</span>' : ''}</span><span class="sb-stat-val">${m.fmt(x)}</span></div>
      ${pct != null ? `<div class="sb-bar-wrap"><div class="sb-bar"><div class="sb-bar-fill" style="width:${pct}%;background:${c}"></div></div><span class="sb-pct" style="color:${c}">${text}</span></div>` : ''}
      <div class="sb-def">${m.def}</div>
    </div>`;
}

function advSectionHtml(p) {
  const rows = advKeys(p).map(k => advStatHtml(p, k)).join('');
  if (!rows) return '';
  const q = qualified(p);
  const caption = q
    ? `Ranked among ${popN[p.positionGroup]} qualified ${GROUP_NAME[p.positionGroup]} (min. ${MIN_PER_G * leagueG} minutes)`
    : `Fewer than ${MIN_PER_G * leagueG} minutes: not ranked`;
  return `<div class="sb-section"><div class="sb-section-title">Advanced Stats · ${STATS_SEASON}</div>${rows}
    <div class="sb-caption">${caption}</div></div>`;
}

// ── Season stats (current season only: the data has no prior season) ──
const gi = k => s => n(s[k]);
const BOX_OUT = [
  { label: 'Starts', val: gi('starts') }, { label: 'Minutes', val: gi('minutes') }, { label: 'Goals', val: gi('goals_scored') },
  { label: 'Assists', val: gi('assists') }, { label: 'xG', val: gi('expected_goals'), txt: f2 }, { label: 'xA', val: gi('expected_assists'), txt: f2 },
  { label: 'Clean sheets', val: gi('clean_sheets') }, { label: 'Yellow', val: gi('yellow_cards'), lower: true }, { label: 'Red', val: gi('red_cards'), lower: true },
];
const BOX_GK = [...BOX_OUT, { label: 'Saves', val: gi('saves') }];
const boxDefs = p => p.positionGroup === 'GKP' ? BOX_GK : BOX_OUT;
const boxText = (d, p) => { const v = p.s ? d.val(p.s) : null; return v == null ? '—' : (d.txt ? d.txt(v) : String(v)); };

function seasonStatsHtml(p) {
  if (!p.s) return '';
  return `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
    <div class="sb-grid">${boxDefs(p).map(d => `<div class="sb-cell"><div class="sb-cell-label">${d.label}</div><div class="sb-cell-val">${boxText(d, p)}</div></div>`).join('')}</div>
    <div class="sb-caption">${STATS_SEASON} season</div></div>`;
}

const lastName = p => (p.webName || p.name).split(' ').slice(-1)[0];
function ageOf(birth) {
  if (!birth) return null;
  const d = new Date(birth + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const now = new Date();
  let a = now.getFullYear() - d.getFullYear();
  if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) a--;
  return a;
}
// FPL availability: i = injured, u = unavailable, d = doubtful, s = suspended, a = available.
function availabilityOf(p) {
  if (!p.s || !p.s.status || p.s.status === 'a') return null;
  const code = p.s.status;
  return { pill: code === 's' ? 'SUS' : code === 'd' ? 'DOUBT' : 'INJ', cls: code === 's' ? 'sus' : code === 'd' ? 'sus' : 'inj',
           text: p.s.news || '', chance: p.s.chance_of_playing_next_round };
}

function subsSectionHtml(p) {
  const cands = subEligiblePlayers(sidebarZone);
  const rows = cands.length ? cands.map(c => `
      <div class="sb-sub" onclick="openCompare('${c.id}', event)">
        <div class="sb-sub-rating" style="color:${ratingColor(c.rating)}">${c.rating != null ? c.rating : '—'}</div>
        <div class="sb-sub-name">${c.webName || c.name}</div>
        <div class="sb-sub-pos">${c.standardPos || c.positionGroup} · ${c.minutes != null ? c.minutes + "'" : '—'}</div>
      </div>`).join('') : '<div class="sb-empty">No other players available in this group.</div>';
  return `<div class="sb-section" style="border-bottom:none">
      <div class="sb-section-title sb-sort"><span>Substitutes</span><span class="sort-toggle" data-sort-toggle></span></div>${rows}</div>`;
}

function renderSidebar(resetScroll) {
  const el = document.getElementById('sbScroll');
  const p = sidebarZone ? getStarter(sidebarZone) : null;
  if (!p) { closeSidebar(); return; }
  if (compareId) { renderCompare(el, p); return; }

  const s = p.s || {};
  const av = availabilityOf(p);
  const age = ageOf(s.birth_date);
  const meta1 = `<img class="sb-teamlogo" src="${teamLogoUrl(p.team)}" alt="">${TEAMS[p.team] ? TEAMS[p.team].name : p.team} · ${p.standardPos || p.positionGroup}`;
  const meta2 = [age != null ? 'Age ' + age : null, s.squad_number != null ? '#' + s.squad_number : null].filter(Boolean).join(' · ');
  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-head">
      <div style="flex:1;min-width:0">
        <div class="sb-name"><span>${p.name}</span>${av ? `<span class="sb-pill ${av.cls}">${av.pill}</span>` : ''}</div>
        <div class="sb-meta">${meta1}</div>
        ${meta2 ? `<div class="sb-meta">${meta2}</div>` : ''}
        ${av ? `<div class="sb-meta" style="color:#ef4444">${av.text}${av.chance != null ? ' (' + av.chance + '% chance next round)' : ''}</div>` : ''}
      </div>
      <div class="sb-rating"><div class="sb-rating-val" style="color:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div><div class="sb-rating-label">EA FC</div></div>
    </div>
    ${advSectionHtml(p)}
    ${seasonStatsHtml(p)}
    ${subsSectionHtml(p)}`;
  document.body.classList.add('sb-open');
  renderSortToggles();
  if (resetScroll) el.scrollTop = 0;
  setSelectedHighlight();
  syncURL();
}

function openCompare(id, event) {
  if (event) event.stopPropagation();
  compareId = id;
  renderSidebar(true);
}

function closeCompare(event) {
  if (event) event.stopPropagation();
  compareId = null;
  renderSidebar(true);
}

function swapFromCompare(event) {
  if (event) event.stopPropagation();
  substitutePlayer(compareId, sidebarZone); // clears compareId; renderPitch() re-renders the sidebar for the new starter
}

// Starter vs. candidate (same position group). Stats are compared only where both players have a value;
// each percentile stays within the player's own group.
function renderCompare(el, a) {
  const b = teamPlayers.find(x => String(x.id) === String(compareId));
  if (!b) { compareId = null; renderSidebar(); return; }

  const rows = boxDefs(a).map(d => {
    const va = a.s ? d.val(a.s) : null, vb = b.s ? d.val(b.s) : null;
    if (va == null || vb == null) return '';
    const ta = boxText(d, a), tb = boxText(d, b);
    let best = '';
    if (ta !== tb) best = (d.lower ? va < vb : va > vb) ? 'a' : 'b';
    return `<div class="sb-tbl-l">${d.label}</div><div class="sb-tbl-v${best === 'a' ? ' best' : ''}">${ta}</div><div class="sb-tbl-v${best === 'b' ? ' best' : ''}">${tb}</div>`;
  }).join('');
  const tableHtml = rows ? `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
      <div class="sb-tbl"><div></div><div class="sb-tbl-h">${lastName(a)}</div><div class="sb-tbl-h">${lastName(b)}</div>${rows}</div>
      <div class="sb-caption">${STATS_SEASON} season</div></div>` : '';

  const line = (pl, key) => {
    const m = advMeta(pl)[key], x = m.val(pl.s);
    const { pct, color } = statPct(pl, key);
    return `<div class="sb-cmp-line"><span class="sb-cmp-tag" title="${pl.name}">${lastName(pl)}</span>
      <div class="sb-bar">${pct != null ? `<div class="sb-bar-fill" style="width:${pct}%;background:${color}"></div>` : ''}</div>
      <span class="sb-cmp-val">${m.fmt(x)}</span>
      <span class="sb-cmp-pct" style="color:${color || 'inherit'}">${pct != null ? ordinal(pct) : '<span class="sb-low" style="margin:0">low sample</span>'}</span></div>`;
  };
  let advHtml = '';
  if (a.s && b.s) {
    const shared = advKeys(a).filter(k => advKeys(b).includes(k) && isNum(advMeta(a)[k].val(a.s)) && isNum(advMeta(b)[k].val(b.s)));
    const advRows = shared.map(key => `<div class="sb-cmp-row"><div class="sb-cmp-top"><span class="sb-stat-label">${advMeta(a)[key].label}</span></div>${line(a, key)}${line(b, key)}</div>`).join('');
    if (advRows) advHtml = `<div class="sb-section"><div class="sb-section-title">Advanced Stats · ${STATS_SEASON} · percentile vs. own group</div>${advRows}</div>`;
  }

  const head = (pl, tag) => `<div>
      <div class="sb-cmp-tagline">${tag}</div>
      <div class="sb-cmp-name">${pl.name}</div>
      <div class="sb-cmp-sub">${pl.standardPos || pl.positionGroup}</div>
      <div class="sb-cmp-rating" style="color:${ratingColor(pl.rating)}">${pl.rating != null ? pl.rating : '—'}</div>
    </div>`;

  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-cmp-head">${head(a, 'Starter')}${head(b, 'Substitute')}</div>
    <div class="sb-cmp-actions">
      <button class="sb-btn" onclick="closeCompare(event)">Back</button>
      <button class="sb-btn primary" onclick="swapFromCompare(event)">Swap in</button>
    </div>
    ${tableHtml}${advHtml}
    ${!tableHtml && !advHtml ? '<div class="sb-section"><div class="sb-empty">These players have no stats in common to compare.</div></div>' : ''}`;
  document.body.classList.add('sb-open');
  el.scrollTop = 0;
  setSelectedHighlight();
  syncURL();
}

// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  closeSidebar();
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam).then(syncURL);
}

function setFormation(key) {
  if (!FORMATIONS[key] || key === currentFormation) return;
  currentFormation = key;
  PITCH_ZONES = FORMATIONS[key].zones;
  ZONE_ORDER = Object.keys(PITCH_ZONES);
  manualStarters = {};
  localStorage.setItem('fieldview_epl_formation', key);
  document.getElementById('formationLabel').textContent = 'Starting XI (' + FORMATIONS[key].label + ')';
  hidePopup();
  document.getElementById('subsPop').classList.remove('open');
  openPopoverPos = null;
  // Zone names don't map across formations: keep the sidebar open only if its player is still a starter.
  const keepId = sidebarZone && getStarter(sidebarZone) ? getStarter(sidebarZone).id : null;
  sidebarZone = null; compareId = null;
  renderPitch();
  renderBenchList();
  const zone = keepId == null ? null : ZONE_ORDER.find(z => getStarter(z) && getStarter(z).id === keepId);
  if (zone) openSidebar(zone); else closeSidebar();
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
  // Click on empty pitch closes the sidebar.
  if (sidebarZone && e.target.closest('.court-canvas') && !e.target.closest('.player-card')) closeSidebar();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sidebarZone) closeSidebar();
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
buildTeamsDropdown();
document.getElementById('formationSelect').value = currentFormation;
document.getElementById('formationLabel').textContent = 'Starting XI (' + FORMATIONS[currentFormation].label + ')';
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('team') && TEAMS[urlParams.get('team')]) currentTeam = urlParams.get('team');
const urlPlayer = urlParams.get('player');

updateSbToggle();
loadTeam(currentTeam).then(() => {
  // Reopen the sidebar if ?player= is someone currently on the pitch for this team; otherwise ignore it.
  if (sidebarOn && urlPlayer) {
    const zone = ZONE_ORDER.find(z => { const st = getStarter(z); return st && String(st.id) === urlPlayer; });
    if (zone) openSidebar(zone);
  }
});
</script>
