<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — Player Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1b23;
  --surface: #1e2028;
  --surface2: #23252f;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #c8cad4;
  --text-muted: #7d87a8;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  flex-shrink: 0;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); flex-shrink: 0; }

.page-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 1px;
  color: var(--text-muted);
}

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── FILTER BAR ── */
.filter-bar {
  background: #0d1118;
  border-bottom: 2px solid var(--border2);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  position: sticky;
  top: 94px;
  z-index: 190;
}

.filter-search {
  position: relative;
  flex: 0 0 220px;
}

.filter-search input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 7px 12px 7px 32px;
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.filter-search input::placeholder { color: var(--text-dim); }
.filter-search input:focus { border-color: var(--accent); }

.filter-search svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
}

/* Multi-select dropdown (team / position filters) */
.multiselect {
  position: relative;
}

.multiselect-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 7px 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .5px;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color .2s;
}
.multiselect-trigger:hover { color: var(--text); }
.multiselect-trigger .chevron { flex-shrink: 0; opacity: .6; }
.multiselect.open .multiselect-trigger { border-color: var(--accent); color: var(--text); }

.multiselect-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 240px;
  max-height: 360px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  box-shadow: 0 12px 24px rgba(0,0,0,.4);
  z-index: 300;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.multiselect-list {
  overflow-y: auto;
  padding: 4px;
}

.multiselect-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  user-select: none;
}
.multiselect-item:hover { background: var(--border); }
.multiselect-item input[type="checkbox"] { flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }

.filter-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.row-count {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: .5px;
  white-space: nowrap;
}

.clear-btn {
  background: none;
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 6px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .5px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
}
.clear-btn:hover { color: var(--text); border-color: var(--border); }

/* ── TABLE ── */
.table-wrap {
  padding: 0 24px 32px;
  overflow-x: auto;
}

.table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  min-width: 900px;
}

.table thead th {
  background: var(--surface);
  border-bottom: 2px solid var(--border2);
  padding: 12px 16px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
  z-index: 100;
  user-select: none;
  transition: color .15s;
}
.table thead th:hover { color: var(--text); }
.table thead th.sorted { color: var(--accent); }
.table thead th .sort-icon {
  margin-left: 4px;
  opacity: 0.5;
  pointer-events: none;
}
.table thead th.sorted .sort-icon { opacity: 1; }

.table tbody td {
  padding: 7px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: middle;
  color: var(--text);
}

.table tbody tr:nth-child(even) {
  background: rgba(255,255,255,0.025);
}

.table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
  cursor: default;
}
.table tbody tr:hover { background: var(--surface2); }

/* Team cell */
.cell-team {
  display: flex;
  align-items: center;
  gap: 8px;
}

.team-logo-cell {
  width: 24px;
  height: 24px;
  object-fit: contain;
  flex-shrink: 0;
}

.cell-team span {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: .5px;
}

/* Player cell */
.cell-player {
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-initials {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 10px;
  flex-shrink: 0;
  color: #05261a;
  background: var(--accent);
}

.player-name-block { min-width: 0; }

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 17px;
  color: var(--text);
  white-space: nowrap;
}

/* Position cell */
.cell-pos {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  text-align: center;
}

/* Numeric stat cell */
.cell-stat {
  text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
}

/* Loading */
.loading {
  text-align: center;
  padding: 80px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.loading-bar {
  width: 200px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  margin: 16px auto 0;
  overflow: hidden;
}

.loading-progress {
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  animation: loadProgress 2s ease-in-out infinite;
}

@keyframes loadProgress {
  0% { width: 0%; margin-left: 0; }
  50% { width: 60%; margin-left: 20%; }
  100% { width: 0%; margin-left: 100%; }
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  letter-spacing: 1px;
  color: var(--text-dim);
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── VIEW TABS ── */
.view-tabs {
  background: #0d1118;
  border-bottom: 2px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  position: sticky;
  top: 52px;
  z-index: 195;
  overflow-x: auto;
}

.view-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  padding: 10px 16px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.view-tab:hover { color: var(--text-muted); }
.view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

@media (max-width: 600px) {
  .table-wrap { padding: 0 12px 32px; }
  .table { display: none; }
  #mobileList { display: block; }
  .filter-bar { padding: 8px 12px; gap: 8px; }
  .filter-search { flex: 1 1 100%; }
  .multiselect { flex: 1 1 calc(50% - 4px); }
  .multiselect-trigger { width: 100%; justify-content: space-between; font-size: 12px; }
  .multiselect-panel { left: auto; right: 0; min-width: 200px; }
  .header { padding: 0 12px; }
  .view-tabs { padding: 0 12px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=epl'">Field<span>View</span></div>
  <div class="header-divider"></div>
  <div class="page-title">Player Table</div>
  <div class="view-toggle">
    <button class="view-btn" onclick="window.location='pitch-view.html'">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg>
      PitchView
    </button>
    <button class="view-btn active">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="3" rx="1" fill="currentColor"/><rect x="1" y="5" width="10" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="10" height="2" rx="1" fill="currentColor" opacity=".3"/></svg>
      Table
    </button>
  </div>
</header>

<!-- View tabs -->
<div class="view-tabs" id="viewTabs">
  <button class="view-tab active" onclick="setView('overview', this)">Overview</button>
  <button class="view-tab" onclick="setView('stats', this)">Stats</button>
  <button class="view-tab" onclick="setView('fantasy', this)">Fantasy</button>
</div>

<!-- Filter bar -->
<div class="filter-bar">
  <div class="filter-search">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 10l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Search player..." oninput="applyFilters()">
  </div>

  <div class="multiselect" id="teamMultiselect">
    <button type="button" class="multiselect-trigger" onclick="toggleTeamPanel(event)">
      <span id="teamMultiselectLabel">All Teams</span>
      <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="multiselect-panel" id="teamPanel" style="display:none">
      <div class="multiselect-list" id="teamPanelList"></div>
    </div>
  </div>

  <div class="multiselect" id="posMultiselect">
    <button type="button" class="multiselect-trigger" onclick="togglePosPanel(event)">
      <span id="posMultiselectLabel">All Positions</span>
      <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="multiselect-panel" id="posPanel" style="display:none">
      <div class="multiselect-list" id="posPanelList"></div>
    </div>
  </div>

  <div class="filter-right">
    <span class="row-count" id="rowCount">Loading...</span>
    <button class="clear-btn" onclick="clearFilters()">Clear</button>
  </div>
</div>

<!-- Table -->
<div class="table-wrap">
  <div id="loadingState" class="loading">
    Loading all 20 teams
    <div class="loading-bar"><div class="loading-progress"></div></div>
  </div>
  <table class="table" id="mainTable" style="display:none">
    <thead>
      <tr>
        <th onclick="sortBy('team')" id="th-team">Team <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('position')" id="th-position">Pos <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('name')" id="th-name" class="sorted">Player <span class="sort-icon">↑</span></th>
        <th onclick="sortBy('rating')" id="th-rating" style="display:none">Rating <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('minutes')" id="th-minutes" style="display:none">Min <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('goals')" id="th-goals" style="display:none">G <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('assists')" id="th-assists" style="display:none">A <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('cleanSheets')" id="th-cleanSheets" style="display:none">CS <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('form')" id="th-form" style="display:none">Form <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('bonus')" id="th-bonus" style="display:none">Bonus <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('nowCost')" id="th-nowCost" style="display:none">Price <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('selectedBy')" id="th-selectedBy" style="display:none">Sel% <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('totalPoints')" id="th-totalPoints" style="display:none">Pts <span class="sort-icon">↕</span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div id="mobileList" style="display:none"></div>
  <div id="emptyState" class="empty-state" style="display:none">No players match your filters.</div>
</div>

<script>
// ══════════════════════════════════════════
// TEAMS -- reused verbatim from pitch-view.html
// (same TEAMS object, same ESPN_TEAM_CODES map)
// ══════════════════════════════════════════
const TEAMS = {
  ARS: { name: "Arsenal" },
  AVL: { name: "Aston Villa" },
  BOU: { name: "Bournemouth" },
  BRE: { name: "Brentford" },
  BHA: { name: "Brighton" },
  CHE: { name: "Chelsea" },
  COV: { name: "Coventry City" },
  CRY: { name: "Crystal Palace" },
  EVE: { name: "Everton" },
  FUL: { name: "Fulham" },
  HUL: { name: "Hull City" },
  IPS: { name: "Ipswich Town" },
  LEE: { name: "Leeds" },
  LIV: { name: "Liverpool" },
  MCI: { name: "Man City" },
  MUN: { name: "Man Utd" },
  NEW: { name: "Newcastle" },
  NFO: { name: "Nott'm Forest" },
  TOT: { name: "Spurs" },
  SUN: { name: "Sunderland" },
};
const TEAM_ABBRS = Object.keys(TEAMS);

const ESPN_TEAM_CODES = {
  ARS: 359, AVL: 362, BOU: 349, BRE: 337, BHA: 331,
  CHE: 363, COV: 388, CRY: 384, EVE: 368, FUL: 370,
  HUL: 306, IPS: 373, LEE: 357, LIV: 364, MCI: 382,
  MUN: 360, NEW: 361, NFO: 393, TOT: 367, SUN: 366,
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/soccer/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// The 4 coarse position_group values from epl_players_master.json
// (FPL's element_type resolved to GKP/DEF/MID/FWD) -- used as the
// filter dimension since it's always present, unlike sofifa's granular
// standard_pos (null for 207/604 unmatched players), which is shown as
// a secondary display-only label in the Position column instead.
const ALL_POSITIONS = ['GKP', 'DEF', 'MID', 'FWD'];
const POSITION_LABELS = { GKP: 'GKP', DEF: 'DEF', MID: 'MID', FWD: 'FWD' };

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let allPlayers = [];
let filteredPlayers = [];
let sortCol = 'name';
let sortDir = 'asc';
let currentView = 'overview';

let selectedTeams = new Set();
let selectedPositions = new Set();

// EPL's stats (FPL's season-to-date block) are flat and shared across
// every position_group -- goals/assists/minutes/form all exist on every
// player's `stats` object regardless of GKP/DEF/MID/FWD (just mostly
// zero where irrelevant, e.g. a keeper's goals_scored). No disjoint
// skater/goalie- or batting/pitching-style split to gate on, so this
// mirrors nba/player-table.html's flat single-column-set VIEWS pattern,
// not NHL's/MLB's statsGroup-filtered one.
const VIEWS = {
  overview: { cols: ['team','position','name','rating','minutes'], sort: 'rating' },
  stats:    { cols: ['team','position','name','goals','assists','cleanSheets','minutes','form'], sort: 'goals' },
  fantasy:  { cols: ['team','position','name','nowCost','selectedBy','bonus','totalPoints'], sort: 'totalPoints' },
};

const ALL_COLS = ['team','position','name','rating','minutes','goals','assists','cleanSheets','form','bonus','nowCost','selectedBy','totalPoints'];

function setView(viewKey, btn) {
  currentView = viewKey;

  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const view = VIEWS[viewKey];
  updateColumns(view.cols);

  sortCol = view.sort;
  sortDir = (view.sort === 'name') ? 'asc' : 'desc';
  document.querySelectorAll('.table thead th').forEach(th => {
    th.classList.remove('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = '↕';
  });
  const th = document.getElementById('th-' + sortCol);
  if (th) {
    th.classList.add('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = sortDir === 'asc' ? '↑' : '↓';
  }

  applyFilters();
  updateStickyOffset();
}

function updateColumns(cols) {
  const colMap = {};
  ALL_COLS.forEach(c => colMap[c] = 'th-' + c);

  ALL_COLS.forEach(col => {
    const th = document.getElementById(colMap[col]);
    if (th) th.style.display = cols.includes(col) ? '' : 'none';
  });

  window._activeCols = cols;
}

// ══════════════════════════════════════════
// LOAD ALL TEAMS
// ══════════════════════════════════════════
async function loadAll() {
  const data = await fetch('data/epl_players_master.json').then(r => r.json());

  for (const player of Object.values(data)) {
    const s = player.stats || {};
    // form/expected_* fields come back from FPL as numeric-strings
    // (e.g. "4.3") -- confirmed live during the EPL build -- coerced
    // to real numbers here so sortBy() compares correctly.
    const formNum = s.form != null ? parseFloat(s.form) : null;
    allPlayers.push({
      id: player.player_id,
      abbr: player.team_short,
      position: player.position_group,       // coarse, always present -- the filterable dimension
      standardPos: player.standard_pos,       // granular sofifa slot, null for unmatched -- display only
      name: player.name || '',
      rating: player.overall_rating,          // null if no sofifa match -- never defaulted
      minutes: s.minutes,
      goals: s.goals_scored,
      assists: s.assists,
      cleanSheets: s.clean_sheets,
      form: formNum,
      bonus: s.bonus,
      nowCost: s.now_cost != null ? s.now_cost / 10 : null,  // FPL prices in tenths (e.g. 155 = £15.5m)
      selectedBy: s.selected_by_percent != null ? parseFloat(s.selected_by_percent) : null,
      totalPoints: s.total_points,
    });
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainTable').style.display = 'table';

  applyFilters();
}

// ══════════════════════════════════════════
// TEAM / POSITION MULTI-SELECT
// ══════════════════════════════════════════
function renderTeamPanel() {
  document.getElementById('teamPanelList').innerHTML = TEAM_ABBRS.map(abbr => `
    <label class="multiselect-item">
      <input type="checkbox" id="team-chk-${abbr}" onchange="toggleTeamItem('${abbr}')">
      ${TEAMS[abbr].name}
    </label>
  `).join('');
}

function renderPosPanel() {
  document.getElementById('posPanelList').innerHTML = ALL_POSITIONS.map(pos => `
    <label class="multiselect-item">
      <input type="checkbox" id="pos-chk-${pos}" onchange="togglePosItem('${pos}')">
      ${POSITION_LABELS[pos]}
    </label>
  `).join('');
}

function toggleTeamItem(abbr) {
  if (selectedTeams.has(abbr)) selectedTeams.delete(abbr); else selectedTeams.add(abbr);
  updateTeamLabel();
  applyFilters();
}

function togglePosItem(pos) {
  if (selectedPositions.has(pos)) selectedPositions.delete(pos); else selectedPositions.add(pos);
  updatePosLabel();
  applyFilters();
}

function updateTeamLabel() {
  const el = document.getElementById('teamMultiselectLabel');
  if (selectedTeams.size === 0) el.textContent = 'All Teams';
  else if (selectedTeams.size === 1) el.textContent = TEAMS[[...selectedTeams][0]].name;
  else el.textContent = selectedTeams.size + ' Teams';
}

function updatePosLabel() {
  const el = document.getElementById('posMultiselectLabel');
  if (selectedPositions.size === 0) el.textContent = 'All Positions';
  else if (selectedPositions.size === 1) el.textContent = POSITION_LABELS[[...selectedPositions][0]];
  else el.textContent = selectedPositions.size + ' Positions';
}

function toggleTeamPanel() {
  const panel = document.getElementById('teamPanel');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'flex' : 'none';
  document.getElementById('teamMultiselect').classList.toggle('open', opening);
}

function togglePosPanel() {
  const panel = document.getElementById('posPanel');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'flex' : 'none';
  document.getElementById('posMultiselect').classList.toggle('open', opening);
}

document.addEventListener('click', (e) => {
  document.querySelectorAll('.multiselect').forEach(ms => {
    if (!ms.contains(e.target)) {
      ms.classList.remove('open');
      const panel = ms.querySelector('.multiselect-panel');
      if (panel) panel.style.display = 'none';
    }
  });
});

// ══════════════════════════════════════════
// FILTERS
// ══════════════════════════════════════════
function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  filteredPlayers = allPlayers.filter(p => {
    if (search && !p.name.toLowerCase().includes(search)) return false;
    if (selectedTeams.size && !selectedTeams.has(p.abbr)) return false;
    if (selectedPositions.size && !selectedPositions.has(p.position)) return false;
    return true;
  });

  sortPlayers();
  renderTable();
  renderMobileList();
  document.getElementById('rowCount').textContent = filteredPlayers.length.toLocaleString() + ' players';
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  selectedTeams = new Set();
  selectedPositions = new Set();
  syncTeamCheckboxes();
  syncPosCheckboxes();
  updateTeamLabel();
  updatePosLabel();
  applyFilters();
}

function syncTeamCheckboxes() {
  TEAM_ABBRS.forEach(abbr => {
    const el = document.getElementById('team-chk-' + abbr);
    if (el) el.checked = selectedTeams.has(abbr);
  });
}

function syncPosCheckboxes() {
  ALL_POSITIONS.forEach(pos => {
    const el = document.getElementById('pos-chk-' + pos);
    if (el) el.checked = selectedPositions.has(pos);
  });
}

// ══════════════════════════════════════════
// SORT
// ══════════════════════════════════════════
// No string-coercion needed here -- unlike MLB's statsapi rate stats
// (avg/obp/era etc, real VARCHAR strings), FPL's minutes/goals/assists/
// bonus/totalPoints are real JSON numbers, and form/selectedBy were
// already parseFloat'd in loadAll() above. Plain `<`/`>` sorts correctly.
function toSortVal(p, col) {
  return p[col];
}

function sortBy(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = (col === 'name') ? 'asc' : 'desc';
  }

  document.querySelectorAll('.table thead th').forEach(th => {
    th.classList.remove('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = '↕';
  });

  const th = document.getElementById('th-' + col);
  if (th) {
    th.classList.add('sorted');
    const icon = th.querySelector('.sort-icon');
    icon.textContent = sortDir === 'asc' ? '↑' : '↓';
  }

  sortPlayers();
  renderTable();
  renderMobileList();
}

function sortPlayers() {
  filteredPlayers.sort((a, b) => {
    const av = toSortVal(a, sortCol);
    const bv = toSortVal(b, sortCol);

    // Nulls always sort last regardless of direction -- same convention
    // as every other sport's table. A real 0 (0 goals, 0 bonus) is
    // meaningful FPL data, not a missing-data placeholder.
    const aNull = av == null || av === '';
    const bNull = bv == null || bv === '';
    if (aNull && bNull) return 0;
    if (aNull) return 1;
    if (bNull) return -1;

    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function renderMobileList() {
  const isMobile = window.innerWidth <= 600;
  const list = document.getElementById('mobileList');
  if (!list) return;

  if (!isMobile) { list.style.display = 'none'; return; }

  document.getElementById('mainTable').style.display = 'none';
  list.style.display = 'block';

  list.innerHTML = filteredPlayers.map(p => {
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
        <img class="team-logo-cell" src="${teamLogoUrl(p.abbr)}" alt="${p.abbr}" loading="lazy">
        <div style="flex:1;min-width:0">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:1px">${p.standardPos || POSITION_LABELS[p.position] || p.position || '—'}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  if (filteredPlayers.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const cols = window._activeCols || VIEWS.overview.cols;

  const html = filteredPlayers.map(p => {
    const initials = p.name.split(' ').map(w => w[0]).join('').slice(0, 2);

    let row = '<tr>';
    if (cols.includes('team'))
      row += '<td><div class="cell-team"><img class="team-logo-cell" src="' + teamLogoUrl(p.abbr) + '" alt="' + p.abbr + '" loading="lazy"><span>' + p.abbr + '</span></div></td>';
    if (cols.includes('position'))
      // Specific sofifa slot when present (e.g. "RB"), else the coarse
      // FPL group -- same fallback convention as pitch-view.html.
      row += '<td class="cell-pos">' + (p.standardPos || POSITION_LABELS[p.position] || p.position || '—') + '</td>';
    if (cols.includes('name'))
      row += '<td><div class="cell-player">' +
        '<div class="player-initials">' + initials + '</div>' +
        '<div class="player-name-block"><div class="player-name">' + p.name + '</div></div>' +
      '</div></td>';
    if (cols.includes('rating'))
      row += '<td class="cell-stat">' + (p.rating != null ? p.rating : '—') + '</td>';
    if (cols.includes('minutes'))
      row += '<td class="cell-stat">' + (p.minutes != null ? p.minutes : '—') + '</td>';
    if (cols.includes('goals'))
      row += '<td class="cell-stat">' + (p.goals != null ? p.goals : '—') + '</td>';
    if (cols.includes('assists'))
      row += '<td class="cell-stat">' + (p.assists != null ? p.assists : '—') + '</td>';
    if (cols.includes('cleanSheets'))
      row += '<td class="cell-stat">' + (p.cleanSheets != null ? p.cleanSheets : '—') + '</td>';
    if (cols.includes('form'))
      row += '<td class="cell-stat">' + (p.form != null ? p.form.toFixed(1) : '—') + '</td>';
    if (cols.includes('bonus'))
      row += '<td class="cell-stat">' + (p.bonus != null ? p.bonus : '—') + '</td>';
    if (cols.includes('nowCost'))
      row += '<td class="cell-stat">' + (p.nowCost != null ? '£' + p.nowCost.toFixed(1) + 'm' : '—') + '</td>';
    if (cols.includes('selectedBy'))
      row += '<td class="cell-stat">' + (p.selectedBy != null ? p.selectedBy.toFixed(1) + '%' : '—') + '</td>';
    if (cols.includes('totalPoints'))
      row += '<td class="cell-stat">' + (p.totalPoints != null ? p.totalPoints : '—') + '</td>';
    row += '</tr>';
    return row;
  }).join('');

  tbody.innerHTML = html;
}

// ══════════════════════════════════════════
// STICKY OFFSET
// ══════════════════════════════════════════
function updateStickyOffset() {
  const header = document.querySelector('.header');
  const viewTabs = document.querySelector('.view-tabs');
  const filterBar = document.querySelector('.filter-bar');
  const headerH = header ? header.offsetHeight : 52;
  const tabsH = viewTabs ? viewTabs.offsetHeight : 42;
  if (filterBar) filterBar.style.top = (headerH + tabsH) + 'px';
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
window._activeCols = VIEWS['overview'].cols;
updateColumns(VIEWS['overview'].cols);
renderTeamPanel();
renderPosPanel();
loadAll().then(() => {
  requestAnimationFrame(() => {
    updateStickyOffset();
    requestAnimationFrame(() => updateStickyOffset());
  });
});
window.addEventListener('resize', updateStickyOffset);
window.addEventListener('resize', renderMobileList);
</script>
</body>
