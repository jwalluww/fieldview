<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — DiamondView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  width: 520px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
/* Fixed (not min-) height: the field fills the viewport under the 52px header, so the page never scrolls.
   --fh is the field height; capped by width so the field + the 360px sidebar column always fit. */
:root {
  --fh: min(calc(100vh - 148px), calc((100vw - 412px) * 0.94));
  --dot: min(90px, 9.3vh);
}
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1600px;
  height: calc(100vh - 84px);
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: field ── */
.left-col { flex-shrink: 0; }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.asof { font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 10px; }

.reset-btn {
  background: none;
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 3px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
}
.reset-btn:hover { color: var(--text); background: var(--border); }

.court-canvas {
  position: relative;
  height: var(--fh);
  width: calc(var(--fh) * 500 / 470);
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: calc(var(--dot) * 1.5);
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: var(--dot); height: var(--dot);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: calc(var(--dot) * 0.26);
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 20px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: calc(var(--dot) * 0.22);
  text-align: center;
  white-space: nowrap;
  color: var(--text);
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: calc(var(--dot) * 0.19);
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  color: var(--text);
}

/* ── SELECTED CARD (sidebar open for this player) ── */
.player-card.selected { z-index: 90; }
.player-card.selected .player-dot { box-shadow: 0 0 0 3px var(--accent), 0 0 18px rgba(0,212,255,.55); }

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 200px; max-height: 280px; overflow-y: auto;
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; }
.subs-row { display: flex; align-items: center; gap: 8px; padding: 6px 5px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 10px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: batting order + pitching staff, no scroll ── */
.right-col { flex: 1; min-width: 0; height: 100%; overflow-y: auto; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
.tag-rotation { background: rgba(0,212,255,.1); color: var(--accent); border: 1px solid rgba(0,212,255,.25); }
.tag-bench { background: rgba(125,135,168,.1); color: var(--text-muted); border: 1px solid rgba(125,135,168,.25); }

.bench-stat { width: 42px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }
.bench-stat-label { font-size: 7px; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

.subgroup-label {
  padding: 6px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; height: auto; }
  .left-col { width: 100%; }
  .court-canvas { width: 100%; height: auto; aspect-ratio: 500/470; }
  .right-col, .sidebar { height: auto; width: 100%; }
}

/* ── SIDEBAR TOGGLE (header) ── */
.sb-toggle {
  margin-left: auto;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 7px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
}
.sb-toggle:hover { color: var(--text); }
.sb-toggle.on { color: var(--accent); border-color: rgba(0,212,255,.4); }
.sb-toggle + .view-toggle { margin-left: 0; }

/* ── PLAYER SIDEBAR (replaces the batting-order / pitching-staff column while open) ── */
.sidebar {
  display: none;
  position: relative;
  width: 360px;
  flex-shrink: 0;
  height: 100%;
  overflow-y: auto;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 13px;
}
body.sb-open .sidebar { display: block; }
body.sb-open .right-col { display: none; }

.sb-close {
  position: absolute;
  top: 8px; right: 10px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 22px; line-height: 1;
  cursor: pointer;
}
.sb-close:hover { color: var(--text); }
.sb-head { padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.sb-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: var(--text); line-height: 1.1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sb-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.sb-rating { text-align: center; flex-shrink: 0; }
.sb-rating-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; line-height: 1; }
.sb-rating-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-pill { border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
.sb-pill.inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); }
.sb-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sb-section-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.sb-stat { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-section-title + .sb-stat { border-top: none; }
.sb-stat-top { display: flex; justify-content: space-between; align-items: baseline; }
.sb-stat-label { font-size: 12px; color: var(--text); }
.sb-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; color: var(--text); }
.sb-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.sb-bar-fill { height: 100%; border-radius: 3px; }
.sb-low { font-size: 10px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
.sb-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-def { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-caption { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.sb-cell-label { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); }
.sb-cell-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.2; }
.sb-tbl { display: grid; grid-template-columns: 1fr 80px 80px; align-items: center; }
.sb-tbl > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl > div:nth-child(-n+3) { border-top: none; }
.sb-tbl-h { text-align: right; font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-tbl-l { font-size: 12px; color: var(--text-muted); }
.sb-tbl-v { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); }
.sb-tbl-v.best { font-weight: 800; color: #22c55e; }
.sb-sub { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; cursor: pointer; border-radius: 6px; }
.sb-sub:hover { background: var(--border); }
.sb-sub-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; width: 32px; text-align: center; flex-shrink: 0; }
.sb-sub-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-sub-pos { font-size: 11px; color: var(--text-muted); }
.sb-empty { font-size: 12px; color: var(--text-dim); }
.sb-cmp-actions { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.sb-btn { flex: 1; padding: 8px 0; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.sb-btn:hover { background: var(--border); }
.sb-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.sb-btn.primary:hover { filter: brightness(1.1); }
.sb-cmp-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); }
.sb-cmp-tagline { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-cmp-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.1; }
.sb-cmp-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-cmp-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; line-height: 1; margin-top: 4px; }
.sb-cmp-row { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-cmp-row:first-of-type { border-top: none; }
.sb-cmp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.sb-cmp-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-cmp-tag { width: 62px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-cmp-val { width: 46px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; color: var(--text); }

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 220px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; color: var(--text); }
.popup-stat-label { font-size: 10px; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup-section-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 9px; font-weight: 700; margin-bottom: 4px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=mlb'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">
      <img class="team-logo team-logo-header" id="teamLogoEl" alt="NYY">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px" id="teamNameEl">New York Yankees</span>
    </div>
    <div class="teams-dropdown" id="teamsDropdown"></div>
  </div>

  <button class="sb-toggle" id="sbToggle" onclick="toggleSidebarMode()" title="Click a player for a detail sidebar (Off = click to substitute)"></button>
  <div class="view-toggle">
    <button class="view-btn active">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="4" y="0" width="4" height="4" fill="currentColor" transform="rotate(45 6 2)"/><rect x="4" y="4" width="4" height="4" fill="currentColor" transform="rotate(45 6 6)" opacity=".6"/><rect x="0" y="4" width="4" height="4" fill="currentColor" transform="rotate(45 2 6)" opacity=".6"/><rect x="8" y="4" width="4" height="4" fill="currentColor" transform="rotate(45 10 6)" opacity=".6"/></svg>
      DiamondView
    </button>

<script>
// ══════════════════════════════════════════
// TEAMS
// ══════════════════════════════════════════
const TEAMS = {
  ATH: { name: "Athletics" },
  ATL: { name: "Atlanta Braves" },
  AZ:  { name: "Arizona Diamondbacks" },
  BAL: { name: "Baltimore Orioles" },
  BOS: { name: "Boston Red Sox" },
  CHC: { name: "Chicago Cubs" },
  CIN: { name: "Cincinnati Reds" },
  CLE: { name: "Cleveland Guardians" },
  COL: { name: "Colorado Rockies" },
  CWS: { name: "Chicago White Sox" },
  DET: { name: "Detroit Tigers" },
  HOU: { name: "Houston Astros" },
  KC:  { name: "Kansas City Royals" },
  LAA: { name: "Los Angeles Angels" },
  LAD: { name: "Los Angeles Dodgers" },
  MIA: { name: "Miami Marlins" },
  MIL: { name: "Milwaukee Brewers" },
  MIN: { name: "Minnesota Twins" },
  NYM: { name: "New York Mets" },
  NYY: { name: "New York Yankees" },
  PHI: { name: "Philadelphia Phillies" },
  PIT: { name: "Pittsburgh Pirates" },
  SD:  { name: "San Diego Padres" },
  SEA: { name: "Seattle Mariners" },
  SF:  { name: "San Francisco Giants" },
  STL: { name: "St. Louis Cardinals" },
  TB:  { name: "Tampa Bay Rays" },
  TEX: { name: "Texas Rangers" },
  TOR: { name: "Toronto Blue Jays" },
  WSH: { name: "Washington Nationals" },
};
const TEAM_ABBRS = Object.keys(TEAMS);

// ESPN's team-logo CDN, same host/pattern as NBA's (a.espncdn.com/i/teamlogos/{sport}/500/{code}.png).
// Verified live, not guessed -- all 30 codes below return 200. Two of our
// internal abbreviations don't match ESPN's own short code, same class of
// mismatch as NBA's no/utah: Arizona is "ari" (not "az"; "az" 404s) and
// the White Sox are "chw" (not "cws" -- "cws" also resolves but to a
// different/older logo asset, "chw" is ESPN's standard 3-letter code).
// The Athletics' "ath" and legacy "oak" codes resolve to the byte-identical
// image, so either works; "ath" was picked to match the current team name.
const ESPN_TEAM_CODES = {
  ATH: 'ath', ATL: 'atl', AZ: 'ari', BAL: 'bal', BOS: 'bos',
  CHC: 'chc', CIN: 'cin', CLE: 'cle', COL: 'col', CWS: 'chw',
  DET: 'det', HOU: 'hou', KC: 'kc', LAA: 'laa', LAD: 'lad',
  MIA: 'mia', MIL: 'mil', MIN: 'min', NYM: 'nym', NYY: 'nyy',
  PHI: 'phi', PIT: 'pit', SD: 'sd', SEA: 'sea', SF: 'sf',
  STL: 'stl', TB: 'tb', TEX: 'tex', TOR: 'tor', WSH: 'wsh',
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/mlb/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// Field zones (% of field canvas). DH is deliberately absent -- it fields
// no position, so it never gets a diamond zone; DH players only appear in
// the batting-order sidebar. First-pass percentages, retuned once against
// a real render (see diamond-view build notes).
const DIAMOND_ZONES = {
  P:  { x: 50, y: 58 },
  C:  { x: 50, y: 84 },
  '1B': { x: 71, y: 60 },
  '2B': { x: 62, y: 39 },
  '3B': { x: 25, y: 60 },
  SS: { x: 34, y: 41 },
  LF: { x: 18, y: 15 },
  CF: { x: 50, y: 10 },
  RF: { x: 82, y: 15 },
};
const ZONE_ORDER = ['P','C','1B','2B','3B','SS','LF','CF','RF'];

// Field zone -> position_group, used to gate substitution eligibility.
// C and P (and DH, off-field) are standalone -- exact position match only,
// no cross-group subbing, per the same taxonomy build_mlb_match.py resolved.
const ZONE_GROUP = { '1B':'IF', '2B':'IF', '3B':'IF', SS:'IF', LF:'OF', CF:'OF', RF:'OF' };

let currentTeam = 'NYY';
let allPlayers = [];
let teamPlayers = [];
// Frontend-only view state for manual bench->field substitutions -- keyed
// by field zone, never written back to mlb_players_master.json, reset on
// every team switch (see loadTeam()), same convention as NBA's manualStarters.
let manualStarters = {};

// Shared 0-99 rating color scale, identical to nba/court-view.html and
// epl/pitch-view.html's ratingColor() -- MLB ratings are live now via
// The Show's official API (scrape_show_api.py), so the dot switches from an AVG/ERA
// heuristic to the same rating-driven convention every other sport uses.
function ratingColor(r) {
  if (r == null) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function mapPlayer(p) {
  const bs = p.batting_stats || null;
  const ps = p.pitching_stats || null;
  const pa = bs ? (bs.plateAppearances != null ? bs.plateAppearances : (bs.atBats != null ? bs.atBats : 0)) : 0;
  return {
    id: p.player_id,
    name: p.name,
    team: p.team_abbr,
    teamName: p.team,
    position: p.position,
    positionGroup: p.position_group,
    positionGroupSource: p.position_group_source,
    playerType: p.player_type,
    jersey: p.jersey_number,
    height: p.height,
    weight: p.weight,
    bats: p.bats,
    throws: p.throws,
    pa: pa,
    avg: bs ? bs.avg : null,
    hr: bs ? bs.homeRuns : null,
    rbi: bs ? bs.rbi : null,
    ops: bs ? bs.ops : null,
    gamesPlayedBatting: bs ? bs.gamesPlayed : null,
    gamesStarted: ps ? (ps.gamesStarted || 0) : 0,
    gamesPitched: ps ? (ps.gamesPitched || 0) : 0,
    era: ps ? ps.era : null,
    whip: ps ? ps.whip : null,
    wins: ps ? ps.wins : null,
    losses: ps ? ps.losses : null,
    so: ps ? ps.strikeOuts : null,
    inningsPitched: ps ? ps.inningsPitched : null,
    rating: p.overall_rating,
    age: (bs && bs.age) || (ps && ps.age) || null,
    bs: bs,
    ps: ps,
    injured: !!p.injured,
    rosterStatus: p.roster_status,
    hasBatting: !!bs,
    hasPitching: !!ps,
  };
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/mlb_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
    buildAdv();
  } catch (e) {
    console.error('Failed to load mlb_players_master.json:', e);
    allPlayers = [];
  }
}

// "Ratings as of <date>" caption: newest roster update's date from ratings_meta.json (shown only if present).
async function loadRatingsMeta() {
  try {
    const res = await fetch('data/ratings_meta.json');
    const meta = await res.json();
    if (meta.ratings_as_of) {
      const [y, m, d] = meta.ratings_as_of.split('-').map(Number);
      const txt = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('ratingsAsOf').textContent = 'Ratings as of ' + txt;
    }
  } catch (e) {}
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  sidebarZone = null; compareId = null;
  document.body.classList.remove('sb-open');
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderField();
  renderBattingOrder();
  renderPitchingStaff();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING NINE (FIELD)
// ══════════════════════════════════════════
// Natural candidates for a zone: exact position match, except CF also
// absorbs a generic 'OF' player (position_group_source: 'defaulted') --
// mirrors the one known real case (Cristian Pache) rather than a general
// rule, per the "single-player edge case, don't over-engineer" call this
// data was built under.
// Injured-list players (roster_status D7/D10/D15/D60) are never natural starters.
function naturalCandidates(zone) {
  if (zone === 'CF') {
    return teamPlayers.filter(p => !p.injured && (p.position === 'CF' || p.position === 'OF'));
  }
  return teamPlayers.filter(p => !p.injured && p.position === zone);
}

// Has actually played this season (PA or IP). The 40-man carries filler with neither; those, and
// injured players, stay out of the sub pools and the batting-order / pitching-staff lists.
function hasPlayed(p) {
  return (p.pa || 0) > 0 || (p.ps && ipToNum(p.ps.inningsPitched) > 0);
}

function getStarter(zone) {
  if (manualStarters[zone] != null) {
    const manual = teamPlayers.find(p => p.id === manualStarters[zone]);
    if (manual) return manual;
  }
  const usedElsewhere = new Set(
    Object.entries(manualStarters).filter(([k]) => k !== zone).map(([, id]) => id)
  );
  const candidates = naturalCandidates(zone).filter(p => !usedElsewhere.has(p.id));
  if (!candidates.length) return null;
  if (zone === 'P') {
    return candidates.slice().sort((a,b) => (b.gamesStarted||0) - (a.gamesStarted||0) || (b.gamesPitched||0) - (a.gamesPitched||0))[0];
  }
  return candidates.slice().sort((a,b) => (b.pa||0) - (a.pa||0))[0];
}

function renderField() {
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(zone => {
    const dz = DIAMOND_ZONES[zone];
    const p = getStarter(zone);
    if (!p) {
      return `
        <div class="player-card" data-pos="${zone}" style="left:${dz.x}%; top:${dz.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    return `
      <div class="player-card" data-pos="${zone}" data-pid="${p.id}" style="left:${dz.x}%; top:${dz.y}%">
        <div class="player-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-rank">${zone}</div>
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;

  // Keep the sidebar in step with the field: refresh it (or close it if its zone has no player now).
  if (sidebarZone) renderSidebar();
  setSelectedHighlight();
  updateResetBtn();
}

// Reset button is only shown while there are manual subs.
function updateResetBtn() {
  document.getElementById('resetStartersBtn').style.display = Object.keys(manualStarters).length ? '' : 'none';
}

function resetStarters() {
  manualStarters = {};
  compareId = null;
  hidePopup();
  renderField();
  renderBattingOrder();
  renderPitchingStaff();
}

// ══════════════════════════════════════════
// BATTING ORDER (all batters, not just bench --
// "batting order" is the whole lineup+bench by
// usage, unlike a basketball bench/rotation list)
// ══════════════════════════════════════════
function renderBattingOrder() {
  const list = document.getElementById('battingOrderList');
  // pa > 0, not just hasBatting -- statsapi.mlb.com gives every rostered
  // player a hitting stat line even if they've never batted (pure
  // pitchers get a real, present, all-zero row), so presence alone isn't
  // "this person bats". Confirmed on real data: 54 pitchers league-wide
  // carry a zero-PA batting_stats block.
  const batters = teamPlayers
    .filter(p => !p.injured && p.hasBatting && p.pa > 0)
    .sort((a, b) => (b.pa || 0) - (a.pa || 0));

  if (!batters.length) {
    list.innerHTML = '<div class="bench-empty">No batting stats on this roster yet.</div>';
    return;
  }

  list.innerHTML = batters.map((p, i) => {
    const rc = ratingColor(p.rating);
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${rc}">${p.rating != null ? p.rating : '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${p.position || ''}${p.playerType === 'two_way' ? ' <span class="tag tag-rotation">TWP</span>' : ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.hr != null ? p.hr : '—'}</div><div class="bench-stat-label">hr</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.rbi != null ? p.rbi : '—'}</div><div class="bench-stat-label">rbi</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.ops || '—'}</div><div class="bench-stat-label">ops</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.pa || '—'}</div><div class="bench-stat-label">pa</div></div>
      </div>
    `;
  }).join('');
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PITCHING STAFF (starters, then bullpen).
// Ohtani (two_way, gamesStarted > 0) legitimately
// appears here too, alongside the batting order --
// not a bug, falls out of filtering by data presence.
// ══════════════════════════════════════════
function renderPitchingStaff() {
  const list = document.getElementById('pitchingList');
  const pitchers = teamPlayers.filter(p => !p.injured && p.hasPitching && ipToNum(p.inningsPitched) > 0);
  const starters = pitchers.filter(p => (p.gamesStarted || 0) > 0)
    .sort((a, b) => (b.gamesStarted || 0) - (a.gamesStarted || 0));
  const bullpen = pitchers.filter(p => (p.gamesStarted || 0) === 0)
    .sort((a, b) => (b.gamesPitched || 0) - (a.gamesPitched || 0));

  if (!pitchers.length) {
    list.innerHTML = '<div class="bench-empty">No pitching stats on this roster yet.</div>';
    return;
  }

  function pitcherRow(p) {
    const rc = ratingColor(p.rating);
    const wl = (p.wins != null && p.losses != null) ? `${p.wins}-${p.losses}` : '—';
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-dot" style="background:${rc}">${p.rating != null ? p.rating : '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${p.gamesStarted > 0 ? '<span class="tag tag-starter">SP</span>' : '<span class="tag tag-bench">RP</span>'}${p.playerType === 'two_way' ? ' <span class="tag tag-rotation">TWP</span>' : ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.whip || '—'}</div><div class="bench-stat-label">whip</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${wl}</div><div class="bench-stat-label">w-l</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.so != null ? p.so : '—'}</div><div class="bench-stat-label">so</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.inningsPitched || '—'}</div><div class="bench-stat-label">ip</div></div>
      </div>
    `;
  }

  let html = '';
  if (starters.length) html += `<div class="subgroup-label">Starters</div>` + starters.map(pitcherRow).join('');
  if (bullpen.length) html += `<div class="subgroup-label">Bullpen</div>` + bullpen.map(pitcherRow).join('');
  list.innerHTML = html;
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP (hover, field cards AND
// sidebar rows -- both wired via the same
// per-node mouseenter/mouseleave mechanics)
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (click a starter -> popover of
// eligible bench players, gated by position_group
// for IF/OF zones, exact position for C/P -> swap)
// ══════════════════════════════════════════
let openPopoverPos = null;

function subEligiblePlayers(zone) {
  const allStarterIds = new Set(ZONE_ORDER.map(z => getStarter(z)?.id).filter(Boolean));
  let pool;
  if (ZONE_GROUP[zone]) {
    pool = teamPlayers.filter(p => p.positionGroup === ZONE_GROUP[zone]);
  } else if (zone === 'P') {
    // Two-way players (Ohtani) carry position 'TWP', not 'P' -- exact-position
    // gating alone would wrongly exclude a real pitcher from the P-zone pool.
    // Scoped to P only: doesn't extend to C or any other standalone zone.
    pool = teamPlayers.filter(p => p.position === zone || p.playerType === 'two_way');
  } else {
    pool = teamPlayers.filter(p => p.position === zone);
  }
  pool = pool.filter(p => !allStarterIds.has(p.id) && !p.injured && hasPlayed(p));
  if (zone === 'P') {
    return pool.sort((a,b) => (b.gamesStarted||0) - (a.gamesStarted||0) || (b.gamesPitched||0) - (a.gamesPitched||0));
  }
  return pool.sort((a,b) => (b.pa||0) - (a.pa||0));
}

function subsLabel(zone) {
  if (zone === 'P') return 'Sub in (pitchers)';
  if (zone === 'C') return 'Sub in (catchers)';
  if (ZONE_GROUP[zone] === 'IF') return 'Sub in (infielders)';
  if (ZONE_GROUP[zone] === 'OF') return 'Sub in (outfielders)';
  return 'Sub in';
}

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
      const zone = card.dataset.pos;
      if (sidebarOn) { openSidebar(zone); return; }
      const popover = document.getElementById('subsPop');
      if (openPopoverPos === zone) {
        popover.classList.remove('open');
        openPopoverPos = null;
        return;
      }
      const subs = subEligiblePlayers(zone);
      const isPitcherZone = zone === 'P';

      popover.innerHTML = `<div class="subs-pop-label">${subsLabel(zone)}</div>` +
        (subs.length ? subs.map(s => `
          <div class="subs-row" data-pid="${s.id}">
            <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating != null ? s.rating : '—'}</div>
            <div class="subs-name">${s.name}</div>
            <div class="subs-mpg">${isPitcherZone ? (s.gamesStarted || 0) + ' gs' : (s.pa || 0) + ' pa'}</div>
          </div>`).join('') : `<div class="subs-empty">No eligible bench players</div>`);

      const courtCanvas = card.closest('.court-canvas');
      const rect = card.getBoundingClientRect();
      const parentRect = courtCanvas.getBoundingClientRect();
      popover.style.left = (rect.left - parentRect.left + 34) + 'px';
      popover.style.top = (rect.top - parentRect.top) + 'px';
      popover.classList.add('open');
      openPopoverPos = zone;

      popover.querySelectorAll('.subs-row').forEach(row => {
        row.addEventListener('click', (ev) => {
          ev.stopPropagation();
          substitutePlayer(row.dataset.pid, zone);
          popover.classList.remove('open');
          openPopoverPos = null;
        });

function popupHTML(p) {

// Sidebar mode: hover is just name / position / rating; everything else is in the sidebar.

  `;

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin; // flip to the left of the anchor
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function showPopup(pid, anchorEl) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  const popup = document.getElementById('playerPopup');
  popup.innerHTML = sidebarOn ? lightPopupHTML(p) : popupHTML(p);
  popup.style.display = 'block';
  positionPopup(popup, anchorEl);
}

// ── Advanced stats: league-wide populations ──
// "123.2" innings = 123 and 2/3, not 123.2.
function ipToNum(v) {
  if (v == null) return null;
  const [w, f] = String(v).split('.');
  const n = parseInt(w, 10) + (parseInt(f || '0', 10) / 3);
  return isNaN(n) ? null : n;
}
function fmtIP(v) {
  const w = Math.floor(v + 1e-9);
  return w + '.' + Math.round((v - w) * 3);
}
// statsapi sends rates as strings (".285", ".---", "-.--"); anything unparseable is missing.
function num(v) { const n = parseFloat(v); return isNaN(n) ? null : n; }
const fmt3 = v => (v < 1 && v >= 0 ? v.toFixed(3).slice(1) : v.toFixed(3));
const fmtP = v => v.toFixed(1) + '%';
const fmtD = d => v => v.toFixed(d);

// lower: lower is better (percentile inverted). style: describes how he plays, not how good he is --
// neutral bar and descriptive text instead of a good/bad color.
const BAT_ADV = {
  ops:    { label: 'OPS',  fmt: fmt3, def: 'On-base plus slugging: the all-in-one hitting rate.' },
  obp:    { label: 'OBP',  fmt: fmt3, def: 'How often he reaches base per plate appearance.' },
  slg:    { label: 'SLG',  fmt: fmt3, def: 'Total bases per at-bat: power and extra-base hits.' },
  iso:    { label: 'ISO',  fmt: fmt3, def: 'Slugging minus average: pure extra-base power.' },
  bb_pct: { label: 'BB%',  fmt: fmtP, def: 'Share of plate appearances that end in a walk.' },
  k_pct:  { label: 'K%',   fmt: fmtP, lower: true, def: 'Share of plate appearances that end in a strikeout (lower is better).' },
  babip:  { label: 'BABIP', fmt: fmt3, style: 'higher than', def: 'Average on balls in play. Mostly contact type and luck, not skill.' },
};
const PIT_ADV = {
  era:    { label: 'ERA',   fmt: fmtD(2), lower: true, def: 'Earned runs allowed per 9 innings (lower is better).' },
  whip:   { label: 'WHIP',  fmt: fmtD(2), lower: true, def: 'Walks plus hits per inning pitched (lower is better).' },
  k_pct:  { label: 'K%',    fmt: fmtP, def: 'Share of batters faced that he strikes out.' },
  bb_pct: { label: 'BB%',   fmt: fmtP, lower: true, def: 'Share of batters faced that he walks (lower is better).' },
  k_bb:   { label: 'K−BB%', fmt: fmtP, def: 'Strikeout rate minus walk rate: the best quick read on a pitcher.' },
  hr9:    { label: 'HR/9',  fmt: fmtD(2), lower: true, def: 'Home runs allowed per 9 innings (lower is better).' },
};
const ADV = { bat: BAT_ADV, pit: PIT_ADV };
const ADV_LIST = { bat: ['ops', 'obp', 'slg', 'iso', 'bb_pct', 'k_pct', 'babip'], pit: ['era', 'whip', 'k_pct', 'bb_pct', 'k_bb', 'hr9'] };

// Percentile color: red at 0, amber at 50, green at 99 (copied from nfl-formation-view.html).
const PCT_RED = [239, 68, 68], PCT_AMBER = [245, 190, 40], PCT_GREEN = [34, 197, 94];
const PCT_NEUTRAL = '#8b93b0';
function pctColor(pct) {
  const [a, b, t] = pct <= 50 ? [PCT_RED, PCT_AMBER, pct / 50] : [PCT_AMBER, PCT_GREEN, (pct - 50) / 49];
  return 'rgb(' + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',') + ')';
}
function ordinal(n) {
  const r = n % 100;
  if (r >= 11 && r <= 13) return n + 'th';
  return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
}

// Team games G for the qualifiers: 162 once the regular season is complete, else the most games any
// team has played (approximated by the most games any player has appeared in).
let leagueG = 162;
let pctIndex = {}; // group ('bat' | 'SP' | 'RP') -> stat key -> sorted values of every qualified player

function kindsOf(p) {
  return p.playerType === 'pitcher' ? ['pit'] : p.playerType === 'two_way' ? ['bat', 'pit'] : ['bat'];
}

function buildAdv() {
  let maxG = 0;
  for (const p of allPlayers) for (const s of [p.bs, p.ps]) if (s && s.gamesPlayed > maxG) maxG = s.gamesPlayed;
  leagueG = Math.min(162, maxG) || 162;
  console.info('[DiamondView] qualifier G =', leagueG, maxG >= 162 ? '(regular season complete)' : '(max games played so far)');

  pctIndex = {};
  for (const p of allPlayers) {
    p.adv = { bat: null, pit: null };
    const kinds = kindsOf(p);
    if (kinds.includes('bat') && p.bs) {
      const s = p.bs, pa = s.plateAppearances, bb = s.baseOnBalls, so = s.strikeOuts;
      if (pa > 0) {
        const slg = num(s.slg), avg = num(s.avg);
        p.adv.bat = {
          qualified: pa >= 3.1 * leagueG,
          vals: {
            ops: num(s.ops), obp: num(s.obp), slg, iso: slg != null && avg != null ? slg - avg : null,
            bb_pct: bb != null ? bb / pa * 100 : null, k_pct: so != null ? so / pa * 100 : null, babip: num(s.babip),
          },
        };
      }
    }
    if (kinds.includes('pit') && p.ps) {
      const s = p.ps, ip = ipToNum(s.inningsPitched), bf = s.battersFaced;
      if (ip != null && ip > 0) {
        const g = s.gamesPitched != null ? s.gamesPitched : s.gamesPlayed;
        const role = (s.gamesStarted || 0) >= g / 2 ? 'SP' : 'RP';
        const k = bf > 0 ? s.strikeOuts / bf * 100 : null, bbp = bf > 0 ? s.baseOnBalls / bf * 100 : null;
        p.adv.pit = {
          role,
          qualified: ip >= (role === 'SP' ? 1.0 : 0.25) * leagueG,
          vals: { era: num(s.era), whip: num(s.whip), k_pct: k, bb_pct: bbp, k_bb: k != null ? k - bbp : null, hr9: s.homeRuns != null ? s.homeRuns * 9 / ip : null },
        };
      }
    }
    for (const kind of ['bat', 'pit']) {
      const a = p.adv[kind];
      if (!a || !a.qualified) continue;
      const group = kind === 'bat' ? 'bat' : a.role;
      for (const key in a.vals) {
        const v = a.vals[key];
        if (typeof v !== 'number' || isNaN(v)) continue;
        const byKey = pctIndex[group] || (pctIndex[group] = {});
        (byKey[key] || (byKey[key] = [])).push(v);
      }
    }
  }
  for (const g in pctIndex) for (const k in pctIndex[g]) pctIndex[g][k].sort((a, b) => a - b);
}

const groupOf = (p, kind) => kind === 'bat' ? 'bat' : p.adv.pit.role;
const advVal = (p, kind, key) => p.adv && p.adv[kind] ? p.adv[kind].vals[key] : null;
const isLowSample = (p, kind) => !!(p.adv && p.adv[kind] && !p.adv[kind].qualified);

// % of the qualified population he beats (ties count half), inverted for lower-is-better stats.
// Null when unqualified or the population is under 10. (copied from nfl-formation-view.html)
function percentileOf(p, kind, key) {
  const a = p.adv && p.adv[kind];
  const arr = a && pctIndex[groupOf(p, kind)] && pctIndex[groupOf(p, kind)][key];
  const v = a && a.vals[key];
  if (!arr || arr.length < 10 || typeof v !== 'number' || isNaN(v) || !a.qualified) return null;
  const lower = !!ADV[kind][key].lower;
  let beaten = 0, eq = 0;
  for (const x of arr) {
    if (x === v) eq++;
    else if (lower ? x > v : x < v) beaten++;
  }
  beaten += 0.5 * (eq - 1); // he is one of the "tied" players; exclude himself
  return Math.min(99, Math.round(beaten / (arr.length - 1) * 100));
}

function statPct(p, kind, key) {
  const m = ADV[kind][key];
  const pct = advVal(p, kind, key) != null ? percentileOf(p, kind, key) : null;
  if (pct == null) return { pct: null, color: null, text: '' };
  return {
    pct,
    color: m.style ? PCT_NEUTRAL : pctColor(pct),
    text: m.style ? m.style + ' ' + pct + '% of hitters' : ordinal(pct) + ' pct',
  };
}

function advStatHtml(p, kind, key) {
  const m = ADV[kind][key];
  const v = advVal(p, kind, key);
  const { pct, color: c, text } = statPct(p, kind, key);
  const low = v != null && isLowSample(p, kind);
  return `
    <div class="sb-stat">
      <div class="sb-stat-top"><span class="sb-stat-label">${m.label}${low ? ' <span class="sb-low">low sample</span>' : ''}</span><span class="sb-stat-val">${v != null ? m.fmt(v) : '—'}</span></div>
      ${pct != null ? `<div class="sb-bar-wrap"><div class="sb-bar"><div class="sb-bar-fill" style="width:${pct}%;background:${c}"></div></div><span class="sb-pct" style="color:${c}">${text}</span></div>` : ''}
      <div class="sb-def">${m.def}</div>
    </div>`;
}

// ── Season-stat grid / comparison table ──
// val: number for comparison (null = missing); txt: formatter (default String); disp: full override;
// lower: lower is better.
const bsv = k => p => p.bs ? num(p.bs[k]) : null;
const psv = k => p => p.ps ? num(p.ps[k]) : null;
const advDef = (kind, key) => ({ label: ADV[kind][key].label, val: p => advVal(p, kind, key), txt: ADV[kind][key].fmt, lower: !!ADV[kind][key].lower });
const GRID_DEFS = {
  bat: [
    { label: 'G', val: bsv('gamesPlayed') }, { label: 'PA', val: bsv('plateAppearances') }, { label: 'AB', val: bsv('atBats') },
    { label: 'H', val: bsv('hits') }, { label: 'HR', val: bsv('homeRuns') }, { label: 'RBI', val: bsv('rbi') },
    { label: 'R', val: bsv('runs') }, { label: 'SB', val: bsv('stolenBases') }, { label: 'AVG', val: bsv('avg'), txt: fmt3 },
  ],
  pit: [
    { label: 'G', val: p => p.ps ? (p.ps.gamesPitched != null ? p.ps.gamesPitched : p.ps.gamesPlayed) : null }, { label: 'GS', val: psv('gamesStarted') },
    { label: 'W-L', val: () => null, disp: p => p.ps && p.ps.wins != null && p.ps.losses != null ? p.ps.wins + '-' + p.ps.losses : null },
    { label: 'IP', val: p => p.ps ? ipToNum(p.ps.inningsPitched) : null, txt: fmtIP }, { label: 'SO', val: psv('strikeOuts') },
    { label: 'BB', val: psv('baseOnBalls'), lower: true }, { label: 'SV', val: psv('saves') }, { label: 'HLD', val: psv('holds') },
  ],
};
// extra rate rows in the comparison table (same stats as the advanced rows, without bars)
const CMP_EXTRA = {
  bat: [advDef('bat', 'ops'), advDef('bat', 'bb_pct'), advDef('bat', 'k_pct')],
  pit: [advDef('pit', 'era'), advDef('pit', 'whip'), advDef('pit', 'k_pct'), advDef('pit', 'bb_pct'), advDef('pit', 'hr9')],
};

function cellText(d, p) {
  if (d.disp) return d.disp(p) || '—';
  const v = d.val(p);
  return v == null ? '—' : (d.txt ? d.txt(v) : String(v));
}
const KIND_TITLE = { bat: 'Batting', pit: 'Pitching' };

function gridSectionHtml(p, kind, multi) {
  const defs = GRID_DEFS[kind];
  const texts = defs.map(d => cellText(d, p));
  if (texts.every(t => t === '—')) return '';
  return `<div class="sb-section"><div class="sb-section-title">Season Stats${multi ? ' · ' + KIND_TITLE[kind] : ''}</div>
    <div class="sb-grid">${defs.map((d, i) => `<div class="sb-cell"><div class="sb-cell-label">${d.label}</div><div class="sb-cell-val">${texts[i]}</div></div>`).join('')}</div>
    <div class="sb-caption">${STATS_SEASON} season</div></div>`;
}

// Stat blocks to show: only those the player actually has, pitching first for a two-way player at P.
function displayKinds(p, zone) {
  const kinds = kindsOf(p).filter(k => p.adv && p.adv[k]);
  return zone === 'P' ? kinds.sort((a, b) => (a === 'pit' ? 0 : 1) - (b === 'pit' ? 0 : 1)) : kinds;
}

const lastName = pl => { const w = pl.name.split(' '); return w.length > 1 ? w.slice(1).join(' ') : w[0]; };

function renderSidebar(resetScroll) {
  const el = document.getElementById('playerSidebar');
  const p = sidebarZone ? getStarter(sidebarZone) : null;
  if (!p) { closeSidebar(); return; }
  if (compareId) { renderCompare(el, p); return; }

  const kinds = displayKinds(p, sidebarZone);
  const multi = kinds.length > 1;
  const meta1 = [p.position + (sidebarZone !== p.position ? ' · ' + sidebarZone : ''), p.teamName].filter(Boolean).join(' · ');
  const meta2 = [p.age ? 'Age ' + p.age : null, p.bats ? 'Bats ' + p.bats : null, p.throws ? 'Throws ' + p.throws : null, p.height || null, p.weight ? p.weight + ' lbs' : null].filter(Boolean).join(' · ');

  const advHtml = kinds.map(kind => `<div class="sb-section"><div class="sb-section-title">Advanced Stats${multi ? ' · ' + KIND_TITLE[kind] : ''}</div>
      ${ADV_LIST[kind].map(k => advStatHtml(p, kind, k)).join('')}
      <div class="sb-caption">${kind === 'pit' ? 'Ranked among ' + (p.adv.pit.role === 'SP' ? 'starting' : 'relief') + ' pitchers' : 'Ranked among all qualified batters'}</div></div>`).join('');
  const gridHtml = kinds.map(kind => gridSectionHtml(p, kind, multi)).join('');

  const subs = subEligiblePlayers(sidebarZone);
  const isP = sidebarZone === 'P';
  const subsHtml = subs.length ? subs.map(c => `
      <div class="sb-sub" onclick="openCompare('${c.id}', event)">
        <div class="sb-sub-rating" style="color:${ratingColor(c.rating)}">${c.rating != null ? c.rating : '—'}</div>
        <div class="sb-sub-name">${c.name}</div>
        <div class="sb-sub-pos">${c.position || ''} · ${isP ? (c.gamesStarted || 0) + ' gs' : (c.pa || 0) + ' pa'}</div>
      </div>`).join('') : '<div class="sb-empty">No other players available at this position.</div>';

  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-head">
      <div style="flex:1;min-width:0">
        <div class="sb-name"><span>${p.jersey ? '#' + p.jersey + ' ' : ''}${p.name}</span>${p.injured ? '<span class="sb-pill inj">INJ</span>' : ''}</div>
        <div class="sb-meta">${meta1}</div>
        ${meta2 ? `<div class="sb-meta">${meta2}</div>` : ''}
      </div>
      <div class="sb-rating"><div class="sb-rating-val" style="color:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div><div class="sb-rating-label">Overall</div></div>
    </div>
    ${advHtml}
    ${gridHtml}
    <div class="sb-section" style="border-bottom:none">
      <div class="sb-section-title">Substitutes</div>
      ${subsHtml}
    </div>`;
  document.body.classList.add('sb-open');
  if (resetScroll) el.scrollTop = 0;
  setSelectedHighlight();
  syncURL();
}

function openCompare(id, event) {
  if (event) event.stopPropagation();
  compareId = id;
  renderSidebar(true);
}

function closeCompare(event) {
  if (event) event.stopPropagation();
  compareId = null;
  renderSidebar(true);
}

function swapFromCompare(event) {
  if (event) event.stopPropagation();
  substitutePlayer(compareId, sidebarZone); // clears compareId; renderField() re-renders the sidebar for the new starter
}

// Starter vs. candidate. Only stat blocks both players have are compared; each percentile stays
// within the player's own population.
function renderCompare(el, a) {
  const b = teamPlayers.find(x => String(x.id) === String(compareId));
  if (!b) { compareId = null; renderSidebar(); return; }
  const kindsA = displayKinds(a, sidebarZone), kindsB = displayKinds(b, sidebarZone);
  const shared = kindsA.filter(k => kindsB.includes(k));
  const sameKinds = kindsA.length === kindsB.length && shared.length === kindsA.length;
  const multi = shared.length > 1;

  const tableFor = kind => {
    const rows = [...GRID_DEFS[kind], ...CMP_EXTRA[kind]].map(d => {
      const ta = cellText(d, a), tb = cellText(d, b);
      if (ta === '—' && tb === '—') return '';
      const va = d.val(a), vb = d.val(b);
      let best = '';
      if (va != null && vb != null && ta !== tb) best = (d.lower ? va < vb : va > vb) ? 'a' : 'b';
      return `<div class="sb-tbl-l">${d.label}</div><div class="sb-tbl-v${best === 'a' ? ' best' : ''}">${ta}</div><div class="sb-tbl-v${best === 'b' ? ' best' : ''}">${tb}</div>`;
    }).join('');
    if (!rows) return '';
    return `<div class="sb-section"><div class="sb-section-title">Season Stats${multi ? ' · ' + KIND_TITLE[kind] : ''}</div>
      <div class="sb-tbl"><div></div><div class="sb-tbl-h">${lastName(a)}</div><div class="sb-tbl-h">${lastName(b)}</div>${rows}</div>
      <div class="sb-caption">${STATS_SEASON} season</div></div>`;
  };

  const line = (pl, kind, key) => {
    const m = ADV[kind][key], v = advVal(pl, kind, key);
    const { pct, color } = statPct(pl, kind, key);
    return `<div class="sb-cmp-line"><span class="sb-cmp-tag">${lastName(pl)}</span>
      <div class="sb-bar">${pct != null ? `<div class="sb-bar-fill" style="width:${pct}%;background:${color}"></div>` : ''}</div>
      <span class="sb-cmp-val">${v != null ? m.fmt(v) : '—'}</span>
      <span class="sb-cmp-pct" style="color:${color || 'inherit'}">${pct != null ? ordinal(pct) : (v != null && isLowSample(pl, kind) ? '<span class="sb-low" style="margin:0">low sample</span>' : '')}</span></div>`;
  };
  const advFor = kind => {
    const rows = ADV_LIST[kind].filter(k => advVal(a, kind, k) != null || advVal(b, kind, k) != null).map(key =>
      `<div class="sb-cmp-row"><div class="sb-cmp-top"><span class="sb-stat-label">${ADV[kind][key].label}</span></div>${line(a, kind, key)}${line(b, kind, key)}</div>`).join('');
    return rows ? `<div class="sb-section"><div class="sb-section-title">Advanced Stats${multi ? ' · ' + KIND_TITLE[kind] : ''} · percentile vs. own group</div>${rows}</div>` : '';
  };

  const head = (pl, tag) => `<div>
      <div class="sb-cmp-tagline">${tag}</div>
      <div class="sb-cmp-name">${pl.jersey ? '#' + pl.jersey + ' ' : ''}${pl.name}</div>
      <div class="sb-cmp-sub">${pl.position || ''}${pl.age ? ' · Age ' + pl.age : ''}</div>
      <div class="sb-cmp-rating" style="color:${ratingColor(pl.rating)}">${pl.rating != null ? pl.rating : '—'}</div>
    </div>`;

  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-cmp-head">${head(a, 'Starter')}${head(b, 'Substitute')}</div>
    <div class="sb-cmp-actions">
      <button class="sb-btn" onclick="closeCompare(event)">Back</button>
      <button class="sb-btn primary" onclick="swapFromCompare(event)">Swap in</button>
    </div>
    ${shared.map(tableFor).join('')}
    ${shared.map(advFor).join('')}
    ${!shared.length ? '<div class="sb-section"><div class="sb-empty">These players have no stats in common to compare.</div></div>' : ''}
    ${!sameKinds ? '<div class="sb-section" style="border-bottom:none"><div class="sb-caption" style="margin-top:0">Different player types: only shared stats are compared.</div></div>' : ''}`;
  document.body.classList.add('sb-open');
  el.scrollTop = 0;
  setSelectedHighlight();
  syncURL();
}

// ══════════════════════════════════════════
// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  closeSidebar();
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam).then(syncURL);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
  // Click on empty field closes the sidebar.
  if (sidebarZone && e.target.closest('.court-canvas') && !e.target.closest('.player-card')) closeSidebar();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sidebarZone) closeSidebar();
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('team') && TEAMS[urlParams.get('team')]) currentTeam = urlParams.get('team');
const urlPlayer = urlParams.get('player');

updateSbToggle();
loadRatingsMeta();
buildTeamsDropdown();
loadTeam(currentTeam).then(() => {
  // Reopen the sidebar if ?player= is someone currently on the field for this team; otherwise ignore it.
  if (sidebarOn && urlPlayer) {
    const zone = ZONE_ORDER.find(z => { const st = getStarter(z); return st && String(st.id) === urlPlayer; });
    if (zone) openSidebar(zone);
  }
});
</script>
