<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — DiamondView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  width: 520px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1130px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: compact field ── */
.left-col { width: 598px; flex-shrink: 0; }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.court-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 500/470;
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 90px;
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: 60px; height: 60px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 15px;
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 14px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  text-align: center;
  white-space: nowrap;
  color: var(--text);
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  color: var(--text-muted);
}

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 150px; box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; }
.subs-row { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:7px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 11px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 9px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 10px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: batting order + pitching staff, no scroll ── */
.right-col { flex: 1; min-width: 0; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 9px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
.tag-rotation { background: rgba(0,212,255,.1); color: var(--accent); border: 1px solid rgba(0,212,255,.25); }
.tag-bench { background: rgba(125,135,168,.1); color: var(--text-muted); border: 1px solid rgba(125,135,168,.25); }

.bench-stat { width: 42px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }
.bench-stat-label { font-size: 7px; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

.subgroup-label {
  padding: 6px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; }
  .left-col { width: 100%; }
}

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 220px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: var(--text); }
.popup-stat-label { font-size: 9px; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup-section-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 9px; font-weight: 700; margin-bottom: 4px; }
</style>
</head>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=mlb'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">

    </button>

<div class="wrap">
  <div class="left-col">

    <div class="court-canvas">
      <svg class="court-bg" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">

        <!-- foul lines -->

        <line x1="250" y1="385" x2="485" y2="65" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5"/>
        <!-- infield dirt -->
        <path d="M 250 385 L 365 272 L 250 165 L 135 272 Z" fill="#a9825a" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linejoin="round"/>
        <!-- infield grass cutout -->

        <!-- mound -->
        <circle cx="250" cy="258.5" r="17" fill="#8a6239" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
        <rect x="245" y="253" width="10" height="3" fill="#ffffff" fill-opacity="0.6"/>
        <!-- home plate dirt circle -->
        <circle cx="250" cy="385" r="34" fill="#a9825a" fill-opacity="0.92"/>
        <!-- bases -->
        <rect x="358" y="265" width="14" height="14" fill="#ffffff" fill-opacity="0.9" transform="rotate(45 365 272)"/>
        <rect x="243" y="158" width="14" height="14" fill="#ffffff" fill-opacity="0.9" transform="rotate(45 250 165)"/>
        <rect x="128" y="265" width="14" height="14" fill="#ffffff" fill-opacity="0.9" transform="rotate(45 135 272)"/>
        <!-- home plate -->

      <div class="players-layer" id="playersLayer"></div>

<script>
// ══════════════════════════════════════════
// TEAMS
// ══════════════════════════════════════════
const TEAMS = {
  ATH: { name: "Athletics" },
  ATL: { name: "Atlanta Braves" },
  AZ:  { name: "Arizona Diamondbacks" },
  BAL: { name: "Baltimore Orioles" },
  BOS: { name: "Boston Red Sox" },
  CHC: { name: "Chicago Cubs" },
  CIN: { name: "Cincinnati Reds" },
  CLE: { name: "Cleveland Guardians" },
  COL: { name: "Colorado Rockies" },
  CWS: { name: "Chicago White Sox" },
  DET: { name: "Detroit Tigers" },
  HOU: { name: "Houston Astros" },
  KC:  { name: "Kansas City Royals" },
  LAA: { name: "Los Angeles Angels" },
  LAD: { name: "Los Angeles Dodgers" },
  MIA: { name: "Miami Marlins" },
  MIL: { name: "Milwaukee Brewers" },
  MIN: { name: "Minnesota Twins" },
  NYM: { name: "New York Mets" },
  NYY: { name: "New York Yankees" },
  PHI: { name: "Philadelphia Phillies" },
  PIT: { name: "Pittsburgh Pirates" },
  SD:  { name: "San Diego Padres" },
  SEA: { name: "Seattle Mariners" },
  SF:  { name: "San Francisco Giants" },
  STL: { name: "St. Louis Cardinals" },
  TB:  { name: "Tampa Bay Rays" },
  TEX: { name: "Texas Rangers" },
  TOR: { name: "Toronto Blue Jays" },
  WSH: { name: "Washington Nationals" },
};
const TEAM_ABBRS = Object.keys(TEAMS);

// ESPN's team-logo CDN, same host/pattern as NBA's (a.espncdn.com/i/teamlogos/{sport}/500/{code}.png).
// Verified live, not guessed -- all 30 codes below return 200. Two of our
// internal abbreviations don't match ESPN's own short code, same class of
// mismatch as NBA's no/utah: Arizona is "ari" (not "az"; "az" 404s) and
// the White Sox are "chw" (not "cws" -- "cws" also resolves but to a
// different/older logo asset, "chw" is ESPN's standard 3-letter code).
// The Athletics' "ath" and legacy "oak" codes resolve to the byte-identical
// image, so either works; "ath" was picked to match the current team name.
const ESPN_TEAM_CODES = {
  ATH: 'ath', ATL: 'atl', AZ: 'ari', BAL: 'bal', BOS: 'bos',
  CHC: 'chc', CIN: 'cin', CLE: 'cle', COL: 'col', CWS: 'chw',
  DET: 'det', HOU: 'hou', KC: 'kc', LAA: 'laa', LAD: 'lad',
  MIA: 'mia', MIL: 'mil', MIN: 'min', NYM: 'nym', NYY: 'nyy',
  PHI: 'phi', PIT: 'pit', SD: 'sd', SEA: 'sea', SF: 'sf',
  STL: 'stl', TB: 'tb', TEX: 'tex', TOR: 'tor', WSH: 'wsh',
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/mlb/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// Field zones (% of field canvas). DH is deliberately absent -- it fields
// no position, so it never gets a diamond zone; DH players only appear in
// the batting-order sidebar. First-pass percentages, retuned once against
// a real render (see diamond-view build notes).
const DIAMOND_ZONES = {
  P:  { x: 50, y: 55 },
  C:  { x: 50, y: 84 },
  '1B': { x: 71, y: 60 },
  '2B': { x: 59, y: 39 },
  '3B': { x: 25, y: 60 },
  SS: { x: 37, y: 41 },
  LF: { x: 18, y: 15 },
  CF: { x: 50, y: 6 },
  RF: { x: 82, y: 15 },
};
const ZONE_ORDER = ['P','C','1B','2B','3B','SS','LF','CF','RF'];

// Field zone -> position_group, used to gate substitution eligibility.
// C and P (and DH, off-field) are standalone -- exact position match only,
// no cross-group subbing, per the same taxonomy build_mlb_match.py resolved.
const ZONE_GROUP = { '1B':'IF', '2B':'IF', '3B':'IF', SS:'IF', LF:'OF', CF:'OF', RF:'OF' };

let currentTeam = 'NYY';
let allPlayers = [];
let teamPlayers = [];
// Frontend-only view state for manual bench->field substitutions -- keyed
// by field zone, never written back to mlb_players_master.json, reset on
// every team switch (see loadTeam()), same convention as NBA's manualStarters.
let manualStarters = {};

// Shared 0-99 rating color scale, identical to nba/court-view.html and
// epl/pitch-view.html's ratingColor() -- MLB ratings are live now via
// theshowratings.com (ScraperAPI), so the dot switches from an AVG/ERA
// heuristic to the same rating-driven convention every other sport uses.
function ratingColor(r) {
  if (r == null) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function mapPlayer(p) {
  const bs = p.batting_stats || null;
  const ps = p.pitching_stats || null;
  const pa = bs ? (bs.plateAppearances != null ? bs.plateAppearances : (bs.atBats != null ? bs.atBats : 0)) : 0;
  return {
    id: p.player_id,
    name: p.name,
    team: p.team_abbr,
    teamName: p.team,
    position: p.position,
    positionGroup: p.position_group,
    positionGroupSource: p.position_group_source,
    playerType: p.player_type,
    jersey: p.jersey_number,
    height: p.height,
    weight: p.weight,
    bats: p.bats,
    throws: p.throws,
    pa: pa,
    avg: bs ? bs.avg : null,
    hr: bs ? bs.homeRuns : null,
    rbi: bs ? bs.rbi : null,
    ops: bs ? bs.ops : null,
    gamesPlayedBatting: bs ? bs.gamesPlayed : null,
    gamesStarted: ps ? (ps.gamesStarted || 0) : 0,
    gamesPitched: ps ? (ps.gamesPitched || 0) : 0,
    era: ps ? ps.era : null,
    whip: ps ? ps.whip : null,
    wins: ps ? ps.wins : null,
    losses: ps ? ps.losses : null,
    so: ps ? ps.strikeOuts : null,
    inningsPitched: ps ? ps.inningsPitched : null,
    rating: p.overall_rating,
    hasBatting: !!bs,
    hasPitching: !!ps,
  };
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/mlb_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
  } catch (e) {
    console.error('Failed to load mlb_players_master.json:', e);
    allPlayers = [];
  }
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderField();
  renderBattingOrder();
  renderPitchingStaff();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING NINE (FIELD)
// ══════════════════════════════════════════
// Natural candidates for a zone: exact position match, except CF also
// absorbs a generic 'OF' player (position_group_source: 'defaulted') --
// mirrors the one known real case (Cristian Pache) rather than a general
// rule, per the "single-player edge case, don't over-engineer" call this
// data was built under.
function naturalCandidates(zone) {
  if (zone === 'CF') {
    return teamPlayers.filter(p => p.position === 'CF' || p.position === 'OF');
  }
  return teamPlayers.filter(p => p.position === zone);
}

function getStarter(zone) {
  if (manualStarters[zone] != null) {
    const manual = teamPlayers.find(p => p.id === manualStarters[zone]);
    if (manual) return manual;
  }
  const usedElsewhere = new Set(
    Object.entries(manualStarters).filter(([k]) => k !== zone).map(([, id]) => id)
  );
  const candidates = naturalCandidates(zone).filter(p => !usedElsewhere.has(p.id));
  if (!candidates.length) return null;
  if (zone === 'P') {
    return candidates.slice().sort((a,b) => (b.gamesStarted||0) - (a.gamesStarted||0) || (b.gamesPitched||0) - (a.gamesPitched||0))[0];
  }
  return candidates.slice().sort((a,b) => (b.pa||0) - (a.pa||0))[0];
}

function renderField() {
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(zone => {
    const dz = DIAMOND_ZONES[zone];
    const p = getStarter(zone);
    if (!p) {
      return `
        <div class="player-card" data-pos="${zone}" style="left:${dz.x}%; top:${dz.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    return `
      <div class="player-card" data-pos="${zone}" data-pid="${p.id}" style="left:${dz.x}%; top:${dz.y}%">
        <div class="player-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-rank">${zone}${p.jersey != null ? ' · #' + p.jersey : ''}</div>
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;
}

// ══════════════════════════════════════════
// BATTING ORDER (all batters, not just bench --
// "batting order" is the whole lineup+bench by
// usage, unlike a basketball bench/rotation list)
// ══════════════════════════════════════════
function renderBattingOrder() {
  const list = document.getElementById('battingOrderList');
  // pa > 0, not just hasBatting -- statsapi.mlb.com gives every rostered
  // player a hitting stat line even if they've never batted (pure
  // pitchers get a real, present, all-zero row), so presence alone isn't
  // "this person bats". Confirmed on real data: 54 pitchers league-wide
  // carry a zero-PA batting_stats block.
  const batters = teamPlayers
    .filter(p => p.hasBatting && p.pa > 0)
    .sort((a, b) => (b.pa || 0) - (a.pa || 0));

  if (!batters.length) {
    list.innerHTML = '<div class="bench-empty">No batting stats on this roster yet.</div>';
    return;
  }

  list.innerHTML = batters.map((p, i) => {
    const rc = ratingColor(p.rating);
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${rc}">${p.rating != null ? p.rating : '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${p.position || ''}${p.playerType === 'two_way' ? ' <span class="tag tag-rotation">TWP</span>' : ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.hr != null ? p.hr : '—'}</div><div class="bench-stat-label">hr</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.rbi != null ? p.rbi : '—'}</div><div class="bench-stat-label">rbi</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.ops || '—'}</div><div class="bench-stat-label">ops</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.pa || '—'}</div><div class="bench-stat-label">pa</div></div>
      </div>
    `;
  }).join('');
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PITCHING STAFF (starters, then bullpen).
// Ohtani (two_way, gamesStarted > 0) legitimately
// appears here too, alongside the batting order --
// not a bug, falls out of filtering by data presence.
// ══════════════════════════════════════════
function renderPitchingStaff() {
  const list = document.getElementById('pitchingList');
  const pitchers = teamPlayers.filter(p => p.hasPitching);
  const starters = pitchers.filter(p => (p.gamesStarted || 0) > 0)
    .sort((a, b) => (b.gamesStarted || 0) - (a.gamesStarted || 0));
  const bullpen = pitchers.filter(p => (p.gamesStarted || 0) === 0)
    .sort((a, b) => (b.gamesPitched || 0) - (a.gamesPitched || 0));

  if (!pitchers.length) {
    list.innerHTML = '<div class="bench-empty">No pitching stats on this roster yet.</div>';
    return;
  }

  function pitcherRow(p) {
    const rc = ratingColor(p.rating);
    const wl = (p.wins != null && p.losses != null) ? `${p.wins}-${p.losses}` : '—';
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-dot" style="background:${rc}">${p.rating != null ? p.rating : '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${p.gamesStarted > 0 ? '<span class="tag tag-starter">SP</span>' : '<span class="tag tag-bench">RP</span>'}${p.playerType === 'two_way' ? ' <span class="tag tag-rotation">TWP</span>' : ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.whip || '—'}</div><div class="bench-stat-label">whip</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${wl}</div><div class="bench-stat-label">w-l</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.so != null ? p.so : '—'}</div><div class="bench-stat-label">so</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.inningsPitched || '—'}</div><div class="bench-stat-label">ip</div></div>
      </div>
    `;
  }

  let html = '';
  if (starters.length) html += `<div class="subgroup-label">Starters</div>` + starters.map(pitcherRow).join('');
  if (bullpen.length) html += `<div class="subgroup-label">Bullpen</div>` + bullpen.map(pitcherRow).join('');
  list.innerHTML = html;
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP (hover, field cards AND
// sidebar rows -- both wired via the same
// per-node mouseenter/mouseleave mechanics)
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (click a starter -> popover of
// eligible bench players, gated by position_group
// for IF/OF zones, exact position for C/P -> swap)
// ══════════════════════════════════════════
let openPopoverPos = null;

function subEligiblePlayers(zone) {
  const allStarterIds = new Set(ZONE_ORDER.map(z => getStarter(z)?.id).filter(Boolean));
  let pool;
  if (ZONE_GROUP[zone]) {
    pool = teamPlayers.filter(p => p.positionGroup === ZONE_GROUP[zone]);
  } else if (zone === 'P') {
    // Two-way players (Ohtani) carry position 'TWP', not 'P' -- exact-position
    // gating alone would wrongly exclude a real pitcher from the P-zone pool.
    // Scoped to P only: doesn't extend to C or any other standalone zone.
    pool = teamPlayers.filter(p => p.position === zone || p.playerType === 'two_way');
  } else {
    pool = teamPlayers.filter(p => p.position === zone);
  }
  pool = pool.filter(p => !allStarterIds.has(p.id));
  if (zone === 'P') {
    return pool.sort((a,b) => (b.gamesStarted||0) - (a.gamesStarted||0) || (b.gamesPitched||0) - (a.gamesPitched||0));
  }
  return pool.sort((a,b) => (b.pa||0) - (a.pa||0));
}

function subsLabel(zone) {
  if (zone === 'P') return 'Sub in (pitchers)';
  if (zone === 'C') return 'Sub in (catchers)';
  if (ZONE_GROUP[zone] === 'IF') return 'Sub in (infielders)';
  if (ZONE_GROUP[zone] === 'OF') return 'Sub in (outfielders)';
  return 'Sub in';
}

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
      const zone = card.dataset.pos;
      const popover = document.getElementById('subsPop');
      if (openPopoverPos === zone) {
        popover.classList.remove('open');
        openPopoverPos = null;
        return;
      }
      const subs = subEligiblePlayers(zone);
      const isPitcherZone = zone === 'P';

      popover.innerHTML = `<div class="subs-pop-label">${subsLabel(zone)}</div>` +
        (subs.length ? subs.map(s => `
          <div class="subs-row" data-pid="${s.id}">
            <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating != null ? s.rating : '—'}</div>
            <div class="subs-name">${s.name}</div>
            <div class="subs-mpg">${isPitcherZone ? (s.gamesStarted || 0) + ' gs' : (s.pa || 0) + ' pa'}</div>
          </div>`).join('') : `<div class="subs-empty">No eligible bench players</div>`);

      const courtCanvas = card.closest('.court-canvas');
      const rect = card.getBoundingClientRect();
      const parentRect = courtCanvas.getBoundingClientRect();
      popover.style.left = (rect.left - parentRect.left + 34) + 'px';
      popover.style.top = (rect.top - parentRect.top) + 'px';
      popover.classList.add('open');
      openPopoverPos = zone;

      popover.querySelectorAll('.subs-row').forEach(row => {
        row.addEventListener('click', (ev) => {
          ev.stopPropagation();
          substitutePlayer(row.dataset.pid, zone);
          popover.classList.remove('open');
          openPopoverPos = null;
        });
      });
    });
  });
}

function substitutePlayer(pid, targetZone) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  manualStarters[targetZone] = p.id;
  hidePopup();
  renderField();
  renderBattingOrder();
  renderPitchingStaff();
}

function battingStatGrid(p) {
  return `
    <div class="popup-stat-grid">
      <div class="popup-stat"><div class="popup-stat-val">${p.avg || '—'}</div><div class="popup-stat-label">AVG</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.hr != null ? p.hr : '—'}</div><div class="popup-stat-label">HR</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.rbi != null ? p.rbi : '—'}</div><div class="popup-stat-label">RBI</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.ops || '—'}</div><div class="popup-stat-label">OPS</div></div>
    </div>
  `;
}
function pitchingStatGrid(p) {
  const wl = (p.wins != null && p.losses != null) ? `${p.wins}-${p.losses}` : '—';
  return `
    <div class="popup-stat-grid">
      <div class="popup-stat"><div class="popup-stat-val">${p.era || '—'}</div><div class="popup-stat-label">ERA</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.whip || '—'}</div><div class="popup-stat-label">WHIP</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${wl}</div><div class="popup-stat-label">W-L</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.so != null ? p.so : '—'}</div><div class="popup-stat-label">SO</div></div>
    </div>
  `;
}

function popupHTML(p) {
  const bio = [p.height, p.weight != null ? p.weight + ' lbs' : null].filter(Boolean).join(' · ');
  const bt = [p.bats ? 'B:' + p.bats : null, p.throws ? 'T:' + p.throws : null].filter(Boolean).join(' · ');

  let statsSection;
  if (p.playerType === 'two_way') {
    statsSection = `
      <div class="popup-section-label">Batting</div>
      ${battingStatGrid(p)}
      <div class="popup-section-label">Pitching</div>
      ${pitchingStatGrid(p)}
    `;
  } else if (p.playerType === 'pitcher') {
    statsSection = pitchingStatGrid(p);
  } else {
    statsSection = battingStatGrid(p);
  }

  // Branches on playerType, not hasBatting/hasPitching -- pure pitchers
  // carry a real, present, all-zero batting_stats row (see renderBattingOrder),
  // so presence-based branching would wrongly show a .000/0 PA batting
  // line instead of their real pitching line.
  const games = p.playerType === 'two_way'
    ? `${p.pa || 0} PA · ${p.gamesStarted || 0} GS`
    : p.playerType === 'pitcher'
      ? `${p.gamesPitched != null ? p.gamesPitched : '—'} G · ${p.gamesStarted != null ? p.gamesStarted : '—'} GS`
      : `${p.pa != null ? p.pa : '—'} PA`;

  return `
    <div class="popup-header">
      <div class="popup-jersey">${p.jersey != null ? '#' + p.jersey : ''}</div>
      <div class="popup-name">${p.name}</div>
      <div class="popup-pos">${p.position || ''}</div>
    </div>
    ${statsSection}
    <div class="popup-divider"></div>
    <div class="popup-row"><span class="popup-row-label">Games</span><span class="popup-row-val">${games}</span></div>
    ${bio ? `<div class="popup-row"><span class="popup-row-label">Bio</span><span class="popup-row-val">${bio}</span></div>` : ''}
    ${bt ? `<div class="popup-row"><span class="popup-row-label">B/T</span><span class="popup-row-val">${bt}</span></div>` : ''}
  `;
}

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin; // flip to the left of the anchor
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function showPopup(pid, anchorEl) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  const popup = document.getElementById('playerPopup');
  popup.innerHTML = popupHTML(p);
  popup.style.display = 'block';
  positionPopup(popup, anchorEl);
}

function hidePopup() {
  document.getElementById('playerPopup').style.display = 'none';
}

// ══════════════════════════════════════════
// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
buildTeamsDropdown();
loadTeam(currentTeam);
</script>
