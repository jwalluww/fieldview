<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — PitchView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  width: 520px;
  max-height: 420px;
  overflow-y: auto;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1130px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: compact pitch ── */
.left-col { width: 560px; flex-shrink: 0; }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.court-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 500/720;
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 90px;
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: 54px; height: 54px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 15px;
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 14px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100px;
  color: var(--text);
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  /* var(--text-muted) is low-contrast against the green pitch --
     switched to var(--text), matching how NBA's court-view.html
     already handles this same line against its wood court. */
  color: var(--text);
}

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 200px; max-height: 280px; overflow-y: auto;
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; }
.subs-row { display: flex; align-items: center; gap: 8px; padding: 6px 5px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 10px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: full bench list, no scroll ── */
.right-col { flex: 1; min-width: 0; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 9px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }

.bench-stat { width: 42px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }
.bench-stat-label { font-size: 7px; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; }
  .left-col { width: 100%; }
}

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 240px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; color: var(--text); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-muted); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; color: var(--text); }
.popup-stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=mls'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">
      <img class="team-logo team-logo-header" id="teamLogoEl" alt="ATL">

      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="3" rx="1" fill="currentColor"/><rect x="1" y="5" width="10" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="10" height="2" rx="1" fill="currentColor" opacity=".3"/></svg>

        <!-- halfway line + center circle -->

        <circle cx="250" cy="360" r="55" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2.5"/>

        <!-- own goal (bottom): penalty box, six-yard box, arc -->

        <path d="M 175 586 A 55 55 0 0 1 325 586" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2.5"/>
        <circle cx="250" cy="612" r="3" fill="white" fill-opacity="0.6"/>

        <!-- attacking goal (top): penalty box, six-yard box, arc -->
        <rect x="120" y="14" width="260" height="120" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2.5"/>
        <rect x="190" y="14" width="120" height="42" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2.5"/>
        <path d="M 175 134 A 55 55 0 0 0 325 134" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2.5"/>
        <circle cx="250" cy="108" r="3" fill="white" fill-opacity="0.6"/>

        <path d="M 14 30 A 16 16 0 0 0 30 14" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2"/>
        <path d="M 470 14 A 16 16 0 0 0 486 30" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2"/>
        <path d="M 14 690 A 16 16 0 0 1 30 706" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="2"/>

<div class="player-popup" id="playerPopup"></div>

<script>
// ══════════════════════════════════════════
// TEAMS -- MLS's 30 real current clubs, keyed
// by mls_players_master.json's `team_abbreviation`
// field (ESPN's own abbreviation, confirmed live).
// Excludes the 2 exhibition entries ("MLS All-Stars",
// "Liga MX All-Stars") and the Arsenal-squad leak
// (team_id 359) already filtered out during the MLS
// build's population-filtering step.
// ══════════════════════════════════════════
const TEAMS = {
  ATL: { name: "Atlanta United FC" },
  ATX: { name: "Austin FC" },
  CHI: { name: "Chicago Fire FC" },
  CIN: { name: "FC Cincinnati" },
  CLB: { name: "Columbus Crew" },
  CLT: { name: "Charlotte FC" },
  COL: { name: "Colorado Rapids" },
  DAL: { name: "FC Dallas" },
  DC:  { name: "D.C. United" },
  HOU: { name: "Houston Dynamo FC" },
  LA:  { name: "LA Galaxy" },
  LAFC:{ name: "LAFC" },
  MIA: { name: "Inter Miami CF" },
  MIN: { name: "Minnesota United FC" },
  MTL: { name: "CF Montréal" },
  NE:  { name: "New England Revolution" },
  NSH: { name: "Nashville SC" },
  NYC: { name: "New York City FC" },
  ORL: { name: "Orlando City SC" },
  PHI: { name: "Philadelphia Union" },
  POR: { name: "Portland Timbers" },
  RBNY:{ name: "Red Bull New York" },
  RSL: { name: "Real Salt Lake" },
  SD:  { name: "San Diego FC" },
  SEA: { name: "Seattle Sounders FC" },
  SJ:  { name: "San Jose Earthquakes" },
  SKC: { name: "Sporting Kansas City" },
  STL: { name: "St. Louis CITY SC" },
  TOR: { name: "Toronto FC" },
  VAN: { name: "Vancouver Whitecaps" },
};
const TEAM_ABBRS = Object.keys(TEAMS);

// ESPN's team-logo CDN -- confirmed live for MLS specifically (not
// assumed from EPL's pattern): a.espncdn.com/i/teamlogos/soccer/500/
// {espn_id}.png, same "soccer" sport segment, real 200s with real image
// bytes on a spot-check (Chicago 182, Inter Miami 20232, LAFC 18966,
// San Diego 22529, Charlotte 21300). IDs are ESPN's own numeric team
// ids from mls_roster.json's team_id field (this project's own ESPN
// scrape), not a 3-letter code.
const ESPN_TEAM_CODES = {
  ATL: 18418, ATX: 20906, CHI: 182, CIN: 18267, CLB: 183,
  CLT: 21300, COL: 184, DAL: 185, DC: 193, HOU: 6077,
  LA: 187, LAFC: 18966, MIA: 20232, MIN: 17362, MTL: 9720,
  NE: 189, NSH: 18986, NYC: 17606, ORL: 12011, PHI: 10739,
  POR: 9723, RBNY: 190, RSL: 4771, SD: 22529, SEA: 9726,
  SJ: 191, SKC: 186, STL: 21812, TOR: 7318, VAN: 9727,
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/soccer/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// ══════════════════════════════════════════
// FORMATION (fixed 4-3-3 for every team, same
// simplification as EPL/NBA/NHL). Reused verbatim
// from epl/pitch-view.html.
// ══════════════════════════════════════════
const PITCH_ZONES = {
  GK:   { x: 50, y: 90 },
  DEF1: { x: 14, y: 74 },
  DEF2: { x: 38, y: 79 },
  DEF3: { x: 62, y: 79 },
  DEF4: { x: 86, y: 74 },
  MID1: { x: 25, y: 50 },
  MID2: { x: 50, y: 55 },
  MID3: { x: 75, y: 50 },
  FWD1: { x: 18, y: 20 },
  FWD2: { x: 50, y: 13 },
  FWD3: { x: 82, y: 20 },
};
const ZONE_ORDER = ['GK','DEF1','DEF2','DEF3','DEF4','MID1','MID2','MID3','FWD1','FWD2','FWD3'];

// Zone -> mls_players_master.json's `position_group`. Real values
// confirmed live before writing this: ESPN's coarse position collapses
// to single-letter codes here (G/D/M/F), NOT FPL's 3-letter GKP/DEF/
// MID/FWD -- a genuinely different enum from EPL's, not just a
// relabeling exercise skipped by assumption.
const ZONE_GROUP = {
  GK: 'G',
  DEF1: 'D', DEF2: 'D', DEF3: 'D', DEF4: 'D',
  MID1: 'M', MID2: 'M', MID3: 'M',
  FWD1: 'F', FWD2: 'F', FWD3: 'F',
};

let currentTeam = 'ATL';
let allPlayers = [];
let teamPlayers = [];
let manualStarters = {};
let currentStarters = {};

// Same 0-99 rating color scale as epl/pitch-view.html's ratingColor()
// (sofifa's overall_rating is the identical source/scale for both leagues).
function ratingColor(r) {
  if (r == null) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function mapPlayer(p) {
  // `stats` (ASA xgoals) is null for 263/1010 players -- a wholly
  // separate join from sofifa's rating/standard_pos, confirmed live.
  // Real field names: `goals`, `primary_assists` (NOT "assists" --
  // different from FPL's field name), `minutes_played` (NOT "minutes"),
  // `points_added` (ASA's single-number advanced-metric stat, used here
  // as the closest equivalent to EPL's FPL `form`).
  const s = p.stats || {};
  return {
    id: p.player_id,
    name: p.name,
    team: p.team_abbreviation,
    positionGroup: p.position_group,   // coarse: G/D/M/F (ESPN's own single-letter codes)
    standardPos: p.standard_pos,       // granular sofifa slot, e.g. "RB" -- null for 230/1010 (unmatched)
    rating: p.overall_rating,          // null if no sofifa match -- never defaulted, never shown as "NR"
    potential: p.potential,
    jersey: p.jersey,
    minutes: s.minutes_played,
    goals: s.goals,
    assists: s.primary_assists,
    pointsAdded: s.points_added,
  };
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/mls_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
  } catch (e) {
    console.error('Failed to load mls_players_master.json:', e);
    allPlayers = [];
  }
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderPitch();
  renderBenchList();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING XI (PITCH)
// ══════════════════════════════════════════
function rankedGroupPool(group) {
  return teamPlayers.filter(p => p.positionGroup === group).slice().sort((a,b) => (b.minutes||0) - (a.minutes||0));
}

// Same computeStarters() fix as epl/pitch-view.html: resolves the whole
// XI in one pass so MLS's 4 DEF / 3 MID / 3 FWD same-group zones never
// double-book a player (the bug NHL's ice-view.html's per-zone-
// independent getStarter() would hit if copied as-is -- see that file's
// docstring for the concrete case).
function computeStarters() {
  const claimed = new Set();
  const starters = {};

  for (const zone of ZONE_ORDER) {
    if (manualStarters[zone] != null) {
      const p = teamPlayers.find(pl => pl.id === manualStarters[zone]);
      if (p && !claimed.has(p.id)) {
        starters[zone] = p;
        claimed.add(p.id);
      }
    }
  }

  for (const zone of ZONE_ORDER) {
    if (starters[zone]) continue;
    const pool = rankedGroupPool(ZONE_GROUP[zone]).filter(p => !claimed.has(p.id));
    starters[zone] = pool.length ? pool[0] : null;
    if (starters[zone]) claimed.add(starters[zone].id);
  }
  return starters;
}

function getStarter(zone) {
  return currentStarters[zone] || null;
}

function renderPitch() {
  currentStarters = computeStarters();
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(zone => {
    const dz = PITCH_ZONES[zone];
    const p = currentStarters[zone];
    if (!p) {
      return `
        <div class="player-card" data-pos="${zone}" style="left:${dz.x}%; top:${dz.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    const label = p.standardPos || p.positionGroup;
    return `
      <div class="player-card" data-pos="${zone}" data-pid="${p.id}" style="left:${dz.x}%; top:${dz.y}%">
        <div class="player-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-rank">${label}</div>
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;
}

// ══════════════════════════════════════════
// BENCH LIST (everyone else, ranked by minutes)
// ══════════════════════════════════════════
function renderBenchList() {
  const list = document.getElementById('benchList');
  const startingIds = new Set(Object.values(currentStarters).filter(Boolean).map(p => p.id));
  const bench = teamPlayers
    .filter(p => !startingIds.has(p.id))
    .sort((a, b) => (b.minutes || 0) - (a.minutes || 0));

  if (!bench.length) {
    list.innerHTML = '<div class="bench-empty">No bench players on this roster yet.</div>';
    return;
  }

  list.innerHTML = bench.map((p, i) => {
    const label = p.standardPos || p.positionGroup;
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${label || ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.goals != null ? p.goals : '—'}</div><div class="bench-stat-label">g</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.assists != null ? p.assists : '—'}</div><div class="bench-stat-label">a</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.minutes != null ? p.minutes : '—'}</div><div class="bench-stat-label">min</div></div>
      </div>
    `;
  }).join('');
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (same-group only)
// ══════════════════════════════════════════
let openPopoverPos = null;

function subEligiblePlayers(zone) {
  const allStarterIds = new Set(Object.values(currentStarters).filter(Boolean).map(p => p.id));
  const group = ZONE_GROUP[zone];
  return teamPlayers
    .filter(p => p.positionGroup === group && !allStarterIds.has(p.id))
    .sort((a,b) => (b.minutes||0) - (a.minutes||0));
}

const GROUP_LABEL = { G: 'goalkeepers', D: 'defenders', M: 'midfielders', F: 'forwards' };
function subsLabel(zone) {
  return `Sub in (${GROUP_LABEL[ZONE_GROUP[zone]] || ZONE_GROUP[zone]})`;
}

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
      const zone = card.dataset.pos;
      const popover = document.getElementById('subsPop');
      if (openPopoverPos === zone) {
        popover.classList.remove('open');
        openPopoverPos = null;
        return;
      }
      const subs = subEligiblePlayers(zone);

      popover.innerHTML = `<div class="subs-pop-label">${subsLabel(zone)}</div>` +
        (subs.length ? subs.map(s => `
          <div class="subs-row" data-pid="${s.id}">
            <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating != null ? s.rating : '—'}</div>
            <div class="subs-name">${s.name}</div>
            <div class="subs-mpg">${s.minutes != null ? s.minutes + "'" : '—'}</div>
          </div>`).join('') : `<div class="subs-empty">No eligible bench players</div>`);

      const pitchCanvas = card.closest('.court-canvas');
      const rect = card.getBoundingClientRect();
      const parentRect = pitchCanvas.getBoundingClientRect();
      popover.style.left = (rect.left - parentRect.left + 34) + 'px';
      popover.style.top = (rect.top - parentRect.top) + 'px';
      popover.classList.add('open');
      openPopoverPos = zone;

      popover.querySelectorAll('.subs-row').forEach(row => {
        row.addEventListener('click', (ev) => {
          ev.stopPropagation();
          substitutePlayer(row.dataset.pid, zone);
          popover.classList.remove('open');
          openPopoverPos = null;
        });
      });
    });
  });
}

function substitutePlayer(pid, targetZone) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  manualStarters[targetZone] = p.id;
  hidePopup();
  renderPitch();
  renderBenchList();
}

function popupHTML(p) {
  const label = p.standardPos || p.positionGroup;
  return `
    <div class="popup-header">
      <div class="popup-jersey">${p.jersey ? '#' + p.jersey : ''}</div>
      <div class="popup-name">${p.name}</div>
      <div class="popup-pos">${label || ''}</div>
    </div>
    <div class="popup-stat-grid">
      <div class="popup-stat"><div class="popup-stat-val">${p.goals != null ? p.goals : '—'}</div><div class="popup-stat-label">Goals</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.assists != null ? p.assists : '—'}</div><div class="popup-stat-label">Assists</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.minutes != null ? p.minutes : '—'}</div><div class="popup-stat-label">Minutes</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.pointsAdded != null ? p.pointsAdded.toFixed(1) : '—'}</div><div class="popup-stat-label">Pts Add</div></div>
    </div>
    <div class="popup-divider"></div>
    ${p.rating != null ? `<div class="popup-row"><span class="popup-row-label">sofifa</span><span class="popup-row-val">${p.rating} OVR${p.potential != null ? ' / ' + p.potential + ' POT' : ''}</span></div>` : ''}
    <div class="popup-row"><span class="popup-row-label">Team</span><span class="popup-row-val">${TEAMS[p.team] ? TEAMS[p.team].name : p.team}</span></div>
  `;
}

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin;
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function showPopup(pid, anchorEl) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  const popup = document.getElementById('playerPopup');
  popup.innerHTML = popupHTML(p);
  popup.style.display = 'block';
  positionPopup(popup, anchorEl);
}

function hidePopup() {
  document.getElementById('playerPopup').style.display = 'none';
}

// ══════════════════════════════════════════
// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
buildTeamsDropdown();
loadTeam(currentTeam);
</script>
