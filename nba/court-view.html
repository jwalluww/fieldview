<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — CourtView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  width: 520px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1130px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: compact court ── */
.left-col { width: 598px; flex-shrink: 0; }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.depth-chart-updated {
  font-family: 'Barlow', sans-serif;
  font-weight: 400;
  font-size: 11px;
  letter-spacing: .2px;
  text-transform: none;
  color: var(--text-dim);
}

.court-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 500/470;
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 90px;
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 20px;
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 14px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  text-align: center;
  white-space: nowrap;
  color: var(--text);
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  color: var(--text);
}

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 150px; box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; }
.subs-row { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:7px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 11px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 9px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 10px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: full bench list, no scroll ── */
.right-col { flex: 1; min-width: 0; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 9px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
.tag-rotation { background: rgba(0,212,255,.1); color: var(--accent); border: 1px solid rgba(0,212,255,.25); }
.tag-bench { background: rgba(125,135,168,.1); color: var(--text-muted); border: 1px solid rgba(125,135,168,.25); }

.bench-stat { width: 46px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); }
.bench-stat-label { font-size: 7px; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; }
  .left-col { width: 100%; }
}

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 220px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; color: var(--text); }
.popup-stat-label { font-size: 9px; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=nba'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">
      <img class="team-logo team-logo-header" id="teamLogoEl" alt="LAL">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px" id="teamNameEl">Los Angeles Lakers</span>
    </div>
    <div class="teams-dropdown" id="teamsDropdown"></div>
  </div>

  <div class="view-toggle">
    <button class="view-btn active">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="2" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="2" cy="10" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="10" r="1.5" fill="currentColor" opacity=".6"/></svg>
      CourtView
    </button>
    <button class="view-btn" onclick="window.location='player-table.html'">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="3" rx="1" fill="currentColor"/><rect x="1" y="5" width="10" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="10" height="2" rx="1" fill="currentColor" opacity=".3"/></svg>
      Table
    </button>
  </div>
</header>

<div class="wrap">
  <div class="left-col">
    <div class="court-label">
      <span>Starting Five</span>
      <span class="depth-chart-updated" id="depthChartUpdated"></span>
    </div>

    <div class="court-canvas">
      <svg class="court-bg" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <defs>
          <pattern id="hardwood" x="0" y="0" width="42" height="470" patternUnits="userSpaceOnUse">
            <rect width="21" height="470" fill="#2f2216"/>
            <rect x="21" width="21" height="470" fill="#362819"/>
          </pattern>
        </defs>
        <rect width="500" height="470" fill="url(#hardwood)"/>
        <rect x="8" y="8" width="484" height="454" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
        <!-- paint -->
        <rect x="190" y="8" width="120" height="190" fill="#000000" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
        <!-- free throw circle -->
        <circle cx="250" cy="198" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
        <!-- restricted arc -->
        <path d="M 210 8 A 40 40 0 0 0 290 8" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
        <!-- three point arc -->
        <path d="M 30 8 L 30 128 A 220 220 0 0 0 470 128 L 470 8" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
        <!-- half court circle -->
        <circle cx="250" cy="462" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
        <!-- hoop -->
        <circle cx="250" cy="28" r="7" fill="none" stroke="#f5a623" stroke-width="3"/>
        <rect x="230" y="4" width="40" height="4" fill="#ffffff" fill-opacity="0.6"/>
      </svg>
      <div class="players-layer" id="playersLayer"></div>
      <div class="subs-pop" id="subsPop"></div>
    </div>
    <div class="court-hint">Click a starter to see substitutes</div>
  </div>

  <div class="right-col">
    <div class="rotation-title">Bench &amp; Rotation (by Minutes Per Game)</div>
    <div class="bench-list" id="benchList"></div>
  </div>
</div>

<div class="player-popup" id="playerPopup"></div>

<script>
// ══════════════════════════════════════════
// TEAMS
// ══════════════════════════════════════════
const TEAMS = {
  ATL: { name: "Atlanta Hawks",          colors: ["#e03a3e","#c1d32f"] },
  BOS: { name: "Boston Celtics",         colors: ["#007a33","#ba9653"] },
  BKN: { name: "Brooklyn Nets",          colors: ["#000000","#ffffff"] },
  CHA: { name: "Charlotte Hornets",      colors: ["#1d1160","#00788c"] },
  CHI: { name: "Chicago Bulls",          colors: ["#ce1141","#000000"] },
  CLE: { name: "Cleveland Cavaliers",    colors: ["#860038","#fdbb30"] },
  DAL: { name: "Dallas Mavericks",       colors: ["#00538c","#b8c4ca"] },
  DEN: { name: "Denver Nuggets",         colors: ["#0e2240","#fec524"] },
  DET: { name: "Detroit Pistons",        colors: ["#c8102e","#1d42ba"] },
  GSW: { name: "Golden State Warriors",  colors: ["#1d428a","#ffc72c"] },
  HOU: { name: "Houston Rockets",        colors: ["#ce1141","#000000"] },
  IND: { name: "Indiana Pacers",         colors: ["#002d62","#fdbb30"] },
  LAC: { name: "LA Clippers",            colors: ["#c8102e","#1d428a"] },
  LAL: { name: "Los Angeles Lakers",     colors: ["#552583","#fdb927"] },
  MEM: { name: "Memphis Grizzlies",      colors: ["#5d76a9","#f5b112"] },
  MIA: { name: "Miami Heat",             colors: ["#98002e","#f9a01b"] },
  MIL: { name: "Milwaukee Bucks",        colors: ["#00471b","#eee1c6"] },
  MIN: { name: "Minnesota Timberwolves", colors: ["#0c2340","#78be20"] },
  NOP: { name: "New Orleans Pelicans",   colors: ["#0c2340","#b4975a"] },
  NYK: { name: "New York Knicks",        colors: ["#006bb6","#f58426"] },
  OKC: { name: "Oklahoma City Thunder",  colors: ["#007ac1","#ef3b24"] },
  ORL: { name: "Orlando Magic",          colors: ["#0077c0","#c4ced4"] },
  PHI: { name: "Philadelphia 76ers",     colors: ["#006bb6","#ed174c"] },
  PHX: { name: "Phoenix Suns",           colors: ["#1d1160","#e56020"] },
  POR: { name: "Portland Trail Blazers", colors: ["#e03a3e","#000000"] },
  SAC: { name: "Sacramento Kings",       colors: ["#5a2d81","#63727a"] },
  SAS: { name: "San Antonio Spurs",      colors: ["#c4ced4","#000000"] },
  TOR: { name: "Toronto Raptors",        colors: ["#ce1141","#000000"] },
  UTA: { name: "Utah Jazz",              colors: ["#002b5c","#f9a01b"] },
  WAS: { name: "Washington Wizards",     colors: ["#002b5c","#e31837"] },
};
const TEAM_ABBRS = Object.keys(TEAMS);
const STATUS_LABEL = { starter: 'Starter', rotation: 'Rotation', bench: 'Bench' };

// ESPN's team-logo CDN. cdn.nba.com (the official source) was tried
// first but fails with a real HTTP/2 protocol error in actual browser
// navigation, not just headless testing -- would break for real
// visitors, so not usable regardless of being the "proper" source.
// ESPN's own short codes mostly match our TEAM_ABBRS, except New Orleans
// ("no", not "nop") and Utah ("utah", not "uta") -- verified against the
// live CDN, not guessed.
const ESPN_TEAM_CODES = {
  ATL: 'atl', BOS: 'bos', CLE: 'cle', NOP: 'no', CHI: 'chi',
  DAL: 'dal', DEN: 'den', GSW: 'gsw', HOU: 'hou', LAC: 'lac',
  LAL: 'lal', MIA: 'mia', MIL: 'mil', MIN: 'min', BKN: 'bkn',
  NYK: 'nyk', ORL: 'orl', IND: 'ind', PHI: 'phi', PHX: 'phx',
  POR: 'por', SAC: 'sac', SAS: 'sas', OKC: 'okc', TOR: 'tor',
  UTA: 'utah', MEM: 'mem', WAS: 'was', DET: 'det', CHA: 'cha',
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/nba/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// Loose half-court zones for each starting position (% of court canvas)
const COURT_ZONES = {
  C:  { x: 66, y: 21 },   // post, offset — not dead-center under the hoop
  PF: { x: 34, y: 21 },   // opposite post
  SF: { x: 76, y: 49 },
  SG: { x: 24, y: 49 },
  PG: { x: 50, y: 72 },
};
const ZONE_ORDER = ['C','PF','SF','SG','PG'];

let currentTeam = 'LAL';
let allPlayers = [];
let teamPlayers = [];
// id -> "PF 3/46", league-wide rank within position group by 2K overall_rating.
// Computed once in loadAllPlayers() since allPlayers is already the full
// league, not per-team -- same scope as NFL's madden_rank/madden_rank_total.
let positionRanks = {};
// Frontend-only view state for manual bench->court substitutions -- keyed
// by court zone, never written back to nba_players_master.json, reset on
// every team switch (see loadTeam()).
let manualStarters = {};

function ratingColor(r) {
  if (!r) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function mapPlayer(p) {
  return {
    id: p.player_id,
    name: p.name,
    team: p.team,
    pos: p.position,
    jersey: p.jersey_number,
    height: p.height,
    weight: p.weight,
    ppg: p.ppg,
    rpg: p.rpg,
    apg: p.apg,
    mpg: p.mpg,
    games_started: p.games_started,
    games_played: p.games_played,
    status: p.rotation_status,
    rating: p.overall_rating,
    salary: p.contract_salary,
    years_remaining: p.contract_years_remaining,
  };
}

// Players with no 2K rating get no entry here -- rendering code must
// check for a missing key and skip the badge, not show a placeholder.
function computePositionRanks(players) {
  const byPos = {};
  players.forEach(p => {
    if (p.rating == null) return; // no 2K rating, no badge
    (byPos[p.pos] ||= []).push(p);
  });
  const rankMap = {}; // id -> "PF 3/46"
  Object.entries(byPos).forEach(([pos, group]) => {
    group.sort((a, b) => b.rating - a.rating);
    group.forEach((p, i) => {
      rankMap[p.id] = `${pos} ${i + 1}/${group.length}`;
    });
  });
  return rankMap;
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/nba_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
    positionRanks = computePositionRanks(allPlayers);
  } catch (e) {
    console.error('Failed to load nba_players_master.json:', e);
    allPlayers = [];
  }
}

// Purely informational -- silently omit if the file, the field, or the
// date fails to parse, rather than surface an error state for a small
// staleness caption.
async function loadDepthChartMeta() {
  try {
    const res = await fetch('data/nba_depth_chart.json');
    const raw = await res.json();
    if (!raw.last_changed) return;
    const d = new Date(raw.last_changed + 'T00:00:00');
    if (isNaN(d.getTime())) return;
    const formatted = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
    document.getElementById('depthChartUpdated').textContent = `Depth chart as of ${formatted}`;
  } catch (e) {
    // no-op
  }
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderCourt();
  renderBenchList();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING FIVE (COURT)
// ══════════════════════════════════════════
function getStarter(pos) {
  if (manualStarters[pos] != null) {
    const manual = teamPlayers.find(p => p.id === manualStarters[pos]);
    if (manual) return manual;
  }
  const usedElsewhere = new Set(
    Object.entries(manualStarters).filter(([k]) => k !== pos).map(([, id]) => id)
  );
  const candidates = teamPlayers.filter(p => p.pos === pos && !usedElsewhere.has(p.id));
  if (!candidates.length) return null;
  const starters = candidates.filter(p => p.status === 'starter');
  // among starters at this position, take the highest-minutes one; if
  // none are flagged starter, fall back to the highest-minutes player
  const pool = starters.length ? starters : candidates;
  return pool.sort((a,b) => (b.mpg||0) - (a.mpg||0))[0];
}

function renderCourt() {
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(pos => {
    const zone = COURT_ZONES[pos];
    const p = getStarter(pos);
    if (!p) {
      return `
        <div class="player-card" data-pos="${pos}" style="left:${zone.x}%; top:${zone.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    const rc = ratingColor(p.rating);
    const rank = positionRanks[p.id];
    return `
      <div class="player-card" data-pos="${pos}" data-pid="${p.id}" style="left:${zone.x}%; top:${zone.y}%">
        <div class="player-dot" style="background:${rc}">${p.rating || '—'}</div>
        <div class="player-name">${p.name}</div>
        ${rank ? `<div class="player-rank">${rank}</div>` : ''}
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;
}

// ══════════════════════════════════════════
// BENCH & ROTATION LIST
// ══════════════════════════════════════════
function renderBenchList() {
  const list = document.getElementById('benchList');
  const startingIds = new Set(ZONE_ORDER.map(pos => getStarter(pos)?.id).filter(Boolean));
  const bench = teamPlayers
    .filter(p => !startingIds.has(p.id))
    .sort((a, b) => (b.mpg || 0) - (a.mpg || 0));

  if (!bench.length) {
    list.innerHTML = '<div class="bench-empty">No bench players on this roster yet.</div>';
    return;
  }

  list.innerHTML = bench.map((p, i) => {
    const rc = ratingColor(p.rating);
    return `
      <div class="bench-row">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${rc}">${p.rating || '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${positionRanks[p.id] || p.pos || ''} ${p.status ? '<span class="tag tag-' + p.status + '">' + STATUS_LABEL[p.status] + '</span>' : ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.ppg != null ? p.ppg : '—'}</div><div class="bench-stat-label">ppg</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.rpg != null ? p.rpg : '—'}</div><div class="bench-stat-label">rpg</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.apg != null ? p.apg : '—'}</div><div class="bench-stat-label">apg</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.mpg != null ? p.mpg : '—'}</div><div class="bench-stat-label">mpg</div></div>
      </div>
    `;
  }).join('');
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP (hover, court cards only)
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (click a starter -> popover of
// same-position bench/rotation players -> swap)
// ══════════════════════════════════════════
let openPopoverPos = null;

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
      const pos = card.dataset.pos;
      const popover = document.getElementById('subsPop');
      if (openPopoverPos === pos) {
        popover.classList.remove('open');
        openPopoverPos = null;
        return;
      }
      const allStarterIds = new Set(ZONE_ORDER.map(z => getStarter(z)?.id).filter(Boolean));
      const subs = teamPlayers
        .filter(p => !allStarterIds.has(p.id))
        .sort((a, b) => (b.mpg || 0) - (a.mpg || 0));

      popover.innerHTML = `<div class="subs-pop-label">Sub in (any position)</div>` +
        (subs.length ? subs.map(s => `
          <div class="subs-row" data-pid="${s.id}">
            <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating || '—'}</div>
            <div class="subs-name">${s.name}</div>
            <div class="subs-mpg">${s.mpg != null ? s.mpg : '—'}</div>
          </div>`).join('') : `<div class="subs-empty">No bench players available</div>`);

      const courtCanvas = card.closest('.court-canvas');
      const rect = card.getBoundingClientRect();
      const parentRect = courtCanvas.getBoundingClientRect();
      popover.style.left = (rect.left - parentRect.left + 34) + 'px';
      popover.style.top = (rect.top - parentRect.top) + 'px';
      popover.classList.add('open');
      openPopoverPos = pos;

      popover.querySelectorAll('.subs-row').forEach(row => {
        row.addEventListener('click', (ev) => {
          ev.stopPropagation();
          substitutePlayer(row.dataset.pid, pos);
          popover.classList.remove('open');
          openPopoverPos = null;
        });
      });
    });
  });
}

function substitutePlayer(pid, targetPos) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  manualStarters[targetPos] = p.id;
  hidePopup();
  renderCourt();
  renderBenchList();
}

function popupHTML(p) {
  const rc = ratingColor(p.rating);
  const bio = [p.height, p.weight != null ? p.weight + ' lbs' : null].filter(Boolean).join(' · ');
  const games = (p.games_played != null ? p.games_played : '—') + ' GP · ' + (p.games_started != null ? p.games_started : '—') + ' GS';
  const contract = p.salary ? p.salary + (p.years_remaining ? ' · ' + p.years_remaining + 'y left' : '') : null;
  return `
    <div class="popup-header">
      <div class="popup-jersey">${p.jersey != null ? '#' + p.jersey : ''}</div>
      <div class="popup-name">${p.name}</div>
      <div class="popup-pos">${p.pos || ''}</div>
    </div>
    <div class="popup-stat-grid">
      <div class="popup-stat"><div class="popup-stat-val">${p.ppg != null ? p.ppg : '—'}</div><div class="popup-stat-label">PPG</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.rpg != null ? p.rpg : '—'}</div><div class="popup-stat-label">RPG</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.apg != null ? p.apg : '—'}</div><div class="popup-stat-label">APG</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.mpg != null ? p.mpg : '—'}</div><div class="popup-stat-label">MPG</div></div>
    </div>
    <div class="popup-divider"></div>
    <div class="popup-row"><span class="popup-row-label">Games</span><span class="popup-row-val">${games}</span></div>
    ${bio ? `<div class="popup-row"><span class="popup-row-label">Bio</span><span class="popup-row-val">${bio}</span></div>` : ''}
    <div class="popup-row"><span class="popup-row-label">Rating</span><span class="popup-row-val" style="color:${rc};font-weight:900">${p.rating || '—'}</span></div>
    ${contract ? `<div class="popup-row"><span class="popup-row-label">Contract</span><span class="popup-row-val">${contract}</span></div>` : ''}
    ${p.status ? `<div class="popup-row"><span class="popup-row-label">Status</span><span class="tag tag-${p.status}">${STATUS_LABEL[p.status]}</span></div>` : ''}
  `;
}

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin; // flip to the left of the anchor
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function showPopup(pid, anchorEl) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  const popup = document.getElementById('playerPopup');
  popup.innerHTML = popupHTML(p);
  popup.style.display = 'block';
  positionPopup(popup, anchorEl);
}

function hidePopup() {
  document.getElementById('playerPopup').style.display = 'none';
}

// ══════════════════════════════════════════
// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
buildTeamsDropdown();
loadTeam(currentTeam);
loadDepthChartMeta();
</script>
