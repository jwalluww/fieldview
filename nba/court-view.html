<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — CourtView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  width: 520px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1130px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: compact court ── */
.asof { font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 10px; }

.left-col { width: 598px; flex-shrink: 0; }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.depth-chart-updated {
  font-family: 'Barlow', sans-serif;
  font-weight: 400;
  font-size: 11px;
  letter-spacing: .2px;
  text-transform: none;
  color: var(--text-dim);
}

.court-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 500/470;
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 90px;
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 20px;
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-undo {
  position: absolute;
  top: -4px; right: 4px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  line-height: 1;
  color: var(--text-dim);
  cursor: pointer;
  z-index: 30;
}
.player-undo:hover { color: var(--text); border-color: var(--border); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 14px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  text-align: center;
  white-space: nowrap;
  color: var(--text);
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  color: var(--text);
}

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 200px; max-height: 280px; overflow-y: auto; box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sort-toggle { display: inline-flex; border: 1px solid var(--border2); border-radius: 5px; overflow: hidden; flex-shrink: 0; }
.sort-toggle button { background: none; border: none; color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .5px; text-transform: uppercase; padding: 2px 7px; cursor: pointer; }
.sort-toggle button.active { background: rgba(0,212,255,.15); color: var(--accent); }
.subs-row { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 11px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: full bench list, no scroll ── */
.right-col { flex: 1; min-width: 0; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 9px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
.tag-rotation { background: rgba(0,212,255,.1); color: var(--accent); border: 1px solid rgba(0,212,255,.25); }
.tag-bench { background: rgba(125,135,168,.1); color: var(--text-muted); border: 1px solid rgba(125,135,168,.25); }

.bench-stat { width: 46px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); }
.bench-stat-label { font-size: 8px; color: var(--text-muted); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

/* ── SIDEBAR ── */
.sb-toggle {
  margin-left: auto;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 7px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
}
.sb-toggle:hover { color: var(--text); }
.sb-toggle.on { color: var(--accent); border-color: rgba(0,212,255,.4); }
.sb-toggle + .view-toggle { margin-left: 0; }

/* ── PLAYER SIDEBAR (replaces the batting-order / pitching-staff column while open) ── */
.sidebar {
  display: none;
  position: relative;
  flex: 1;
  min-width: 0;
  align-self: stretch;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 13px;
}
body.sb-open .sidebar { display: block; }
.sb-scroll { position: absolute; inset: 0; overflow-y: auto; border-radius: 8px; }
body.sb-open .right-col { display: none; }

.sb-close {
  position: absolute;
  top: 8px; right: 10px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 22px; line-height: 1;
  cursor: pointer;
}
.sb-close:hover { color: var(--text); }
.sb-head { padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.sb-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: var(--text); line-height: 1.1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sb-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.sb-rating { text-align: center; flex-shrink: 0; }
.sb-rating-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; line-height: 1; }
.sb-rating-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-pill { border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
.sb-pill.inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); }
.sb-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sb-section-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.sb-stat { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-section-title + .sb-stat { border-top: none; }
.sb-stat-top { display: flex; justify-content: space-between; align-items: baseline; }
.sb-stat-label { font-size: 12px; color: var(--text); }
.sb-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; color: var(--text); }
.sb-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.sb-bar-fill { height: 100%; border-radius: 3px; }
.sb-low { font-size: 10px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
.sb-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-def { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-caption { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.sb-cell-label { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); }
.sb-cell-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.2; }
.sb-tbl { display: grid; grid-template-columns: 1fr 80px 80px; align-items: center; }
.sb-tbl > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl > div:nth-child(-n+3) { border-top: none; }
.sb-tbl-h { text-align: right; font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-tbl-l { font-size: 12px; color: var(--text-muted); }
.sb-tbl-v { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); }
.sb-tbl-v.best { font-weight: 800; color: #22c55e; }
.sb-sub { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; cursor: pointer; border-radius: 6px; }
.sb-sub:hover { background: var(--border); }
.sb-sub-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; width: 32px; text-align: center; flex-shrink: 0; }
.sb-sub-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-sub-pos { font-size: 11px; color: var(--text-muted); }
.sb-empty { font-size: 12px; color: var(--text-dim); }
.sb-cmp-actions { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.sb-btn { flex: 1; padding: 8px 0; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.sb-btn:hover { background: var(--border); }
.sb-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.sb-btn.primary:hover { filter: brightness(1.1); }
.sb-cmp-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); }
.sb-cmp-tagline { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-cmp-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.1; }
.sb-cmp-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-cmp-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; line-height: 1; margin-top: 4px; }
.sb-cmp-row { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-cmp-row:first-of-type { border-top: none; }
.sb-cmp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.sb-cmp-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-cmp-tag { width: 104px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-cmp-val { width: 46px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; color: var(--text); }
.sb-cmp-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-note { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.sb-sort { display: flex; align-items: center; justify-content: space-between; }
.sb-tbl3 { display: grid; grid-template-columns: 1fr 84px 84px; align-items: center; }
.sb-tbl3 > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl3 > div:nth-child(-n+3) { border-top: none; }
.sb-pill.sus { background: rgba(245,166,35,.15); color: var(--gold); border: 1px solid rgba(245,166,35,.4); }
.sb-teamlogo { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; margin-right: 3px; }
.reset-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 3px 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); cursor: pointer; }
.reset-btn:hover { color: var(--text); background: var(--border); }
.court-label-r { display: flex; align-items: baseline; gap: 12px; }
.player-card.selected { z-index: 90; }
.player-card.selected .player-dot { box-shadow: 0 0 0 3px var(--accent), 0 0 18px rgba(0,212,255,.55); }
.pop-inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
@media (max-width: 700px) { .sidebar { min-height: 480px; } }

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; }
  .left-col { width: 100%; }
}

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 220px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; color: var(--text); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-muted); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 16px; color: var(--text); }
.popup-stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=nba'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">

<script>
// ══════════════════════════════════════════
// TEAMS
// ══════════════════════════════════════════
const TEAMS = {
  ATL: { name: "Atlanta Hawks",          colors: ["#e03a3e","#c1d32f"] },
  BOS: { name: "Boston Celtics",         colors: ["#007a33","#ba9653"] },
  BKN: { name: "Brooklyn Nets",          colors: ["#000000","#ffffff"] },
  CHA: { name: "Charlotte Hornets",      colors: ["#1d1160","#00788c"] },
  CHI: { name: "Chicago Bulls",          colors: ["#ce1141","#000000"] },
  CLE: { name: "Cleveland Cavaliers",    colors: ["#860038","#fdbb30"] },
  DAL: { name: "Dallas Mavericks",       colors: ["#00538c","#b8c4ca"] },
  DEN: { name: "Denver Nuggets",         colors: ["#0e2240","#fec524"] },
  DET: { name: "Detroit Pistons",        colors: ["#c8102e","#1d42ba"] },
  GSW: { name: "Golden State Warriors",  colors: ["#1d428a","#ffc72c"] },
  HOU: { name: "Houston Rockets",        colors: ["#ce1141","#000000"] },
  IND: { name: "Indiana Pacers",         colors: ["#002d62","#fdbb30"] },
  LAC: { name: "LA Clippers",            colors: ["#c8102e","#1d428a"] },
  LAL: { name: "Los Angeles Lakers",     colors: ["#552583","#fdb927"] },
  MEM: { name: "Memphis Grizzlies",      colors: ["#5d76a9","#f5b112"] },
  MIA: { name: "Miami Heat",             colors: ["#98002e","#f9a01b"] },
  MIL: { name: "Milwaukee Bucks",        colors: ["#00471b","#eee1c6"] },
  MIN: { name: "Minnesota Timberwolves", colors: ["#0c2340","#78be20"] },
  NOP: { name: "New Orleans Pelicans",   colors: ["#0c2340","#b4975a"] },
  NYK: { name: "New York Knicks",        colors: ["#006bb6","#f58426"] },
  OKC: { name: "Oklahoma City Thunder",  colors: ["#007ac1","#ef3b24"] },
  ORL: { name: "Orlando Magic",          colors: ["#0077c0","#c4ced4"] },
  PHI: { name: "Philadelphia 76ers",     colors: ["#006bb6","#ed174c"] },
  PHX: { name: "Phoenix Suns",           colors: ["#1d1160","#e56020"] },
  POR: { name: "Portland Trail Blazers", colors: ["#e03a3e","#000000"] },
  SAC: { name: "Sacramento Kings",       colors: ["#5a2d81","#63727a"] },
  SAS: { name: "San Antonio Spurs",      colors: ["#c4ced4","#000000"] },
  TOR: { name: "Toronto Raptors",        colors: ["#ce1141","#000000"] },
  UTA: { name: "Utah Jazz",              colors: ["#002b5c","#f9a01b"] },
  WAS: { name: "Washington Wizards",     colors: ["#002b5c","#e31837"] },
};
const TEAM_ABBRS = Object.keys(TEAMS);
const STATUS_LABEL = { starter: 'Starter', rotation: 'Rotation', bench: 'Bench' };

// ESPN's team-logo CDN. cdn.nba.com (the official source) was tried
// first but fails with a real HTTP/2 protocol error in actual browser
// navigation, not just headless testing -- would break for real
// visitors, so not usable regardless of being the "proper" source.
// ESPN's own short codes mostly match our TEAM_ABBRS, except New Orleans
// ("no", not "nop") and Utah ("utah", not "uta") -- verified against the
// live CDN, not guessed.
const ESPN_TEAM_CODES = {
  ATL: 'atl', BOS: 'bos', CLE: 'cle', NOP: 'no', CHI: 'chi',
  DAL: 'dal', DEN: 'den', GSW: 'gsw', HOU: 'hou', LAC: 'lac',
  LAL: 'lal', MIA: 'mia', MIL: 'mil', MIN: 'min', BKN: 'bkn',
  NYK: 'nyk', ORL: 'orl', IND: 'ind', PHI: 'phi', PHX: 'phx',
  POR: 'por', SAC: 'sac', SAS: 'sas', OKC: 'okc', TOR: 'tor',
  UTA: 'utah', MEM: 'mem', WAS: 'was', DET: 'det', CHA: 'cha',
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/nba/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// Loose half-court zones for each starting position (% of court canvas)
const COURT_ZONES = {
  C:  { x: 66, y: 21 },   // post, offset — not dead-center under the hoop
  PF: { x: 34, y: 21 },   // opposite post
  SF: { x: 76, y: 49 },
  SG: { x: 24, y: 49 },
  PG: { x: 50, y: 72 },
};
const ZONE_ORDER = ['C','PF','SF','SG','PG'];

let currentTeam = 'LAL';
let allPlayers = [];
let teamPlayers = [];
// id -> "PF 3/46", league-wide rank within position group by 2K overall_rating.
// Computed once in loadAllPlayers() since allPlayers is already the full
// league, not per-team -- same scope as NFL's madden_rank/madden_rank_total.
let positionRanks = {};
// Frontend-only view state for manual bench->court substitutions -- keyed
// by court zone, never written back to nba_players_master.json, reset on
// every team switch (see loadTeam()).
let manualStarters = {};
// Single-level undo, keyed by zone: manualStarters[pos]'s value right before
// the most recent substitutePlayer() call for that zone (undefined if the
// zone had no manual starter yet). A zone key here means "show Undo"; using
// undo or subbing that zone again clears/overwrites the entry. Same
// lifecycle as manualStarters -- reset on every team switch.
let subUndo = {};

function ratingColor(r) {
  if (!r) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function mapPlayer(p) {
  return {
    id: p.player_id,
    name: p.name,
    team: p.team,
    pos: p.position,
    jersey: p.jersey_number,
    height: p.height,
    weight: p.weight,
    ppg: p.ppg,
    rpg: p.rpg,
    apg: p.apg,
    mpg: p.mpg,
    games_started: p.games_started,
    games_played: p.games_played,
    status: p.rotation_status,
    rating: p.overall_rating,
    salary: p.contract_salary,
    years_remaining: p.contract_years_remaining,
    injury: p.injury_status,
    cur: { gp: p.games_played, gs: p.games_started, mpg: p.mpg, ppg: p.ppg, rpg: p.rpg, apg: p.apg,
           spg: p.spg, bpg: p.bpg, fg: p.fg_pct, tp: p.three_pct, ft: p.ft_pct, tov: p.tov },
    prev: p.prev_season ? { season: p.prev_season.season, gp: p.prev_season.games_played, gs: p.prev_season.games_started,
           mpg: p.prev_season.mpg, ppg: p.prev_season.ppg, rpg: p.prev_season.rpg, apg: p.prev_season.apg,
           spg: p.prev_season.spg, bpg: p.prev_season.bpg, fg: p.prev_season.fg_pct, tp: p.prev_season.three_pct,
           ft: p.prev_season.ft_pct, tov: p.prev_season.tov } : null,
    statsSeason: p.stats_season,
    advCur: p.adv_season ? p : null,   // BBR current-season fields live on the master row itself
    advPrev: p.adv_prev || null,
  };
}

// Players with no 2K rating get no entry here -- rendering code must
// check for a missing key and skip the badge, not show a placeholder.
function computePositionRanks(players) {
  const byPos = {};
  players.forEach(p => {
    if (p.rating == null) return; // no 2K rating, no badge
    (byPos[p.pos] ||= []).push(p);
  });
  const rankMap = {}; // id -> "PF 3/46"
  Object.entries(byPos).forEach(([pos, group]) => {
    group.sort((a, b) => b.rating - a.rating);
    group.forEach((p, i) => {
      rankMap[p.id] = `${pos} ${i + 1}/${group.length}`;
    });
  });
  return rankMap;
}

// "2K ratings as of <date>": when the 2K ratings last changed (ratings_last_changed in ratings_meta.json); nothing if missing.
async function loadRatingsMeta() {
  try {
    const res = await fetch('data/ratings_meta.json');
    const meta = await res.json();
    if (meta.ratings_last_changed) {
      const [y, m, d] = meta.ratings_last_changed.split('-').map(Number);
      const txt = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('ratingsAsOf').textContent = '2K ratings as of ' + txt;
    }
  } catch (e) {}
}

// "Stats as of <date>": when the stats/rosters last changed (stats_last_changed in stats_meta.json); nothing if missing.
async function loadStatsMeta() {
  try {
    const res = await fetch('data/stats_meta.json');
    const meta = await res.json();
    if (meta.stats_last_changed) {
      const [y, m, d] = meta.stats_last_changed.split('-').map(Number);
      const txt = new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('statsAsOf').textContent = 'Stats as of ' + txt;
    }
  } catch (e) {}
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/nba_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
    positionRanks = computePositionRanks(allPlayers);
    buildAdv();
    loadRatingsMeta();
    loadStatsMeta();
  } catch (e) {
    console.error('Failed to load nba_players_master.json:', e);
    allPlayers = [];
  }
}

// Purely informational -- silently omit if the file, the field, or the
// date fails to parse, rather than surface an error state for a small
// staleness caption.
async function loadDepthChartMeta() {
  try {
    const res = await fetch('data/nba_depth_chart.json');
    const raw = await res.json();
    if (!raw.last_changed) return;
    const d = new Date(raw.last_changed + 'T00:00:00');
    if (isNaN(d.getTime())) return;
    const formatted = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
    document.getElementById('depthChartUpdated').textContent = `Depth chart as of ${formatted}`;
  } catch (e) {
    // no-op
  }
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  subUndo = {};
  sidebarZone = null; compareId = null;
  document.body.classList.remove('sb-open');
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderCourt();
  renderBenchList();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING FIVE (COURT)
// ══════════════════════════════════════════
function getStarter(pos) {
  if (manualStarters[pos] != null) {
    const manual = teamPlayers.find(p => p.id === manualStarters[pos]);
    if (manual) return manual;
  }
  const usedElsewhere = new Set(
    Object.entries(manualStarters).filter(([k]) => k !== pos).map(([, id]) => id)
  );
  const candidates = teamPlayers.filter(p => p.pos === pos && !usedElsewhere.has(p.id));
  if (!candidates.length) return null;
  const starters = candidates.filter(p => p.status === 'starter');
  // among starters at this position, take the highest-minutes one; if
  // none are flagged starter, fall back to the highest-minutes player
  const pool = starters.length ? starters : candidates;
  return pool.sort((a,b) => (b.mpg||0) - (a.mpg||0))[0];
}

function renderCourt() {
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(pos => {
    const zone = COURT_ZONES[pos];
    const p = getStarter(pos);
    if (!p) {
      return `
        <div class="player-card" data-pos="${pos}" style="left:${zone.x}%; top:${zone.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    const rc = ratingColor(p.rating);
    const rank = positionRanks[p.id];
    return `
      <div class="player-card" data-pos="${pos}" data-pid="${p.id}" style="left:${zone.x}%; top:${zone.y}%">
        <div class="player-dot" style="background:${rc}">${p.rating || '—'}</div>
        <div class="player-name">${p.name}</div>
        ${rank ? `<div class="player-rank">${rank}</div>` : ''}
        ${pos in subUndo ? `<div class="player-undo" data-undo-pos="${pos}" title="Undo substitution">↺</div>` : ''}
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);
  attachUndoHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;

  // Keep the sidebar in step with the court: refresh it (or close it if its zone has no player now).
  if (sidebarZone) renderSidebar();
  setSelectedHighlight();
  updateResetBtn();
}

// Reset button is only shown while there are manual subs.
function updateResetBtn() {
  document.getElementById('resetStartersBtn').style.display = Object.keys(manualStarters).length ? '' : 'none';
}

function resetStarters() {
  manualStarters = {};
  subUndo = {};
  compareId = null;
  hidePopup();
  renderCourt();
  renderBenchList();
}

// ══════════════════════════════════════════
// BENCH & ROTATION LIST
// ══════════════════════════════════════════
// Shared sub sort (popover + bench list): '2k' (rating desc) or 'mpg' (minutes desc).
// Nulls sort last in both modes; the other metric breaks ties. Default = mpg (the old order).
const SUBSORT_KEY = 'fieldview_nba_subsort';
let subSort = 'mpg';
try { const v = localStorage.getItem(SUBSORT_KEY); if (v === '2k' || v === 'mpg') subSort = v; } catch (e) {}

function sortSubs(list) {
  const primary = subSort === '2k' ? 'rating' : 'mpg';
  const secondary = subSort === '2k' ? 'mpg' : 'rating';
  const cmp = (a, b, k) => (a[k] == null) - (b[k] == null) || (b[k] - a[k]) || 0;
  return list.slice().sort((a, b) => cmp(a, b, primary) || cmp(a, b, secondary));
}

function renderSortToggles() {
  document.querySelectorAll('[data-sort-toggle]').forEach(el => {
    el.innerHTML = `<button data-sort="2k" class="${subSort === '2k' ? 'active' : ''}">2K</button>` +
                   `<button data-sort="mpg" class="${subSort === 'mpg' ? 'active' : ''}">MPG</button>`;
    el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      setSubSort(btn.dataset.sort);
    }));
  });
}

function setSubSort(mode) {
  subSort = mode;
  try { localStorage.setItem(SUBSORT_KEY, mode); } catch (e) {}
  renderBenchList();
  if (openPopoverPos) fillSubsPopover(openPopoverPos);
  if (sidebarZone && !compareId) renderSidebar();
}

function renderBenchList() {
  const list = document.getElementById('benchList');
  const startingIds = new Set(ZONE_ORDER.map(pos => getStarter(pos)?.id).filter(Boolean));
  const bench = teamPlayers
    .filter(p => !startingIds.has(p.id));
  document.getElementById('benchTitle').textContent =
    'Bench & Rotation (by ' + (subSort === '2k' ? '2K Rating' : 'Minutes Per Game') + ')';
  renderSortToggles();

  if (!bench.length) {
    list.innerHTML = '<div class="bench-empty">No bench players on this roster yet.</div>';
    return;
  }

  list.innerHTML = sortSubs(bench).map((p, i) => {
    const rc = ratingColor(p.rating);
    return `
      <div class="bench-row">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${rc}">${p.rating || '—'}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${positionRanks[p.id] || p.pos || ''} ${p.status ? '<span class="tag tag-' + p.status + '">' + STATUS_LABEL[p.status] + '</span>' : ''}</div>
        </div>
        <div class="bench-stat"><div class="bench-stat-val">${p.ppg != null ? p.ppg : '—'}</div><div class="bench-stat-label">ppg</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.rpg != null ? p.rpg : '—'}</div><div class="bench-stat-label">rpg</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.apg != null ? p.apg : '—'}</div><div class="bench-stat-label">apg</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.mpg != null ? p.mpg : '—'}</div><div class="bench-stat-label">mpg</div></div>
      </div>
    `;
  }).join('');
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP (hover, court cards only)
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (click a starter -> popover of
// same-position bench/rotation players -> swap)
// ══════════════════════════════════════════
let openPopoverPos = null;

function fillSubsPopover(pos) {
  const popover = document.getElementById('subsPop');
  const allStarterIds = new Set(ZONE_ORDER.map(z => getStarter(z)?.id).filter(Boolean));
  const subs = sortSubs(teamPlayers.filter(p => !allStarterIds.has(p.id)));

  popover.innerHTML = `<div class="subs-pop-label"><span>Sub in (any position)</span><span class="sort-toggle" data-sort-toggle></span></div>` +
    (subs.length ? subs.map(s => `
      <div class="subs-row" data-pid="${s.id}">
        <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating || '—'}</div>
        <div class="subs-name">${s.name}</div>
        <div class="subs-mpg">${s.mpg != null ? s.mpg : '—'}</div>
      </div>`).join('') : `<div class="subs-empty">No bench players available</div>`);
  renderSortToggles();

  popover.querySelectorAll('.subs-row').forEach(row => {
    row.addEventListener('click', (ev) => {
      ev.stopPropagation();
      substitutePlayer(row.dataset.pid, pos);
      popover.classList.remove('open');
      openPopoverPos = null;
    });
  });
}

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
      const pos = card.dataset.pos;
      if (sidebarOn) { openSidebar(pos); return; }
      const popover = document.getElementById('subsPop');
      if (openPopoverPos === pos) {
        popover.classList.remove('open');
        openPopoverPos = null;
        return;
      }
      fillSubsPopover(pos);

      const courtCanvas = card.closest('.court-canvas');
      const rect = card.getBoundingClientRect();
      const parentRect = courtCanvas.getBoundingClientRect();
      popover.style.left = (rect.left - parentRect.left + 34) + 'px';
      popover.style.top = (rect.top - parentRect.top) + 'px';
      popover.classList.add('open');
      openPopoverPos = pos;
    });
  });
}

function substitutePlayer(pid, targetPos) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  subUndo[targetPos] = manualStarters[targetPos];
  manualStarters[targetPos] = p.id;
  compareId = null;
  hidePopup();
  renderCourt();
  renderBenchList();
}

// Single-level undo: puts the zone back to whatever it was immediately
// before the most recent substitutePlayer() call for that zone, then
// clears the undo entry so the affordance disappears (no undo-of-undo).
function undoSubstitution(pos) {
  if (!(pos in subUndo)) return;
  const prev = subUndo[pos];
  delete subUndo[pos];
  if (prev == null) {
    delete manualStarters[pos];
  } else {
    manualStarters[pos] = prev;
  }
  hidePopup();
  renderCourt();
  renderBenchList();
}

function attachUndoHandlers(layer) {
  layer.querySelectorAll('.player-undo').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      undoSubstitution(el.dataset.undoPos);
    });
  });
}

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin; // flip to the left of the anchor
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

// ── Advanced stats (Basketball-Reference) ──
// Percentile color: red at 0, amber at 50, green at 99 (copied from nfl-formation-view.html).
const PCT_RED = [239, 68, 68], PCT_AMBER = [245, 190, 40], PCT_GREEN = [34, 197, 94];
const PCT_NEUTRAL = '#8b93b0';
function pctColor(pct) {
  const [a, b, t] = pct <= 50 ? [PCT_RED, PCT_AMBER, pct / 50] : [PCT_AMBER, PCT_GREEN, (pct - 50) / 49];
  return 'rgb(' + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',') + ')';
}
function ordinal(n) {
  const r = n % 100;
  if (r >= 11 && r <= 13) return n + 'th';
  return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
}

// Qualifier: minutes >= MIN_PER_G x G, G = the season's max games across the master (current / prior).
const MIN_PER_G = 12;
let advG = { cur: 0, prev: 0 };
let pctIndex = { cur: {}, prev: {} }; // season -> position -> stat key -> sorted values of every qualified player
let popN = { cur: {}, prev: {} };     // season -> position -> number of qualified players

const isNum = v => typeof v === 'number' && !isNaN(v);
const fmtPct1 = v => v.toFixed(1) + '%';
const fmtSigned = v => (v > 0 ? '+' : '') + v.toFixed(1);
const fmt3 = v => (v < 0 ? '-' : '') + Math.abs(v).toFixed(3).replace(/^0/, '');
const ADV_META = {
  ts_pct:    { label: 'TS%',   fmt: v => (v * 100).toFixed(1) + '%', def: 'True shooting: scoring efficiency counting 2s, 3s and free throws.' },
  usg_pct:   { label: 'USG%',  fmt: fmtPct1, style: 'usage', def: 'Share of team plays he finishes (shot, turnover, free throws) while on the floor.' },
  ast_pct:   { label: 'AST%',  fmt: fmtPct1, def: 'Share of teammates’ baskets he assisted while on the floor.' },
  trb_pct:   { label: 'TRB%',  fmt: fmtPct1, def: 'Share of available rebounds he grabbed while on the floor.' },
  tov_pct:   { label: 'TOV%',  fmt: fmtPct1, lower: true, def: 'Turnovers per 100 plays he uses. Lower is better.' },
  bpm:       { label: 'BPM',   fmt: fmtSigned, def: 'Box Plus/Minus: points per 100 possessions above an average player (0 = average).' },
  ws_per_48: { label: 'WS/48', fmt: fmt3, def: 'Win Shares per 48 minutes (about .100 is average).' },
};
const ADV_LIST = ['ts_pct', 'usg_pct', 'ast_pct', 'trb_pct', 'tov_pct', 'bpm', 'ws_per_48'];

const advQualified = (b, which) => !!b && isNum(b.adv_mp) && advG[which] > 0 && b.adv_mp >= MIN_PER_G * advG[which];

function buildAdv() {
  advG = { cur: 0, prev: 0 };
  for (const p of allPlayers) {
    if (p.advCur && p.advCur.adv_games > advG.cur) advG.cur = p.advCur.adv_games;
    if (p.advPrev && p.advPrev.adv_games > advG.prev) advG.prev = p.advPrev.adv_games;
  }
  pctIndex = { cur: {}, prev: {} };
  popN = { cur: {}, prev: {} };
  for (const p of allPlayers) {
    if (!p.pos) continue;
    for (const which of ['cur', 'prev']) {
      const b = which === 'cur' ? p.advCur : p.advPrev;
      if (!advQualified(b, which)) continue;
      popN[which][p.pos] = (popN[which][p.pos] || 0) + 1;
      const idx = (pctIndex[which][p.pos] ||= {});
      for (const k of ADV_LIST) if (isNum(b[k])) (idx[k] ||= []).push(b[k]);
    }
  }
  for (const which of ['cur', 'prev']) for (const pos in pctIndex[which]) for (const k in pctIndex[which][pos]) pctIndex[which][pos][k].sort((a, b) => a - b);
  console.info('[CourtView] qualifier G =', advG, '(minutes >= ' + MIN_PER_G + ' x G)');
}

// Which season's advanced block a player shows: current if qualified; else last season if that qualifies
// (with a note); else current raw values (or last season's raw if there are none) tagged low sample, no bars.
function advView(p) {
  if (advQualified(p.advCur, 'cur')) return { which: 'cur', season: p.advCur.adv_season, b: p.advCur, qualified: true };
  if (advQualified(p.advPrev, 'prev')) return { which: 'prev', season: p.advPrev.adv_season, b: p.advPrev, qualified: true, note: 'this season: low sample' };
  const has = b => b && ADV_LIST.some(k => isNum(b[k]));
  if (has(p.advCur)) return { which: 'cur', season: p.advCur.adv_season, b: p.advCur, qualified: false };
  if (has(p.advPrev)) return { which: 'prev', season: p.advPrev.adv_season, b: p.advPrev, qualified: false };
  return null;
}

// % of the qualified same-position population he beats (ties count half), inverted for lower-is-better stats.
// Null when unqualified or the population is under 10. (copied from mlb/diamond-view.html)
function percentileOf(p, v, key) {
  const a = v && v.qualified ? v : null;
  const arr = a && pctIndex[a.which][p.pos] && pctIndex[a.which][p.pos][key];
  const x = a && a.b[key];
  if (!arr || arr.length < 10 || typeof x !== 'number' || isNaN(x)) return null;
  const lower = !!ADV_META[key].lower;
  let beaten = 0, eq = 0;
  for (const y of arr) {
    if (y === x) eq++;
    else if (lower ? y > x : y < x) beaten++;
  }
  beaten += 0.5 * (eq - 1); // he is one of the "tied" players; exclude himself
  return Math.min(99, Math.round(beaten / (arr.length - 1) * 100));
}

function statPct(p, v, key) {
  const m = ADV_META[key];
  const pct = percentileOf(p, v, key);
  if (pct == null) return { pct: null, color: null, text: '' };
  return {
    pct,
    color: m.style ? PCT_NEUTRAL : pctColor(pct),
    text: m.style ? 'higher usage than ' + pct + '% of ' + p.pos + 's' : ordinal(pct) + ' pct',
  };
}

function advStatHtml(p, v, key) {
  const m = ADV_META[key], x = v.b[key];
  if (!isNum(x)) return '';
  const { pct, color: c, text } = statPct(p, v, key);
  return `
    <div class="sb-stat">
      <div class="sb-stat-top"><span class="sb-stat-label">${m.label}${!v.qualified ? ' <span class="sb-low">low sample</span>' : ''}</span><span class="sb-stat-val">${m.fmt(x)}</span></div>
      ${pct != null ? `<div class="sb-bar-wrap"><div class="sb-bar"><div class="sb-bar-fill" style="width:${pct}%;background:${c}"></div></div><span class="sb-pct" style="color:${c}">${text}</span></div>` : ''}
      <div class="sb-def">${m.def}</div>
    </div>`;
}

function advSectionHtml(p) {
  const v = advView(p);
  if (!v) return '';
  const rows = ADV_LIST.map(k => advStatHtml(p, v, k)).join('');
  if (!rows) return '';
  const n = popN[v.which][p.pos];
  const caption = v.qualified
    ? `Ranked among ${n} qualified ${p.pos}s in ${v.season} (min. ${MIN_PER_G * advG[v.which]} minutes)`
    : `Fewer than ${MIN_PER_G * advG[v.which]} minutes in ${v.season}: not ranked`;
  return `<div class="sb-section"><div class="sb-section-title">Advanced Stats · ${v.season}</div>
    ${v.note ? `<div class="sb-note" style="margin:-4px 0 4px">${v.note}</div>` : ''}${rows}
    <div class="sb-caption">${caption}</div></div>`;
}

// ── Season stats ──
const BOX_DEFS = [
  { label: 'GP', k: 'gp' }, { label: 'GS', k: 'gs' }, { label: 'MPG', k: 'mpg', d: 1 },
  { label: 'PPG', k: 'ppg', d: 1 }, { label: 'RPG', k: 'rpg', d: 1 }, { label: 'APG', k: 'apg', d: 1 },
  { label: 'SPG', k: 'spg', d: 1 }, { label: 'BPG', k: 'bpg', d: 1 },
  { label: 'FG%', k: 'fg', d: 1 }, { label: '3P%', k: 'tp', d: 1 }, { label: 'FT%', k: 'ft', d: 1 },
  { label: 'TOV', k: 'tov', d: 1, lower: true },
];
const boxText = (blk, d) => blk && isNum(blk[d.k]) ? (d.d ? blk[d.k].toFixed(d.d) : String(blk[d.k])) : '—';

function seasonStatsHtml(p) {
  const rows = BOX_DEFS.map(d => `<div class="sb-tbl-l">${d.label}</div><div class="sb-tbl-v">${boxText(p.cur, d)}</div><div class="sb-tbl-v">${boxText(p.prev, d)}</div>`).join('');
  return `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
    <div class="sb-tbl3"><div></div><div class="sb-tbl-h">This season</div><div class="sb-tbl-h">Last season</div>${rows}</div>
    <div class="sb-caption">${p.statsSeason || ''}${p.prev ? ' · ' + p.prev.season : ''}</div></div>`;
}

const lastName = p => p.name.split(' ').slice(1).join(' ') || p.name;
function fmtSalary(s) {
  const n = parseInt(String(s == null ? '' : s).replace(/[^0-9]/g, ''), 10);
  return n ? '$' + (n / 1e6).toFixed(1) + 'M' : null;
}

function subsSectionHtml(p) {
  const startingIds = new Set(ZONE_ORDER.map(z => getStarter(z)?.id).filter(Boolean));
  const cands = sortSubs(teamPlayers.filter(c => !startingIds.has(c.id)));

      <div class="sb-sub" onclick="openCompare('${c.id}', event)">

        <div class="sb-sub-name">${c.name}</div>
        <div class="sb-sub-pos">${c.pos || ''} · ${c.mpg != null ? c.mpg + ' mpg' : '— mpg'}</div>
      </div>`).join('') : '<div class="sb-empty">No bench players available.</div>';
  return `<div class="sb-section" style="border-bottom:none">
      <div class="sb-section-title sb-sort"><span>Substitutes</span><span class="sort-toggle" data-sort-toggle></span></div>${rows}</div>`;
}

function openCompare(id, event) {

function swapFromCompare(event) {
  if (event) event.stopPropagation();

}

// Starter vs. candidate. Season stats (this season) and advanced rows are compared only where both players
// have a value; each percentile stays within the player's own position population and displayed season.
function renderCompare(el, a) {
  const b = teamPlayers.find(x => String(x.id) === String(compareId));
  if (!b) { compareId = null; renderSidebar(); return; }

  const rows = BOX_DEFS.map(d => {
    const va = a.cur[d.k], vb = b.cur[d.k];
    if (!isNum(va) || !isNum(vb)) return '';
    const ta = boxText(a.cur, d), tb = boxText(b.cur, d);
    let best = '';
    if (ta !== tb) best = (d.lower ? va < vb : va > vb) ? 'a' : 'b';
    return `<div class="sb-tbl-l">${d.label}</div><div class="sb-tbl-v${best === 'a' ? ' best' : ''}">${ta}</div><div class="sb-tbl-v${best === 'b' ? ' best' : ''}">${tb}</div>`;
  }).join('');
  const tableHtml = rows ? `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
      <div class="sb-tbl"><div></div><div class="sb-tbl-h">${lastName(a)}</div><div class="sb-tbl-h">${lastName(b)}</div>${rows}</div>
      <div class="sb-caption">${a.statsSeason || ''} season</div></div>` : '';

  const va = advView(a), vb = advView(b);
  const line = (pl, v, key) => {
    const m = ADV_META[key], x = v.b[key];
    const { pct, color } = statPct(pl, v, key);
    const tag = lastName(pl) + (v.which === 'prev' ? ' · ' + v.season.replace(/^20/, '') : '');
    return `<div class="sb-cmp-line"><span class="sb-cmp-tag" title="${pl.name} · ${v.season}">${tag}</span>
      <div class="sb-bar">${pct != null ? `<div class="sb-bar-fill" style="width:${pct}%;background:${color}"></div>` : ''}</div>
      <span class="sb-cmp-val">${m.fmt(x)}</span>
      <span class="sb-cmp-pct" style="color:${color || 'inherit'}">${pct != null ? ordinal(pct) : '<span class="sb-low" style="margin:0">low sample</span>'}</span></div>`;
  };
  let advHtml = '';
  if (va && vb) {
    const advRows = ADV_LIST.filter(k => isNum(va.b[k]) && isNum(vb.b[k])).map(key =>
      `<div class="sb-cmp-row"><div class="sb-cmp-top"><span class="sb-stat-label">${ADV_META[key].label}</span></div>${line(a, va, key)}${line(b, vb, key)}</div>`).join('');
    if (advRows) advHtml = `<div class="sb-section"><div class="sb-section-title">Advanced Stats · percentile vs. own position</div>${advRows}
      <div class="sb-caption">${lastName(a)}: ${va.season}${va.qualified ? '' : ' (low sample)'} · ${lastName(b)}: ${vb.season}${vb.qualified ? '' : ' (low sample)'}</div></div>`;
  }

  const head = (pl, tag) => `<div>
      <div class="sb-cmp-tagline">${tag}</div>
      <div class="sb-cmp-name">${pl.jersey != null && pl.jersey !== '' ? '#' + pl.jersey + ' ' : ''}${pl.name}</div>
      <div class="sb-cmp-sub">${pl.pos || ''}${pl.height ? ' · ' + pl.height : ''}</div>
      <div class="sb-cmp-rating" style="color:${ratingColor(pl.rating)}">${pl.rating != null ? pl.rating : '—'}</div>
    </div>`;

  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-cmp-head">${head(a, 'Starter')}${head(b, 'Substitute')}</div>
    <div class="sb-cmp-actions">
      <button class="sb-btn" onclick="closeCompare(event)">Back</button>
      <button class="sb-btn primary" onclick="swapFromCompare(event)">Swap in</button>
    </div>
    ${tableHtml}${advHtml}
    ${!tableHtml && !advHtml ? '<div class="sb-section"><div class="sb-empty">These players have no stats in common to compare.</div></div>' : ''}`;
  document.body.classList.add('sb-open');
  el.scrollTop = 0;
  setSelectedHighlight();
  syncURL();
}

// ══════════════════════════════════════════
// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  closeSidebar();
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam).then(syncURL);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
  // Click on empty court closes the sidebar.
  if (sidebarZone && e.target.closest('.court-canvas') && !e.target.closest('.player-card')) closeSidebar();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sidebarZone) closeSidebar();
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('team') && TEAMS[urlParams.get('team')]) currentTeam = urlParams.get('team');
const urlPlayer = urlParams.get('player');

updateSbToggle();
buildTeamsDropdown();
loadTeam(currentTeam).then(() => {
  // Reopen the sidebar if ?player= is someone currently on the court for this team; otherwise ignore it.
  if (sidebarOn && urlPlayer) {
    const zone = ZONE_ORDER.find(z => { const st = getStarter(z); return st && String(st.id) === urlPlayer; });
    if (zone) openSidebar(zone);
  }
});
loadDepthChartMeta();
</script>
