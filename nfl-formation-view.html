<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900; letter-spacing: .5px;
  color: #fff;
  flex-shrink: 0;
}

.ctrl-group {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.ctrl-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  white-space: nowrap;
}
.ctrl-btn:hover { color: var(--text); background: var(--border); }
.ctrl-btn.active { background: var(--accent); color: #000; }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── TEAM DROPDOWN ── */
.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 8px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  width: 320px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

/* ── FIELD ── */
.field-outer {
  padding: 16px 24px 24px;
  min-height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
}

.formation-bar {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.formation-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.field-canvas {
  position: relative;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  flex: 1;
  border-radius: 4px;
}

.field-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  border-radius: 4px;
  overflow: hidden;
}

.players-layer {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 1000px;
}

/* ── PLAYER CARD ── */
.player-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  z-index: 20;
  gap: 0;
}
.player-node:hover { z-index: 100; }

.p-card {
  width: 105px;
  border-radius: 8px 8px 0 0;
  padding: 7px 10px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-bottom: none;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.player-node:hover .p-card {
  transform: scale(1.06);
  border-color: rgba(255,255,255,0.4);
}

.p-jersey {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  line-height: 1;
  align-self: flex-start;
}

.p-lastname {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 500;
  font-size: 18px;
  color: #fff;
  line-height: 1.1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 93px;
}

.p-madden {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 28px;
  line-height: 1;
  text-align: center;
}

.p-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  color: rgba(255,255,255,0.45);
  letter-spacing: .5px;
  line-height: 1;
}

.p-pos-bar {
  width: 105px;
  background: #000;
  border-radius: 0 0 6px 6px;
  padding: 4px 0;
  text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-top: none;
}

/* ── HOVER CARD ── */
.hover-card {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  width: 220px;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s, transform .15s;
  transform: translateX(-50%) translateY(6px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.8);
  z-index: 500;
  overflow: hidden;
}
.player-node:hover .hover-card {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.player-node.flip-card .hover-card {
  bottom: auto;
  top: calc(100% + 12px);
  transform: translateX(-50%) translateY(-6px);
}
.player-node.flip-card:hover .hover-card {
  transform: translateX(-50%) translateY(0);
}

.card-header {
  padding: 11px 13px 9px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.card-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 13px;
  color: #fff;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.2);
}

.card-nameblock { flex: 1; min-width: 0; }

.card-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 14px;
  color: var(--text);
  line-height: 1.1;
}

.card-meta {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

.card-ratings {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid var(--border);
}

.card-rating-cell {
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-right: 1px solid var(--border);
}
.card-rating-cell:last-child { border-right: none; }

.crc-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  line-height: 1;
}

.crc-label {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.card-footer {
  padding: 8px 13px;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* ── LEGEND ── */
.legend-strip {
  width: 100%;
  max-width: 1400px;
  margin: 12px auto 0;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 16px;
  color: var(--text-muted);
  letter-spacing: .5px;
  padding: 10px 0;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.ls-item { display: flex; align-items: center; gap: 6px; }

.ls-dot {
  width: 12px; height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

@keyframes nodeIn {
  from { opacity: 0; transform: translate(-50%, calc(-50% - 10px)); }
  to   { opacity: 1; transform: translate(-50%, -50%); }
}
.player-node { animation: nodeIn .35s cubic-bezier(.34,1.56,.64,1) both; }
</style>
</head>

      WLB:  {x:56, y:40},
      DE:   {x:35, y:56},
      NT:   {x:50, y:56},
      DT:   {x:65, y:56},
    },
  },
  st: {
    'kickoff': {
      PK: {x:50, y:88},
      KO: {x:50, y:88},
      LS: {x:50, y:72},
      H:  {x:50, y:72},
      PR: {x:22, y:58},
      KR: {x:78, y:58},
      PT: {x:50, y:78},
    }
  }
};

const TE2_COORD = {x:76, y:56};

let currentTeam = 'BUF';
let currentUnit = 'offense';
let currentPersonnel = '11';
let teamData = null;

function maddenColor(r) {
  if (!r) return '#6b7494';
  if (r >= 95) return '#00ff88';
  if (r >= 90) { const t = (r-90)/5; return `hsl(${140+t*20},100%,55%)`; }
  if (r >= 85) { const t = (r-85)/5; return `hsl(${100+t*40},100%,55%)`; }
  if (r >= 80) { const t = (r-80)/5; return `hsl(${75+t*25},100%,55%)`; }
  if (r >= 75) { const t = (r-75)/5; return `hsl(${55+t*20},100%,55%)`; }
  if (r >= 70) { const t = (r-70)/5; return `hsl(${38+t*17},100%,55%)`; }
  if (r >= 65) { const t = (r-65)/5; return `hsl(${25+t*13},100%,55%)`; }
  return `hsl(${Math.max(0,(r-55)*2)},90%,50%)`;
}

async function loadTeam(abbr) {
  try {
    const res = await fetch(`data/${abbr.toLowerCase()}.json`);
    teamData = await res.json();
  } catch(e) {
    console.error('Failed to load team data:', e);
    return;
  }
  updateHeader();
  renderFormation();
}

function getStarter(pos) {
  return teamData?.depth_chart?.[pos]?.[0] || null;
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const swatch = document.getElementById('teamSwatchEl');
  swatch.textContent = currentTeam;
  swatch.style.background = team.colors[0];
  swatch.style.borderColor = team.colors[1];
  document.getElementById('teamNameEl').textContent = team.name;
}

function buildHoverCard(p, pos) {
  const team = TEAMS[currentTeam];
  const initials = p.name.split(' ').map(w => w[0]).join('').slice(0, 2);
  const mc = maddenColor(p.madden);
  return `
    <div class="hover-card">
      <div class="card-header">
        <div class="card-avatar" style="background:${team.colors[0]};border-color:${team.colors[1]}">${initials}</div>
        <div class="card-nameblock">
          <div class="card-name">${p.jersey ? '#'+p.jersey+' ' : ''}${p.name}</div>
          <div class="card-meta">${pos}${p.age ? ' · Age '+p.age : ''}${p.years_pro != null ? ' · Yr '+(p.years_pro+1)+' NFL' : ''}</div>
        </div>
      </div>
      <div class="card-ratings">
        <div class="card-rating-cell">
          <div class="crc-val" style="color:${mc}">${p.madden || '—'}</div>
          <div class="crc-label">Madden</div>
        </div>
        <div class="card-rating-cell">
          <div class="crc-val" style="color:var(--gold)">${p.age || '—'}</div>
          <div class="crc-label">Age</div>
        </div>
        <div class="card-rating-cell">
          <div class="crc-val" style="color:var(--text-muted)">${p.years_pro != null ? p.years_pro+1 : '—'}</div>
          <div class="crc-label">NFL Yr</div>
        </div>
      </div>
      ${p.stats && Object.keys(p.stats).length > 0 ? `
        <div style="padding:8px 13px;border-top:1px solid var(--border)">
          <div style="font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px">${p.stats_season || ''} STATS</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 12px">
            ${Object.entries(p.stats).map(([k,v]) => `
              <div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
                <span style="font-size:10px;color:var(--text-muted)">${k}</span>
                <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--text)">${v}</span>
              </div>
            `).join('')}
          </div>
        </div>
      ` : ''}
      <div class="card-footer">
        <span style="font-family:'Barlow Condensed';font-weight:700;font-size:13px;color:var(--gold)">${p.cap_number || '—'}</span>
        <span style="font-size:10px;color:var(--text-dim)">cap hit</span>
      </div>
    </div>
  `;
}

function buildPlayerNode(p, pos, coords, delay, flipCard) {
  if (!p) return '';
  const team = TEAMS[currentTeam];
  const mc = maddenColor(p.madden);
  const lastName = p.name.split(' ').filter(w => w.length > 1).slice(-1)[0] || p.name;

  return `
    <div class="player-node ${flipCard ? 'flip-card' : ''}"
         style="left:${coords.x}%;top:${coords.y}%;animation-delay:${delay}ms">
      <div class="p-card" style="background:${team.colors[0]}">
        <div class="p-jersey">${p.jersey ? '#'+p.jersey : '\u00a0'}</div>
        <div class="p-lastname">${lastName}</div>
        <div class="p-madden" style="color:${mc}">${p.madden || '—'}</div>
        ${p.madden_rank ? `<div class="p-rank">${p.madden_rank} / ${p.madden_rank_total} ${p.madden_pos_label || ''}</div>` : ''}
      </div>
      <div class="p-pos-bar">${pos}</div>
      ${buildHoverCard(p, pos)}
    </div>
  `;
}

function renderFormation() {
  const layer = document.getElementById('playersLayer');
  if (!teamData) { layer.innerHTML = ''; return; }

  const coordMap = FORMATION_COORDS[currentUnit]?.[currentPersonnel]
                || FORMATION_COORDS[currentUnit]?.['11']
                || {};

  let html = '';
  let delay = 0;

  for (const [pos, coords] of Object.entries(coordMap)) {
    if (pos === 'TE' && currentPersonnel === '12') {
      const players = teamData.depth_chart['TE'] || [];
      html += buildPlayerNode(players[0] || null, 'TE',  coords,    delay, false);
      delay += 40;
      html += buildPlayerNode(players[1] || null, 'TE2', TE2_COORD, delay, false);
      delay += 40;
      continue;
    }
    const starter = getStarter(pos);
    html += buildPlayerNode(starter, pos, coords, delay, coords.y > 72);
    delay += 40;
  }

  layer.innerHTML = html;
}

function setUnit(unit, btn) {
  currentUnit = unit;
  document.querySelectorAll('.ctrl-group:first-child .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const pg = document.getElementById('personnelGroup');

  if (unit === 'offense') {
    pg.innerHTML = `
      <button class="ctrl-btn active" onclick="setPersonnel('11',this)">11 (3 WR)</button>
      <button class="ctrl-btn" onclick="setPersonnel('12',this)">12 (2 TE)</button>
      <button class="ctrl-btn" onclick="setPersonnel('21',this)">21 (2 RB)</button>
    `;
    currentPersonnel = '11';
    document.getElementById('formationLabel').textContent = '11 Personnel · Shotgun Spread';
  } else if (unit === 'defense') {
    const baseScheme = teamData?.base_defense || 'Base 4-3';
    const isThreeFour = baseScheme.includes('3-4');
    const baseKey = isThreeFour ? 'base34' : 'base43';
    const baseLabel = isThreeFour ? '3-4 Base' : '4-3 Base';
    pg.innerHTML = `
      <button class="ctrl-btn active" onclick="setPersonnel('${baseKey}',this)">${baseLabel}</button>
      <button class="ctrl-btn" onclick="setPersonnel('nickel',this)">Nickel</button>
      <button class="ctrl-btn" onclick="setPersonnel('dime',this)">Dime</button>
    `;
    currentPersonnel = baseKey;
    document.getElementById('formationLabel').textContent = baseScheme;
  } else {
    pg.innerHTML = `<button class="ctrl-btn active" onclick="setPersonnel('kickoff',this)">Kickoff</button>`;
    currentPersonnel = 'kickoff';
    document.getElementById('formationLabel').textContent = 'Special Teams';
  }

  renderFormation();
}

function setPersonnel(pers, btn) {
  currentPersonnel = pers;
  document.querySelectorAll('#personnelGroup .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = {
    '11': '11 Personnel · Shotgun Spread',
    '12': '12 Personnel · 2 TE Set',
    '21': '21 Personnel · 2 Back Set',
    'base43': teamData?.base_defense || 'Base 4-3',
    'base34': teamData?.base_defense || 'Base 3-4',
    'nickel': 'Nickel Package',
    'dime': 'Dime Package',
    'kickoff': 'Special Teams',
  };
  document.getElementById('formationLabel').textContent = labels[pers] || pers;
  renderFormation();
}

function buildTeamDropdown() {
  document.getElementById('teamsDropdown').innerHTML = Object.entries(TEAMS).map(([abbr, t]) => `
    <div class="team-opt ${abbr === currentTeam ? 'selected' : ''}" onclick="selectTeam('${abbr}')">
      <div style="width:28px;height:28px;border-radius:50%;background:${t.colors[0]};border:2px solid ${t.colors[1]};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:9px;color:#fff">${abbr}</div>
      ${t.name.split(' ').pop()}
    </div>
  `).join('');
}

function toggleTeamDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) buildTeamDropdown();
}

function selectTeam(abbr) {
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  loadTeam(abbr);
}

document.addEventListener('click', e => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
});

loadTeam('BUF');
</script>
</body>
</html>
