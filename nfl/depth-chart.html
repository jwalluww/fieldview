<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — Player Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1b23;
  --surface: #1e2028;
  --surface2: #23252f;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #c8cad4;
  --text-muted: #7d87a8;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

#th-stat1, #th-stat2, #th-stat3, #th-stat4, #th-stat5, #th-stat6, #th-stat7,
#th-stat8, #th-stat9, #th-stat10, #th-stat11, #th-stat12, #th-stat13,
#th-stat14, #th-stat15, #th-stat16, #th-stat17 {
  text-align: center;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  flex-shrink: 0;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); flex-shrink: 0; }

.page-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 1px;
  color: var(--text-muted);
}

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── FILTER BAR ── */
.filter-bar {
  background: #0d1118;
  border-bottom: 2px solid var(--border2);
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  position: sticky;
  top: 94px;
  z-index: 190;
}

.filter-search {
  position: relative;
  flex: 0 0 220px;
}

.filter-search input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 7px 12px 7px 32px;
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.filter-search input::placeholder { color: var(--text-dim); }
.filter-search input:focus { border-color: var(--accent); }

.filter-search svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
}

/* Multi-select dropdown (team / position filters) */
.multiselect {
  position: relative;
}

.multiselect-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 7px 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: .5px;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color .2s;
}
.multiselect-trigger:hover { color: var(--text); }
.multiselect-trigger .chevron { flex-shrink: 0; opacity: .6; }
.multiselect.open .multiselect-trigger { border-color: var(--accent); color: var(--text); }

.multiselect-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 240px;
  max-height: 360px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  box-shadow: 0 12px 24px rgba(0,0,0,.4);
  z-index: 300;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.multiselect-actions {
  display: flex;
  gap: 6px;
  padding: 8px;
  border-bottom: 1px solid var(--border2);
  flex-shrink: 0;
}

.multiselect-group-btn {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 5px 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: .5px;
  color: var(--text-muted);
  cursor: pointer;
  text-transform: uppercase;
  transition: all .15s;
}
.multiselect-group-btn:hover { color: var(--accent); border-color: var(--accent); }
.multiselect-group-btn.active { background: var(--accent); border-color: var(--accent); color: #0d0e13; }

/* ── COLUMN PICKER ── */
.col-picker {
  background: #0d1118;
  border-bottom: 1px solid var(--border2);
  padding: 8px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px 16px;
}
.col-picker-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .5px;
  color: var(--text-muted);
  cursor: pointer;
  text-transform: uppercase;
  user-select: none;
}
.col-picker-item:hover { color: var(--text); }
.col-picker-item input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

.multiselect-list {
  overflow-y: auto;
  padding: 4px;
}

.multiselect-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  user-select: none;
}
.multiselect-item:hover { background: var(--border); }
.multiselect-item input[type="checkbox"] { flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }

.filter-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 6px 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .5px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
}
.filter-chip:hover { border-color: var(--border); color: var(--text); }
.filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.06); }

.filter-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.row-count {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: .5px;
  white-space: nowrap;
}

.clear-btn {
  background: none;
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 6px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .5px;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
}
.clear-btn:hover { color: var(--text); border-color: var(--border); }

/* ── TABLE ── */
.table-wrap {
  padding: 0 24px 32px;
  overflow-x: auto;
}

.table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  min-width: 900px;
}

/* Column headers */
.table thead th {
  background: var(--surface);
  border-bottom: 2px solid var(--border2);
  padding: 12px 16px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: left;
  cursor: pointer;
  white-space: nowrap;
  z-index: 100;
  user-select: none;
  transition: color .15s;
}
.table thead th:hover { color: var(--text); }
.table thead th.sorted { color: var(--accent); }
.table thead th .sort-icon { 
  margin-left: 4px; 
  opacity: 0.5;
  pointer-events: none;
}
.table thead th.sorted .sort-icon { opacity: 1; }

/* Rows */
/* Add/replace in your <style> */
.table tbody td {
  padding: 7px 12px;  /* slightly tighter */
  border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: middle;
  /* font-size: 14px; */
  color: var(--text);  /* brighter default */
}

/* Alternating rows like OOTP */
.table tbody tr:nth-child(even) {
  background: rgba(255,255,255,0.025);
}

.table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background .1s;
  cursor: default;
}
.table tbody tr:hover { background: var(--surface2); }

/* Team cell */
.cell-team {
  display: flex;
  align-items: center;
  gap: 8px;
}

.team-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 7px;
  flex-shrink: 0;
  letter-spacing: .5px;
}

.team-logo-cell {
  width: 24px;
  height: 24px;
  object-fit: contain;
  flex-shrink: 0;
}

.cell-team span {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: .5px;
}

/* Player cell */
.cell-player {
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-initials {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 10px;
  flex-shrink: 0;
  color: #fff;
}

.player-name-block { min-width: 0; }

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 17px;
  color: var(--text);
  white-space: nowrap;
}

.player-sub {
  font-size: 10px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 1px;
}

.tag {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-inj { background: rgba(239,68,68,.15); color: var(--red); border: 1px solid rgba(239,68,68,.3); }
.tag-rookie { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }

/* Madden cell */
.cell-madden {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 31px;
  text-align: center;
}

/* Position cell */
.cell-pos {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  text-align: center;
}

/* Standard pos badge */
.std-pos {
  display: inline-block;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 10px;
  letter-spacing: 1px;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text-muted);
  text-transform: uppercase;
}

/* Cap hit */
.cell-cap {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 20px;
  color: var(--gold);
  white-space: nowrap;
}

/* Loading */
.loading {
  text-align: center;
  padding: 80px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.loading-bar {
  width: 200px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  margin: 16px auto 0;
  overflow: hidden;
}

.loading-progress {
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  animation: loadProgress 2s ease-in-out infinite;
}

@keyframes loadProgress {
  0% { width: 0%; margin-left: 0; }
  50% { width: 60%; margin-left: 20%; }
  100% { width: 0%; margin-left: 100%; }
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  letter-spacing: 1px;
  color: var(--text-dim);
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── VIEW TABS ── */
.view-tabs {
  background: #0d1118;
  border-bottom: 2px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  position: sticky;
  top: 52px;
  z-index: 195;
  overflow-x: auto;
}

.view-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  padding: 10px 16px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.view-tab:hover { color: var(--text-muted); }
.view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.view-tab-divider {
  width: 1px;
  height: 16px;
  background: var(--border2);
  align-self: center;
  margin: 0 4px;
  flex-shrink: 0;
}

@media (max-width: 600px) {
  .table-wrap { padding: 0 12px 32px; }
  
  .table { display: none; }
  
  #mobileList { display: block; }

  .filter-bar {
    padding: 8px 12px;
    gap: 8px;
  }
  
  .filter-search { flex: 1 1 100%; }

  .multiselect {
    flex: 1 1 calc(50% - 4px);
  }

  .multiselect-trigger {
    width: 100%;
    justify-content: space-between;
    font-size: 12px;
  }

  .multiselect-panel {
    left: auto;
    right: 0;
    min-width: 200px;
  }

  .header { padding: 0 12px; }
  
  .view-tabs { padding: 0 12px; }
}

</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html'">Field<span>View</span></div>
  <div class="header-divider"></div>
  <div class="page-title">Player Table</div>
  <div class="view-toggle">
    <button class="view-btn" onclick="window.location='nfl-formation-view.html'">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="2" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="2" cy="10" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="10" r="1.5" fill="currentColor" opacity=".6"/></svg>
      Formation
    </button>
    <button class="view-btn active">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="3" rx="1" fill="currentColor"/><rect x="1" y="5" width="10" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="10" height="2" rx="1" fill="currentColor" opacity=".3"/></svg>
      Table
    </button>
  </div>
</header>

<!-- View tabs -->
<div class="view-tabs" id="viewTabs">
  <button class="view-tab active" onclick="setView('overview', this)">Overview</button>
  <button class="view-tab" onclick="setView('financial', this)">Financial</button>
  <button class="view-tab" onclick="setView('madden', this)">Madden Ratings</button>
  <div class="view-tab-divider"></div>
  <button class="view-tab" onclick="setView('passing', this)">Passing</button>
  <button class="view-tab" onclick="setView('rushing', this)">Rushing</button>
  <button class="view-tab" onclick="setView('receiving', this)">Receiving</button>
  <button class="view-tab" onclick="setView('defense', this)">Defense</button>
</div>

<!-- Filter bar -->
<div class="filter-bar">
  <div class="filter-search">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 10l2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Search player..." oninput="applyFilters()">
  </div>

  <div class="multiselect" id="teamMultiselect">
    <button type="button" class="multiselect-trigger" onclick="toggleTeamPanel(event)">
      <span id="teamMultiselectLabel">All Teams</span>
      <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="multiselect-panel" id="teamPanel" style="display:none">
      <div class="multiselect-actions">
        <button type="button" class="multiselect-group-btn" onclick="toggleTeamGroup('AFC')">All AFC</button>
        <button type="button" class="multiselect-group-btn" onclick="toggleTeamGroup('NFC')">All NFC</button>
      </div>
      <div class="multiselect-list" id="teamPanelList"></div>
    </div>
  </div>

  <div class="multiselect" id="posMultiselect">
    <button type="button" class="multiselect-trigger" onclick="togglePosPanel(event)">
      <span id="posMultiselectLabel">All Positions</span>
      <svg class="chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="multiselect-panel" id="posPanel" style="display:none">
      <div class="multiselect-actions">
        <button type="button" class="multiselect-group-btn" id="posGroupOffenseBtn" onclick="togglePosGroup('OFFENSE')">All Offense</button>
        <button type="button" class="multiselect-group-btn" id="posGroupDefenseBtn" onclick="togglePosGroup('DEFENSE')">All Defense</button>
      </div>
      <div class="multiselect-list" id="posPanelList"></div>
    </div>
  </div>

  <div class="filter-right">
    <span class="row-count" id="maddenAsOf"></span>
    <span class="row-count" id="rowCount">Loading...</span>
    <button class="clear-btn" onclick="clearFilters()">Clear</button>
  </div>
</div>

<!-- Column picker (Passing/Rushing/Receiving/Defense only) -->
<div id="colPicker" class="col-picker" style="display:none"></div>

<!-- Table -->
<div class="table-wrap">
  <div id="loadingState" class="loading">
    Loading all 32 teams
    <div class="loading-bar"><div class="loading-progress"></div></div>
  </div>
  <table class="table" id="mainTable" style="display:none">
    <thead>
      <tr>
        <th onclick="sortBy('team')" id="th-team">Team <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('ourlads_pos')" id="th-ourlads_pos">Position <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('pos')" id="th-pos">Group <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('name')" id="th-name">Player <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('age')" id="th-age">Age <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('college')" id="th-college" style="display:none">College <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('draft_year')" id="th-draft_year" style="display:none">Draft Yr <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('years_pro')" id="th-years_pro">NFL Yr <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('madden')" id="th-madden" class="sorted">Madden <span class="sort-icon">↓</span></th>
        <th onclick="sortBy('cap')" id="th-cap">Cap Hit <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('years_remaining')" id="th-years_remaining" style="display:none">Yrs Left <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('cash_total_remaining')" id="th-cash_total_remaining" style="display:none">Cash Remaining <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('cash_guaranteed_remaining')" id="th-cash_guaranteed_remaining" style="display:none">Gtd Remaining <span class="sort-icon">↕</span></th>

};
let checkedStatKeys = new Set();

function checkedCols(viewKey) {
  return STAT_COLS[viewKey].filter(e => checkedStatKeys.has(e.key));
}

function defaultSortColFor(viewKey) {
  const entries = checkedCols(viewKey);
  const idx = entries.findIndex(e => e.key === DEFAULT_SORT_KEY[viewKey]);
  return idx >= 0 ? 'stat' + (idx + 1) : 'madden';
}

function rebuildStatView(viewKey) {
  const entries = checkedCols(viewKey);
  const cols = FIXED_COLS[viewKey].concat(entries.map((e, i) => 'stat' + (i + 1)));
  updateColumns(cols);
  updateStatColumns(viewKey, entries);
}

function renderColPicker(viewKey) {
  document.getElementById('colPicker').innerHTML = STAT_COLS[viewKey].map(e => `
    <label class="col-picker-item">
      <input type="checkbox" ${checkedStatKeys.has(e.key) ? 'checked' : ''} onchange="toggleStatCol('${e.key}','${viewKey}')">
      ${e.label}
    </label>
  `).join('');
}

function toggleStatCol(key, viewKey) {
  // Capture the actual stat KEY the sort currently points to (if any),
  // so a checkbox toggle that shifts slot positions doesn't silently
  // re-point the sort at a different stat.
  let sortKeyBefore = null;
  const m = /^stat(\d+)$/.exec(sortCol);
  if (m) sortKeyBefore = window['_statKey' + m[1]];

  if (checkedStatKeys.has(key)) checkedStatKeys.delete(key); else checkedStatKeys.add(key);
  rebuildStatView(viewKey);

  if (sortKeyBefore) {
    if (!checkedStatKeys.has(sortKeyBefore)) {
      // The column driving the sort was just unchecked -- fall back to
      // this tab's original default sort column.
      sortCol = defaultSortColFor(viewKey);
      sortDir = 'desc';
    } else {
      // Still checked, but may have shifted slots -- re-point sortCol.
      const entries = checkedCols(viewKey);
      const idx = entries.findIndex(e => e.key === sortKeyBefore);
      if (idx >= 0) sortCol = 'stat' + (idx + 1);
    }
  }
  applyFilters();
}

  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));

  // Auto-filter: replace the position selection with this view's position
  // set (e.g. Defense tab selects all of DEFENSE_POS). Views with no
  // `pos` (overview/financial/madden) leave the current selection alone,
  // same as the old posFilter behavior.
  if (view.pos) {
    selectedPositions = new Set(view.pos);
    syncPosCheckboxes();
    updatePosLabel();
    syncPosGroupButtons();

    updateStatColumns(viewKey);

      age: 'th-age', college: 'th-college', draft_year: 'th-draft_year',

      years_remaining: 'th-years_remaining', cash_total_remaining: 'th-cash_total_remaining',
      cash_guaranteed_remaining: 'th-cash_guaranteed_remaining', avg_annual_remaining: 'th-avg_annual_remaining',
  };
  STAT_SLOT_IDS.forEach(id => { colMap[id] = 'th-' + id; });

  allCols.forEach(col => {
    const th = document.getElementById(colMap[col]);
    if (th) th.style.display = cols.includes(col) ? '' : 'none';
  });

  // Store for renderTable to use
  window._activeCols = cols;

async function loadAll() {
  const data = await fetch('data/players_master.json').then(r => r.json());
  try {
    const res = await fetch('data/madden_meta.json');
    const dates = res.ok ? Object.values(await res.json()).filter(Boolean).sort() : [];
    if (dates.length) {
      // Teams the scraper couldn't refresh have no date; say so instead of
      // letting the oldest known date imply every team is that fresh.
      const newest = dates[dates.length - 1];
      const older = TEAM_ABBRS.length - dates.filter(d => d === newest).length;
      const all = dates.length >= TEAM_ABBRS.length;
      document.getElementById('maddenAsOf').textContent = 'Ratings as of ' + dates[0] +
        (all ? '' : ' (' + older + ' team' + (older === 1 ? '' : 's') + ' older)');
    }
  } catch (e) {}

  for (const player of Object.values(data)) {
    const team = TEAMS[player.team] || {};
    allPlayers.push({
      abbr: player.team,
      teamName: player.team_name,
      teamColors: team.colors,
      ourladsPos: player.ourlads_pos,
      depth: player.depth,
      name: player.canonical_name || '',
      age: player.age || null,
      college: player.college || null,
      draft_year: player.draft_year || null,
      years_pro: player.years_pro != null ? player.years_pro : null,
      madden: player.madden || null,
      cap_number: player.cap_number || null,
      cap_raw: parseCap(player.cap_number),
      years_remaining: player.years_remaining != null ? player.years_remaining : null,
      cash_total_remaining: player.cash_total_remaining != null ? player.cash_total_remaining : null,
      cash_guaranteed_remaining: player.cash_guaranteed_remaining != null ? player.cash_guaranteed_remaining : null,
      avg_annual_remaining: player.avg_annual_remaining != null ? player.avg_annual_remaining : null,
      standard_pos: player.standard_pos || '',
      standard_slot: player.ourlads_pos,
      injured: player.injured || false,
      attainment: player.attainment || null,
      stats: player.stats || {},
      epa_per_play: player.epa_per_play != null ? player.epa_per_play : null,
      success_rate: player.success_rate != null ? player.success_rate : null,
      ngs_time_to_throw: player.ngs_time_to_throw != null ? player.ngs_time_to_throw : null,
      cpoe: player.cpoe != null ? player.cpoe : null,
      qbr: player.qbr != null ? player.qbr : null,
      ryoe_per_att: player.ryoe_per_att != null ? player.ryoe_per_att : null,
      yac_per_att: player.yac_per_att != null ? player.yac_per_att : null,
      broken_tackle_rate: player.broken_tackle_rate != null ? player.broken_tackle_rate : null,
      box_rate: player.box_rate != null ? player.box_rate : null,
      target_share: player.target_share != null ? player.target_share : null,
      yac_above_expectation: player.yac_above_expectation != null ? player.yac_above_expectation : null,
      adot: player.adot != null ? player.adot : null,
      air_yards_share: player.air_yards_share != null ? player.air_yards_share : null,
      avg_separation: player.avg_separation != null ? player.avg_separation : null,
      drop_rate: player.drop_rate != null ? player.drop_rate : null,
      broken_tackle_rate_rec: player.broken_tackle_rate_rec != null ? player.broken_tackle_rate_rec : null,
      pressures_per100: player.pressures_per100 != null ? player.pressures_per100 : null,
      sacks_per100: player.sacks_per100 != null ? player.sacks_per100 : null,
      tfl_per100: player.tfl_per100 != null ? player.tfl_per100 : null,
      tkl_per100: player.tkl_per100 != null ? player.tkl_per100 : null,
      missed_tackle_rate: player.missed_tackle_rate != null ? player.missed_tackle_rate : null,
      comp_pct_allowed: player.comp_pct_allowed != null ? player.comp_pct_allowed : null,
      rating_allowed: player.rating_allowed != null ? player.rating_allowed : null,
      yds_per_target_allowed: player.yds_per_target_allowed != null ? player.yds_per_target_allowed : null,
      adot_allowed: player.adot_allowed != null ? player.adot_allowed : null,
      int_pd_per_target: player.int_pd_per_target != null ? player.int_pd_per_target : null,
    });
  }
  loaded++;

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainTable').style.display = 'table';

  applyFilters();
}

function parseCap(capStr) {
  if (!capStr) return 0;
  return parseInt(capStr.replace(/[$,]/g, '')) || 0;
}

function formatMoney(n) {
  if (n == null) return null;
  return '$' + Math.round(n).toLocaleString('en-US');
}

// ══════════════════════════════════════════
// TEAM / POSITION MULTI-SELECT
// ══════════════════════════════════════════
function renderTeamPanel() {
  document.getElementById('teamPanelList').innerHTML = TEAM_ABBRS.map(abbr => `
    <label class="multiselect-item">
      <input type="checkbox" id="team-chk-${abbr}" onchange="toggleTeamItem('${abbr}')">
      ${TEAMS[abbr].name}
    </label>
  `).join('');
}

function renderPosPanel() {
  document.getElementById('posPanelList').innerHTML = ALL_POSITIONS.map(pos => `
    <label class="multiselect-item">
      <input type="checkbox" id="pos-chk-${pos}" onchange="togglePosItem('${pos}')">
      ${pos}
    </label>
  `).join('');
}

function toggleTeamItem(abbr) {
  if (selectedTeams.has(abbr)) selectedTeams.delete(abbr); else selectedTeams.add(abbr);
  updateTeamLabel();
  applyFilters();
}

function togglePosItem(pos) {
  if (selectedPositions.has(pos)) selectedPositions.delete(pos); else selectedPositions.add(pos);
  updatePosLabel();
  syncPosGroupButtons();
  applyFilters();
}

// "All AFC"/"All NFC"/"All Offense"/"All Defense": select every item in
// the group as if picked one by one, unless they're all already selected
// (in which case it acts as a clear-group toggle).
function toggleTeamGroup(which) {
  const group = which === 'AFC' ? AFC_TEAMS : NFC_TEAMS;
  const allSelected = [...group].every(a => selectedTeams.has(a));
  group.forEach(a => allSelected ? selectedTeams.delete(a) : selectedTeams.add(a));
  syncTeamCheckboxes();
  updateTeamLabel();
  applyFilters();
}

function togglePosGroup(which) {
  const group = which === 'OFFENSE' ? OFFENSE_POS : DEFENSE_POS;
  const allSelected = [...group].every(p => selectedPositions.has(p));
  group.forEach(p => allSelected ? selectedPositions.delete(p) : selectedPositions.add(p));
  syncPosCheckboxes();
  updatePosLabel();
  syncPosGroupButtons();
  applyFilters();
}

// Highlights "All Offense"/"All Defense" when every position in that group
// is currently selected (and only then) -- called anywhere selectedPositions
// changes, not just from the group-toggle buttons themselves.
function syncPosGroupButtons() {
  const offBtn = document.getElementById('posGroupOffenseBtn');
  const defBtn = document.getElementById('posGroupDefenseBtn');
  if (offBtn) offBtn.classList.toggle('active', [...OFFENSE_POS].every(p => selectedPositions.has(p)));
  if (defBtn) defBtn.classList.toggle('active', [...DEFENSE_POS].every(p => selectedPositions.has(p)));
}

function syncTeamCheckboxes() {
  TEAM_ABBRS.forEach(abbr => {
    const el = document.getElementById('team-chk-' + abbr);
    if (el) el.checked = selectedTeams.has(abbr);
  });
}

function syncPosCheckboxes() {
  ALL_POSITIONS.forEach(pos => {
    const el = document.getElementById('pos-chk-' + pos);
    if (el) el.checked = selectedPositions.has(pos);
  });
}

function updateTeamLabel() {
  const el = document.getElementById('teamMultiselectLabel');
  if (selectedTeams.size === 0) el.textContent = 'All Teams';
  else if (selectedTeams.size === 1) el.textContent = TEAMS[[...selectedTeams][0]].name;
  else el.textContent = selectedTeams.size + ' Teams';
}

function updatePosLabel() {
  const el = document.getElementById('posMultiselectLabel');
  if (selectedPositions.size === 0) el.textContent = 'All Positions';
  else if (selectedPositions.size === 1) el.textContent = [...selectedPositions][0];
  else el.textContent = selectedPositions.size + ' Positions';
}

function toggleTeamPanel() {
  const panel = document.getElementById('teamPanel');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'flex' : 'none';
  document.getElementById('teamMultiselect').classList.toggle('open', opening);
}

function togglePosPanel() {
  const panel = document.getElementById('posPanel');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'flex' : 'none';
  document.getElementById('posMultiselect').classList.toggle('open', opening);
}

// Close any open panel when clicking outside its own multiselect --
// clicks on checkboxes/group buttons inside an open panel are contained
// within it, so they don't trigger this.
document.addEventListener('click', (e) => {
  document.querySelectorAll('.multiselect').forEach(ms => {
    if (!ms.contains(e.target)) {
      ms.classList.remove('open');
      const panel = ms.querySelector('.multiselect-panel');
      if (panel) panel.style.display = 'none';
    }
  });
});

// ══════════════════════════════════════════
// FILTERS
// ══════════════════════════════════════════
function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  filteredPlayers = allPlayers.filter(p => {
    if (search && !p.name.toLowerCase().includes(search)) return false;
    if (selectedTeams.size && !selectedTeams.has(p.abbr)) return false;
    if (selectedPositions.size && !selectedPositions.has(p.standard_pos)) return false;
    return true;
  });

  // Apply sort
  sortPlayers();
  renderTable();
  renderMobileList();
  document.getElementById('rowCount').textContent = filteredPlayers.length.toLocaleString() + ' players';
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  selectedTeams = new Set();
  selectedPositions = new Set();
  syncTeamCheckboxes();
  syncPosCheckboxes();
  updateTeamLabel();
  updatePosLabel();
  syncPosGroupButtons();
  applyFilters();
}

// ══════════════════════════════════════════
// SORT
// ══════════════════════════════════════════
function sortBy(col) {
  if (sortCol === col) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortCol = col;
    sortDir = (col === 'madden' || col === 'cap' || col === 'age') ? 'desc' : 'asc';
  }

  document.querySelectorAll('.table thead th').forEach(th => {
    th.classList.remove('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = '↕';
  });

  const th = document.getElementById('th-' + col);
  if (th) {
    th.classList.add('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = sortDir === 'asc' ? '↑' : '↓';
  }

  sortPlayers();
  renderTable();
  renderMobileList();
}

function sortPlayers() {
  filteredPlayers.sort((a, b) => {
    let av, bv;
    switch(sortCol) {
      case 'team':      av = a.abbr;         bv = b.abbr;         break;
      case 'pos':       av = a.standard_pos;  bv = b.standard_pos; break;
      case 'ourlads_pos': av = a.ourladsPos; bv = b.ourladsPos; break;
      case 'name':      av = a.name;          bv = b.name;         break;
      case 'age':       av = a.age;           bv = b.age;          break;
      case 'college':   av = a.college;       bv = b.college;      break;
      case 'draft_year': av = a.draft_year;   bv = b.draft_year;   break;
      case 'years_pro': av = a.years_pro;     bv = b.years_pro;    break;
      case 'madden':    av = a.madden;        bv = b.madden;       break;
      case 'cap':       av = a.cap_raw || null; bv = b.cap_raw || null; break;
      case 'years_remaining':            av = a.years_remaining;            bv = b.years_remaining;            break;
      case 'cash_total_remaining':       av = a.cash_total_remaining;       bv = b.cash_total_remaining;       break;
      case 'cash_guaranteed_remaining':  av = a.cash_guaranteed_remaining;  bv = b.cash_guaranteed_remaining;  break;
      case 'avg_annual_remaining':       av = a.avg_annual_remaining;       bv = b.avg_annual_remaining;       break;
      case 'stat1': av = getStatVal(a, window._statKey1); bv = getStatVal(b, window._statKey1); break;
      case 'stat2': av = getStatVal(a, window._statKey2); bv = getStatVal(b, window._statKey2); break;
      case 'stat3': av = getStatVal(a, window._statKey3); bv = getStatVal(b, window._statKey3); break;
      case 'stat4': av = getStatVal(a, window._statKey4); bv = getStatVal(b, window._statKey4); break;
      case 'stat5': av = getStatVal(a, window._statKey5); bv = getStatVal(b, window._statKey5); break;
      case 'stat6': av = getStatVal(a, window._statKey6); bv = getStatVal(b, window._statKey6); break;
      case 'stat7': av = getStatVal(a, window._statKey7); bv = getStatVal(b, window._statKey7); break;
      case 'stat8': av = getStatVal(a, window._statKey8); bv = getStatVal(b, window._statKey8); break;
      case 'stat9': av = getStatVal(a, window._statKey9); bv = getStatVal(b, window._statKey9); break;
      case 'stat10': av = getStatVal(a, window._statKey10); bv = getStatVal(b, window._statKey10); break;
      case 'stat11': av = getStatVal(a, window._statKey11); bv = getStatVal(b, window._statKey11); break;
      case 'stat12': av = getStatVal(a, window._statKey12); bv = getStatVal(b, window._statKey12); break;
      case 'stat13': av = getStatVal(a, window._statKey13); bv = getStatVal(b, window._statKey13); break;
      case 'stat14': av = getStatVal(a, window._statKey14); bv = getStatVal(b, window._statKey14); break;
      case 'stat15': av = getStatVal(a, window._statKey15); bv = getStatVal(b, window._statKey15); break;
      case 'stat16': av = getStatVal(a, window._statKey16); bv = getStatVal(b, window._statKey16); break;
      case 'stat17': av = getStatVal(a, window._statKey17); bv = getStatVal(b, window._statKey17); break;
      default:          av = a.madden;        bv = b.madden;
    }
    // Nulls always last regardless of sort direction
    const aNull = av == null || av === '';
    const bNull = bv == null || bv === '';
    if (aNull && bNull) return 0;
    if (aNull) return 1;
    if (bNull) return -1;

    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
}

// ══════════════════════════════════════════
// MADDEN COLOR
// ══════════════════════════════════════════
function maddenColor(r) {
  if (!r) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function getStatVal(p, statKey) {
  if (!statKey) return null;
  // Defense-tab stats only exist for defensive positions ('DEF' = generic
  // reserve-list defenders); applies to both display and sort.
  if (currentView === 'defense' && !DEFENSE_POS.has(p.standard_pos) && p.standard_pos !== 'DEF') return null;
  if (p.stats && p.stats[statKey] != null) return p.stats[statKey];
  return p[statKey] != null ? p[statKey] : null;
}

function updateStatColumns(viewKey, entries) {
  // `entries` (an ordered array of {key,label,tooltip} from checkedCols())
  // drives the 4 merged tabs; non-merged tabs (overview/financial/madden)
  // pass none and simply clear every stat slot, same as before.
  const keys = entries || null;

  STAT_SLOT_IDS.forEach((id, i) => {
    const th = document.getElementById('th-' + id);
    if (!th) return;
    if (keys && i < keys.length) {
      const entry = keys[i];
      th.style.display = '';
      th.innerHTML = entry.label + ' <span class="sort-icon">↕</span>';
      th.title = entry.tooltip || '';
      window['_statKey' + (i+1)] = entry.key;
    } else {
      th.style.display = 'none';
      window['_statKey' + (i+1)] = null;
    }
  });
}

// ══════════════════════════════════════════
// RENDER

function renderMobileList() {
  const isMobile = window.innerWidth <= 600;
  const list = document.getElementById('mobileList');
  if (!list) return;
  
  if (!isMobile) { list.style.display = 'none'; return; }
  
  document.getElementById('mainTable').style.display = 'none';
  list.style.display = 'block';

  list.innerHTML = filteredPlayers.map(p => {
    const team = TEAMS[p.abbr];
    const mc = maddenColor(p.madden);
    const initials = p.name.split(' ').map(w => w[0]).join('').slice(0,2);
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="width:32px;height:32px;border-radius:50%;background:${team.colors[0]};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:9px;color:#fff;flex-shrink:0">${p.abbr}</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:1px">${p.ourladsPos} · <span class="std-pos">${p.standard_pos}</span>${p.injured ? ' · <span style="color:var(--red)">INJ</span>' : ''}</div>
        </div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:${mc};flex-shrink:0">${p.madden || '—'}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--gold);flex-shrink:0;text-align:right">${p.cap_number || '—'}</div>
      </div>
    `;
  }).join('');
}
function renderTable() {
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  if (filteredPlayers.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

    const activeEntries = MERGED_TABS.includes(currentView) ? checkedCols(currentView) : [];
    const html = filteredPlayers.map(p => {
    const team = TEAMS[p.abbr];
    const mc = maddenColor(p.madden);
    const initials = p.name.split(' ').map(w => w[0]).join('').slice(0, 2);
    const cols = window._activeCols || ['team','pos','name','age','years_pro','madden','cap'];

    let row = '<tr>';
    if (cols.includes('team'))
      row += '<td><div class="cell-team"><img class="team-logo-cell" src="' + teamLogoUrl(p.abbr) + '" alt="' + p.abbr + '" loading="lazy"><span>' + p.abbr + '</span></div></td>';
    if (cols.includes('ourlads_pos'))
      row += '<td class="cell-pos">' + p.ourladsPos + '</td>';
    if (cols.includes('pos'))
      row += '<td style="text-align:center"><span class="std-pos">' + (p.standard_pos || '—') + '</span></td>';
    if (cols.includes('name'))
      row += '<td><div class="cell-player">' +
        '<div class="player-initials" style="background:' + team.colors[0] + '">' + initials + '</div>' +
        '<div class="player-name-block">' +
          '<div class="player-name">' + p.name + '</div>' +
          '<div class="player-sub">' +
            (p.injured ? '<span class="tag tag-inj">INJ</span>' : '') +
            (p.years_pro === 0 ? '<span class="tag tag-rookie">R</span>' : '') +
            (p.attainment ? '<span>' + p.attainment + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</div></td>';
    if (cols.includes('age'))
      row += '<td style="text-align:center;color:var(--text-muted);font-family:\'Barlow Condensed\',sans-serif;font-weight:600">' + (p.age || '—') + '</td>';
    if (cols.includes('college'))
      row += '<td style="color:var(--text-muted);font-family:\'Barlow Condensed\',sans-serif;font-weight:600">' + (p.college || '—') + '</td>';
    if (cols.includes('draft_year'))
      row += '<td style="text-align:center;color:var(--text-muted);font-family:\'Barlow Condensed\',sans-serif;font-weight:600">' + (p.draft_year || '—') + '</td>';
    if (cols.includes('years_pro'))
      row += '<td style="text-align:center;color:var(--text-muted);font-family:\'Barlow Condensed\',sans-serif;font-weight:600">' + (p.years_pro != null ? p.years_pro : '—') + '</td>';
    if (cols.includes('madden'))
      row += '<td class="cell-madden" style="color:' + mc + '">' + (p.madden || '—') + '</td>';
    if (cols.includes('cap'))
      row += '<td class="cell-cap">' + (p.cap_number || '—') + '</td>';
    if (cols.includes('years_remaining'))
      row += '<td style="text-align:center;color:var(--text-muted);font-family:\'Barlow Condensed\',sans-serif;font-weight:600">' + (p.years_remaining != null ? p.years_remaining : '—') + '</td>';
    if (cols.includes('cash_total_remaining'))
      row += '<td style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;color:var(--text)">' + (formatMoney(p.cash_total_remaining) || '—') + '</td>';
    if (cols.includes('cash_guaranteed_remaining'))
      row += '<td style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;color:var(--text)">' + (formatMoney(p.cash_guaranteed_remaining) || '—') + '</td>';
    if (cols.includes('avg_annual_remaining'))
      row += '<td style="font-family:\'Barlow Condensed\',sans-serif;font-weight:700;color:var(--gold)">' + (formatMoney(p.avg_annual_remaining) || '—') + '</td>';
      STAT_SLOT_IDS.forEach((col, i) => {
        const key = window['_statKey' + (i+1)];
        if (cols.includes(col) && key) {
          const val = getStatVal(p, key);
          const colDef = activeEntries[i];
          const decimals = colDef ? colDef.decimals : null;
          const display = (val != null && decimals != null) ? Number(val).toFixed(decimals) : val;
          row += '<td style="text-align:center;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:16px;color:var(--text)">' + (display != null ? display : '<span style="color:var(--text-muted)">—</span>') + '</td>';
        }
      });
    row += '</tr>';
    return row;
  }).join('');

  tbody.innerHTML = html;
}

function updateStickyOffset() {
