<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 28px; height: 28px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.ctrl-group {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.ctrl-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  white-space: nowrap;
}
.ctrl-btn:hover { color: var(--text); background: var(--border); }
.ctrl-btn.active { background: var(--accent); color: #000; }
.reset-btn { border: 1px solid var(--border2); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── TEAM DROPDOWN ── */
.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 8px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  width: 320px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

/* ── FIELD ── */
.field-outer {
  padding: 16px 24px 8px;
  min-height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
}

.formation-bar {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
.formation-bar > .formation-label { padding-bottom: 12px; }

.formation-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.field-canvas {
  position: relative;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  flex: 1;
  min-height: 0; /* flex items default to min-height:auto, which floors this
                    at .players-layer's content height (1000px fallback) --
                    the actual scroll bug, not card size. */
  border-radius: 4px;
}

.field-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  border-radius: 4px;
  overflow: hidden;
}

.players-layer {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 1000px; /* fallback, overridden by JS */
}

/* ── PLAYER CARD ── */
.player-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  z-index: 20;
  gap: 0;
}
.player-node:hover { z-index: 100; }

.p-card {
  width: 96px;
  border-radius: 8px 8px 0 0;
  padding: 6px 9px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-bottom: none;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  position: relative;
}
.player-node:hover .p-card {
  transform: scale(1.06);
  border-color: rgba(255,255,255,0.4);
}

.p-badge-inj {
  position: absolute;
  top: -6px;
  right: -6px;
  background: rgba(239,68,68,.9);
  color: #fff;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 800;
  padding: 1px 4px;
  letter-spacing: .5px;
  z-index: 5;
}

.p-jersey {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 11px;
  color: rgba(255,255,255,0.65);
  line-height: 1;
  align-self: flex-start;
}

.p-lastname {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 500;
  font-size: 16px;
  color: #fff;
  line-height: 1.1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 84px;
}

.p-madden {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 26px;
  line-height: 1;
  text-align: center;
}

.p-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  letter-spacing: .5px;
  line-height: 1;
}

.p-pos-bar {
  width: 96px;
  background: #000;
  border-radius: 0 0 6px 6px;
  padding: 4px 0;
  text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-top: none;
}

/* ── LIGHT HOVER TOOLTIP ── */
.hover-card {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  width: max-content;
  max-width: 220px;
  padding: 7px 11px;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s, transform .15s;
  /* --hx: horizontal viewport-edge correction, nudged in by JS (positionHoverCard) */
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(6px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  z-index: 500;
  font-size: 12px;
}
.player-node:hover .hover-card {
  opacity: 1;
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(0);
}
.player-node.flip-card .hover-card {
  bottom: auto;
  top: calc(100% + 12px);
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(-6px);
}
.player-node.flip-card:hover .hover-card {
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(0);
}
.hc-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: var(--text);
  line-height: 1.1;
  white-space: nowrap;
}
.hc-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 3px;
  color: var(--text-muted);
  white-space: nowrap;
}
.hc-madden { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; }
.hc-inj { color: #ef4444; font-weight: 800; font-size: 11px; letter-spacing: .5px; }

/* ── SELECTED CARD (sidebar open for this player) ── */
.player-node.selected { z-index: 90; }
.player-node.selected .p-card,
.player-node.selected .p-pos-bar {
  box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(0,212,255,.55);
}

/* ── PLAYER SIDEBAR ── */
.sidebar {
  position: fixed;
  top: 52px;
  right: 0;
  bottom: 0;
  width: 360px;
  background: #14171f;
  border-left: 1px solid var(--border2);
  box-shadow: -12px 0 40px rgba(0,0,0,0.6);
  z-index: 700;
  overflow-y: auto;
  font-size: 13px;
  transform: translateX(100%);
  visibility: hidden;
  transition: transform .18s, visibility .18s;
}
.sidebar.open { transform: none; visibility: visible; }
body.sb-open .field-outer { padding-right: 384px; }
/* The field shrinks to make room for the sidebar; on narrower screens the field loses 360px, slim the cards to keep 22 from overlapping. */
@media (max-width: 1500px) {
  body.sb-open .p-card, body.sb-open .p-pos-bar { width: 66px; }
  body.sb-open .p-card { padding: 4px 4px 4px; }
  body.sb-open .p-pos-bar { font-size: 11px; padding: 3px 0; }
  body.sb-open .p-lastname { max-width: 58px; font-size: 13px; }
  body.sb-open .p-madden { font-size: 22px; }
  body.sb-open .p-jersey { font-size: 10px; }
  body.sb-open .p-rank { display: none; }
  body.sb-open .formation-bar { flex-wrap: wrap; row-gap: 0; }
  body.sb-open .formation-bar > .formation-label { white-space: nowrap; }
}

.sb-close {
  position: absolute;
  top: 8px; right: 10px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 22px; line-height: 1;
  cursor: pointer;
}
.sb-close:hover { color: var(--text); }
.sb-head { padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.sb-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: var(--text); line-height: 1.1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sb-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.sb-contract { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--gold); margin-top: 4px; }
.sb-madden { text-align: center; flex-shrink: 0; }
.sb-madden-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; line-height: 1; }
.sb-madden-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-pill { border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
.sb-pill.inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); }
.sb-pill.rookie { background: rgba(34,197,94,.1); color: #22c55e; border: 1px solid rgba(34,197,94,.3); }
.sb-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sb-section-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.sb-stat { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-section-title + .sb-stat { border-top: none; }
.sb-stat-top { display: flex; justify-content: space-between; align-items: baseline; }
.sb-stat-label { font-size: 12px; color: var(--text); }
.sb-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; color: var(--text); }
.sb-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.sb-bar-fill { height: 100%; border-radius: 3px; }
.sb-low { font-size: 10px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
.sb-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-def { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-caption { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.sb-cell-label { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); }
.sb-cell-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.2; }
.sb-tbl { display: grid; grid-template-columns: 1fr 80px 80px; align-items: center; }
.sb-tbl > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl > div:nth-child(-n+3) { border-top: none; }
.sb-tbl-h { text-align: right; font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-tbl-l { font-size: 12px; color: var(--text-muted); }
.sb-tbl-v { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); }
.sb-tbl-v.best { font-weight: 800; color: #22c55e; }
.sb-sub { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; cursor: pointer; border-radius: 6px; }
.sb-sub:hover { background: var(--border); }
.sb-sub-madden { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; width: 32px; text-align: center; flex-shrink: 0; }
.sb-sub-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-sub-pos { font-size: 11px; color: var(--text-muted); }
.sb-empty { font-size: 12px; color: var(--text-dim); }
.sb-cmp-actions { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.sb-btn { flex: 1; padding: 8px 0; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.sb-btn:hover { background: var(--border); }
.sb-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.sb-btn.primary:hover { filter: brightness(1.1); }
.sb-cmp-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); }
.sb-cmp-tagline { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-cmp-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.1; }
.sb-cmp-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-cmp-madden { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; line-height: 1; margin-top: 4px; }
.sb-cmp-row { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-cmp-row:first-of-type { border-top: none; }
.sb-cmp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.sb-delta { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; color: var(--text-muted); }
.sb-cmp-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-cmp-tag { width: 62px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-cmp-val { width: 46px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; color: var(--text); }
.sb-cmp-pct { width: 52px; text-align: right; font-size: 11px; font-weight: 700; }

/* ── LEGEND ── */
.legend-strip {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 14px;
  color: var(--text-muted);
  letter-spacing: .5px;
  padding: 0 0 12px;
  white-space: nowrap;
}

.ls-item { display: flex; align-items: center; gap: 6px; }

.ls-dot {
  width: 12px; height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

@keyframes nodeIn {
  from { opacity: 0; transform: translate(-50%, calc(-50% - 10px)); }
  to   { opacity: 1; transform: translate(-50%, -50%); }
}
.player-node { animation: nodeIn .35s cubic-bezier(.34,1.56,.64,1) both; }

@media (max-width: 600px) {
  .sidebar { width: 100%; }
  body.sb-open .field-outer { padding-right: 24px; }
  .p-card {
    width: 72px;
    padding: 4px 6px 4px;
  }
  .p-pos-bar {
    width: 72px;
    font-size: 11px;
    padding: 3px 0;
  }
  .p-lastname {
    font-size: 13px;
    max-width: 64px;
  }
  .p-madden {
    font-size: 20px;
  }
  .p-jersey {
    font-size: 10px;
  }
  .p-rank {
    font-size: 11px;
  }
  /* Hide rank on very small screens to save space */
  .p-rank { display: none; }
  
  /* Header tighter on mobile */
  .header {
    padding: 0 12px;
    gap: 10px;
    flex-wrap: wrap;
    height: auto;
    min-height: 52px;
    padding-top: 6px;
    padding-bottom: 6px;
  }
}

</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html'" style="cursor:pointer">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">
      <img class="team-logo team-logo-header" id="teamLogoEl" alt="BUF">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px" id="teamNameEl">Buffalo Bills</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="color:var(--text-muted);margin-left:4px"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div class="teams-dropdown" id="teamsDropdown"></div>
  </div>

  <div style="display:flex;gap:8px;align-items:center;margin-left:12px">
    <div class="ctrl-group" id="offPersonnelGroup">
      <button class="ctrl-btn active" onclick="setOffPersonnel('11',this)">11 (3 WR)</button>
      <button class="ctrl-btn" onclick="setOffPersonnel('12',this)">12 (2 TE)</button>
    </div>
    <div class="ctrl-group" id="defPersonnelGroup">
      <!-- rebuilt per-team by updateDefPersonnelButtons(), same
           base/nickel key logic the old setUnit('defense', ...) used -->
    </div>
    <button class="ctrl-btn reset-btn" id="resetStartersBtn" onclick="resetStarters()" style="display:none">Reset to starters</button>
  </div>

  <div class="view-toggle">
    <button class="view-btn active">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="2" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="2" cy="10" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="10" r="1.5" fill="currentColor" opacity=".6"/></svg>

function maddenColor(r) {
  if (!r) return '#6b7494';
  if (r >= 95) return '#00ff88';
  if (r >= 90) { const t = (r-90)/5; return `hsl(${140+t*20},100%,55%)`; }
  if (r >= 85) { const t = (r-85)/5; return `hsl(${100+t*40},100%,55%)`; }
  if (r >= 80) { const t = (r-80)/5; return `hsl(${75+t*25},100%,55%)`; }
  if (r >= 75) { const t = (r-75)/5; return `hsl(${55+t*20},100%,55%)`; }
  if (r >= 70) { const t = (r-70)/5; return `hsl(${38+t*17},100%,55%)`; }
  if (r >= 65) { const t = (r-65)/5; return `hsl(${25+t*13},100%,55%)`; }
  return `hsl(${Math.max(0,(r-55)*2)},90%,50%)`;
}

// Percentile color: red at 0, amber at 50, green at 99.
const PCT_RED = [239, 68, 68], PCT_AMBER = [245, 190, 40], PCT_GREEN = [34, 197, 94];
const PCT_NEUTRAL = '#8b93b0'; // style stats (describe role, not quality) use one flat color
function pctColor(pct) {
  const [a, b, t] = pct <= 50 ? [PCT_RED, PCT_AMBER, pct / 50] : [PCT_AMBER, PCT_GREEN, (pct - 50) / 49];
  return 'rgb(' + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',') + ')';
}

// Advanced stats shown in the player sidebar. lower: lower is better (percentile
// inverted). style: describes role/style rather than quality -- neutral bar and descriptive
// text ("<style> N% of <pos plural>") instead of a good/bad color; lower: true means the
// percentile counts players with a LARGER value (e.g. "quicker than").
const fmtN = (d, unit, signed) => v => (signed && v > 0 ? '+' : '') + v.toFixed(d) + (unit || '');
const ADV_STATS = {

  avg_separation:         { label: 'Sep', fmt: fmtN(2), def: 'Yards of space from the nearest defender at the catch.' },

};

// Offense sample-size gate (NFL leaderboard qualifiers, per team game played). The volume must come
// from the same season as the stat: S = advMeta.field_season[field], G = league_max_games[S], and
// players' adv_volume[S] from the pipeline. Gated by position group, not field. Inert when the
// pipeline data isn't there yet (no meta, or players without an adv_volume key).
const GATE_RULES = { QB: ['att', 14], RB: ['car', 6.25], WR: ['tgt', 1.875], TE: ['tgt', 1.875] };
function isLowSample(p, key) {
  const rule = GATE_RULES[p.standard_pos];
  if (!rule || p.adv_volume === undefined) return false; // defenders (gated in the pipeline) / pre-pipeline data
  const S = advMeta.field_season && advMeta.field_season[key];
  const G = S != null && advMeta.league_max_games && advMeta.league_max_games[S];
  if (!G) return false;
  const vol = p.adv_volume && p.adv_volume[S];
  return !vol || vol[rule[0]] == null || vol[rule[0]] < rule[1] * G;
}

// Percentile index: for each standard_pos, the sorted values of every advanced stat
// across ALL loaded players. Built once after data loads. Sample-size filtering is
// whatever the pipeline already nulls out.
let pctIndex = {};
function buildPctIndex() {
  pctIndex = {};
  for (const p of allPlayers) {
    if (!p.standard_pos) continue;
    for (const key in ADV_STATS) {
      const v = p[key];
      if (typeof v !== 'number' || isNaN(v) || isLowSample(p, key)) continue;
      const byKey = pctIndex[p.standard_pos] || (pctIndex[p.standard_pos] = {});
      (byKey[key] || (byKey[key] = [])).push(v);
    }
  }
  for (const pos in pctIndex) for (const key in pctIndex[pos]) pctIndex[pos][key].sort((a, b) => a - b);
}

// % of the same-position population he beats (ties count half), inverted for
// lower-is-better stats. Null when the population is under 10.
function percentileOf(p, key) {
  const arr = pctIndex[p.standard_pos] && pctIndex[p.standard_pos][key];
  const v = p[key];
  if (!arr || arr.length < 10 || typeof v !== 'number' || isLowSample(p, key)) return null;
  const lower = !!ADV_STATS[key].lower;
  let beaten = 0, eq = 0;
  for (const x of arr) {
    if (x === v) eq++;
    else if (lower ? x > v : x < v) beaten++;
  }
  beaten += 0.5 * (eq - 1); // he is one of the "tied" players; exclude himself
  return Math.min(99, Math.round(beaten / (arr.length - 1) * 100));
}

function ordinal(n) {
  const r = n % 100;
  if (r >= 11 && r <= 13) return n + 'th';
  return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
}

const POS_PLURAL = { QB: 'QBs', RB: 'RBs', WR: 'WRs', TE: 'TEs', EDGE: 'edge rushers', DI: 'interior linemen', LB: 'LBs', S: 'safeties', CB: 'CBs' };

// Percentile, bar color and label text for one player's stat (all null when no value / population too small).
function statPct(p, key) {
  const m = ADV_STATS[key];
  const pct = p[key] != null ? percentileOf(p, key) : null;
  if (pct == null) return { pct: null, color: null, text: '' };
  return {
    pct,
    color: m.style ? PCT_NEUTRAL : pctColor(pct),
    text: m.style ? m.style + ' ' + pct + '% of ' + (POS_PLURAL[p.standard_pos] || p.standard_pos) : ordinal(pct) + ' pct',
  };
}

function advStatHtml(p, key) {
  const m = ADV_STATS[key];
  const v = p[key];
  const { pct, color: c, text } = statPct(p, key);
  const low = v != null && isLowSample(p, key);
  return `
    <div class="sb-stat">
      <div class="sb-stat-top"><span class="sb-stat-label">${m.label}${low ? ' <span class="sb-low">low sample</span>' : ''}</span><span class="sb-stat-val">${v != null ? m.fmt(v) : '—'}</span></div>
      ${pct != null ? `<div class="sb-bar-wrap"><div class="sb-bar"><div class="sb-bar-fill" style="width:${pct}%;background:${c}"></div></div><span class="sb-pct" style="color:${c}">${text}</span></div>` : ''}
      <div class="sb-def">${m.def}</div>
    </div>`;
}

function parseCap(capStr) {
  if (!capStr) return 0;
  return parseInt(capStr.replace(/[$,]/g, '')) || 0;
}

function formatMoneyShort(n) {
  if (n == null) return null;
  if (Math.abs(n) >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n);
}

function mapPlayer(player) {
  return {
    id: player.player_id,
    name: player.canonical_name,
    team: player.team,
    base_defense: player.base_defense,
    standard_pos: player.standard_pos,
    standard_slot: player.standard_slot,
    depth: player.depth,
    jersey: player.jersey,
    age: player.age,
    years_pro: player.years_pro,

let maddenMeta = {};
let advMeta = {}; // { field_season, league_max_games } from the pipeline; empty = offense gate inert
async function loadMaddenMeta() {

    const res = await fetch('data/madden_meta.json');
    if (res.ok) maddenMeta = await res.json();
  } catch (e) { maddenMeta = {}; }
}

async function loadAdvMeta() {
  try {
    const res = await fetch('data/advanced_meta.json');
    if (res.ok) advMeta = await res.json();
  } catch (e) { advMeta = {}; }
}

async function loadAllPlayers() {
  await loadMaddenMeta();
  await loadAdvMeta();
  try {
    const res = await fetch('data/players_master.json');

async function loadTeam(abbr) {

  const players = allPlayers.filter(p => p.team === abbr);
  teamData = { base_defense: players[0]?.base_defense || '', players };
  updateHeader();
  updateDefPersonnelButtons();
  renderFormation();

}

function syncURL() {
  const params = new URLSearchParams({
    team: currentTeam,
    off: currentOffPersonnel,
    def: currentDefPersonnel
  });
  const sbPlayer = sidebarPos ? getStarter(sidebarPos) : null;
  if (sbPlayer) params.set('player', sbPlayer.id);

function syncFieldHeight() {
  const fieldBg = document.querySelector('.field-bg');
  const layer = document.getElementById('playersLayer');
  if (!fieldBg || !layer) return;
  const h = fieldBg.getBoundingClientRect().height;
  if (h > 0) layer.style.height = h + 'px';
}

window.addEventListener('resize', syncFieldHeight);

function getStarter(formationPos) {
  if (!teamData) return null;
  // Check if user has subbed someone in
  if (currentStarters[formationPos]) return currentStarters[formationPos];
  // TE2 (12-personnel second tight end) isn't a real standard_slot value —
  // it's the depth-2 player within the TE group. Handle it explicitly so
  // it gets the same sub-candidate pool (standard_pos 'TE') as TE1.
  if (formationPos === 'TE2') {
    const tes = teamData.players
      .filter(p => p.standard_slot === 'TE')
      .sort((a, b) => (a.depth || 99) - (b.depth || 99));
    return tes[1] || null;
  }
  // Default: find the depth-1 player with matching standard_slot
  const starter = teamData.players.find(p => p.depth === 1 && p.standard_slot === formationPos);
  if (starter) return starter;
  // FALLBACK (2026 season) — IND, CLE, and CIN roster only WLB/MLB on
  // OurLads with no dedicated SLB, so the base43 'SAM' slot has no
  // player and the base package fields one short. Backfill from the
  // backup (depth 2) WLB ('WILL'), then backup MLB ('MIKE'), so the
  // slot is never empty. If this stops matching real rosters (e.g. a
  // team adds a SLB group back, or the backup is no longer depth 2),
  // adjust the standard_slot/depth checks below.
  if (formationPos === 'SAM') {
    const backupWill = teamData.players.find(p => p.standard_slot === 'WILL' && p.depth === 2);
    if (backupWill) return backupWill;
    const backupMike = teamData.players.find(p => p.standard_slot === 'MIKE' && p.depth === 2);
    if (backupMike) return backupMike;
  }
  return null;
}

const INJURED_SLOTS = ['IR', 'PUP', 'NFI', 'PUP-R'];

function getSubCandidates(formationPos) {
  if (!teamData) return [];
  // Find the standard_pos for this slot from current starter or coord map
  const current = getStarter(formationPos);
  // S slots always draw from every safety, regardless of who holds the slot
  // or what standard_slot a safety was filed under (e.g. an NB-row safety).
  const targetPos = (formationPos === 'FS' || formationPos === 'SS') ? 'S' : current?.standard_pos;
  if (!targetPos) return [];
  // The nickel slot takes corners or safeties.
  const targetPositions = formationPos === 'NB' ? ['CB', 'S'] : [targetPos];

  // Collect all players with matching standard_pos, sorted by madden desc.
  // Injured-list players ARE eligible sub options (see the on-field INJ
  // badge in buildPlayerNode) -- INJURED_SLOTS is kept in case that's
  // revisited, but nothing currently filters on it here.
  const candidates = teamData.players.filter(p => targetPositions.includes(p.standard_pos));
  candidates.sort((a, b) => (b.madden || 0) - (a.madden || 0));
  // Dedupe by id, and exclude anyone already on the field
  const seen = new Set();
  return candidates.filter(p => {
    if (seen.has(p.id)) return false;
    seen.add(p.id);
    if (currentOnFieldIds.has(p.id)) return false;
    return true;
  });
}

function selectSub(formationPos, playerId, event) {
  if (event) event.stopPropagation();
  compareId = null;
  // Find the player object
  const p = teamData.players.find(p => p.id === playerId);
  if (!p) return;

  currentStarters[formationPos] = p;

  // Recompute currentOnFieldIds and every slot's coords/flip from scratch --
  // cheap (no DOM work), and buildFormationSlots() already encodes all of
  // getStarter()'s override/fallback logic so this stays in lockstep with
  // a full renderFormation() without needing to duplicate it here.
  currentOnFieldIds = new Set();
  const offCoordMap = FORMATION_COORDS.offense[currentOffPersonnel] || FORMATION_COORDS.offense['11'];
  const defCoordMap = FORMATION_COORDS.defense[currentDefPersonnel] || {};
  const slots = [
    ...buildFormationSlots(offCoordMap, currentOffPersonnel),
    ...buildFormationSlots(defCoordMap, currentDefPersonnel),
  ];

  // Rebuild only the substituted slot's node.
  const oldNode = document.querySelector(`#playersLayer .player-node[data-pos="${formationPos}"]`);
  const changedSlot = slots.find(s => s.pos === formationPos);
  if (oldNode && changedSlot) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = buildPlayerNode(changedSlot.starter, changedSlot.pos, changedSlot.coords, 0, changedSlot.flip).trim();
    oldNode.replaceWith(wrapper.firstElementChild);
  }

  // The sidebar follows the incoming player (and moves the highlight to the new card).
  if (sidebarPos === formationPos) renderSidebar();
  updateResetBtn();
}

// Reset button is only shown while there are manual subs on either side.
function updateResetBtn() {
  document.getElementById('resetStartersBtn').style.display = Object.keys(currentStarters).length ? '' : 'none';
}

// Clears manual subs for both offense and defense; personnel choices are untouched.
// renderFormation() refreshes the sidebar, or closes it if its player left the field.
function resetStarters() {
  currentStarters = {};
  compareId = null;
  renderFormation();
}

// Season-stat grid. keys: stats-block spellings to try in order (the block mixes SACK/SACKS,
// QB_HIT/"QB HIT", INT/INTs, PBU/PD across positions); num/den: derived rate; lower: lower is
// better when comparing two players.
const DEF_GRID = [
  { label: 'TKL', keys: ['TKL'] }, { label: 'SACK', keys: ['SACK', 'SACKS'] }, { label: 'TFL', keys: ['TFL'] },
  { label: 'QB Hit', keys: ['QB_HIT', 'QB HIT'] }, { label: 'INT', keys: ['INT', 'INTs'] }, { label: 'PBU', keys: ['PBU', 'PD'] },
];
const REC_GRID = [
  { label: 'TGT', keys: ['TGT'] }, { label: 'REC', keys: ['REC'] }, { label: 'Rec Yds', keys: ['REC_YDS'] },
  { label: 'Y/Rec', num: 'REC_YDS', den: 'REC', dec: 1 }, { label: 'Rec TD', keys: ['REC_TDS'] }, { label: 'YAC', keys: ['YAC'] },
];
const GRID_DEFS = {
  QB: [
    { label: 'CMP', keys: ['CMP'] }, { label: 'ATT', keys: ['ATT'] }, { label: 'Comp%', num: 'CMP', den: 'ATT', mult: 100, dec: 1, unit: '%' },
    { label: 'Pass Yds', keys: ['PASS_YDS'] }, { label: 'YPA', num: 'PASS_YDS', den: 'ATT', dec: 1 }, { label: 'Pass TD', keys: ['PASS_TDS'] },
    { label: 'INT', keys: ['INT', 'INTs'], lower: true }, { label: 'Sacks', keys: ['SACK', 'SACKS'], lower: true }, { label: 'Rush Yds', keys: ['RUSH_YDS'] },
  ],
  RB: [
    { label: 'CAR', keys: ['CAR'] }, { label: 'Rush Yds', keys: ['RUSH_YDS'] }, { label: 'YPC', num: 'RUSH_YDS', den: 'CAR', dec: 1 },
    { label: 'Rush TD', keys: ['RUSH_TDS'] }, { label: 'REC', keys: ['REC'] }, { label: 'Rec Yds', keys: ['REC_YDS'] },
  ],
  WR: REC_GRID, TE: REC_GRID,
  EDGE: DEF_GRID, DI: DEF_GRID, LB: DEF_GRID, CB: DEF_GRID, S: DEF_GRID,
};
const SNAP_DEF = { label: 'Snap%', snap: true };
const gridDefs = pos => (GRID_DEFS[pos] || []).concat([SNAP_DEF]);

// Number for one grid cell, or null when missing (or a derived rate's denominator is 0/missing).
function gridValue(p, d) {
  if (d.snap) return p.snap_pct != null ? p.snap_pct : null;
  const st = p.stats || {};
  if (d.num) {
    const n = st[d.num], den = st[d.den];
    return n != null && den ? n / den * (d.mult || 1) : null;
  }
  for (const k of d.keys) if (st[k] != null) return Number(st[k]);
  return null;
}

function gridFmt(d, v) {
  if (v == null) return '—';
  if (d.snap) return Math.round(v) + '%';
  return d.dec != null ? v.toFixed(d.dec) + (d.unit || '') : String(v);
}

// stats-block season, shown when any non-snap stat has a value
function statsSeasonCaption(p) {
  const has = gridDefs(p.standard_pos).some(d => !d.snap && gridValue(p, d) != null);
  return has && p.stats_season != null ? p.stats_season + ' season' : '';
}

function gridSectionHtml(p) {
  const defs = gridDefs(p.standard_pos);
  const vals = defs.map(d => gridValue(p, d));
  if (!vals.some(v => v != null)) return '';
  const cap = statsSeasonCaption(p);
  return `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
    <div class="sb-grid">${defs.map((d, i) => `<div class="sb-cell"><div class="sb-cell-label">${d.label}</div><div class="sb-cell-val">${gridFmt(d, vals[i])}</div></div>`).join('')}</div>
    ${cap ? `<div class="sb-caption">${cap}</div>` : ''}</div>`;
}

// Starter-vs-substitute stat table; the better value per row is bold green.
function compareTableHtml(a, b, last) {
  const defsA = gridDefs(a.standard_pos);
  const seen = new Set(defsA.map(d => d.label));
  const extra = gridDefs(b.standard_pos).filter(d => !seen.has(d.label) && gridValue(a, d) != null);
  const rows = [...defsA, ...extra].map(d => ({ d, va: gridValue(a, d), vb: gridValue(b, d) })).filter(r => r.va != null || r.vb != null);
  if (!rows.length) return '';
  const cells = rows.map(({ d, va, vb }) => {
    const fa = gridFmt(d, va), fb = gridFmt(d, vb);
    let best = '';
    if (va != null && vb != null && fa !== fb) best = (d.lower ? va < vb : va > vb) ? 'a' : 'b';
    return `<div class="sb-tbl-l">${d.label}</div><div class="sb-tbl-v${best === 'a' ? ' best' : ''}">${fa}</div><div class="sb-tbl-v${best === 'b' ? ' best' : ''}">${fb}</div>`;
  }).join('');
  const ca = statsSeasonCaption(a), cb = statsSeasonCaption(b);
  const cap = ca && cb && a.stats_season === b.stats_season ? ca
    : [ca && last(a) + ' ' + ca, cb && last(b) + ' ' + cb].filter(Boolean).join(' · ');
  return `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
    <div class="sb-tbl"><div></div><div class="sb-tbl-h">${last(a)}</div><div class="sb-tbl-h">${last(b)}</div>${cells}</div>
    ${cap ? `<div class="sb-caption">${cap}</div>` : ''}</div>`;
}

function renderSidebar(resetScroll) {
  const el = document.getElementById('playerSidebar');
  const p = sidebarPos ? getStarter(sidebarPos) : null;
  if (!p) { closeSidebar(); return; }
  if (compareId) { renderCompare(el, p); return; }
  const team = TEAMS[currentTeam];
  const mc = maddenColor(p.madden);
  const cfg = SIDEBAR_CARD[p.standard_pos];
  const injText = [p.injury_status, p.injury_detail].filter(Boolean).join(' — ');

  const meta1 = [p.standard_pos + (sidebarPos !== p.standard_pos ? ' · ' + sidebarPos : ''), team.name].join(' · ');
  const meta2 = [p.age ? 'Age ' + p.age : null, p.years_pro != null ? 'Yr ' + p.years_pro + ' NFL' : null, p.height || null, p.weight ? p.weight + ' lbs' : null, p.college || null, p.draft_year ? 'Drafted ' + p.draft_year : null].filter(Boolean).join(' · ');
  const contract = p.years_remaining != null && p.avg_annual_remaining != null
    ? p.years_remaining + ' yrs remaining · ' + formatMoneyShort(p.avg_annual_remaining) + '/yr avg'
    : (p.cap_raw ? formatMoneyShort(p.cap_raw) + ' cap hit' : '');

  // Advanced section: skipped entirely when the player has no advanced values.
  let listHtml = '';
  if (cfg && cfg.list.some(k => p[k] != null)) {
    listHtml = `<div class="sb-section"><div class="sb-section-title">Advanced Stats</div>${cfg.list.map(k => advStatHtml(p, k)).join('')}
      ${cfg.compact && p.def_advanced_season ? `<div class="sb-caption">Advanced: ${p.def_advanced_season}</div>` : ''}</div>`;
  }
  const subs = getSubCandidates(sidebarPos);
  const subsHtml = subs.length ? subs.map(c => `
      <div class="sb-sub" onclick="openCompare('${c.id}', event)">
        <div class="sb-sub-madden" style="color:${maddenColor(c.madden)}">${c.madden || '—'}</div>
        <div class="sb-sub-name">${c.name}</div>
        <div class="sb-sub-pos">${c.standard_pos}${c.injured ? ' · <span style="color:#ef4444">INJ</span>' : ''}</div>
      </div>`).join('') : '<div class="sb-empty">No other players available at this position.</div>';

  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-head">
      <div style="flex:1;min-width:0">
        <div class="sb-name"><span>${p.jersey ? '#' + p.jersey + ' ' : ''}${p.name}</span>
          ${p.injured ? `<span class="sb-pill inj">INJ</span>` : ''}
          ${p.years_pro === 0 ? `<span class="sb-pill rookie">R</span>` : ''}
        </div>
        <div class="sb-meta">${meta1}</div>
        ${meta2 ? `<div class="sb-meta">${meta2}</div>` : ''}
        ${p.injured && injText ? `<div class="sb-meta" style="color:#ef4444">${injText}</div>` : ''}
        ${contract ? `<div class="sb-contract">${contract}</div>` : ''}
      </div>
      <div class="sb-madden"><div class="sb-madden-val" style="color:${mc}">${p.madden || '—'}</div><div class="sb-madden-label">Madden</div></div>
    </div>
    ${listHtml}
    ${gridSectionHtml(p)}
    <div class="sb-section" style="border-bottom:none">
      <div class="sb-section-title">Substitutes</div>
      ${subsHtml}
    </div>`;
  el.classList.add('open');
  document.body.classList.add('sb-open');
  if (resetScroll) el.scrollTop = 0;
  setSelectedHighlight();
  syncFieldHeight();
  syncURL();
}

function openCompare(id, event) {
  if (event) event.stopPropagation();
  compareId = id;
  renderSidebar(true);
}

function closeCompare(event) {
  if (event) event.stopPropagation();
  compareId = null;
  renderSidebar(true);
}

function swapFromCompare(event) {
  const id = compareId;
  selectSub(sidebarPos, id, event); // clears compareId and re-renders the sidebar for the new starter
}

// Starter vs. candidate. Only stats both positions carry are compared; each player's
// percentile stays within his own standard_pos.
function renderCompare(el, a) {
  const b = teamData.players.find(x => x.id === compareId);
  if (!b) { compareId = null; renderSidebar(); return; }
  const cfgA = SIDEBAR_CARD[a.standard_pos], cfgB = SIDEBAR_CARD[b.standard_pos];
  const keysB = cfgB ? cfgB.list : [];
  const keys = cfgA ? cfgA.list.filter(k => keysB.includes(k) && (a[k] != null || b[k] != null)) : [];
  const last = pl => { const w = pl.name.split(' '); return w.length > 1 ? w.slice(1).join(' ') : w[0]; };

  const line = (pl, key) => {
    const m = ADV_STATS[key];
    const { pct, color } = statPct(pl, key);
    return `<div class="sb-cmp-line"><span class="sb-cmp-tag">${last(pl)}</span>
      <div class="sb-bar">${pct != null ? `<div class="sb-bar-fill" style="width:${pct}%;background:${color}"></div>` : ''}</div>
      <span class="sb-cmp-val">${pl[key] != null ? m.fmt(pl[key]) : '—'}</span>
      <span class="sb-cmp-pct" style="color:${color || 'inherit'}">${pct != null ? ordinal(pct) : (pl[key] != null && isLowSample(pl, key) ? '<span class="sb-low" style="margin:0">low sample</span>' : '')}</span></div>`;
  };
  const rows = keys.map(key => {
    const m = ADV_STATS[key];
    const pa = statPct(a, key).pct, pb = statPct(b, key).pct;
    let delta = '';
    const hasPct = pa != null && pb != null, hasRaw = a[key] != null && b[key] != null;
    if (hasPct || hasRaw) {
      const d = hasPct ? pb - pa : 0;
      // Percentiles are already inverted for lower-is-better stats, so a positive delta is always "candidate better".
      const c = m.style || !hasPct || d === 0 ? 'var(--text-muted)' : (d > 0 ? '#22c55e' : '#ef4444');
      let raw = '';
      if (hasRaw) { const t = m.fmt(b[key] - a[key]); raw = (t[0] === '-' || t[0] === '+' ? '' : '+') + t; }
      const pct = hasPct ? (d > 0 ? '+' : '') + d + ' pct' : '';
      delta = `<span class="sb-delta" style="color:${c}">${hasRaw && hasPct ? raw + '  (' + pct + ')' : raw || pct}</span>`;
    }
    return `<div class="sb-cmp-row"><div class="sb-cmp-top"><span class="sb-stat-label">${m.label}</span>${delta}</div>${line(a, key)}${line(b, key)}</div>`;
  }).join('');

  const head = (pl, tag) => `<div>
      <div class="sb-cmp-tagline">${tag}</div>
      <div class="sb-cmp-name">${pl.jersey ? '#' + pl.jersey + ' ' : ''}${pl.name}</div>
      <div class="sb-cmp-sub">${pl.standard_pos}${pl.age ? ' · Age ' + pl.age : ''}</div>
      <div class="sb-cmp-madden" style="color:${maddenColor(pl.madden)}">${pl.madden || '—'}</div>
    </div>`;

  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-cmp-head">${head(a, 'Starter')}${head(b, 'Substitute')}</div>
    <div class="sb-cmp-actions">
      <button class="sb-btn" onclick="closeCompare(event)">Back</button>
      <button class="sb-btn primary" onclick="swapFromCompare(event)">Swap in</button>
    </div>
    ${compareTableHtml(a, b, last)}
    ${rows ? `<div class="sb-section"><div class="sb-section-title">Advanced Stats · percentile vs. own position</div>${rows}
      ${a.standard_pos !== b.standard_pos ? `<div class="sb-caption">Different positions: only shared stats are compared, each ranked within his own position.</div>` : ''}</div>` : ''}
    `;
  el.classList.add('open');
  document.body.classList.add('sb-open');
  el.scrollTop = 0;
  setSelectedHighlight();
  syncFieldHeight();
  syncURL();
}

function positionHoverCard(node) {
  const card = node.querySelector('.hover-card');
  if (!card) return;
  const margin = 8;

  // Reset any previous correction before measuring fresh geometry.
  card.style.setProperty('--hx', '0px');

  // Vertical: flip above/below if the current side would run off-screen.
  const showingBelow = node.classList.contains('flip-card');
  const vRect = card.getBoundingClientRect();
  if (showingBelow && vRect.bottom > window.innerHeight - margin) {
    node.classList.remove('flip-card');
  } else if (!showingBelow && vRect.top < margin) {
    node.classList.add('flip-card');
  }

  // Horizontal: nudge left/right so the card stays within the viewport.
  const hRect = card.getBoundingClientRect(); // re-measure — the flip above may have changed layout
  let hx = 0;
  if (hRect.right > window.innerWidth - margin) {
    hx = (window.innerWidth - margin) - hRect.right;
  } else if (hRect.left < margin) {
    hx = margin - hRect.left;
  }
  card.style.setProperty('--hx', hx + 'px');
}

// Light hover tooltip: name, position, Madden, INJ designation. Everything else lives in the sidebar.
function buildHoverCard(p, pos) {
  const mc = maddenColor(p.madden);
  return `
    <div class="hover-card">
      <div class="hc-name">${p.name}</div>
      <div class="hc-meta">
        <span>${p.standard_pos || pos}${pos !== p.standard_pos ? ' · ' + pos : ''}</span>
        <span class="hc-madden" style="color:${mc}">${p.madden || '—'}</span>
        ${p.injured ? `<span class="hc-inj">INJ${p.injury_status ? ' · ' + p.injury_status : ''}</span>` : ''}
      </div>
    </div>
  `;
}

function buildPlayerNode(p, pos, coords, delay, flipCard) {
  if (!p) return '';
  const team = TEAMS[currentTeam];
  const mc = maddenColor(p.madden);
  const parts = p.name.split(' ');
  const lastName = parts.length > 1 ? parts.slice(1).join(' ') : parts[0];

  return `
    <div class="player-node ${flipCard ? 'flip-card' : ''}" data-pos="${pos}"
         style="left:${coords.x}%;top:${coords.y}%;animation-delay:${delay}ms"
         onclick="openSidebar('${pos}', event)"
         onmouseenter="positionHoverCard(this)">
      <div class="p-card" style="background:${team.colors[0]}">
        ${p.injured ? `<div class="p-badge-inj" title="${[p.injury_detail, p.injury_status].filter(Boolean).join(' — ')}">INJ</div>` : ''}
        <div class="p-jersey">${p.jersey ? '#'+p.jersey : ' '}</div>
        <div class="p-lastname">${lastName}</div>
        <div class="p-madden" style="color:${mc}">${p.madden || '—'}</div>
        ${p.madden_rank ? `<div class="p-rank">${p.madden_rank} / ${p.madden_rank_total} ${p.madden_pos_label || ''}</div>` : ''}
      </div>
      <div class="p-pos-bar">${pos}</div>
      ${buildHoverCard(p, pos)}
    </div>
  `;
}

// Maps OurLads position codes to formation slot keys
const POS_ALIAS = {
  // Offensive line
  'OT': 'LT', 'LOT': 'LT', 'ROT': 'RT',
  // Receivers
  'WR': 'LWR', 'FL': 'SWR', 'SE': 'RWR',
  // Tight end
  'TE': 'TE',
  // Backfield
  'HB': 'RB', 'TB': 'RB',
  // Defensive line — Detroit style
  'LDE': 'DE', 'RDE': 'DE',
  'LDT': 'DT', 'RDT': 'DT',
  // Linebackers — Detroit style
  'SLB': 'ROLB',
  // Defensive line — 4-3
  'DLE': 'DE', 'DRE': 'DE',
  'DLT': 'DT', 'DRT': 'DT',
  // Defensive line — 3-4
  'LE': 'DE', 'RE': 'DE',
  'NT': 'NT',
  // Edge rushers (Bears style)
  'LEDG': 'DE', 'REDG': 'DE',
  // Linebackers — 4-3
  'WILL': 'LOLB', 'SAM': 'ROLB', 'MIKE': 'MLB',
  // Linebackers — 3-4
  'LILB': 'WLB', 'RILB': 'MLB',
  'RUSH': 'ROLB',
  // Corners
  'LCB': 'LCB', 'RCB': 'RCB', 'CB': 'LCB',
  // Safeties
  'SS': 'SS', 'FS': 'FS', 'S': 'SS',
  // Nickel
  'NB': 'NB', 'SCB': 'NB',
};

function resolvePos(ourladsPos) {
  return POS_ALIAS[ourladsPos] || ourladsPos;
}

function buildFormationSlots(coordMap, personnel) {
  const slots = [];
  for (const [pos, coords] of Object.entries(coordMap)) {
    if (pos === 'TE' && personnel === '12') {
      const te1 = getStarter('TE');
      const te2 = getStarter('TE2');
      if (te1) currentOnFieldIds.add(te1.id);
      if (te2) currentOnFieldIds.add(te2.id);
      slots.push({ pos: 'TE', coords, starter: te1, flip: false });
      slots.push({ pos: 'TE2', coords: TE2_COORD, starter: te2, flip: false });
      continue;
    }
    const starter = getStarter(pos);
    if (starter) currentOnFieldIds.add(starter.id);
    const forceFlip = ['QB', 'RB', 'FB', 'HB'].includes(pos);
    slots.push({ pos, coords, starter, flip: forceFlip || coords.y > 72 });
  }
  return slots;
}

function renderFormation() {
  const layer = document.getElementById('playersLayer');
  if (!teamData) { layer.innerHTML = ''; return; }

  const offCoordMap = FORMATION_COORDS.offense[currentOffPersonnel] || FORMATION_COORDS.offense['11'];
  const defCoordMap = FORMATION_COORDS.defense[currentDefPersonnel] || {};

  currentOnFieldIds = new Set();
  const slots = [
    ...buildFormationSlots(offCoordMap, currentOffPersonnel),
    ...buildFormationSlots(defCoordMap, currentDefPersonnel),
  ];

  let html = '';
  let delay = 0;
  for (const slot of slots) {
    html += buildPlayerNode(slot.starter, slot.pos, slot.coords, delay, slot.flip);
    delay += 40;
  }

  layer.innerHTML = html;

  // Keep the sidebar in step with the field: refresh it if its slot still exists
  // (the on-field set changed, so its substitute list may have), else close it.
  if (sidebarPos) {
    if (layer.querySelector(`.player-node[data-pos="${sidebarPos}"]`)) renderSidebar();
    else closeSidebar();
  }
  updateResetBtn();
}

function setOffPersonnel(pers, btn) {
  currentOffPersonnel = pers;
  document.querySelectorAll('#offPersonnelGroup .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = {
    '11': '11 Personnel · Shotgun Spread',
    '12': '12 Personnel · 2 TE Set',
  };
  document.getElementById('offFormationLabel').textContent = labels[pers] || pers;
  renderFormation();
  syncURL();
}

function setDefPersonnel(pers, btn) {
  currentDefPersonnel = pers;
  document.querySelectorAll('#defPersonnelGroup .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const isNickel = pers.startsWith('nickel');
  document.getElementById('defFormationLabel').textContent =
    isNickel ? 'Nickel Package' : (teamData?.base_defense || 'Base 4-3');
  renderFormation();
  syncURL();
}

// Called once per team load (teams differ on 3-4 vs 4-3 base scheme via
// base_defense) -- replaces the key-computation that used to live
// inside setUnit('defense', ...), since there's no more unit toggle to
// trigger it from.
function updateDefPersonnelButtons() {
  const baseScheme = teamData?.base_defense || 'Base 4-3';
  const isThreeFour = baseScheme.includes('3-4');
  const baseKey    = isThreeFour ? 'base34'   : 'base43';
  const nickelKey  = isThreeFour ? 'nickel34' : 'nickel';
  const baseLabel  = isThreeFour ? '3-4 Base' : '4-3 Base';
  document.getElementById('defPersonnelGroup').innerHTML = `
    <button class="ctrl-btn active" onclick="setDefPersonnel('${baseKey}',this)">${baseLabel}</button>
    <button class="ctrl-btn" onclick="setDefPersonnel('${nickelKey}',this)">Nickel</button>
  `;
  currentDefPersonnel = baseKey;
  document.getElementById('defFormationLabel').textContent = baseScheme;
}

function buildTeamDropdown() {
  document.getElementById('teamsDropdown').innerHTML = Object.entries(TEAMS).map(([abbr, t]) => `
    <div class="team-opt ${abbr === currentTeam ? 'selected' : ''}" onclick="selectTeam('${abbr}')">
      <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
      ${t.name.split(' ').pop()}
    </div>
  `).join('');
}

function toggleTeamDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) buildTeamDropdown();
}

async function selectTeam(abbr) {
  closeSidebar();
  currentTeam = abbr;
  currentStarters = {};
  localStorage.setItem('fieldview_team', abbr);
  document.getElementById('teamsDropdown').classList.remove('open');

  // Preserve the *choice* of Nickel on defense across a team switch --
  // updateDefPersonnelButtons() inside loadTeam() already recomputes the
  // correct scheme-specific key (base43/base34/nickel/nickel34) for the
  // new team, so just re-click Nickel by button position if that's what
  // was selected. Offense's 11/12 choice is preserved automatically
  // since currentOffPersonnel isn't touched by a team switch.
  const wasNickel = currentDefPersonnel.startsWith('nickel');

  await loadTeam(abbr);

  if (wasNickel) {
    const persBtns = document.querySelectorAll('#defPersonnelGroup .ctrl-btn');
    if (persBtns[1]) persBtns[1].click();
  }

  syncURL();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  // Click on empty field closes the sidebar.
  if (sidebarPos && e.target.closest('.field-canvas') && !e.target.closest('.player-node')) {
    closeSidebar();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sidebarPos) closeSidebar();
});

const params = new URLSearchParams(window.location.search);
const urlTeam = params.get('team');
const urlOff  = params.get('off');
const urlDef  = params.get('def');
const urlPlayer = params.get('player');

currentTeam = (urlTeam && TEAMS[urlTeam]) ? urlTeam : (localStorage.getItem('fieldview_team') || 'BUF');

loadTeam(currentTeam).then(() => {
  syncFieldHeight();
  if (urlOff) {
    const offBtns = document.querySelectorAll('#offPersonnelGroup .ctrl-btn');
    offBtns.forEach(btn => {
      if (btn.getAttribute('onclick')?.includes(urlOff)) btn.click();
    });
  }
  if (urlDef) {
    const defBtns = document.querySelectorAll('#defPersonnelGroup .ctrl-btn');
    defBtns.forEach(btn => {
      if (btn.getAttribute('onclick')?.includes(urlDef)) btn.click();
    });
  }
  // Reopen the sidebar if ?player= is someone currently on the field for this team; otherwise ignore it.
  if (urlPlayer) {
    const slot = [...document.querySelectorAll('#playersLayer .player-node')].map(n => n.dataset.pos)
      .find(pos => { const st = getStarter(pos); return st && st.id === urlPlayer; });
    if (slot) openSidebar(slot);
  }
});
</script>
