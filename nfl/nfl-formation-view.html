<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 28px; height: 28px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.ctrl-group {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.ctrl-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  white-space: nowrap;
}
.ctrl-btn:hover { color: var(--text); background: var(--border); }
.ctrl-btn.active { background: var(--accent); color: #000; }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── TEAM DROPDOWN ── */
.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 8px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  width: 320px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

/* ── FIELD ── */
.field-outer {
  padding: 16px 24px 8px;
  min-height: calc(100vh - 52px);
  display: flex;
  flex-direction: column;
}

.formation-bar {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
.formation-bar > .formation-label { padding-bottom: 12px; }

.formation-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.field-canvas {
  position: relative;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  flex: 1;
  min-height: 0; /* flex items default to min-height:auto, which floors this
                    at .players-layer's content height (1000px fallback) --
                    the actual scroll bug, not card size. */
  border-radius: 4px;
}

.field-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  border-radius: 4px;
  overflow: hidden;
}

.players-layer {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 1000px; /* fallback, overridden by JS */
}

/* ── PLAYER CARD ── */
.player-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  z-index: 20;
  gap: 0;
}
.player-node:hover { z-index: 100; }

.p-card {
  width: 96px;
  border-radius: 8px 8px 0 0;
  padding: 6px 9px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-bottom: none;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), border-color .2s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  position: relative;
}
.player-node:hover .p-card {
  transform: scale(1.06);
  border-color: rgba(255,255,255,0.4);
}

.p-badge-inj {
  position: absolute;
  top: -6px;
  right: -6px;
  background: rgba(239,68,68,.9);
  color: #fff;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 800;
  padding: 1px 4px;
  letter-spacing: .5px;
  z-index: 5;
}

.p-jersey {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 11px;
  color: rgba(255,255,255,0.65);
  line-height: 1;
  align-self: flex-start;
}

.p-lastname {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 500;
  font-size: 16px;
  color: #fff;
  line-height: 1.1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 84px;
}

.p-madden {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 26px;
  line-height: 1;
  text-align: center;
}

.p-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  letter-spacing: .5px;
  line-height: 1;
}

.p-pos-bar {
  width: 96px;
  background: #000;
  border-radius: 0 0 6px 6px;
  padding: 4px 0;
  text-align: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
  border: 1.5px solid rgba(255,255,255,0.15);
  border-top: none;
}

/* ── HOVER CARD ── */
.hover-card {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  width: 300px;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s, transform .15s;
  /* --hx: horizontal viewport-edge correction, nudged in by JS (positionHoverCard) */
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(6px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.8);
  z-index: 500;
  overflow: hidden;
  font-size: 13px;
}
.player-node:hover .hover-card {
  opacity: 1;
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(0);
  pointer-events: auto;
}
.player-node.flip-card .hover-card {
  bottom: auto;
  top: calc(100% + 12px);
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(-6px);
}
.player-node.flip-card:hover .hover-card {
  transform: translateX(-50%) translateX(var(--hx, 0px)) translateY(0);
}

.card-header {
  padding: 11px 13px 9px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.card-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 13px;
  color: #fff;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.2);
}

.card-nameblock { flex: 1; min-width: 0; }

.card-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--text);
  line-height: 1.1;
}

.card-meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.card-ratings {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-bottom: 1px solid var(--border);
}

.card-rating-cell {
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-right: 1px solid var(--border);
}
.card-rating-cell:last-child { border-right: none; }

.crc-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 24px;
  line-height: 1;
}

.crc-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.card-footer {
  padding: 8px 13px;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* ── HOVER CARD STAT ROWS ── */
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 13px;
  border-top: 1px solid var(--border);
}
.stat-row-label {
  font-size: 11px;
  color: var(--text-muted);
}
.stat-row-val {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: var(--text);
}

/* ── LEGEND ── */
.legend-strip {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 14px;
  color: var(--text-muted);
  letter-spacing: .5px;
  padding: 0 0 12px;
  white-space: nowrap;
}

.ls-item { display: flex; align-items: center; gap: 6px; }

.ls-dot {
  width: 12px; height: 12px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── SUB DROPDOWN ── */
.sub-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 8px;
  z-index: 600;
  box-shadow: 0 12px 40px rgba(0,0,0,0.8);
  overflow: hidden;
  display: none;
}
.sub-dropdown.open { display: block; }
.sub-dropdown-header {
  padding: 7px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
}
.sub-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  transition: background .15s;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.sub-option:last-child { border-bottom: none; }
.sub-option:hover { background: var(--border); }
.sub-option-madden {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 18px;
  line-height: 1;
  width: 32px;
  flex-shrink: 0;
  text-align: center;
}
.sub-option-info { flex: 1; min-width: 0; }
.sub-option-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sub-option-meta {
  font-size: 10px;
  color: var(--text-muted);
}
.sub-option.active-player {
  background: rgba(0,212,255,0.06);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

@keyframes nodeIn {
  from { opacity: 0; transform: translate(-50%, calc(-50% - 10px)); }
  to   { opacity: 1; transform: translate(-50%, -50%); }
}
.player-node { animation: nodeIn .35s cubic-bezier(.34,1.56,.64,1) both; }

@media (max-width: 600px) {
  .p-card {
    width: 72px;
    padding: 4px 6px 4px;
  }
  .p-pos-bar {
    width: 72px;
    font-size: 11px;
    padding: 3px 0;
  }
  .p-lastname {
    font-size: 13px;
    max-width: 64px;
  }
  .p-madden {
    font-size: 20px;
  }
  .p-jersey {
    font-size: 10px;
  }
  .p-rank {
    font-size: 11px;
  }
  /* Hide rank on very small screens to save space */
  .p-rank { display: none; }
  
  /* Header tighter on mobile */
  .header {
    padding: 0 12px;
    gap: 10px;
    flex-wrap: wrap;
    height: auto;
    min-height: 52px;
    padding-top: 6px;
    padding-bottom: 6px;
  }
}

</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html'" style="cursor:pointer">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">
      <img class="team-logo team-logo-header" id="teamLogoEl" alt="BUF">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px" id="teamNameEl">Buffalo Bills</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="color:var(--text-muted);margin-left:4px"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div class="teams-dropdown" id="teamsDropdown"></div>
  </div>

  <div style="display:flex;gap:8px;align-items:center;margin-left:12px">
    <div class="ctrl-group" id="offPersonnelGroup">
      <button class="ctrl-btn active" onclick="setOffPersonnel('11',this)">11 (3 WR)</button>
      <button class="ctrl-btn" onclick="setOffPersonnel('12',this)">12 (2 TE)</button>
    </div>
    <div class="ctrl-group" id="defPersonnelGroup">
      <!-- rebuilt per-team by updateDefPersonnelButtons(), same
           base/nickel key logic the old setUnit('defense', ...) used -->
    </div>
  </div>

  <div class="view-toggle">
    <button class="view-btn active">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="2" fill="currentColor"/><circle cx="2" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="2" r="1.5" fill="currentColor" opacity=".6"/><circle cx="2" cy="10" r="1.5" fill="currentColor" opacity=".6"/><circle cx="10" cy="10" r="1.5" fill="currentColor" opacity=".6"/></svg>
      Formation
    </button>
    <button class="view-btn" onclick="window.location='depth-chart.html'">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="3" rx="1" fill="currentColor"/><rect x="1" y="5" width="10" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="10" height="2" rx="1" fill="currentColor" opacity=".3"/></svg>
      Table
    </button>
  </div>
</header>

<div class="field-outer">
  <div class="formation-bar">
    <div class="formation-label" id="offFormationLabel">11 Personnel · Shotgun Spread</div>
    <span class="formation-label" style="opacity:.5; letter-spacing:0; text-transform:none; font-size:13px;">vs</span>
    <div class="formation-label" id="defFormationLabel">Base 4-3</div>
    <div class="legend-strip">
      <span style="font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-right:4px">Madden Rating</span>
      <div class="ls-item"><div class="ls-dot" style="background:#00ff88"></div>95+</div>
      <div class="ls-item"><div class="ls-dot" style="background:#22c55e"></div>90–94</div>
      <div class="ls-item"><div class="ls-dot" style="background:#a3e635"></div>85–89</div>
      <div class="ls-item"><div class="ls-dot" style="background:#d4e635"></div>80–84</div>
      <div class="ls-item"><div class="ls-dot" style="background:#facc15"></div>75–79</div>
      <div class="ls-item"><div class="ls-dot" style="background:#fb923c"></div>70–74</div>
      <div class="ls-item"><div class="ls-dot" style="background:#ef4444"></div>&lt;70</div>
      <span id="maddenAsOf" style="font-size:13px;color:var(--text-dim)"></span>
    </div>
  </div>

  <div class="field-canvas">
    <svg class="field-bg" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <pattern id="stripes" x="0" y="0" width="1400" height="102.5" patternUnits="userSpaceOnUse">
          <rect width="1400" height="102.5" fill="#122b12"/>
          <rect y="51.25" width="1400" height="51.25" fill="#163016"/>
        </pattern>
      </defs>
      <rect width="1400" height="820" fill="url(#stripes)" rx="4"/>
      <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
        <line x1="0" y1="164" x2="1400" y2="164"/>
        <line x1="0" y1="328" x2="1400" y2="328"/>
        <line x1="0" y1="492" x2="1400" y2="492"/>
        <line x1="0" y1="656" x2="1400" y2="656"/>
      </g>
      <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
        <line x1="462" y1="0" x2="462" y2="820"/>
        <line x1="938" y1="0" x2="938" y2="820"/>
      </g>
      <line x1="0" y1="410" x2="1400" y2="410" stroke="rgba(0,212,255,0.2)" stroke-width="2" stroke-dasharray="10 7"/>
      <text x="20" y="404" fill="rgba(0,212,255,0.3)" font-family="Barlow Condensed, sans-serif" font-size="11" font-weight="700" letter-spacing="2">LINE OF SCRIMMAGE</text>
    </svg>

    <div class="players-layer" id="playersLayer"></div>
  </div>
</div>

<script>
const TEAMS = {
  ARZ: { name: "Arizona Cardinals",    colors: ["#97233f","#ffb612"] },
  ATL: { name: "Atlanta Falcons",      colors: ["#a71930","#a5acaf"] },
  BAL: { name: "Baltimore Ravens",     colors: ["#241773","#9e7c0c"] },
  BUF: { name: "Buffalo Bills",        colors: ["#003087","#c8102e"] },
  CAR: { name: "Carolina Panthers",    colors: ["#0085ca","#101820"] },
  CHI: { name: "Chicago Bears",        colors: ["#0b162a","#c83803"] },
  CIN: { name: "Cincinnati Bengals",   colors: ["#fb4f14","#000000"] },
  CLE: { name: "Cleveland Browns",     colors: ["#311d00","#ff3c00"] },
  DAL: { name: "Dallas Cowboys",       colors: ["#003594","#869397"] },
  DEN: { name: "Denver Broncos",       colors: ["#fb4f14","#002244"] },
  DET: { name: "Detroit Lions",        colors: ["#0076b6","#b0b7bc"] },
  GB:  { name: "Green Bay Packers",    colors: ["#203731","#ffb612"] },
  HOU: { name: "Houston Texans",       colors: ["#03202f","#a71930"] },
  IND: { name: "Indianapolis Colts",   colors: ["#002c5f","#a5acaf"] },
  JAX: { name: "Jacksonville Jaguars", colors: ["#101820","#d7a22a"] },
  KC:  { name: "Kansas City Chiefs",   colors: ["#e31837","#ffb81c"] },
  LAC: { name: "Los Angeles Chargers", colors: ["#0080c6","#ffc20e"] },

function maddenColor(r) {
  if (!r) return '#6b7494';
  if (r >= 95) return '#00ff88';
  if (r >= 90) { const t = (r-90)/5; return `hsl(${140+t*20},100%,55%)`; }
  if (r >= 85) { const t = (r-85)/5; return `hsl(${100+t*40},100%,55%)`; }
  if (r >= 80) { const t = (r-80)/5; return `hsl(${75+t*25},100%,55%)`; }
  if (r >= 75) { const t = (r-75)/5; return `hsl(${55+t*20},100%,55%)`; }
  if (r >= 70) { const t = (r-70)/5; return `hsl(${38+t*17},100%,55%)`; }
  if (r >= 65) { const t = (r-65)/5; return `hsl(${25+t*13},100%,55%)`; }
  return `hsl(${Math.max(0,(r-55)*2)},90%,50%)`;
}

function defTooltip(key, pos) {
  const m = DEF_STAT_META[key];
  const r = DEF_RANGES[key + '_' + pos.toLowerCase()];
  let tip = m.tip;
  if (r) {
    const qual = (m.per100 || key === 'missed_tackle_rate') ? '300+ snaps' : '10+ targets';
    tip += ' Typical range (' + DEF_CUTOFF_SEASON + ', ' + pos + ', ' + qual + '): about ' + r[0].toFixed(m.dec) + m.unit + ' to ' + r[1].toFixed(m.dec) + m.unit + '.';
  }
  if (m.per100) tip += ' The denominator is all defensive snaps, so it understates players who often drop into coverage; compare within a position group only.';
  return tip;
}

function buildDefAdvBlock(p) {
  const cfg = DEF_CARD[p.standard_pos];
  const pos = p.standard_pos;
  const season = p.def_advanced_season != null ? p.def_advanced_season : '';
  const fmt = (key) => {
    const v = p[key];
    return v != null ? v.toFixed(DEF_STAT_META[key].dec) + DEF_STAT_META[key].unit : '—';
  };
  const dot = (key, size) => (key === 'adot_allowed' || p[key] == null) ? '' : tierDot(key + '_' + pos.toLowerCase(), p[key], size);
  const st = p.stats || {};
  const stat = (...ks) => { for (const k of ks) if (st[k] != null) return st[k]; return null; };
  const compact = [
    cfg.compact.includes('TKL') && stat('TKL') != null ? stat('TKL') + ' tkl' : null,
    cfg.compact.includes('SACK') && stat('SACK', 'SACKS') != null ? stat('SACK', 'SACKS') + ' sack' : null,
    cfg.compact.includes('TFL') && stat('TFL') != null ? stat('TFL') + ' TFL' : null,
    cfg.compact.includes('INT') && stat('INT') != null ? stat('INT') + ' INT' : null,
    cfg.compact.includes('PBU') && stat('PBU', 'PD') != null ? stat('PBU', 'PD') + ' PD' : null,
    p.snap_pct != null ? Math.round(p.snap_pct) + '% snaps' : null,
  ].filter(v => v != null).join(' · ');
  // TKL/SACK/etc. and snap % come from the stats block's season, which can differ from the advanced season.
  const compactLabel = compact && p.stats_season != null && p.stats_season !== p.def_advanced_season ? p.stats_season + ': ' : '';
  const rows = [cfg.hero, ...cfg.grid].map(key => ({
    label: DEF_STAT_META[key].label,
    tooltip: defTooltip(key, pos),
    dot: dot(key, 8),
    display: fmt(key),
  }));
  return `
        ${buildStatRows(rows)}
        ${compact ? `
          <div style="padding:7px 13px 2px;border-top:1px solid var(--border);text-align:center;font-size:11px;color:var(--text-muted)">${compactLabel}${compact}</div>
        ` : ''}
        ${season ? `<div style="padding:0 13px 6px;text-align:center;font-size:9px;color:var(--text-dim)">Advanced: ${season}</div>` : ''}
      `;
}

function tierColor(statKey, value) {
  if (value == null) return null;
  const t = STAT_TIERS[statKey];
  if (!t) return null;
  const aboveHigh = value >= t.high;
  const belowLow = value <= t.low;
  if (t.lowerIsBetter) {
    if (belowLow) return '#22c55e';
    if (aboveHigh) return '#ef4444';
  } else {
    if (aboveHigh) return '#22c55e';
    if (belowLow) return '#ef4444';
  }
  return '#eab308';
}

function tierDot(statKey, value, size) {
  const c = tierColor(statKey, value);
  const px = size || 7;
  return c ? `<span style="width:${px}px;height:${px}px;border-radius:50%;background:${c};display:inline-block"></span>` : '';
}

// Shared hover-card layout: a single column of equal-weight rows, replacing
// the old "hero stat + small grid" pattern. Each row's own border-top does
// the dividing, so callers don't need to wrap this in a bordered container.
function buildStatRows(rows) {
  return rows.map(r => `
        <div class="stat-row">
          <span class="stat-row-label" title="${r.tooltip || ''}">${r.label}</span>
          <span class="stat-row-val">${r.dot || ''}${r.display}</span>
        </div>
      `).join('');
}

function parseCap(capStr) {
  if (!capStr) return 0;
  return parseInt(capStr.replace(/[$,]/g, '')) || 0;
}

function formatMoneyShort(n) {
  if (n == null) return null;
  if (Math.abs(n) >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n);
}

    allPlayers = Object.values(raw).map(mapPlayer);
  } catch(e) {
    console.error('Failed to load players_master.json:', e);
    allPlayers = [];
  }
}

async function loadTeam(abbr) {
  if (!allPlayers) await loadAllPlayers();
  const players = allPlayers.filter(p => p.team === abbr);
  teamData = { base_defense: players[0]?.base_defense || '', players };
  updateHeader();
  updateDefPersonnelButtons();
  renderFormation();
  syncFieldHeight();
}

function syncURL() {
  const params = new URLSearchParams({
    team: currentTeam,
    off: currentOffPersonnel,
    def: currentDefPersonnel
  });
  history.replaceState(null, '', '?' + params.toString());
}

function syncFieldHeight() {
  const fieldBg = document.querySelector('.field-bg');
  const layer = document.getElementById('playersLayer');
  if (!fieldBg || !layer) return;
  const h = fieldBg.getBoundingClientRect().height;
  if (h > 0) layer.style.height = h + 'px';
}

window.addEventListener('resize', syncFieldHeight);

function getStarter(formationPos) {
  if (!teamData) return null;
  // Check if user has subbed someone in
  if (currentStarters[formationPos]) return currentStarters[formationPos];
  // TE2 (12-personnel second tight end) isn't a real standard_slot value —
  // it's the depth-2 player within the TE group. Handle it explicitly so
  // it gets the same sub-candidate pool (standard_pos 'TE') as TE1.
  if (formationPos === 'TE2') {
    const tes = teamData.players
      .filter(p => p.standard_slot === 'TE')
      .sort((a, b) => (a.depth || 99) - (b.depth || 99));
    return tes[1] || null;
  }
  // Default: find the depth-1 player with matching standard_slot
  const starter = teamData.players.find(p => p.depth === 1 && p.standard_slot === formationPos);
  if (starter) return starter;
  // FALLBACK (2026 season) — IND, CLE, and CIN roster only WLB/MLB on
  // OurLads with no dedicated SLB, so the base43 'SAM' slot has no
  // player and the base package fields one short. Backfill from the
  // backup (depth 2) WLB ('WILL'), then backup MLB ('MIKE'), so the
  // slot is never empty. If this stops matching real rosters (e.g. a
  // team adds a SLB group back, or the backup is no longer depth 2),
  // adjust the standard_slot/depth checks below.
  if (formationPos === 'SAM') {
    const backupWill = teamData.players.find(p => p.standard_slot === 'WILL' && p.depth === 2);
    if (backupWill) return backupWill;
    const backupMike = teamData.players.find(p => p.standard_slot === 'MIKE' && p.depth === 2);
    if (backupMike) return backupMike;
  }
  return null;
}

const INJURED_SLOTS = ['IR', 'PUP', 'NFI', 'PUP-R'];

function getSubCandidates(formationPos) {
  if (!teamData) return [];
  // Find the standard_pos for this slot from current starter or coord map
  const current = getStarter(formationPos);
  // S slots always draw from every safety, regardless of who holds the slot
  // or what standard_slot a safety was filed under (e.g. an NB-row safety).
  const targetPos = (formationPos === 'FS' || formationPos === 'SS') ? 'S' : current?.standard_pos;
  if (!targetPos) return [];
  // The nickel slot takes corners or safeties.
  const targetPositions = formationPos === 'NB' ? ['CB', 'S'] : [targetPos];

  // Collect all players with matching standard_pos, sorted by madden desc.
  // Injured-list players ARE eligible sub options (see the on-field INJ
  // badge in buildPlayerNode) -- INJURED_SLOTS is kept in case that's
  // revisited, but nothing currently filters on it here.
  const candidates = teamData.players.filter(p => targetPositions.includes(p.standard_pos));
  candidates.sort((a, b) => (b.madden || 0) - (a.madden || 0));
  // Dedupe by id, and exclude anyone already on the field
  const seen = new Set();
  return candidates.filter(p => {
    if (seen.has(p.id)) return false;
    seen.add(p.id);
    if (currentOnFieldIds.has(p.id)) return false;
    return true;
  });
}

function buildSubDropdown(formationPos, currentPlayer) {
  const candidates = getSubCandidates(formationPos);
  if (candidates.length === 0) return '';

  const options = candidates.map(p => {
    const mc = maddenColor(p.madden);
    const parts = p.name.split(' ');
    const displayName = parts.length > 1 ? parts.slice(1).join(' ') : parts[0];
    return `
      <div class="sub-option"
           onclick="selectSub('${formationPos}', '${p.id}', event)">
        <div class="sub-option-madden" style="color:${mc}">${p.madden || '—'}</div>
        <div class="sub-option-info">
          <div class="sub-option-name">${displayName}</div>
          <div class="sub-option-meta">${p.standard_slot || ''} · ${p.cap_number || '—'}</div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="sub-dropdown" id="sub-${formationPos}">
      <div class="sub-dropdown-header">Substitute ${formationPos}</div>
      ${options}
    </div>
  `;
}

function selectSub(formationPos, playerId, event) {
  event.stopPropagation();
  // Find the player object
  const p = teamData.players.find(p => p.id === playerId);
  if (!p) return;

  currentStarters[formationPos] = p;
  closeSubDropdown();

  // Recompute currentOnFieldIds and every slot's coords/flip from scratch --
  // cheap (no DOM work), and buildFormationSlots() already encodes all of
  // getStarter()'s override/fallback logic so this stays in lockstep with
  // a full renderFormation() without needing to duplicate it here.
  currentOnFieldIds = new Set();
  const offCoordMap = FORMATION_COORDS.offense[currentOffPersonnel] || FORMATION_COORDS.offense['11'];
  const defCoordMap = FORMATION_COORDS.defense[currentDefPersonnel] || {};
  const slots = [
    ...buildFormationSlots(offCoordMap, currentOffPersonnel),
    ...buildFormationSlots(defCoordMap, currentDefPersonnel),
  ];

  // Rebuild only the substituted slot's node -- find it via its sub-dropdown
  // id (stable per formationPos) rather than replaying the whole field.
  const oldDropdown = document.getElementById('sub-' + formationPos);
  const oldNode = oldDropdown ? oldDropdown.closest('.player-node') : null;
  const changedSlot = slots.find(s => s.pos === formationPos);
  if (oldNode && changedSlot) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = buildPlayerNode(changedSlot.starter, changedSlot.pos, changedSlot.coords, 0, changedSlot.flip).trim();
    oldNode.replaceWith(wrapper.firstElementChild);
  }

  // Every OTHER rendered slot's dropdown was baked with the old
  // currentOnFieldIds -- refresh their (hidden) sub-dropdown markup in
  // place so candidate lists stay correct. This is invisible since
  // dropdowns are closed by default, so it causes no visual flicker.
  document.querySelectorAll('#playersLayer .sub-dropdown').forEach(dd => {
    if (dd.id === 'sub-' + formationPos) return; // just rebuilt above
    const pos = dd.id.replace('sub-', '');
    const currentP = getStarter(pos);
    dd.outerHTML = buildSubDropdown(pos, currentP);
  });
}

function openSubDropdown(formationPos, event) {
  event.stopPropagation();
  // Close any open dropdown first
  closeSubDropdown();
  activeSubDropdown = formationPos;
  const el = document.getElementById('sub-' + formationPos);
  if (el) el.classList.add('open');
}

function closeSubDropdown() {
  if (activeSubDropdown) {
    const el = document.getElementById('sub-' + activeSubDropdown);
    if (el) el.classList.remove('open');
    activeSubDropdown = null;
  }
}

function updateHeader() {

function positionHoverCard(node) {
  const card = node.querySelector('.hover-card');
  if (!card) return;
  const margin = 8;

  // Reset any previous correction before measuring fresh geometry.
  card.style.setProperty('--hx', '0px');

  // Vertical: flip above/below if the current side would run off-screen.
  const showingBelow = node.classList.contains('flip-card');
  const vRect = card.getBoundingClientRect();
  if (showingBelow && vRect.bottom > window.innerHeight - margin) {
    node.classList.remove('flip-card');
  } else if (!showingBelow && vRect.top < margin) {
    node.classList.add('flip-card');
  }

  // Horizontal: nudge left/right so the card stays within the viewport.
  const hRect = card.getBoundingClientRect(); // re-measure — the flip above may have changed layout
  let hx = 0;
  if (hRect.right > window.innerWidth - margin) {
    hx = (window.innerWidth - margin) - hRect.right;
  } else if (hRect.left < margin) {
    hx = margin - hRect.left;
  }
  card.style.setProperty('--hx', hx + 'px');
}

        ${p.injured ? `<div class="p-badge-inj" title="${[p.injury_detail, p.injury_status].filter(Boolean).join(' — ')}">INJ</div>` : ''}
        <div class="p-jersey">${p.jersey ? '#'+p.jersey : '\u00a0'}</div>
        <div class="p-lastname">${lastName}</div>
        <div class="p-madden" style="color:${mc}">${p.madden || '—'}</div>
        ${p.madden_rank ? `<div class="p-rank">${p.madden_rank} / ${p.madden_rank_total} ${p.madden_pos_label || ''}</div>` : ''}
      </div>
      <div class="p-pos-bar">${pos}</div>
      ${buildSubDropdown(pos, p)}
      ${buildHoverCard(p, pos)}
    </div>
  `;
}

// Maps OurLads position codes to formation slot keys
const POS_ALIAS = {
  // Offensive line
  'OT': 'LT', 'LOT': 'LT', 'ROT': 'RT',
  // Receivers
  'WR': 'LWR', 'FL': 'SWR', 'SE': 'RWR',
  // Tight end
  'TE': 'TE',
  // Backfield
  'HB': 'RB', 'TB': 'RB',
  // Defensive line — Detroit style
  'LDE': 'DE', 'RDE': 'DE',
  'LDT': 'DT', 'RDT': 'DT',
  // Linebackers — Detroit style
  'SLB': 'ROLB',
  // Defensive line — 4-3
  'DLE': 'DE', 'DRE': 'DE',
  'DLT': 'DT', 'DRT': 'DT',
  // Defensive line — 3-4
  'LE': 'DE', 'RE': 'DE',
  'NT': 'NT',
  // Edge rushers (Bears style)
  'LEDG': 'DE', 'REDG': 'DE',
  // Linebackers — 4-3
  'WILL': 'LOLB', 'SAM': 'ROLB', 'MIKE': 'MLB',
  // Linebackers — 3-4
  'LILB': 'WLB', 'RILB': 'MLB',
  'RUSH': 'ROLB',
  // Corners
  'LCB': 'LCB', 'RCB': 'RCB', 'CB': 'LCB',
  // Safeties
  'SS': 'SS', 'FS': 'FS', 'S': 'SS',
  // Nickel
  'NB': 'NB', 'SCB': 'NB',
};

function resolvePos(ourladsPos) {
  return POS_ALIAS[ourladsPos] || ourladsPos;
}

function buildFormationSlots(coordMap, personnel) {
  const slots = [];
  for (const [pos, coords] of Object.entries(coordMap)) {
    if (pos === 'TE' && personnel === '12') {
      const te1 = getStarter('TE');
      const te2 = getStarter('TE2');
      if (te1) currentOnFieldIds.add(te1.id);
      if (te2) currentOnFieldIds.add(te2.id);
      slots.push({ pos: 'TE', coords, starter: te1, flip: false });
      slots.push({ pos: 'TE2', coords: TE2_COORD, starter: te2, flip: false });
      continue;
    }
    const starter = getStarter(pos);
    if (starter) currentOnFieldIds.add(starter.id);
    const forceFlip = ['QB', 'RB', 'FB', 'HB'].includes(pos);
    slots.push({ pos, coords, starter, flip: forceFlip || coords.y > 72 });
  }
  return slots;
}

function renderFormation() {
  const layer = document.getElementById('playersLayer');
  if (!teamData) { layer.innerHTML = ''; return; }

  const offCoordMap = FORMATION_COORDS.offense[currentOffPersonnel] || FORMATION_COORDS.offense['11'];
  const defCoordMap = FORMATION_COORDS.defense[currentDefPersonnel] || {};

  currentOnFieldIds = new Set();
  const slots = [
    ...buildFormationSlots(offCoordMap, currentOffPersonnel),
    ...buildFormationSlots(defCoordMap, currentDefPersonnel),
  ];

  let html = '';
  let delay = 0;
  for (const slot of slots) {
    html += buildPlayerNode(slot.starter, slot.pos, slot.coords, delay, slot.flip);
    delay += 40;
  }

  layer.innerHTML = html;
}

function setOffPersonnel(pers, btn) {
  currentOffPersonnel = pers;
  document.querySelectorAll('#offPersonnelGroup .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const labels = {
    '11': '11 Personnel · Shotgun Spread',
    '12': '12 Personnel · 2 TE Set',
  };
  document.getElementById('offFormationLabel').textContent = labels[pers] || pers;
  renderFormation();
  syncURL();
}

function setDefPersonnel(pers, btn) {
  currentDefPersonnel = pers;
  document.querySelectorAll('#defPersonnelGroup .ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const isNickel = pers.startsWith('nickel');
  document.getElementById('defFormationLabel').textContent =
    isNickel ? 'Nickel Package' : (teamData?.base_defense || 'Base 4-3');
  renderFormation();
  syncURL();
}

// Called once per team load (teams differ on 3-4 vs 4-3 base scheme via
// base_defense) -- replaces the key-computation that used to live
// inside setUnit('defense', ...), since there's no more unit toggle to
// trigger it from.
function updateDefPersonnelButtons() {
  const baseScheme = teamData?.base_defense || 'Base 4-3';
  const isThreeFour = baseScheme.includes('3-4');
  const baseKey    = isThreeFour ? 'base34'   : 'base43';
  const nickelKey  = isThreeFour ? 'nickel34' : 'nickel';
  const baseLabel  = isThreeFour ? '3-4 Base' : '4-3 Base';
  document.getElementById('defPersonnelGroup').innerHTML = `
    <button class="ctrl-btn active" onclick="setDefPersonnel('${baseKey}',this)">${baseLabel}</button>
    <button class="ctrl-btn" onclick="setDefPersonnel('${nickelKey}',this)">Nickel</button>
  `;
  currentDefPersonnel = baseKey;
  document.getElementById('defFormationLabel').textContent = baseScheme;
}

function buildTeamDropdown() {
  document.getElementById('teamsDropdown').innerHTML = Object.entries(TEAMS).map(([abbr, t]) => `
    <div class="team-opt ${abbr === currentTeam ? 'selected' : ''}" onclick="selectTeam('${abbr}')">
      <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
      ${t.name.split(' ').pop()}
    </div>
  `).join('');
}

function toggleTeamDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) buildTeamDropdown();
}

async function selectTeam(abbr) {
  currentTeam = abbr;
  currentStarters = {};
  localStorage.setItem('fieldview_team', abbr);
  document.getElementById('teamsDropdown').classList.remove('open');

  // Preserve the *choice* of Nickel on defense across a team switch --
  // updateDefPersonnelButtons() inside loadTeam() already recomputes the
  // correct scheme-specific key (base43/base34/nickel/nickel34) for the
  // new team, so just re-click Nickel by button position if that's what
  // was selected. Offense's 11/12 choice is preserved automatically
  // since currentOffPersonnel isn't touched by a team switch.
  const wasNickel = currentDefPersonnel.startsWith('nickel');

  await loadTeam(abbr);

  if (wasNickel) {
    const persBtns = document.querySelectorAll('#defPersonnelGroup .ctrl-btn');
    if (persBtns[1]) persBtns[1].click();
  }

  syncURL();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-node')) {
    closeSubDropdown();
  }
});

const params = new URLSearchParams(window.location.search);
const urlTeam = params.get('team');
const urlOff  = params.get('off');
const urlDef  = params.get('def');

currentTeam = (urlTeam && TEAMS[urlTeam]) ? urlTeam : (localStorage.getItem('fieldview_team') || 'BUF');

loadTeam(currentTeam).then(() => {
  syncFieldHeight();
  if (urlOff) {
    const offBtns = document.querySelectorAll('#offPersonnelGroup .ctrl-btn');
    offBtns.forEach(btn => {
      if (btn.getAttribute('onclick')?.includes(urlOff)) btn.click();
    });
  }
  if (urlDef) {
    const defBtns = document.querySelectorAll('#defPersonnelGroup .ctrl-btn');
    defBtns.forEach(btn => {
      if (btn.getAttribute('onclick')?.includes(urlDef)) btn.click();
    });
  }
});
</script>
