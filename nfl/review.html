<style>
:root {
  --bg: #13141a; --surface: #111318; --surface2: #181c24; --border: #1e2330; --border2: #262d3d;
  --text: #e8eaf0; --text-muted: #6b7494; --text-dim: #404660;
  --accent: #00d4ff; --gold: #f5a623; --green: #22c55e; --red: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; overflow: hidden; }

.header { background: #0d1118; border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 20px; height: 52px; }
.logo { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 2px; color: var(--accent); cursor: pointer; }
.logo span { color: var(--text-muted); font-weight: 400; }
.header-divider { width: 1px; height: 24px; background: var(--border2); }
.week-sel { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 6px 12px;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 1px; cursor: pointer; }
.caption { color: var(--text-muted); font-size: 13px; }
.view-toggle { margin-left: auto; display: flex; gap: 2px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 3px; }
.view-btn { background: none; border: none; border-radius: 6px; padding: 5px 14px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 12px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 6px; }
a.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── page: This week + Season (stacked; side by side when wide) + links row. The page never scrolls. ── */
.page { height: calc(100vh - 52px); display: flex; flex-direction: column; padding: 12px 16px 0; container: page / inline-size; }
body.sb-open .page { margin-right: 360px; }
.cols { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.panel { background: #0f1218; border: 1px solid var(--border); border-radius: 12px; min-height: 0; }
.week { flex: 0 1 auto; max-height: 62%; overflow-y: auto; padding: 10px 14px 12px; container: week / inline-size; }
.season { flex: 1 1 0; min-height: 190px; display: flex; flex-direction: column; container: season / inline-size; }
@container page (min-width: 1500px) {
  .cols { flex-direction: row; }
  .week { flex: 1.25 1 0; max-height: none; }
  .season { flex: 1 1 0; }
}
.panel-title { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
.panel-sub { color: var(--text-muted); font-size: 12px; font-weight: 400; margin-left: 10px; letter-spacing: 0; text-transform: none; font-family: 'Barlow', sans-serif; }
.msg { color: var(--text-muted); text-align: center; padding: 36px 0; }
.none { color: var(--text-muted); font-size: 12px; font-style: italic; }
.logo-sm { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; flex-shrink: 0; }
a.plink { color: var(--accent); text-decoration: none; }
a.plink:hover { text-decoration: underline; }
h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); font-weight: 700; }

/* scoreboard strip */
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 7px; margin-top: 8px; }
.tile { display: block; width: 100%; text-align: left; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: inherit; font: inherit; padding: 5px 9px 4px; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--text-muted); }
.tile.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.t-row { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 500; line-height: 22px; }
.t-row .code { flex: 1; }
.t-row .pts { font-size: 18px; }
.t-row.win { color: var(--text); font-weight: 800; }
.t-status { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.t-status .hl-flag { color: var(--gold); }
.tile.pending { border-style: dashed; background: none; }

/* combined weekly leaders */
.combo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
@container week (min-width: 760px) { .combo { grid-template-columns: repeat(3, 1fr); } }
@container week (min-width: 1150px) { .combo { grid-template-columns: repeat(6, 1fr); } }
.card { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 9px 5px; min-width: 0; }
.row { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 13px; line-height: 20px; }
.row .rk { width: 16px; flex-shrink: 0; color: var(--text-muted); font-size: 11px; text-align: right; }
.row .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: .3px; }
.row .tm { color: var(--text-muted); font-size: 11px; flex-shrink: 0; }
.row .val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; flex-shrink: 0; }
.footnote { color: var(--text-muted); font-size: 11px; margin-top: 7px; }

/* season */
.season-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
.tabs, .seg { display: flex; gap: 2px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 3px; }
.tab { background: none; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--border2); color: var(--text); }
.season-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; }
.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; align-items: start; }
.tables .card { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 3px; }
th { color: var(--text-muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; text-align: right; padding: 3px 3px; }
td { padding: 4px 3px; text-align: right; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.l, td.l { text-align: left; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.seed-row { display: flex; align-items: center; gap: 9px; padding: 5px 0; border-top: 1px solid var(--border); font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 600; }
.seed-row .rk { width: 18px; color: var(--text-muted); text-align: right; }
.seed-row .nm { flex: 1; min-width: 0; }
.seed-row .tag { font-family: 'Barlow', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.seed-row .rec { min-width: 52px; text-align: right; }
.hunt-head { margin-top: 10px; padding-bottom: 3px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.note { color: var(--text-muted); font-size: 12px; margin-bottom: 10px; }
.lead-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; align-items: start; }
.draft { columns: 250px; column-gap: 10px; }
.pick { display: flex; align-items: center; gap: 9px; break-inside: avoid; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 5px 10px; margin-bottom: 6px; text-decoration: none; color: var(--text); }
a.pick:hover { border-color: var(--accent); }
.pick .num { width: 22px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; color: var(--accent); }
.pick img { width: 26px; height: 26px; object-fit: contain; }
.pick .who { min-width: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.15; }
.pick .from { display: block; font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 400; color: var(--text-muted); }
.draft-link { display: inline-block; color: var(--accent); text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; margin-bottom: 10px; }
.draft-link:hover { text-decoration: underline; }

.links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 8px 2px; font-size: 12px; color: var(--text-muted); }
.links a { color: var(--text-muted); text-decoration: none; }
.links a:hover { color: var(--accent); }

/* game sidebar */
.sidebar { position: fixed; top: 52px; right: 0; bottom: 0; width: 360px; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--border2); display: none; }
body.sb-open .sidebar { display: block; }
@media (max-width: 800px) { body.sb-open .page { margin-right: 0; } .sidebar { width: 100%; } }
.sb-close { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--text-muted); font-size: 24px; line-height: 1; cursor: pointer; }
.sb-close:hover { color: var(--text); }
.sb-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--border2); }
.sb-when { color: var(--text-muted); font-size: 12px; margin: 0 28px 8px 0; }
.team-row { display: flex; align-items: center; gap: 12px; padding: 3px 0; color: var(--text-muted); }
.team-row img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
.team-row .nm { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 600; letter-spacing: .5px; flex: 1; }
.team-row .rec { font-size: 12px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }
.team-row .sc { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; min-width: 36px; text-align: right; }
.team-row.win { color: var(--text); }
.team-row.win .nm, .team-row.win .sc { font-weight: 800; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.sec h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; font-weight: 700; }

.statrow { margin-bottom: 11px; }
.statrow .lbl { text-align: center; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
.statrow .vals { display: flex; justify-content: space-between; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 3px; }
.bar { display: flex; height: 6px; gap: 3px; }
.bar > div { background: var(--surface2); border-radius: 3px; display: flex; }
.bar .a { justify-content: flex-end; } .bar .b { justify-content: flex-start; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--text-muted); }
.bar i.lead { background: var(--accent); }
.tabs-leg { display: flex; justify-content: space-between; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }

.leader { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.leader:last-child { border-bottom: none; }
.leader .cat { width: 68px; flex-shrink: 0; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.leader .who { flex: 1; min-width: 0; }
.leader .who a, .leader .who span.n { font-weight: 600; }
.leader .pos { color: var(--text-muted); font-size: 11px; margin-left: 4px; }
.leader .line { color: var(--text-muted); font-size: 12px; display: block; }
.leader .ovr { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; padding: 1px 6px; border-radius: 5px; background: #0d1118; border: 1px solid var(--border2); flex-shrink: 0; }
.team-leads + .team-leads { margin-top: 12px; }
.team-leads h4 { color: var(--text); font-size: 14px; margin-bottom: 2px; }

.play { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; align-items: flex-start; }
.play:last-child { border-bottom: none; }
.play .when { width: 52px; flex-shrink: 0; color: var(--text-muted); font-size: 12px; padding-top: 2px; }
.play img { width: 20px; height: 20px; object-fit: contain; margin-top: 1px; }
.play .tx { flex: 1; min-width: 0; }
.play .sco { color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; }

.hls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hl { display: block; text-decoration: none; color: var(--text); background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; }
.hl:hover { border-color: var(--accent); }
.hl img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
.hl span { display: block; padding: 6px 8px; font-size: 12px; line-height: 1.3; }
</style>

<script>
const escapeHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const esc = escapeHtml;

const ESPN_TEAM_CODES = {
  ARZ: 'ari', ATL: 'atl', BAL: 'bal', BUF: 'buf', CAR: 'car', CHI: 'chi', CIN: 'cin', CLE: 'cle', DAL: 'dal', DEN: 'den',
  DET: 'det', GB: 'gb', HOU: 'hou', IND: 'ind', JAX: 'jax', KC: 'kc', LAC: 'lac', LAR: 'lar', LV: 'lv', MIA: 'mia',
  MIN: 'min', NE: 'ne', NO: 'no', NYG: 'nyg', NYJ: 'nyj', PHI: 'phi', PIT: 'pit', SF: 'sf', SEA: 'sea', TB: 'tb',
  TEN: 'ten', WAS: 'wsh',
};
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function teamLogoUrl(abbr) {
  return has(ESPN_TEAM_CODES, abbr) ? `https://a.espncdn.com/i/teamlogos/nfl/500/${ESPN_TEAM_CODES[abbr]}.png` : '';
}
function logoImg(abbr, cls) {
  const u = teamLogoUrl(abbr);
  return u ? `<img${cls ? ` class="${cls}"` : ''} src="${esc(u)}" alt="${esc(abbr)}" loading="lazy">` : '';
}
// Madden gradient — copied verbatim from nfl-formation-view.html
function maddenColor(r) {
  if (!r) return '#6b7494';
  if (r >= 95) return '#00ff88';
  if (r >= 90) { const t = (r-90)/5; return `hsl(${140+t*20},100%,55%)`; }
  if (r >= 85) { const t = (r-85)/5; return `hsl(${100+t*40},100%,55%)`; }
  if (r >= 80) { const t = (r-80)/5; return `hsl(${75+t*25},100%,55%)`; }
  if (r >= 75) { const t = (r-75)/5; return `hsl(${55+t*20},100%,55%)`; }
  if (r >= 70) { const t = (r-70)/5; return `hsl(${38+t*17},100%,55%)`; }
  if (r >= 65) { const t = (r-65)/5; return `hsl(${25+t*13},100%,55%)`; }
  return `hsl(${Math.max(0,(r-55)*2)},90%,50%)`;
}
function safeUrl(u) { return typeof u === 'string' && /^https:\/\//i.test(u) ? u : ''; }

let INDEX = null, MASTER = {}, SEASON = null, DRAFT = null, DRAFT_META = null;
let currentWeek = null, openGame = null, seasonTab = 'standings', conf = 'AFC';
let TEAM_NAMES = Object.create(null);
const weekCache = {};

const masterPlayer = id => (id && has(MASTER, id)) ? MASTER[id] : null;
// A matched player's name links to FormationView on the team the master has them on (so the sidebar can find them).
function playerName(name, id) {
  const p = masterPlayer(id);
  return p
    ? `<a class="plink" href="nfl-formation-view.html?team=${encodeURIComponent(p.team)}&player=${encodeURIComponent(id)}" title="${esc(name)}: open in FormationView">${esc(name)}</a>`
    : `<span class="n" title="${esc(name)}">${esc(name)}</span>`;
}

// ── THIS WEEK ──
function dayLabel(iso, withTime) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return withTime
    ? d.toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' })
    : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function tileRow(t, final) {
  return `<span class="t-row${final && t.winner ? ' win' : ''}">${logoImg(t.team, 'logo-sm')}<span class="code">${esc(t.team)}</span>
    <span class="pts">${final ? esc(t.score) : ''}</span></span>`;
}
function stripHtml(data) {
  const all = data.games.map(g => ({ g, final: true })).concat((data.pending || []).map(g => ({ g, final: false })));
  all.sort((a, b) => String(a.g.date).localeCompare(String(b.g.date)));
  return all.map(({ g, final }) => {
    if (final) {
      const n = g.highlights.length;
      return `<button type="button" class="tile${openGame === g.id ? ' sel' : ''}" data-game="${esc(g.id)}" title="${esc(g.away.name || g.away.team)} at ${esc(g.home.name || g.home.team)}, ${esc(dayLabel(g.date))}">
        ${tileRow(g.away, true)}${tileRow(g.home, true)}
        <span class="t-status"><span>${esc(g.status)}</span>${n ? `<span class="hl-flag" title="${n} highlight${n > 1 ? 's' : ''}">&#9654; ${n}</span>` : ''}</span></button>`;
    }
    const status = g.state === 'in' ? 'In progress at update' : g.state === 'post' ? 'Not final' : dayLabel(g.date, true);
    return `<div class="tile pending">${tileRow(g.away, false)}${tileRow(g.home, false)}<span class="t-status"><span>${esc(status)}</span></span></div>`;
  }).join('');
}
const WEEK_CATS = [
  { key: 'pass', label: 'Passing yds' }, { key: 'rush', label: 'Rushing yds' }, { key: 'rec', label: 'Receiving yds' },
  { key: 'td', label: 'Total TD' }, { key: 'sacks', label: 'Sacks' }, { key: 'tackles', label: 'Tackles' },
];
// Who scored a touchdown, from ESPN's scoring-play text (its summary has no scorer field). A pass credits the
// receiver, a lateral the last player to receive it. Returns null for a format it does not recognise.
function tdScorer(text) {
  const t = String(text || '').replace(/^(\s*\([^)]*\))+\s*/, ''); // play-by-play style notes: "(No Huddle) ..."
  const laterals = [...t.matchAll(/lateral to (.+?) for -?\d+ (?:yd|yard)/gi)];
  if (laterals.length) return laterals[laterals.length - 1][1];
  let m = /complete pass to (.+?) for -?\d+ (?:yd|yard)/i.exec(t);
  if (m) return m[1];
  const end = t.search(/\bTOUCHDOWN\b/);
  if (end >= 0) { // play-by-play style ("J.Gibbs up the middle for 1 yard, TOUCHDOWN"): the last F.Last before TOUCHDOWN
    const names = t.slice(0, end).match(/\b[A-Z][a-z]{0,2}\.(?:St\.\s?)?[A-Z][A-Za-z'-]+/g);
    return names ? names[names.length - 1] : null;
  }
  // "Name 12 Yd Run", "Name 8 Yd pass from QB", "Name 35 Yd Interception Return", "Name Fumble Recovery in End Zone"
  m = /^(.+?)\s+-?\d+\s+(?:yd|yard)s?\s+(?:pass from|rush|run|[a-z ]*?(?:return|recovery))/i.exec(t)
    || /^(.+?)\s+(?:blocked\s+(?:punt|kick|field goal)|fumble|punt|kickoff|interception)\s+(?:return|recovery)/i.exec(t);
  return m ? m[1] : null;
}
// The scoring plays that are touchdowns: the only scores that add 6 or more points.
function touchdownPlays(g) {
  let away = 0, home = 0;
  return g.scoring_plays.filter(p => {
    const a = Number(p.away) || 0, h = Number(p.home) || 0, gain = a - away + h - home;
    away = a; home = h;
    return gain >= 6 && !['FG', 'SF', 'D2P'].includes(p.type);
  });
}
// Same name normalisation as scrape_review.py.
const normName = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[.'`-]/g, '').replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '').replace(/[^a-z ]/g, '').split(' ').filter(Boolean).join(' ');
// Scorer -> player on the scoring team: the week's leaders first (they carry the scraper's id crosswalk), then
// players_master by name + team, only when unique. "J.Gibbs" matches on initial + last name.
function resolveScorer(raw, team, leaders) {
  const short = /^([A-Z][a-z]{0,2})\.((?:St\.\s?)?[A-Z][A-Za-z'-]+)$/.exec(raw);
  const first = short && normName(short[1]), last = short && normName(short[2]);
  const want = normName(raw);
  const is = name => {
    const n = normName(name);
    return !!n && (short ? n.startsWith(first) && n.endsWith(' ' + last) : n === want);
  };
  const lead = leaders.filter(l => l.team === team && is(l.name));
  if (lead.length && new Set(lead.map(l => normName(l.name))).size === 1) {
    const withId = lead.find(l => masterPlayer(l.player_id));
    if (withId) return { name: short ? withId.name : raw, player_id: withId.player_id };
  }
  const ids = Object.keys(MASTER).filter(id => {
    const p = MASTER[id];
    return p.team === team && [p.canonical_name, p.ourlads_name, p.nflreadpy_name].some(is);
  });
  if (ids.length === 1) return { name: short ? MASTER[ids[0]].canonical_name : raw, player_id: ids[0] };
  return { name: short && lead.length ? lead[0].name : raw, player_id: null };
}
// Touchdowns scored (rushing, receiving, returns, defense; never the passer) across the week's scoring summaries.
// yards = scrimmage yards from the player's rushing / receiving leader lines, null when he led neither.
function weekTouchdowns(data) {
  const leaders = data.games.flatMap(g => g.leaders);
  const found = new Map();
  for (const g of data.games) {
    for (const p of touchdownPlays(g)) {
      const raw = tdScorer(p.text);
      if (!raw) continue;
      const who = resolveScorer(raw.trim(), p.team, leaders);
      const key = who.player_id || `${p.team}|${normName(who.name)}`;
      const e = found.get(key) || { ...who, team: p.team, v: 0, yards: null };
      e.v += 1;
      found.set(key, e);
    }
  }
  for (const e of found.values()) {
    for (const l of leaders) {
      if ((l.cat !== 'rush' && l.cat !== 'rec') || l.team !== e.team || normName(l.name) !== normName(e.name)) continue;
      const y = /(-?\d+) YDS/.exec(String(l.line || ''));
      if (y) e.yards = (e.yards || 0) + Number(y[1]);
    }
  }
  return [...found.values()];
}
// League-wide top 5s. Yards, sacks and tackles come from each game's per-team leaders (one per team per category);
// Total TD from the scoring summaries. Equal TDs: more known scrimmage yards first, then alphabetical.
function weekLeaders(data) {
  const lists = { pass: [], rush: [], rec: [], sacks: [], tackles: [] };
  for (const g of data.games) {
    for (const l of g.leaders) {
      if (!has(lists, l.cat)) continue;
      const line = String(l.line || '');
      const yds = /(-?\d+) YDS/.exec(line);
      const v = (l.cat === 'sacks' || l.cat === 'tackles') ? parseFloat(line) : (yds ? +yds[1] : NaN);
      if (v > 0) lists[l.cat].push({ ...l, v });
    }
  }
  lists.td = weekTouchdowns(data);
  const yards = e => e.yards == null ? -1e9 : e.yards;
  for (const k of Object.keys(lists)) {
    lists[k] = lists[k].sort((a, b) => b.v - a.v || (k === 'td' ? yards(b) - yards(a) : 0) || String(a.name).localeCompare(String(b.name))).slice(0, 5);
  }
  return lists;
}
function comboHtml(data) {
  const lists = weekLeaders(data);
  return WEEK_CATS.map(c => `<div class="card" data-cat="${c.key}"><h4>${c.label}</h4>${lists[c.key].map((l, i) =>
    `<div class="row"><span class="rk">${i + 1}</span>${logoImg(l.team, 'logo-sm')}<span class="nm">${playerName(l.name, l.player_id)}</span><span class="val">${esc(l.v)}</span></div>`
  ).join('') || '<div class="none">None yet</div>'}</div>`).join('');
}
const gamesLeft = n => `${n} game${n === 1 ? '' : 's'} left`;
function weekHtml(data) {
  const n = data.games.length;
  const sub = data.partial ? `Week ${data.week} · ${n} final, ${gamesLeft(data.games_remaining)}` : `Week ${data.week} · ${n} games`;
  return `<h2 class="panel-title">This week<span class="panel-sub">${esc(sub)} · click a final game for details</span></h2>
    <div class="strip">${stripHtml(data)}</div>
    <div class="combo">${comboHtml(data)}</div>
    <div class="footnote">Yards, sacks and tackles: league-wide from each team's top performer in every final game. Total TD: rushing, receiving, return and defensive touchdowns from the scoring summaries (not passing).</div>`;
}

// ── GAME SIDEBAR ──
const CAT_LABEL = { pass: 'Passing', rush: 'Rushing', rec: 'Receiving', sacks: 'Sacks', tackles: 'Tackles' };
const STAT_ROWS = [
  ['totalYards', 'Total yards', 'num'], ['netPassingYards', 'Passing yards', 'num'], ['rushingYards', 'Rushing yards', 'num'],
  ['turnovers', 'Turnovers', 'num'], ['thirdDownEff', '3rd down', 'frac'], ['possessionTime', 'Time of possession', 'clock'],
];
function statNum(v, kind) {
  if (v == null) return null;
  if (kind === 'frac') { const m = /^(\d+)-(\d+)$/.exec(v); return m && +m[2] ? +m[1] / +m[2] : 0; }
  if (kind === 'clock') { const m = /^(\d+):(\d+)$/.exec(v); return m ? +m[1] * 60 + +m[2] : null; }
  const n = parseFloat(v); return isNaN(n) ? null : n;
}
function statDisplay(v, kind) {
  if (kind === 'frac') { const m = /^(\d+)-(\d+)$/.exec(v || ''); return m && +m[2] ? `${v} (${Math.round(100 * m[1] / m[2])}%)` : (v || '—'); }
  return v == null ? '—' : v;
}
function statBars(g) {
  const h = g.team_stats.home || {}, a = g.team_stats.away || {};
  let out = `<div class="tabs-leg"><span>${esc(g.away.team)}</span><span>${esc(g.home.team)}</span></div>`;
  for (const [key, label, kind] of STAT_ROWS) {
    const av = statNum(a[key], kind), hv = statNum(h[key], kind);
    const tot = (av || 0) + (hv || 0);
    const aw = tot ? 100 * (av || 0) / tot : 50, hw = tot ? 100 * (hv || 0) / tot : 50;
    // turnovers: fewer is the better side
    const lead = av === hv ? '' : ((kind === 'num' && key === 'turnovers') ? (av < hv ? 'a' : 'b') : (av > hv ? 'a' : 'b'));
    out += `<div class="statrow"><div class="lbl">${esc(label)}</div>
      <div class="vals"><span>${esc(statDisplay(a[key], kind))}</span><span>${esc(statDisplay(h[key], kind))}</span></div>
      <div class="bar"><div class="a" style="flex:1"><i class="${lead === 'a' ? 'lead' : ''}" style="width:${aw.toFixed(1)}%"></i></div>
      <div class="b" style="flex:1"><i class="${lead === 'b' ? 'lead' : ''}" style="width:${hw.toFixed(1)}%"></i></div></div></div>`;
  }
  return out;
}
function leaderRow(l) {
  const p = masterPlayer(l.player_id);
  const ovr = p && p.madden ? `<span class="ovr" style="color:${maddenColor(p.madden)}">${esc(p.madden)}</span>` : '';
  return `<div class="leader"><span class="cat">${esc(CAT_LABEL[l.cat] || l.cat)}</span>
    <span class="who">${playerName(l.name, l.player_id)}<span class="pos">${esc(l.pos || '')}</span><span class="line">${esc(l.line)}</span></span>${ovr}</div>`;
}
function leadersHtml(g) {
  return [g.away.team, g.home.team].map(t => `<div class="team-leads"><h4>${logoImg(t, 'logo-sm')} ${esc(t)}</h4>${
    g.leaders.filter(l => l.team === t).map(leaderRow).join('') || '<div class="none">No leaders listed</div>'}</div>`).join('');
}
function scoringHtml(g) {
  if (!g.scoring_plays.length) return '<div class="none">No scoring plays</div>';
  return g.scoring_plays.map(p => `<div class="play"><span class="when">Q${esc(p.quarter)} ${esc(p.clock)}</span>
    ${logoImg(p.team)}<span class="tx">${esc(p.text)}</span><span class="sco">${esc(p.away)}-${esc(p.home)}</span></div>`).join('');
}
function highlightsHtml(g) {
  const items = g.highlights.filter(h => safeUrl(h.url));
  if (!items.length) return '<div class="none">No highlights for this game (ESPN publishes clips for only a couple of days).</div>';
  return `<div class="hls">${items.map(h => {
    const th = safeUrl(h.thumbnail);
    return `<a class="hl" href="${esc(h.url)}" target="_blank" rel="noopener">${th ? `<img src="${esc(th)}" alt="" loading="lazy">` : ''}<span>${esc(h.title)}</span></a>`;
  }).join('')}</div>`;
}
function sidebarHtml(g) {
  const row = t => `<div class="team-row${t.winner ? ' win' : ''}">${logoImg(t.team)}<span class="nm">${esc(t.team)}<span class="rec">${esc(t.record)}</span></span><span class="sc">${esc(t.score)}</span></div>`;
  return `<button type="button" class="sb-close" aria-label="Close">&times;</button>
    <div class="sb-head"><div class="sb-when">${esc([g.status, dayLabel(g.date), g.venue].filter(Boolean).join(' · '))}</div>${row(g.away)}${row(g.home)}</div>
    <div class="sec"><h3>Team stats</h3>${statBars(g)}</div>
    <div class="sec"><h3>Top performers</h3>${leadersHtml(g)}</div>
    <div class="sec"><h3>Scoring summary</h3>${scoringHtml(g)}</div>
    <div class="sec"><h3>Highlights</h3>${highlightsHtml(g)}</div>`;
}
function syncUrl() {
  const q = new URLSearchParams({ week: currentWeek });
  if (openGame) q.set('game', openGame);
  try { history.replaceState(null, '', '?' + q.toString()); } catch (e) {}
}
function markSelected() {
  document.querySelectorAll('.tile[data-game]').forEach(t => t.classList.toggle('sel', t.dataset.game === openGame));
}
function openSidebar(id) {
  const data = weekCache[currentWeek];
  const g = data && data.games.find(x => x.id === id);
  if (!g) return;
  openGame = id;
  const el = document.getElementById('gameSidebar');
  el.innerHTML = sidebarHtml(g);
  el.querySelector('.sb-close').addEventListener('click', closeSidebar);
  el.scrollTop = 0;
  document.body.classList.add('sb-open');
  markSelected();
  syncUrl();
}
function closeSidebar() {
  if (!openGame) return;
  openGame = null;
  document.body.classList.remove('sb-open');
  document.getElementById('gameSidebar').innerHTML = '';
  markSelected();
  syncUrl();
}
document.getElementById('weekPanel').addEventListener('click', e => {
  const t = e.target.closest('.tile[data-game]');
  if (!t) return;
  if (t.dataset.game === openGame) closeSidebar(); else openSidebar(t.dataset.game);
});
// Click outside the sidebar closes it (game tiles switch games; the credits popup is left alone).
document.addEventListener('click', e => {
  if (openGame && !e.target.closest('#gameSidebar, .tile[data-game], #fvCredits, #fvCreditsBtn')) closeSidebar();
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });

// ── SEASON ──
const SEASON_TABS = [['standings', 'Standings'], ['playoffs', 'Playoff picture'], ['leaders', 'Leaders'], ['draft', 'Draft order']];
const SEASON_CATS = [
  ['passingYards', 'Passing yards'], ['passingTouchdowns', 'Passing TD'], ['rushingYards', 'Rushing yards'], ['rushingTouchdowns', 'Rushing TD'],
  ['receivingYards', 'Receiving yards'], ['receptions', 'Receptions'], ['receivingTouchdowns', 'Receiving TD'],
  ['sacks', 'Sacks'], ['totalTackles', 'Tackles'], ['interceptions', 'Interceptions'],
];
const record = r => r.ties ? `${r.wins}-${r.losses}-${r.ties}` : `${r.wins}-${r.losses}`;
const nickname = r => String(r.name || r.team).split(' ').pop();
function standingsHtml() {
  const rows = SEASON.standings.filter(r => r.conference === conf);
  const divisions = [...new Set(rows.map(r => r.division))].sort((a, b) => {
    const order = ['East', 'North', 'South', 'West'];
    return order.indexOf(String(a).split(' ')[1]) - order.indexOf(String(b).split(' ')[1]);
  });
  return `<div class="tables">${divisions.map(d => `<div class="card"><h4>${esc(d)}</h4><table>
    <tr><th class="l">Team</th><th>W-L-T</th><th>Pct</th><th title="Points for">PF</th><th title="Points against">PA</th><th title="Streak">Strk</th></tr>
    ${rows.filter(r => r.division === d).sort((a, b) => a.div_rank - b.div_rank).map(r => `<tr><td class="l">${logoImg(r.team, 'logo-sm')} ${esc(nickname(r))}</td>
      <td>${esc(record(r))}</td><td>${esc(Number(r.pct).toFixed(3).replace(/^0/, ''))}</td><td>${esc(r.points_for)}</td><td>${esc(r.points_against)}</td><td>${esc(r.streak || '—')}</td></tr>`).join('')}
  </table></div>`).join('')}</div>`;
}
function playoffsHtml() {
  const byTeam = Object.create(null);
  SEASON.standings.forEach(r => { byTeam[r.team] = r; });
  const pic = SEASON.playoff_picture;
  const projected = ['AFC', 'NFC'].some(c => pic[c] && pic[c].seeded_by !== 'espn');
  const note = projected
    ? 'Projected seeds, computed from records (division leaders first, ties by point differential, not the official NFL tiebreakers).'
    : "ESPN's seeding if the season ended today.";
  const col = c => {
    const p = pic[c];
    if (!p) return '';
    const row = (t, seed, tag) => {
      const r = byTeam[t] || { team: t };
      return `<div class="seed-row"><span class="rk">${seed}</span>${logoImg(t, 'logo-sm')}<span class="nm">${esc(nickname(r))}</span>
        ${tag ? `<span class="tag">${tag}</span>` : ''}<span class="rec">${r.wins == null ? '' : esc(record(r))}</span></div>`;
    };
    return `<div class="card" data-conf="${c}"><h4>${c}${p.seeded_by !== 'espn' ? ' · projected seeds' : ''}</h4>
      ${p.seeds.map((t, i) => row(t, i + 1, i < 4 ? 'Division leader' : 'Wild card')).join('')}
      <div class="hunt-head">In the hunt</div>${p.hunt.map((t, i) => row(t, i + 8, '')).join('')}</div>`;
  };
  return `<div class="note">${note}</div><div class="two">${col('AFC')}${col('NFC')}</div>`;
}
function leadersTabHtml() {
  return `<div class="lead-grid">${SEASON_CATS.map(([key, label]) => `<div class="card" data-cat="${key}"><h4>${label}</h4>${
    ((SEASON.leaders || {})[key] || []).map(r => `<div class="row"><span class="rk">${esc(r.rank)}</span>${logoImg(r.team, 'logo-sm')}
      <span class="nm">${playerName(r.name, r.player_id)}</span><span class="tm">${esc(r.pos || '')}</span><span class="val">${esc(Number(r.value).toLocaleString('en-US'))}</span></div>`).join('')
    || '<div class="none">No data</div>'}</div>`).join('')}</div>`;
}
function draftHtml() {
  const picks = DRAFT.filter(p => p.round === 1).sort((a, b) => a.pick - b.pick);
  const simulated = DRAFT_META && DRAFT_META.sources && DRAFT_META.sources.draft_order_source !== 'otc';
  const asOf = (DRAFT_META && DRAFT_META.board_last_changed) || 'unknown';
  const full = t => TEAM_NAMES[t] || t;
  return `<a class="draft-link" href="nfl-formation-view.html?panel=draft">Mock draft in FormationView &rarr;</a>
    <div class="note">Round 1. Board as of ${esc(asOf)}. ${simulated ? 'Simulated order (Mock Draft Hero).' : 'Order and pick ownership from OverTheCap, projected from current standings.'} Click a pick to open that team's Draft panel.</div>
    <div class="draft">${picks.map(p => `<a class="pick" href="nfl-formation-view.html?team=${encodeURIComponent(p.team)}&panel=draft">
      <span class="num">${esc(p.pick)}</span>${logoImg(p.team)}<span class="who">${esc(full(p.team))}${
      p.original_team && p.original_team !== p.team ? `<span class="from">from ${esc(full(p.original_team))}</span>` : ''}</span></a>`).join('')}</div>`;
}
function renderSeason(keepScroll) {
  const head = document.getElementById('seasonHead'), body = document.getElementById('seasonBody');
  const updated = !SEASON ? null : seasonTab === 'leaders' ? SEASON.leaders_updated : seasonTab === 'draft' ? null : SEASON.standings_updated;
  head.innerHTML = `<h2 class="panel-title">Season</h2>
    <div class="tabs" role="tablist">${SEASON_TABS.map(([k, label]) => `<button type="button" class="tab${k === seasonTab ? ' active' : ''}" role="tab" aria-selected="${k === seasonTab}" data-tab="${k}">${label}</button>`).join('')}</div>
    ${seasonTab === 'standings' ? `<div class="seg">${['AFC', 'NFC'].map(c => `<button type="button" class="tab${c === conf ? ' active' : ''}" aria-pressed="${c === conf}" data-conf-btn="${c}">${c}</button>`).join('')}</div>` : ''}
    ${updated ? `<span class="caption">To date, updated ${esc(updated)}</span>` : ''}`;
  const ready = seasonTab === 'draft' ? Array.isArray(DRAFT)
    : seasonTab === 'leaders' ? !!(SEASON && SEASON.leaders)
    : !!(SEASON && SEASON.standings && SEASON.playoff_picture);
  const render = { standings: standingsHtml, playoffs: playoffsHtml, leaders: leadersTabHtml, draft: draftHtml }[seasonTab];
  body.innerHTML = ready ? render() : '<div class="msg">No data for this tab yet.</div>';
  if (!keepScroll) body.scrollTop = 0;
}
document.getElementById('seasonHead').addEventListener('click', e => {
  const t = e.target.closest('button[data-tab], button[data-conf-btn]');
  if (!t) return;
  if (t.dataset.tab) seasonTab = t.dataset.tab; else conf = t.dataset.confBtn;
  renderSeason();
});

// ── LOAD ──
async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url);
  return res.json();
}
async function showWeek(w, gameId) {
  closeSidebar();
  currentWeek = w;
  document.getElementById('weekSel').value = String(w);
  const panel = document.getElementById('weekPanel');
  try {
    if (!weekCache[w]) weekCache[w] = await getJson(`data/review/week_${INDEX.season}_${w}.json`);
    if (currentWeek !== w) return; // a later switch won
    const data = weekCache[w];
    panel.innerHTML = weekHtml(data);
    panel.scrollTop = 0;
    document.getElementById('caption').textContent = `${data.partial ? `Week ${w} so far` : `Through Week ${w}`}, as of ${INDEX.last_changed}`;
    syncUrl();
    if (gameId) openSidebar(gameId);
  } catch (e) {
    panel.innerHTML = '<div class="msg">Could not load this week.</div>';
    document.getElementById('caption').textContent = '';
  }
}
(async function init() {
  const optional = url => getJson(url).catch(() => null);
  INDEX = await optional('data/review/index.json');
  const [master, draft, meta, season] = await Promise.all([
    optional('data/players_master.json'), optional('data/draft_order.json'), optional('data/draft_meta.json'),
    INDEX ? optional(`data/review/season_${Number(INDEX.season)}.json`) : null,
  ]);
  MASTER = master || {}; DRAFT = draft; DRAFT_META = meta; SEASON = season;
  Object.values(MASTER).forEach(p => { if (p.team && p.team_name) TEAM_NAMES[p.team] = p.team_name; });
  renderSeason();
  if (!INDEX || !INDEX.weeks || !INDEX.weeks.length) {
    document.getElementById('weekPanel').innerHTML = '<div class="msg">No ReView data yet.</div>';
    return;
  }
  const partial = INDEX.partial_weeks || {};
  const sel = document.getElementById('weekSel');
  sel.innerHTML = INDEX.weeks.slice().reverse().map(w =>
    `<option value="${esc(w)}">Week ${esc(w)}${partial[w] ? esc(` (in progress: ${gamesLeft(partial[w])})`) : ''}</option>`).join('');
  sel.addEventListener('change', () => showWeek(+sel.value));
  const q = new URLSearchParams(location.search);
  const asked = parseInt(q.get('week'), 10);
  showWeek(INDEX.weeks.includes(asked) ? asked : (INDEX.current_week || INDEX.latest_week), q.get('game'));
})();
</script>
