<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — IceView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  width: 520px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1130px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: compact rink ── */
.left-col { width: 598px; flex-shrink: 0; }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.court-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 500/470;
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 90px;
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: 60px; height: 60px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 15px;
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 14px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  text-align: center;
  white-space: nowrap;
  /* var(--text) is a light dark-theme color and is unreadable against
     the pale ice background -- every other sport's field/court/pitch
     is dark enough for it to work, ice isn't. Reusing .player-dot's
     existing dark color from this same file instead of inventing a
     new one. */
  color: #05261a;
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  color: var(--text-muted);
}

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 200px; max-height: 280px; overflow-y: auto;
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; }
.subs-row { display: flex; align-items: center; gap: 8px; padding: 6px 5px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 10px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: full bench list, no scroll ── */
.right-col { flex: 1; min-width: 0; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 9px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
.tag-rotation { background: rgba(0,212,255,.1); color: var(--accent); border: 1px solid rgba(0,212,255,.25); }
.tag-bench { background: rgba(125,135,168,.1); color: var(--text-muted); border: 1px solid rgba(125,135,168,.25); }

.bench-stat { width: 42px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }
.bench-stat-label { font-size: 7px; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; }
  .left-col { width: 100%; }
}

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 220px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: var(--text); }
.popup-stat-label { font-size: 9px; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=nhl'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">
      <img class="team-logo team-logo-header" id="teamLogoEl" alt="TOR">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px" id="teamNameEl">Toronto Maple Leafs</span>
    </div>
    <div class="teams-dropdown" id="teamsDropdown"></div>
  </div>

  <div class="view-toggle">
    <button class="view-btn active">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg>
      IceView
    </button>
    <button class="view-btn" onclick="window.location='player-table.html'">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="3" rx="1" fill="currentColor"/><rect x="1" y="5" width="10" height="3" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="9" width="10" height="2" rx="1" fill="currentColor" opacity=".3"/></svg>
      Table
    </button>
  </div>
</header>

<div class="wrap">
  <div class="left-col">
    <div class="court-label">
      <span>Starting Six</span>
    </div>

    <div class="court-canvas">
      <svg class="court-bg" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <defs>
          <pattern id="ice" x="0" y="0" width="500" height="40" patternUnits="userSpaceOnUse">
            <rect width="500" height="20" fill="#dcecf5"/>
            <rect y="20" width="500" height="20" fill="#d2e6f0"/>
          </pattern>
        </defs>
        <rect width="500" height="470" rx="60" fill="url(#ice)"/>
        <!-- rink boundary -->
        <rect x="10" y="10" width="480" height="450" rx="52" fill="none" stroke="#13141a" stroke-opacity="0.18" stroke-width="4"/>
        <!-- blue lines -->
        <line x1="10" y1="150" x2="490" y2="150" stroke="#1d5fb0" stroke-opacity="0.55" stroke-width="6"/>
        <line x1="10" y1="330" x2="490" y2="330" stroke="#1d5fb0" stroke-opacity="0.55" stroke-width="6"/>
        <!-- center red line -->
        <line x1="10" y1="240" x2="490" y2="240" stroke="#c0293c" stroke-opacity="0.5" stroke-width="4"/>
        <circle cx="250" cy="240" r="38" fill="none" stroke="#1d5fb0" stroke-opacity="0.4" stroke-width="2"/>
        <!-- attacking-zone faceoff circles -->
        <circle cx="120" cy="80" r="34" fill="none" stroke="#c0293c" stroke-opacity="0.35" stroke-width="2"/>
        <circle cx="380" cy="80" r="34" fill="none" stroke="#c0293c" stroke-opacity="0.35" stroke-width="2"/>
        <!-- goal crease -->
        <path d="M 210 12 Q 250 45 290 12" fill="#8fc4e8" fill-opacity="0.6" stroke="#c0293c" stroke-opacity="0.5" stroke-width="2"/>
        <!-- goal line -->
        <line x1="150" y1="14" x2="350" y2="14" stroke="#c0293c" stroke-opacity="0.5" stroke-width="3"/>
      </svg>
      <div class="players-layer" id="playersLayer"></div>
      <div class="subs-pop" id="subsPop"></div>
    </div>
    <div class="court-hint">Click a starter to see substitutes</div>
  </div>

  <div class="right-col">
    <div class="rotation-title">Bench &amp; Rotation (by Time on Ice)</div>
    <div class="bench-list" id="benchList"></div>
  </div>
</div>

<div class="player-popup" id="playerPopup"></div>

<script>
// ══════════════════════════════════════════
// TEAMS
// ══════════════════════════════════════════
const TEAMS = {
  ANA: { name: "Anaheim Ducks" },
  BOS: { name: "Boston Bruins" },
  BUF: { name: "Buffalo Sabres" },
  CAR: { name: "Carolina Hurricanes" },
  CBJ: { name: "Columbus Blue Jackets" },
  CGY: { name: "Calgary Flames" },
  CHI: { name: "Chicago Blackhawks" },
  COL: { name: "Colorado Avalanche" },
  DAL: { name: "Dallas Stars" },
  DET: { name: "Detroit Red Wings" },
  EDM: { name: "Edmonton Oilers" },
  FLA: { name: "Florida Panthers" },
  LAK: { name: "Los Angeles Kings" },
  MIN: { name: "Minnesota Wild" },
  MTL: { name: "Montréal Canadiens" },
  NJD: { name: "New Jersey Devils" },
  NSH: { name: "Nashville Predators" },
  NYI: { name: "New York Islanders" },
  NYR: { name: "New York Rangers" },
  OTT: { name: "Ottawa Senators" },
  PHI: { name: "Philadelphia Flyers" },
  PIT: { name: "Pittsburgh Penguins" },
  SEA: { name: "Seattle Kraken" },
  SJS: { name: "San Jose Sharks" },
  STL: { name: "St. Louis Blues" },
  TBL: { name: "Tampa Bay Lightning" },
  TOR: { name: "Toronto Maple Leafs" },
  UTA: { name: "Utah Mammoth" },
  VAN: { name: "Vancouver Canucks" },
  VGK: { name: "Vegas Golden Knights" },
  WPG: { name: "Winnipeg Jets" },
  WSH: { name: "Washington Capitals" },
};
const TEAM_ABBRS = Object.keys(TEAMS);

// ESPN's team-logo CDN, same host/pattern as NFL/NBA/MLB
// (a.espncdn.com/i/teamlogos/{sport}/500/{code}.png). Verified live
// before wiring in, not assumed -- all 32 codes below return 200.
// Three real exceptions found, same class as NBA's no/utah and MLB's
// ari/chw: Los Angeles is "la" (not "lak"), San Jose is "sj" (not
// "sjs"), Tampa Bay is "tb" (not "tbl"). New Jersey stayed "njd" full
// (did NOT shorten to "nj" like the other three-letter-to-two pattern
// might suggest) -- checked directly, not assumed from the others.
const ESPN_TEAM_CODES = {
  ANA: 'ana', BOS: 'bos', BUF: 'buf', CAR: 'car', CBJ: 'cbj',
  CGY: 'cgy', CHI: 'chi', COL: 'col', DAL: 'dal', DET: 'det',
  EDM: 'edm', FLA: 'fla', LAK: 'la', MIN: 'min', MTL: 'mtl',
  NJD: 'njd', NSH: 'nsh', NYI: 'nyi', NYR: 'nyr', OTT: 'ott',
  PHI: 'phi', PIT: 'pit', SEA: 'sea', SJS: 'sj', STL: 'stl',
  TBL: 'tb', TOR: 'tor', UTA: 'uta', VAN: 'van', VGK: 'vgk',
  WPG: 'wpg', WSH: 'wsh',
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/nhl/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// Rink zones (% of canvas). Rough first-pass placement -- will get
// corrected visually next round once rendered at real size, same as
// COURT_ZONES needed after its first real render. D1/D2 are two
// generic defenseman slots, not L/R-specific -- confirmed nhl_roster's
// position_code has no L-D/R-D split, just a single 'D' value.
const ICE_ZONES = {
  // Reordered by actual depth against the rink's real drawn markings
  // (crease ~3-10%, near blue line 32%, center line 51%, far blue line
  // 70%) -- goalie now sits in the crease, defense in the defensive
  // zone between the crease and the blue line, forwards up near center
  // ice, instead of the previous reversed layout.
  G:  { x: 50, y: 7 },
  D1: { x: 30, y: 26 },
  D2: { x: 70, y: 26 },
  LW: { x: 22, y: 55 },
  C:  { x: 50, y: 50 },
  RW: { x: 78, y: 55 },
};
const ZONE_ORDER = ['LW','C','RW','D1','D2','G'];
const ZONE_LABEL = { LW: 'LW', C: 'C', RW: 'RW', D1: 'D', D2: 'D', G: 'G' };

// Zone -> real position_code from nhl_roster (L/C/R for forwards, D for
// defensemen, G for goalies -- confirmed live, no LW/RW-specific codes
// exist in the source data, hence the LW/RW zone labels mapping to the
// same underlying 'L'/'R' codes real broadcasts also collapse together).
const ZONE_POSCODE = { LW: 'L', C: 'C', RW: 'R', D1: 'D', D2: 'D', G: 'G' };

// Zone -> position_group, used to gate substitution eligibility.
// Forward pool is positionless across LW/C/RW, D pool positionless
// across D1/D2 -- G is standalone (exact position_code match only, no
// cross-group subbing), same pattern as MLB's C/P/DH.
const ZONE_GROUP = { LW: 'forward', C: 'forward', RW: 'forward', D1: 'defenseman', D2: 'defenseman' };

let currentTeam = 'TOR';
let allPlayers = [];
let teamPlayers = [];
// Frontend-only view state for manual bench->ice substitutions -- keyed
// by rink zone, never written back to nhl_players_master.json, reset on
// every team switch (see loadTeam()), same convention as MLB/NBA.
let manualStarters = {};

// Shared 0-99 rating color scale, identical to nba/court-view.html and
// epl/pitch-view.html's ratingColor() -- NHL ratings are live now via
// nhlratings.net (ScraperAPI), so the dot switches from a stat-driven
// heuristic to the same rating-driven convention every other sport uses.
function ratingColor(r) {
  if (r == null) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function formatSavePct(v) {
  if (v == null || isNaN(v)) return null;
  return v.toFixed(3).replace(/^0\./, '.');
}
// timeOnIcePerGame comes back in seconds (confirmed live, e.g. 1379.13
// for McDavid == 22:59) -- not minutes, not a formatted string.
function formatToi(seconds) {
  if (seconds == null || isNaN(seconds)) return null;
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function formatHeight(inches) {
  if (inches == null) return null;
  const ft = Math.floor(inches / 12);
  const inch = inches % 12;
  return `${ft}'${inch}"`;
}

function mapPlayer(p) {
  const ss = p.skater_stats || null;
  const gs = p.goalie_stats || null;
  return {
    id: p.player_id,
    name: p.name,
    team: p.team_abbr,
    positionCode: p.position_code,
    positionGroup: p.position_group,
    jersey: p.jersey_number,
    shoots: p.shoots_catches,
    heightIn: p.height_in_inches,
    weight: p.weight_in_pounds,
    goals: ss ? ss.goals : null,
    assists: ss ? ss.assists : null,
    points: ss ? ss.points : null,
    pointsPerGame: ss ? ss.pointsPerGame : null,
    plusMinus: ss ? ss.plusMinus : null,
    shots: ss ? ss.shots : null,
    gamesPlayedSkater: ss ? ss.gamesPlayed : null,
    toiPerGame: ss ? ss.timeOnIcePerGame : null,
    gamesStarted: gs ? gs.gamesStarted : null,
    gamesPlayedGoalie: gs ? gs.gamesPlayed : null,
    wins: gs ? gs.wins : null,
    losses: gs ? gs.losses : null,
    savePct: gs ? gs.savePct : null,
    gaa: gs ? gs.goalsAgainstAverage : null,
    shutouts: gs ? gs.shutouts : null,
    rating: p.overall_rating,
    hasSkaterStats: !!ss,
    hasGoalieStats: !!gs,
  };
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/nhl_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
  } catch (e) {
    console.error('Failed to load nhl_players_master.json:', e);
    allPlayers = [];
  }
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderRink();
  renderBenchList();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING SIX (RINK)
// ══════════════════════════════════════════
function naturalCandidates(zone) {
  return teamPlayers.filter(p => p.positionCode === ZONE_POSCODE[zone]);
}

function getStarter(zone) {
  if (manualStarters[zone] != null) {
    const manual = teamPlayers.find(p => p.id === manualStarters[zone]);
    if (manual) return manual;
  }
  const usedElsewhere = new Set(
    Object.entries(manualStarters).filter(([k]) => k !== zone).map(([, id]) => id)
  );
  // D1 and D2 share the same position code ('D' in ZONE_POSCODE), so
  // resolving them independently can pick the same top-TOI defenseman
  // for both slots. When D2 is resolving naturally (no manual override
  // on D1), also exclude whoever D1 naturally resolves to. Safe from
  // recursion/cycles: D1's own resolution never looks at D2, and this
  // only recurses one level deep. If D1 IS manually set, this branch is
  // skipped entirely -- that case is already covered by the general
  // manualStarters exclusion above.
  if (zone === 'D2' && manualStarters['D1'] == null) {
    const d1 = getStarter('D1');
    if (d1) usedElsewhere.add(d1.id);
  }
  const candidates = naturalCandidates(zone).filter(p => !usedElsewhere.has(p.id));
  if (!candidates.length) return null;
  if (zone === 'G') {
    return candidates.slice().sort((a,b) => (b.gamesStarted||0) - (a.gamesStarted||0))[0];
  }
  return candidates.slice().sort((a,b) => (b.toiPerGame||0) - (a.toiPerGame||0))[0];
}

function renderRink() {
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(zone => {
    const dz = ICE_ZONES[zone];
    const p = getStarter(zone);
    if (!p) {
      return `
        <div class="player-card" data-pos="${zone}" style="left:${dz.x}%; top:${dz.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    return `
      <div class="player-card" data-pos="${zone}" data-pid="${p.id}" style="left:${dz.x}%; top:${dz.y}%">
        <div class="player-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-rank">${ZONE_LABEL[zone]}${p.jersey != null ? ' · #' + p.jersey : ''}</div>
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;
}

// ══════════════════════════════════════════
// BENCH & ROTATION LIST (everyone else, ranked
// by time on ice -- mirrors CourtView's single
// bench-by-minutes list, not MLB's two-list split)
// ══════════════════════════════════════════
function renderBenchList() {
  const list = document.getElementById('benchList');
  const startingIds = new Set(ZONE_ORDER.map(zone => getStarter(zone)?.id).filter(Boolean));
  // Goalies carry no timeOnIcePerGame (that's a skater-only stat) --
  // they sink to the bottom of a TOI-sorted list, which is fine for a
  // single-team roster with usually one backup goalie.
  // Same organizational-roster filter as subEligiblePlayers() above --
  // exclude anyone with zero games played this season, since they have
  // no real stats and were making this list needlessly long.
  const bench = teamPlayers
    .filter(p => !startingIds.has(p.id))
    .filter(p => (p.gamesPlayedSkater || 0) > 0 || (p.gamesPlayedGoalie || 0) > 0)
    .sort((a, b) => (b.toiPerGame || 0) - (a.toiPerGame || 0));

  if (!bench.length) {
    list.innerHTML = '<div class="bench-empty">No bench players on this roster yet.</div>';
    return;
  }

  list.innerHTML = bench.map((p, i) => {
    const isGoalie = p.positionCode === 'G';
    const dotVal = p.rating != null ? p.rating : '—';
    const dotColor = ratingColor(p.rating);
    const stats = isGoalie
      ? `
        <div class="bench-stat"><div class="bench-stat-val">${p.wins != null && p.losses != null ? p.wins + '-' + p.losses : '—'}</div><div class="bench-stat-label">w-l</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.gaa != null ? p.gaa.toFixed(2) : '—'}</div><div class="bench-stat-label">gaa</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${formatSavePct(p.savePct) || '—'}</div><div class="bench-stat-label">sv%</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.shutouts != null ? p.shutouts : '—'}</div><div class="bench-stat-label">so</div></div>
      `
      : `
        <div class="bench-stat"><div class="bench-stat-val">${p.goals != null ? p.goals : '—'}</div><div class="bench-stat-label">g</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.assists != null ? p.assists : '—'}</div><div class="bench-stat-label">a</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.points != null ? p.points : '—'}</div><div class="bench-stat-label">p</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${formatToi(p.toiPerGame) || '—'}</div><div class="bench-stat-label">toi</div></div>
      `;
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${dotColor}">${dotVal}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${p.positionCode || ''}</div>
        </div>
        ${stats}
      </div>
    `;
  }).join('');
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP (hover, rink cards AND
// bench rows -- both wired via the same
// per-node mouseenter/mouseleave mechanics)
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (click a starter -> popover of
// eligible bench players, gated by position_group
// for forward/defenseman zones, exact position for G)
// ══════════════════════════════════════════
let openPopoverPos = null;

function subEligiblePlayers(zone) {
  const allStarterIds = new Set(ZONE_ORDER.map(z => getStarter(z)?.id).filter(Boolean));
  let pool;
  if (ZONE_GROUP[zone]) {
    pool = teamPlayers.filter(p => p.positionGroup === ZONE_GROUP[zone]);
  } else {
    pool = teamPlayers.filter(p => p.positionCode === ZONE_POSCODE[zone]);
  }
  pool = pool.filter(p => !allStarterIds.has(p.id));
  // Roster data includes the full organization -- prospects, AHL
  // players, recent draft picks who've never appeared in an NHL game.
  // These have no real stats to compare and just add noise to the
  // substitution list, so exclude anyone with zero games played this
  // season (skater or goalie) from being a sub candidate at all.
  pool = pool.filter(p => (p.gamesPlayedSkater || 0) > 0 || (p.gamesPlayedGoalie || 0) > 0);
  if (zone === 'G') {
    return pool.sort((a,b) => (b.gamesStarted||0) - (a.gamesStarted||0));
  }
  return pool.sort((a,b) => (b.toiPerGame||0) - (a.toiPerGame||0));
}

function subsLabel(zone) {
  if (zone === 'G') return 'Sub in (goalies)';
  if (ZONE_GROUP[zone] === 'forward') return 'Sub in (forwards)';
  if (ZONE_GROUP[zone] === 'defenseman') return 'Sub in (defensemen)';
  return 'Sub in';
}

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
      const zone = card.dataset.pos;
      const popover = document.getElementById('subsPop');
      if (openPopoverPos === zone) {
        popover.classList.remove('open');
        openPopoverPos = null;
        return;
      }
      const subs = subEligiblePlayers(zone);
      const isGoalie = zone === 'G';

      popover.innerHTML = `<div class="subs-pop-label">${subsLabel(zone)}</div>` +
        (subs.length ? subs.map(s => `
          <div class="subs-row" data-pid="${s.id}">
            <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating != null ? s.rating : '—'}</div>
            <div class="subs-name">${s.name}</div>
            <div class="subs-mpg">${isGoalie ? (s.gamesStarted || 0) + ' gs' : (formatToi(s.toiPerGame) || '—')}</div>
          </div>`).join('') : `<div class="subs-empty">No eligible bench players</div>`);

      const rinkCanvas = card.closest('.court-canvas');
      const rect = card.getBoundingClientRect();
      const parentRect = rinkCanvas.getBoundingClientRect();
      popover.style.left = (rect.left - parentRect.left + 34) + 'px';
      popover.style.top = (rect.top - parentRect.top) + 'px';
      popover.classList.add('open');
      openPopoverPos = zone;

      popover.querySelectorAll('.subs-row').forEach(row => {
        row.addEventListener('click', (ev) => {
          ev.stopPropagation();
          substitutePlayer(row.dataset.pid, zone);
          popover.classList.remove('open');
          openPopoverPos = null;
        });
      });
    });
  });
}

function substitutePlayer(pid, targetZone) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  manualStarters[targetZone] = p.id;
  hidePopup();
  renderRink();
  renderBenchList();
}

function skaterStatGrid(p) {
  return `
    <div class="popup-stat-grid">
      <div class="popup-stat"><div class="popup-stat-val">${p.goals != null ? p.goals : '—'}</div><div class="popup-stat-label">G</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.assists != null ? p.assists : '—'}</div><div class="popup-stat-label">A</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.points != null ? p.points : '—'}</div><div class="popup-stat-label">P</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.plusMinus != null ? p.plusMinus : '—'}</div><div class="popup-stat-label">+/-</div></div>
    </div>
  `;
}
function goalieStatGrid(p) {
  const wl = (p.wins != null && p.losses != null) ? `${p.wins}-${p.losses}` : '—';
  return `
    <div class="popup-stat-grid">
      <div class="popup-stat"><div class="popup-stat-val">${wl}</div><div class="popup-stat-label">W-L</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.gaa != null ? p.gaa.toFixed(2) : '—'}</div><div class="popup-stat-label">GAA</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${formatSavePct(p.savePct) || '—'}</div><div class="popup-stat-label">SV%</div></div>
      <div class="popup-stat"><div class="popup-stat-val">${p.shutouts != null ? p.shutouts : '—'}</div><div class="popup-stat-label">SO</div></div>
    </div>
  `;
}

function popupHTML(p) {
  const isGoalie = p.positionCode === 'G';
  const bio = [formatHeight(p.heightIn), p.weight != null ? p.weight + ' lbs' : null].filter(Boolean).join(' · ');
  const shootsCatches = p.shoots ? (isGoalie ? 'Catches: ' + p.shoots : 'Shoots: ' + p.shoots) : null;

  const statsSection = isGoalie ? goalieStatGrid(p) : skaterStatGrid(p);
  const games = isGoalie
    ? `${p.gamesPlayedGoalie != null ? p.gamesPlayedGoalie : '—'} GP · ${p.gamesStarted != null ? p.gamesStarted : '—'} GS`
    : `${p.gamesPlayedSkater != null ? p.gamesPlayedSkater : '—'} GP · ${formatToi(p.toiPerGame) || '—'} TOI/G`;

  return `
    <div class="popup-header">
      <div class="popup-jersey">${p.jersey != null ? '#' + p.jersey : ''}</div>
      <div class="popup-name">${p.name}</div>
      <div class="popup-pos">${p.positionCode || ''}</div>
    </div>
    ${statsSection}
    <div class="popup-divider"></div>
    <div class="popup-row"><span class="popup-row-label">Games</span><span class="popup-row-val">${games}</span></div>
    ${bio ? `<div class="popup-row"><span class="popup-row-label">Bio</span><span class="popup-row-val">${bio}</span></div>` : ''}
    ${shootsCatches ? `<div class="popup-row"><span class="popup-row-label">Hand</span><span class="popup-row-val">${shootsCatches}</span></div>` : ''}
  `;
}

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin; // flip to the left of the anchor
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function showPopup(pid, anchorEl) {
  const p = teamPlayers.find(pl => String(pl.id) === String(pid));
  if (!p) return;
  const popup = document.getElementById('playerPopup');
  popup.innerHTML = popupHTML(p);
  popup.style.display = 'block';
  positionPopup(popup, anchorEl);
}

function hidePopup() {
  document.getElementById('playerPopup').style.display = 'none';
}

// ══════════════════════════════════════════
// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
buildTeamsDropdown();
loadTeam(currentTeam);
</script>
</body>
</html>
