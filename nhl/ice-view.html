<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FieldView — IceView</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13141a;
  --surface: #111318;
  --surface2: #181c24;
  --border: #1e2330;
  --border2: #262d3d;
  --text: #e8eaf0;
  --text-muted: #6b7494;
  --text-dim: #404660;
  --accent: #00d4ff;
  --gold: #f5a623;
  --green: #22c55e;
  --red: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: #0d1118;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 200;
}

.logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--accent);
  cursor: pointer;
}
.logo span { color: var(--text-muted); font-weight: 400; }

.header-divider { width: 1px; height: 24px; background: var(--border2); }

.team-logo { object-fit: contain; flex-shrink: 0; }
.team-logo-header { width: 34px; height: 34px; }
.team-logo-opt {
  width: 52px; height: 52px;
  padding: 6px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border2);
}

.team-selector-wrap { position: relative; }

.teams-dropdown {
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px;
  z-index: 300;
  display: none;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  width: 520px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
}
.teams-dropdown.open { display: grid; }

.team-opt {
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  transition: background .15s;
}
.team-opt:hover { background: var(--border); color: var(--text); }
.team-opt.selected { background: rgba(0,212,255,.1); color: var(--accent); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 3px;
}

.view-btn {
  background: none;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.view-btn:hover { color: var(--text); }
.view-btn.active { background: var(--border2); color: var(--text); }

/* ── LAYOUT ── */
.wrap {
  display: flex;
  gap: 20px;
  max-width: 1130px;
  margin: 16px auto;
  padding: 0 16px;
  align-items: flex-start;
}

/* ── LEFT: compact rink ── */
.left-col { width: 598px; flex-shrink: 0; }

.court-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.court-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 500/470;
  border-radius: 8px;
}

.court-bg { width: 100%; height: 100%; display: block; border-radius: 8px; }

.players-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
}

/* ── PLAYER CARD (compact dot) ── */
.player-card {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 90px;
  cursor: pointer;
  z-index: 20;
}
.player-card:hover { z-index: 100; }

.player-dot {
  width: 60px; height: 60px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 15px;
  color: #05261a;
  border: 2px solid rgba(0,0,0,.25);
  transition: transform .1s;
}
.player-card:hover .player-dot { transform: scale(1.1); }

.player-dot-empty {
  background: transparent !important;
  border: 2px dashed var(--border2);
  color: var(--text-dim) !important;
  font-size: 14px;
}

.player-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 15px;
  text-align: center;
  white-space: nowrap;
  /* var(--text) is a light dark-theme color and is unreadable against
     the pale ice background -- every other sport's field/court/pitch
     is dark enough for it to work, ice isn't. Reusing .player-dot's
     existing dark color from this same file instead of inventing a
     new one. */
  color: #05261a;
}

.player-rank {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .3px;
  text-align: center;
  white-space: nowrap;
  color: var(--text-muted);
}

.court-hint { font-size: 10px; color: var(--text-dim); margin-top: 8px; font-style: italic; }

/* ── SUBS POPOVER ── */
.subs-pop {
  position: absolute; z-index: 50;
  background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
  padding: 6px; width: 200px; max-height: 280px; overflow-y: auto;
  box-shadow: 0 8px 20px rgba(0,0,0,.4);
  display: none;
}
.subs-pop.open { display: block; }
.subs-pop-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); padding: 2px 4px 5px; }
.subs-row { display: flex; align-items: center; gap: 8px; padding: 6px 5px; border-radius: 5px; cursor: pointer; }
.subs-row:hover { background: var(--border); }
.subs-dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:900; color:#05261a; font-family:'Barlow Condensed'; }
.subs-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subs-mpg { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.subs-empty { font-size: 10px; color: var(--text-dim); padding: 4px; }

/* ── RIGHT: full bench list, no scroll ── */
.right-col { flex: 1; min-width: 0; }

.rotation-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.bench-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.bench-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
.bench-row:last-child { border-bottom: none; }
.bench-rank { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); width: 14px; text-align: center; flex-shrink: 0; }
.bench-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 13px; color: #05261a; flex-shrink: 0; }
.bench-name-block { flex: 1; min-width: 80px; }
.bench-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench-meta { font-size: 9px; color: var(--text-dim); display: flex; gap: 5px; align-items: center; }

.tag {
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 2px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.tag-starter { background: rgba(34,197,94,.1); color: var(--green); border: 1px solid rgba(34,197,94,.25); }
.tag-rotation { background: rgba(0,212,255,.1); color: var(--accent); border: 1px solid rgba(0,212,255,.25); }
.tag-bench { background: rgba(125,135,168,.1); color: var(--text-muted); border: 1px solid rgba(125,135,168,.25); }

.bench-stat { width: 42px; flex-shrink: 0; text-align: center; }
.bench-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }
.bench-stat-label { font-size: 7px; color: var(--text-dim); letter-spacing: .3px; text-transform: uppercase; }

.bench-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-dim);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-size: 13px;
}

/* ── SIDEBAR ── */
.sb-toggle {
  margin-left: auto;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 7px 14px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
}
.sb-toggle:hover { color: var(--text); }
.sb-toggle.on { color: var(--accent); border-color: rgba(0,212,255,.4); }
.sb-toggle + .view-toggle { margin-left: 0; }

/* ── PLAYER SIDEBAR (replaces the batting-order / pitching-staff column while open) ── */
.sidebar {
  display: none;
  position: relative;
  flex: 1;
  min-width: 0;
  align-self: stretch;
  background: #14171f;
  border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 13px;
}
body.sb-open .sidebar { display: block; }
.sb-scroll { position: absolute; inset: 0; overflow-y: auto; border-radius: 8px; }
body.sb-open .right-col { display: none; }

.sb-close {
  position: absolute;
  top: 8px; right: 10px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 22px; line-height: 1;
  cursor: pointer;
}
.sb-close:hover { color: var(--text); }
.sb-head { padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
.sb-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; color: var(--text); line-height: 1.1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sb-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
.sb-rating { text-align: center; flex-shrink: 0; }
.sb-rating-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; line-height: 1; }
.sb-rating-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-pill { border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
.sb-pill.inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); }
.sb-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.sb-section-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.sb-stat { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-section-title + .sb-stat { border-top: none; }
.sb-stat-top { display: flex; justify-content: space-between; align-items: baseline; }
.sb-stat-label { font-size: 12px; color: var(--text); }
.sb-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 17px; color: var(--text); }
.sb-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.sb-bar-fill { height: 100%; border-radius: 3px; }
.sb-low { font-size: 10px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
.sb-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-def { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-caption { font-size: 10px; color: var(--text-dim); margin-top: 6px; }
.sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 8px; }
.sb-cell-label { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-dim); }
.sb-cell-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.2; }
.sb-tbl { display: grid; grid-template-columns: 1fr 80px 80px; align-items: center; }
.sb-tbl > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl > div:nth-child(-n+3) { border-top: none; }
.sb-tbl-h { text-align: right; font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-tbl-l { font-size: 12px; color: var(--text-muted); }
.sb-tbl-v { text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: var(--text); }
.sb-tbl-v.best { font-weight: 800; color: #22c55e; }
.sb-sub { display: flex; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; cursor: pointer; border-radius: 6px; }
.sb-sub:hover { background: var(--border); }
.sb-sub-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; width: 32px; text-align: center; flex-shrink: 0; }
.sb-sub-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-sub-pos { font-size: 11px; color: var(--text-muted); }
.sb-empty { font-size: 12px; color: var(--text-dim); }
.sb-cmp-actions { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.sb-btn { flex: 1; padding: 8px 0; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
.sb-btn:hover { background: var(--border); }
.sb-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.sb-btn.primary:hover { filter: brightness(1.1); }
.sb-cmp-head { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 40px 12px 16px; border-bottom: 1px solid var(--border); }
.sb-cmp-tagline { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); }
.sb-cmp-name { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; color: var(--text); line-height: 1.1; }
.sb-cmp-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sb-cmp-rating { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; line-height: 1; margin-top: 4px; }
.sb-cmp-row { padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-cmp-row:first-of-type { border-top: none; }
.sb-cmp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
.sb-cmp-line { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.sb-cmp-tag { width: 104px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-cmp-val { width: 46px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; color: var(--text); }
.sb-cmp-pct { font-size: 11px; font-weight: 700; min-width: 58px; text-align: right; white-space: nowrap; }
.sb-note { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.sb-sort { display: flex; align-items: center; justify-content: space-between; }
.sb-tbl3 { display: grid; grid-template-columns: 1fr 84px 84px; align-items: center; }
.sb-tbl3 > div { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.sb-tbl3 > div:nth-child(-n+3) { border-top: none; }
.sb-pill.sus { background: rgba(245,166,35,.15); color: var(--gold); border: 1px solid rgba(245,166,35,.4); }
.sb-teamlogo { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; margin-right: 3px; }
.reset-btn { background: none; border: 1px solid var(--border2); border-radius: 6px; padding: 3px 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); cursor: pointer; }
.reset-btn:hover { color: var(--text); background: var(--border); }
.court-label-r { display: flex; align-items: baseline; gap: 12px; }
.player-card.selected { z-index: 90; }
.player-card.selected .player-dot { box-shadow: 0 0 0 3px var(--accent), 0 0 18px rgba(0,212,255,.55); }
.pop-inj { background: rgba(239,68,68,.2); color: #ef4444; border: 1px solid rgba(239,68,68,.4); border-radius: 3px; font-size: 10px; font-weight: 800; padding: 1px 5px; letter-spacing: 1px; }
@media (max-width: 700px) { .sidebar { min-height: 480px; } }

.sort-toggle { display: inline-flex; border: 1px solid var(--border2); border-radius: 5px; overflow: hidden; flex-shrink: 0; margin-left: 10px; vertical-align: middle; }
.sort-toggle button { background: none; border: none; color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .5px; text-transform: uppercase; padding: 2px 7px; cursor: pointer; }
.sort-toggle button.active { background: rgba(0,212,255,.15); color: var(--accent); }
.subs-pop-label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }

@media (max-width: 700px) {
  .header { padding: 0 12px; }
  .wrap { flex-direction: column; padding: 0 12px; }
  .left-col { width: 100%; }
}

/* ── PLAYER STAT POPUP ── */
.player-popup {
  display: none;
  position: fixed;
  z-index: 500;
  width: 220px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 16px 48px rgba(0,0,0,.6);
  pointer-events: none;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.popup-jersey { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.popup-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; color: var(--text);
  flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.popup-pos { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 11px; color: var(--text-dim); text-transform: uppercase; flex-shrink: 0; }
.popup-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.popup-stat { text-align: center; }
.popup-stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 15px; color: var(--text); }
.popup-stat-label { font-size: 9px; color: var(--text-dim); letter-spacing: .5px; text-transform: uppercase; }
.popup-divider { height: 1px; background: var(--border); margin: 6px 0; }
.popup-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 2px 0; }
.popup-row-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; font-size: 10px; flex-shrink: 0; }
.popup-row-val { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="window.location='../index.html?sport=nhl'">Field<span>View</span></div>
  <div class="header-divider"></div>

  <div class="team-selector-wrap">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px" onclick="toggleTeamDropdown()">
      <img class="team-logo team-logo-header" id="teamLogoEl" alt="TOR">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px" id="teamNameEl">Toronto Maple Leafs</span>
    </div>
    <div class="teams-dropdown" id="teamsDropdown"></div>
  </div>

        <line x1="10" y1="330" x2="490" y2="330" stroke="#1d5fb0" stroke-opacity="0.55" stroke-width="6"/>

        <line x1="10" y1="240" x2="490" y2="240" stroke="#c0293c" stroke-opacity="0.5" stroke-width="4"/>
        <circle cx="250" cy="240" r="38" fill="none" stroke="#1d5fb0" stroke-opacity="0.4" stroke-width="2"/>
        <!-- attacking-zone faceoff circles -->
        <circle cx="120" cy="80" r="34" fill="none" stroke="#c0293c" stroke-opacity="0.35" stroke-width="2"/>
        <circle cx="380" cy="80" r="34" fill="none" stroke="#c0293c" stroke-opacity="0.35" stroke-width="2"/>
        <!-- goal crease -->
        <path d="M 210 12 Q 250 45 290 12" fill="#8fc4e8" fill-opacity="0.6" stroke="#c0293c" stroke-opacity="0.5" stroke-width="2"/>
        <!-- goal line -->
        <line x1="150" y1="14" x2="350" y2="14" stroke="#c0293c" stroke-opacity="0.5" stroke-width="3"/>

  <aside class="sidebar" id="playerSidebar" aria-label="Player details"><div class="sb-scroll" id="sbScroll"></div></aside>

<div class="player-popup" id="playerPopup"></div>

<script>
// ══════════════════════════════════════════
// TEAMS
// ══════════════════════════════════════════
const TEAMS = {
  ANA: { name: "Anaheim Ducks" },
  BOS: { name: "Boston Bruins" },
  BUF: { name: "Buffalo Sabres" },
  CAR: { name: "Carolina Hurricanes" },
  CBJ: { name: "Columbus Blue Jackets" },
  CGY: { name: "Calgary Flames" },
  CHI: { name: "Chicago Blackhawks" },
  COL: { name: "Colorado Avalanche" },
  DAL: { name: "Dallas Stars" },
  DET: { name: "Detroit Red Wings" },
  EDM: { name: "Edmonton Oilers" },
  FLA: { name: "Florida Panthers" },
  LAK: { name: "Los Angeles Kings" },
  MIN: { name: "Minnesota Wild" },
  MTL: { name: "Montréal Canadiens" },
  NJD: { name: "New Jersey Devils" },
  NSH: { name: "Nashville Predators" },
  NYI: { name: "New York Islanders" },
  NYR: { name: "New York Rangers" },
  OTT: { name: "Ottawa Senators" },
  PHI: { name: "Philadelphia Flyers" },
  PIT: { name: "Pittsburgh Penguins" },
  SEA: { name: "Seattle Kraken" },
  SJS: { name: "San Jose Sharks" },
  STL: { name: "St. Louis Blues" },
  TBL: { name: "Tampa Bay Lightning" },
  TOR: { name: "Toronto Maple Leafs" },
  UTA: { name: "Utah Mammoth" },
  VAN: { name: "Vancouver Canucks" },
  VGK: { name: "Vegas Golden Knights" },
  WPG: { name: "Winnipeg Jets" },
  WSH: { name: "Washington Capitals" },
};
const TEAM_ABBRS = Object.keys(TEAMS);

// ESPN's team-logo CDN, same host/pattern as NFL/NBA/MLB
// (a.espncdn.com/i/teamlogos/{sport}/500/{code}.png). Verified live
// before wiring in, not assumed -- all 32 codes below return 200.
// Three real exceptions found, same class as NBA's no/utah and MLB's
// ari/chw: Los Angeles is "la" (not "lak"), San Jose is "sj" (not
// "sjs"), Tampa Bay is "tb" (not "tbl"). New Jersey stayed "njd" full
// (did NOT shorten to "nj" like the other three-letter-to-two pattern
// might suggest) -- checked directly, not assumed from the others.
const ESPN_TEAM_CODES = {
  ANA: 'ana', BOS: 'bos', BUF: 'buf', CAR: 'car', CBJ: 'cbj',
  CGY: 'cgy', CHI: 'chi', COL: 'col', DAL: 'dal', DET: 'det',
  EDM: 'edm', FLA: 'fla', LAK: 'la', MIN: 'min', MTL: 'mtl',
  NJD: 'njd', NSH: 'nsh', NYI: 'nyi', NYR: 'nyr', OTT: 'ott',
  PHI: 'phi', PIT: 'pit', SEA: 'sea', SJS: 'sj', STL: 'stl',
  TBL: 'tb', TOR: 'tor', UTA: 'uta', VAN: 'van', VGK: 'vgk',
  WPG: 'wpg', WSH: 'wsh',
};
function teamLogoUrl(abbr) {
  return `https://a.espncdn.com/i/teamlogos/nhl/500/${ESPN_TEAM_CODES[abbr]}.png`;
}

// Rink zones (% of canvas). Rough first-pass placement -- will get
// corrected visually next round once rendered at real size, same as
// COURT_ZONES needed after its first real render. D1/D2 are two
// generic defenseman slots, not L/R-specific -- confirmed nhl_roster's
// position_code has no L-D/R-D split, just a single 'D' value.
const ICE_ZONES = {
  // Reordered by actual depth against the rink's real drawn markings
  // (crease ~3-10%, near blue line 32%, center line 51%, far blue line
  // 70%) -- goalie now sits in the crease, defense in the defensive
  // zone between the crease and the blue line, forwards up near center
  // ice, instead of the previous reversed layout.
  G:  { x: 50, y: 7 },
  D1: { x: 30, y: 26 },
  D2: { x: 70, y: 26 },
  LW: { x: 22, y: 55 },
  C:  { x: 50, y: 50 },
  RW: { x: 78, y: 55 },
};
const ZONE_ORDER = ['LW','C','RW','D1','D2','G'];
const ZONE_LABEL = { LW: 'LW', C: 'C', RW: 'RW', D1: 'D', D2: 'D', G: 'G' };

// Zone -> real position_code from nhl_roster (L/C/R for forwards, D for
// defensemen, G for goalies -- confirmed live, no LW/RW-specific codes
// exist in the source data, hence the LW/RW zone labels mapping to the
// same underlying 'L'/'R' codes real broadcasts also collapse together).
const ZONE_POSCODE = { LW: 'L', C: 'C', RW: 'R', D1: 'D', D2: 'D', G: 'G' };

// Zone -> position_group, used to gate substitution eligibility.
// Forward pool is positionless across LW/C/RW, D pool positionless
// across D1/D2 -- G is standalone (exact position_code match only, no
// cross-group subbing), same pattern as MLB's C/P/DH.
const ZONE_GROUP = { LW: 'forward', C: 'forward', RW: 'forward', D1: 'defenseman', D2: 'defenseman' };

let currentTeam = 'TOR';
let allPlayers = [];
let teamPlayers = [];
// Frontend-only view state for manual bench->ice substitutions -- keyed
// by rink zone, never written back to nhl_players_master.json, reset on
// every team switch (see loadTeam()), same convention as MLB/NBA.
let manualStarters = {};

// Shared 0-99 rating color scale, identical to nba/court-view.html and
// epl/pitch-view.html's ratingColor() -- NHL ratings are live now via
// nhlratings.net (ScraperAPI), so the dot switches from a stat-driven
// heuristic to the same rating-driven convention every other sport uses.
function ratingColor(r) {
  if (r == null) return '#6b7494';
  if (r >= 95) return '#86efac';
  if (r >= 90) { const t=(r-90)/5; return 'hsl('+(140+t*20)+',60%,62%)'; }
  if (r >= 85) { const t=(r-85)/5; return 'hsl('+(100+t*40)+',55%,58%)'; }
  if (r >= 80) { const t=(r-80)/5; return 'hsl('+(75+t*25)+',55%,58%)'; }
  if (r >= 75) { const t=(r-75)/5; return 'hsl('+(55+t*20)+',60%,58%)'; }
  if (r >= 70) { const t=(r-70)/5; return 'hsl('+(38+t*17)+',65%,55%)'; }
  if (r >= 65) { const t=(r-65)/5; return 'hsl('+(25+t*13)+',65%,52%)'; }
  return 'hsl('+Math.max(0,(r-55)*2)+',70%,48%)';
}

function formatSavePct(v) {
  if (v == null || isNaN(v)) return null;
  return v.toFixed(3).replace(/^0\./, '.');
}
// timeOnIcePerGame comes back in seconds (confirmed live, e.g. 1379.13
// for McDavid == 22:59) -- not minutes, not a formatted string.
function formatToi(seconds) {
  if (seconds == null || isNaN(seconds)) return null;
  const m = Math.floor(seconds / 60);
  const s = Math.round(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function formatHeight(inches) {
  if (inches == null) return null;
  const ft = Math.floor(inches / 12);
  const inch = inches % 12;
  return `${ft}'${inch}"`;
}

function mapPlayer(p) {
  const ss = p.skater_stats || null;
  const gs = p.goalie_stats || null;
  return {
    id: p.player_id,
    name: p.name,
    team: p.team_abbr,
    positionCode: p.position_code,
    positionGroup: p.position_group,
    jersey: p.jersey_number,
    shoots: p.shoots_catches,
    heightIn: p.height_in_inches,
    weight: p.weight_in_pounds,
    goals: ss ? ss.goals : null,
    assists: ss ? ss.assists : null,
    points: ss ? ss.points : null,
    pointsPerGame: ss ? ss.pointsPerGame : null,
    plusMinus: ss ? ss.plusMinus : null,
    shots: ss ? ss.shots : null,
    gamesPlayedSkater: ss ? ss.gamesPlayed : null,
    toiPerGame: ss ? ss.timeOnIcePerGame : null,
    gamesStarted: gs ? gs.gamesStarted : null,
    gamesPlayedGoalie: gs ? gs.gamesPlayed : null,
    wins: gs ? gs.wins : null,
    losses: gs ? gs.losses : null,
    savePct: gs ? gs.savePct : null,
    gaa: gs ? gs.goalsAgainstAverage : null,
    shutouts: gs ? gs.shutouts : null,
    rating: p.overall_rating,
    birthDate: p.birth_date,
    cur: ss || gs,                                  // this season's block (skater or goalie keys)
    curSeason: (ss || gs) ? (ss || gs).seasonId : null,
    prev: p.prev_season || null,                    // last season's block, same keys
    prevSeason: p.prev_season ? p.prev_season.seasonId : null,
    hasSkaterStats: !!ss,
    hasGoalieStats: !!gs,
  };
}

async function loadAllPlayers() {
  try {
    const res = await fetch('data/nhl_players_master.json');
    const raw = await res.json();
    allPlayers = Object.values(raw).map(mapPlayer);
    buildAdv();
  } catch (e) {
    console.error('Failed to load nhl_players_master.json:', e);
    allPlayers = [];
  }
}

async function loadTeam(abbr) {
  if (!allPlayers.length) await loadAllPlayers();
  hidePopup();
  manualStarters = {};
  sidebarZone = null; compareId = null;
  document.body.classList.remove('sb-open');
  teamPlayers = allPlayers.filter(p => p.team === abbr);
  updateHeader();
  renderRink();
  renderBenchList();
}

function updateHeader() {
  const team = TEAMS[currentTeam];
  const logo = document.getElementById('teamLogoEl');
  logo.src = teamLogoUrl(currentTeam);
  logo.alt = currentTeam;
  document.getElementById('teamNameEl').textContent = team.name;
}

// ══════════════════════════════════════════
// STARTING SIX (RINK)
// ══════════════════════════════════════════
function naturalCandidates(zone) {
  return teamPlayers.filter(p => p.positionCode === ZONE_POSCODE[zone]);
}

function getStarter(zone) {
  if (manualStarters[zone] != null) {
    const manual = teamPlayers.find(p => p.id === manualStarters[zone]);
    if (manual) return manual;
  }
  const usedElsewhere = new Set(
    Object.entries(manualStarters).filter(([k]) => k !== zone).map(([, id]) => id)
  );
  // D1 and D2 share the same position code ('D' in ZONE_POSCODE), so
  // resolving them independently can pick the same top-TOI defenseman
  // for both slots. When D2 is resolving naturally (no manual override
  // on D1), also exclude whoever D1 naturally resolves to. Safe from
  // recursion/cycles: D1's own resolution never looks at D2, and this
  // only recurses one level deep. If D1 IS manually set, this branch is
  // skipped entirely -- that case is already covered by the general
  // manualStarters exclusion above.
  if (zone === 'D2' && manualStarters['D1'] == null) {
    const d1 = getStarter('D1');
    if (d1) usedElsewhere.add(d1.id);
  }
  const candidates = naturalCandidates(zone).filter(p => !usedElsewhere.has(p.id));
  if (!candidates.length) return null;
  if (zone === 'G') {
    return candidates.slice().sort((a,b) => (b.gamesStarted||0) - (a.gamesStarted||0))[0];
  }
  return candidates.slice().sort((a,b) => (b.toiPerGame||0) - (a.toiPerGame||0))[0];
}

function renderRink() {
  const layer = document.getElementById('playersLayer');
  const html = ZONE_ORDER.map(zone => {
    const dz = ICE_ZONES[zone];
    const p = getStarter(zone);
    if (!p) {
      return `
        <div class="player-card" data-pos="${zone}" style="left:${dz.x}%; top:${dz.y}%">
          <div class="player-dot player-dot-empty">—</div>
          <div class="player-name" style="color:var(--text-dim)">No Player</div>
        </div>
      `;
    }
    return `
      <div class="player-card" data-pos="${zone}" data-pid="${p.id}" style="left:${dz.x}%; top:${dz.y}%">
        <div class="player-dot" style="background:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-rank">${ZONE_LABEL[zone]}${p.jersey != null ? ' · #' + p.jersey : ''}</div>
      </div>
    `;
  }).join('');
  layer.innerHTML = html;
  attachPopupHandlers(layer);
  attachSubsPopoverHandlers(layer);

  const popover = document.getElementById('subsPop');
  popover.classList.remove('open');
  openPopoverPos = null;

  // Keep the sidebar in step with the rink: refresh it (or close it if its zone has no player now).
  if (sidebarZone) renderSidebar();
  setSelectedHighlight();
  updateResetBtn();
}

// ══════════════════════════════════════════
// BENCH & ROTATION LIST (everyone else, ranked
// by time on ice -- mirrors CourtView's single
// bench-by-minutes list, not MLB's two-list split)
// ══════════════════════════════════════════
// Shared sub sort (popover, sidebar, bench list): 'rating' or 'toi' (time on ice for skaters, games started for goalies).
// Nulls last; the other metric breaks ties. Default = toi (the original order).
const SUBSORT_KEY = 'fieldview_nhl_subsort';
let subSort = 'toi';
try { const v = localStorage.getItem(SUBSORT_KEY); if (v === 'rating' || v === 'toi') subSort = v; } catch (e) {}
function sortSubs(list, isG) {
  const t = p => isG ? p.gamesStarted : p.toiPerGame, r = p => p.rating;
  const cmp = (a, b, f) => (f(a) == null) - (f(b) == null) || (f(b) - f(a)) || 0;
  return list.slice().sort(subSort === 'rating' ? (a, b) => cmp(a, b, r) || cmp(a, b, t) : (a, b) => cmp(a, b, t) || cmp(a, b, r));
}
function renderSortToggles() {
  document.querySelectorAll('[data-sort-toggle]').forEach(el => {
    const g = !el.closest('#benchList') && (sidebarZone || openPopoverPos) === 'G' && !el.closest('.rotation-title');
    el.innerHTML = `<button data-sort="rating" class="${subSort === 'rating' ? 'active' : ''}">Rating</button>` +
                   `<button data-sort="toi" class="${subSort === 'toi' ? 'active' : ''}">${g ? 'GS' : 'TOI'}</button>`;
    el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', ev => { ev.stopPropagation(); setSubSort(btn.dataset.sort); }));
  });
}
function setSubSort(mode) {
  subSort = mode;
  try { localStorage.setItem(SUBSORT_KEY, mode); } catch (e) {}
  renderBenchList();
  if (openPopoverPos) fillSubsPopover(openPopoverPos);
  if (sidebarZone && !compareId) renderSidebar();
}

function renderBenchList() {
  const list = document.getElementById('benchList');
  const startingIds = new Set(ZONE_ORDER.map(zone => getStarter(zone)?.id).filter(Boolean));
  // Goalies carry no timeOnIcePerGame (that's a skater-only stat) --
  // they sink to the bottom of a TOI-sorted list, which is fine for a
  // single-team roster with usually one backup goalie.
  // Same organizational-roster filter as subEligiblePlayers() above --
  // exclude anyone with zero games played this season, since they have
  // no real stats and were making this list needlessly long.
  const bench = teamPlayers
    .filter(p => !startingIds.has(p.id))
    .filter(p => (p.gamesPlayedSkater || 0) > 0 || (p.gamesPlayedGoalie || 0) > 0)
    ;
  bench.splice(0, bench.length, ...sortSubs(bench, false));
  document.getElementById('benchTitle').textContent = 'Bench & Rotation (by ' + (subSort === 'rating' ? 'Rating' : 'Time on Ice') + ')';
  renderSortToggles();

  if (!bench.length) {
    list.innerHTML = '<div class="bench-empty">No bench players on this roster yet.</div>';
    return;
  }

  list.innerHTML = bench.map((p, i) => {
    const isGoalie = p.positionCode === 'G';
    const dotVal = p.rating != null ? p.rating : '—';
    const dotColor = ratingColor(p.rating);
    const stats = isGoalie
      ? `
        <div class="bench-stat"><div class="bench-stat-val">${p.wins != null && p.losses != null ? p.wins + '-' + p.losses : '—'}</div><div class="bench-stat-label">w-l</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.gaa != null ? p.gaa.toFixed(2) : '—'}</div><div class="bench-stat-label">gaa</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${formatSavePct(p.savePct) || '—'}</div><div class="bench-stat-label">sv%</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.shutouts != null ? p.shutouts : '—'}</div><div class="bench-stat-label">so</div></div>
      `
      : `
        <div class="bench-stat"><div class="bench-stat-val">${p.goals != null ? p.goals : '—'}</div><div class="bench-stat-label">g</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.assists != null ? p.assists : '—'}</div><div class="bench-stat-label">a</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${p.points != null ? p.points : '—'}</div><div class="bench-stat-label">p</div></div>
        <div class="bench-stat"><div class="bench-stat-val">${formatToi(p.toiPerGame) || '—'}</div><div class="bench-stat-label">toi</div></div>
      `;
    return `
      <div class="bench-row" data-pid="${p.id}">
        <div class="bench-rank">${i + 1}</div>
        <div class="bench-dot" style="background:${dotColor}">${dotVal}</div>
        <div class="bench-name-block">
          <div class="bench-name">${p.name}</div>
          <div class="bench-meta">${p.positionCode || ''}</div>
        </div>
        ${stats}
      </div>
    `;
  }).join('');
  attachPopupHandlers(list);
}

// ══════════════════════════════════════════
// PLAYER STAT POPUP (hover, rink cards AND
// bench rows -- both wired via the same
// per-node mouseenter/mouseleave mechanics)
// ══════════════════════════════════════════
function attachPopupHandlers(container) {
  container.querySelectorAll('[data-pid]').forEach(el => {
    el.addEventListener('mouseenter', () => showPopup(el.dataset.pid, el));
    el.addEventListener('mouseleave', hidePopup);
  });
}

// ══════════════════════════════════════════
// SUBSTITUTIONS (click a starter -> popover of
// eligible bench players, gated by position_group
// for forward/defenseman zones, exact position for G)
// ══════════════════════════════════════════
let openPopoverPos = null;

function subEligiblePlayers(zone) {
  const allStarterIds = new Set(ZONE_ORDER.map(z => getStarter(z)?.id).filter(Boolean));
  let pool;
  if (ZONE_GROUP[zone]) {
    pool = teamPlayers.filter(p => p.positionGroup === ZONE_GROUP[zone]);
  } else {
    pool = teamPlayers.filter(p => p.positionCode === ZONE_POSCODE[zone]);
  }
  pool = pool.filter(p => !allStarterIds.has(p.id));
  // Roster data includes the full organization -- prospects, AHL
  // players, recent draft picks who've never appeared in an NHL game.
  // These have no real stats to compare and just add noise to the
  // substitution list, so exclude anyone with zero games played this
  // season (skater or goalie) from being a sub candidate at all.
  pool = pool.filter(p => (p.gamesPlayedSkater || 0) > 0 || (p.gamesPlayedGoalie || 0) > 0);
  return sortSubs(pool, zone === 'G');
}

function subsLabel(zone) {
  if (zone === 'G') return 'Sub in (goalies)';
  if (ZONE_GROUP[zone] === 'forward') return 'Sub in (forwards)';
  if (ZONE_GROUP[zone] === 'defenseman') return 'Sub in (defensemen)';
  return 'Sub in';
}

function fillSubsPopover(zone) {
  const popover = document.getElementById('subsPop');
  const subs = subEligiblePlayers(zone);
  const isGoalie = zone === 'G';
  popover.innerHTML = `<div class="subs-pop-label"><span>${subsLabel(zone)}</span><span class="sort-toggle" data-sort-toggle style="margin-left:0"></span></div>` +
    (subs.length ? subs.map(s => `
      <div class="subs-row" data-pid="${s.id}">
        <div class="subs-dot" style="background:${ratingColor(s.rating)}">${s.rating != null ? s.rating : '—'}</div>
        <div class="subs-name">${s.name}</div>
        <div class="subs-mpg">${isGoalie ? (s.gamesStarted || 0) + ' gs' : (formatToi(s.toiPerGame) || '—')}</div>

function attachSubsPopoverHandlers(layer) {
  layer.querySelectorAll('.player-card').forEach(card => {

      const popover = document.getElementById('subsPop');
      if (openPopoverPos === zone) {
        popover.classList.remove('open');
        openPopoverPos = null;

    });
  });

function positionPopup(popup, anchorEl) {
  const rect = anchorEl.getBoundingClientRect();
  const margin = 10;
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;

  let left = rect.right + margin;
  if (left + pw > window.innerWidth - margin) {
    left = rect.left - pw - margin; // flip to the left of the anchor
  }
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.top + rect.height / 2 - ph / 2;
  top = Math.max(margin, Math.min(top, window.innerHeight - ph - margin));

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

// ── Advanced stats ──
// Percentile color: red at 0, amber at 50, green at 99 (copied from nfl-formation-view.html).
const PCT_RED = [239, 68, 68], PCT_AMBER = [245, 190, 40], PCT_GREEN = [34, 197, 94];
const PCT_NEUTRAL = '#8b93b0';
function pctColor(pct) {
  const [a, b, t] = pct <= 50 ? [PCT_RED, PCT_AMBER, pct / 50] : [PCT_AMBER, PCT_GREEN, (pct - 50) / 49];
  return 'rgb(' + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',') + ')';
}
function ordinal(n) {
  const r = n % 100;
  if (r >= 11 && r <= 13) return n + 'th';
  return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
}


// Qualifiers (per season): skaters GP >= 0.3 x G and TOI/GP >= 8:00; goalies GP >= 0.2 x G.
// G = that season's max skater games played anywhere in the data (current / prior).
const SKATER_GP_FRAC = 0.3, SKATER_MIN_TOI = 480, GOALIE_GP_FRAC = 0.2;
let leagueG = { cur: 0, prev: 0 };
let pctIndex = { cur: {}, prev: {} }; // season -> group -> stat key -> sorted values of every qualified player
let popN = { cur: {}, prev: {} };     // season -> group -> number of qualified players

const isNum = v => typeof v === 'number' && !isNaN(v);
const fmtSv = v => v.toFixed(3).replace(/^0\./, '.');
const GROUP_NAME = { forward: 'forwards', defenseman: 'defensemen', goalie: 'goalies' };
const GROUP_SHORT = { forward: 'forwards', defenseman: 'D', goalie: 'goalies' };
const groupOf = p => p.positionGroup;
const seasonLabel = id => id ? String(id).slice(0, 4) + '-' + String(id).slice(6) : '';

// Rates are computed from the raw season block: per-60 uses total ice time = GP x TOI/GP.
function per60(b, num) {
  if (!b || !isNum(b[num]) || !isNum(b.gamesPlayed) || !isNum(b.timeOnIcePerGame) || b.gamesPlayed <= 0 || b.timeOnIcePerGame <= 0) return null;
  return b[num] / (b.gamesPlayed * b.timeOnIcePerGame / 3600);
}
const SK_ADV = {
  p60:  { label: 'Points/60',   val: b => per60(b, 'points'),   fmt: v => v.toFixed(2), def: 'Points per 60 minutes of ice time.' },
  g60:  { label: 'Goals/60',    val: b => per60(b, 'goals'),    fmt: v => v.toFixed(2), def: 'Goals per 60 minutes of ice time.' },
  s60:  { label: 'Shots/60',    val: b => per60(b, 'shots'),    fmt: v => v.toFixed(1), def: 'Shots on goal per 60 minutes of ice time.' },
  shp:  { label: 'S%',          val: b => isNum(b.shootingPct) ? b.shootingPct * 100 : null, fmt: v => v.toFixed(1) + '%', def: 'Share of his shots that became goals.' },
  ev60: { label: 'EV Points/60', val: b => per60(b, 'evPoints'), fmt: v => v.toFixed(2), def: 'Even-strength points per 60 minutes of total ice time.' },
  fo:   { label: 'Faceoff%',    val: (b, p) => p.positionCode === 'C' && isNum(b.faceoffWinPct) ? b.faceoffWinPct * 100 : null, fmt: v => v.toFixed(1) + '%', def: 'Faceoffs won (centers only).' },
  toi:  { label: 'TOI/GP',      val: b => isNum(b.timeOnIcePerGame) ? b.timeOnIcePerGame : null, fmt: v => formatToi(v), style: 'ice time', def: 'Average ice time per game. A role stat, not a quality one.' },
};
const G_ADV = {
  sv:  { label: 'SV%', val: b => isNum(b.savePct) ? b.savePct : null, fmt: fmtSv, def: 'Share of shots on goal he stopped.' },
  gaa: { label: 'GAA', val: b => isNum(b.goalsAgainstAverage) ? b.goalsAgainstAverage : null, fmt: v => v.toFixed(2), lower: true, def: 'Goals allowed per 60 minutes. Lower is better.' },
};
const advMeta = p => p.positionCode === 'G' ? G_ADV : SK_ADV;
const advKeys = p => p.positionCode === 'G' ? ['sv', 'gaa'] : ['p60', 'g60', 's60', 'shp', 'ev60', 'fo', 'toi'];

function qualified(p, b) {
  if (!b || !isNum(b.gamesPlayed)) return false;
  const which = b === p.cur ? 'cur' : 'prev';
  const G = leagueG[which];
  if (!(G > 0)) return false;
  if (p.positionCode === 'G') return b.gamesPlayed >= GOALIE_GP_FRAC * G;
  return b.gamesPlayed >= SKATER_GP_FRAC * G && isNum(b.timeOnIcePerGame) && b.timeOnIcePerGame >= SKATER_MIN_TOI;
}

function buildAdv() {
  leagueG = { cur: 0, prev: 0 };
  for (const p of allPlayers) {
    if (p.cur && p.positionCode !== 'G' && p.cur.gamesPlayed > leagueG.cur) leagueG.cur = p.cur.gamesPlayed;
    if (p.prev && p.positionCode !== 'G' && p.prev.gamesPlayed > leagueG.prev) leagueG.prev = p.prev.gamesPlayed;
  }
  pctIndex = { cur: {}, prev: {} };
  popN = { cur: {}, prev: {} };
  for (const p of allPlayers) {
    for (const which of ['cur', 'prev']) {
      const b = p[which];
      if (!b || !qualified(p, b)) continue;
      const g = groupOf(p), meta = advMeta(p);
      popN[which][g] = (popN[which][g] || 0) + 1;
      const idx = ((pctIndex[which][g]) ||= {});
      for (const k of advKeys(p)) {
        const v = meta[k].val(b, p);
        if (isNum(v)) (idx[k] ||= []).push(v);
      }
    }
  }
  for (const w of ['cur', 'prev']) for (const g in pctIndex[w]) for (const k in pctIndex[w][g]) pctIndex[w][g][k].sort((a, b) => a - b);
  console.info('[IceView] qualifier G =', leagueG);
}

// Which season's block a player shows: current if qualified; else last season if that qualifies (with a note);
// else current raw values tagged low sample (no bars), or last season's raw if there are no current values.
function advView(p) {
  if (qualified(p, p.cur)) return { which: 'cur', season: p.curSeason, b: p.cur, qualified: true };
  if (qualified(p, p.prev)) return { which: 'prev', season: p.prevSeason, b: p.prev, qualified: true, note: 'this season: low sample' };
  if (p.cur) return { which: 'cur', season: p.curSeason, b: p.cur, qualified: false };
  if (p.prev) return { which: 'prev', season: p.prevSeason, b: p.prev, qualified: false };
  return null;
}

// % of the qualified same-group population he beats (ties count half), inverted for lower-is-better stats.
// Null when unqualified or the population is under 10. (copied from mlb/diamond-view.html)
function percentileOf(p, v, key) {
  const a = v && v.qualified ? v : null;
  const arr = a && pctIndex[a.which][groupOf(p)] && pctIndex[a.which][groupOf(p)][key];
  const x = a ? advMeta(p)[key].val(a.b, p) : null;
  if (!arr || arr.length < 10 || typeof x !== 'number' || isNaN(x)) return null;
  const lower = !!advMeta(p)[key].lower;
  let beaten = 0, eq = 0;
  for (const y of arr) {
    if (y === x) eq++;
    else if (lower ? y > x : y < x) beaten++;
  }
  beaten += 0.5 * (eq - 1); // he is one of the "tied" players; exclude himself
  return Math.min(99, Math.round(beaten / (arr.length - 1) * 100));
}

function statPct(p, v, key) {
  const m = advMeta(p)[key];
  const pct = percentileOf(p, v, key);
  if (pct == null) return { pct: null, color: null, text: '' };
  return {
    pct,
    color: m.style ? PCT_NEUTRAL : pctColor(pct),
    text: m.style ? 'more ' + m.style + ' than ' + pct + '% of ' + GROUP_SHORT[groupOf(p)] : ordinal(pct) + ' pct',
  };
}

function advStatHtml(p, v, key) {
  const m = advMeta(p)[key], x = m.val(v.b, p);
  if (!isNum(x)) return '';
  const { pct, color: c, text } = statPct(p, v, key);
  return `
    <div class="sb-stat">
      <div class="sb-stat-top"><span class="sb-stat-label">${m.label}${!v.qualified ? ' <span class="sb-low">low sample</span>' : ''}</span><span class="sb-stat-val">${m.fmt(x)}</span></div>
      ${pct != null ? `<div class="sb-bar-wrap"><div class="sb-bar"><div class="sb-bar-fill" style="width:${pct}%;background:${c}"></div></div><span class="sb-pct" style="color:${c}">${text}</span></div>` : ''}
      <div class="sb-def">${m.def}</div>
    </div>`;
}

function qualText(p, which) {
  const G = leagueG[which];
  return p.positionCode === 'G' ? 'min. ' + Math.ceil(GOALIE_GP_FRAC * G) + ' GP'
    : 'min. ' + Math.ceil(SKATER_GP_FRAC * G) + ' GP and 8:00 TOI/GP';
}

function advSectionHtml(p) {
  const v = advView(p);
  if (!v) return '';
  const rows = advKeys(p).map(k => advStatHtml(p, v, k)).join('');
  if (!rows) return '';
  const g = groupOf(p), n = popN[v.which][g];
  const caption = v.qualified
    ? `Ranked among ${n} qualified ${GROUP_NAME[g]} in ${seasonLabel(v.season)} (${qualText(p, v.which)})`
    : `Below the ${qualText(p, v.which)} minimum in ${seasonLabel(v.season)}: not ranked`;
  return `<div class="sb-section"><div class="sb-section-title">Advanced Stats · ${seasonLabel(v.season)}</div>
    ${v.note ? `<div class="sb-note" style="margin:-4px 0 4px">${v.note}</div>` : ''}${rows}
    <div class="sb-caption">${caption}</div></div>`;
}

// ── Season stats ──
const txtInt = v => String(v);
const SK_BOX = [
  { label: 'GP', k: 'gamesPlayed', f: txtInt }, { label: 'G', k: 'goals', f: txtInt }, { label: 'A', k: 'assists', f: txtInt },
  { label: 'PTS', k: 'points', f: txtInt }, { label: '+/-', k: 'plusMinus', f: v => (v > 0 ? '+' : '') + v },
  { label: 'PIM', k: 'penaltyMinutes', f: txtInt, lower: true }, { label: 'SOG', k: 'shots', f: txtInt },
  { label: 'S%', k: 'shootingPct', f: v => (v * 100).toFixed(1) + '%' }, { label: 'TOI/GP', k: 'timeOnIcePerGame', f: formatToi },
  { label: 'FO%', k: 'faceoffWinPct', f: v => (v * 100).toFixed(1) + '%' },
];
const G_BOX = [
  { label: 'GP', k: 'gamesPlayed', f: txtInt }, { label: 'W', k: 'wins', f: txtInt }, { label: 'L', k: 'losses', f: txtInt, lower: true },
  { label: 'SV%', k: 'savePct', f: fmtSv }, { label: 'GAA', k: 'goalsAgainstAverage', f: v => v.toFixed(2), lower: true }, { label: 'SO', k: 'shutouts', f: txtInt },
];
const boxDefs = p => p.positionCode === 'G' ? G_BOX : SK_BOX;
const boxText = (b, d) => b && isNum(b[d.k]) ? d.f(b[d.k]) : '—';

function seasonStatsHtml(p) {
  const rows = boxDefs(p).map(d => `<div class="sb-tbl-l">${d.label}</div><div class="sb-tbl-v">${boxText(p.cur, d)}</div><div class="sb-tbl-v">${boxText(p.prev, d)}</div>`).join('');
  return `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
    <div class="sb-tbl3"><div></div><div class="sb-tbl-h">This season</div><div class="sb-tbl-h">Last season</div>${rows}</div>
    <div class="sb-caption">${seasonLabel(p.curSeason)}${p.prev ? ' · ' + seasonLabel(p.prevSeason) : ''}</div></div>`;
}

const lastName = p => p.name.split(' ').slice(1).join(' ') || p.name;
function ageOf(birth) {
  if (!birth) return null;
  const d = new Date(birth + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const now = new Date();
  let a = now.getFullYear() - d.getFullYear();
  if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) a--;
  return a;
}

function subsSectionHtml(p) {
  const isG = sidebarZone === 'G';
  const cands = subEligiblePlayers(sidebarZone);
  const rows = cands.length ? cands.map(c => `
      <div class="sb-sub" onclick="openCompare('${c.id}', event)">
        <div class="sb-sub-rating" style="color:${ratingColor(c.rating)}">${c.rating != null ? c.rating : '—'}</div>
        <div class="sb-sub-name">${c.name}</div>
        <div class="sb-sub-pos">${c.positionCode || ''} · ${isG ? (c.gamesStarted || 0) + ' gs' : (formatToi(c.toiPerGame) || '—')}</div>
      </div>`).join('') : '<div class="sb-empty">No other players available at this position.</div>';
  return `<div class="sb-section" style="border-bottom:none">
      <div class="sb-section-title sb-sort"><span>Substitutes</span><span class="sort-toggle" data-sort-toggle></span></div>${rows}</div>`;
}

function renderSidebar(resetScroll) {
  const el = document.getElementById('sbScroll');
  const p = sidebarZone ? getStarter(sidebarZone) : null;
  if (!p) { closeSidebar(); return; }
  if (compareId) { renderCompare(el, p); return; }

  const age = ageOf(p.birthDate);
  const meta1 = `<img class="sb-teamlogo" src="${teamLogoUrl(p.team)}" alt="">${p.team} · ${p.positionCode || ''}${sidebarZone !== p.positionCode && ZONE_LABEL[sidebarZone] !== p.positionCode ? ' · playing ' + ZONE_LABEL[sidebarZone] : ''}`;
  const meta2 = [age != null ? 'Age ' + age : null, formatHeight(p.heightIn), p.weight != null ? p.weight + ' lbs' : null,
                 p.shoots ? (p.positionCode === 'G' ? 'Catches ' : 'Shoots ') + p.shoots : null].filter(Boolean).join(' · ');
  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-head">
      <div style="flex:1;min-width:0">
        <div class="sb-name"><span>${p.jersey != null ? '#' + p.jersey + ' ' : ''}${p.name}</span></div>
        <div class="sb-meta">${meta1}</div>
        ${meta2 ? `<div class="sb-meta">${meta2}</div>` : ''}
      </div>
      <div class="sb-rating"><div class="sb-rating-val" style="color:${ratingColor(p.rating)}">${p.rating != null ? p.rating : '—'}</div><div class="sb-rating-label">Overall</div></div>
    </div>
    ${advSectionHtml(p)}
    ${seasonStatsHtml(p)}
    ${subsSectionHtml(p)}`;
  document.body.classList.add('sb-open');
  renderSortToggles();
  if (resetScroll) el.scrollTop = 0;
  setSelectedHighlight();
  syncURL();
}

function openCompare(id, event) {

  renderSidebar(true);
}

function closeCompare(event) {

}

function swapFromCompare(event) {

}

// Starter vs. candidate. Season stats (this season) and advanced rows are compared only where both players
// have a value; each percentile stays within the player's own group and displayed season.
function renderCompare(el, a) {
  const b = teamPlayers.find(x => String(x.id) === String(compareId));
  if (!b) { compareId = null; renderSidebar(); return; }

  const rows = boxDefs(a).map(d => {
    const e = boxDefs(b).find(x => x.label === d.label);
    if (!e || !a.cur || !b.cur || !isNum(a.cur[d.k]) || !isNum(b.cur[e.k])) return '';
    const va = a.cur[d.k], vb = b.cur[e.k], ta = boxText(a.cur, d), tb = boxText(b.cur, e);
    let best = '';
    if (ta !== tb) best = (d.lower ? va < vb : va > vb) ? 'a' : 'b';
    return `<div class="sb-tbl-l">${d.label}</div><div class="sb-tbl-v${best === 'a' ? ' best' : ''}">${ta}</div><div class="sb-tbl-v${best === 'b' ? ' best' : ''}">${tb}</div>`;
  }).join('');
  const tableHtml = rows ? `<div class="sb-section"><div class="sb-section-title">Season Stats</div>
      <div class="sb-tbl"><div></div><div class="sb-tbl-h">${lastName(a)}</div><div class="sb-tbl-h">${lastName(b)}</div>${rows}</div>
      <div class="sb-caption">${seasonLabel(a.curSeason)} season</div></div>` : '';

  const va = advView(a), vb = advView(b);
  const line = (pl, v, key) => {
    const m = advMeta(pl)[key], x = m.val(v.b, pl);
    const { pct, color } = statPct(pl, v, key);
    const tag = lastName(pl) + (v.which === 'prev' ? ' · ' + seasonLabel(v.season).replace(/^20/, '') : '');
    return `<div class="sb-cmp-line"><span class="sb-cmp-tag" title="${pl.name} · ${seasonLabel(v.season)}">${tag}</span>
      <div class="sb-bar">${pct != null ? `<div class="sb-bar-fill" style="width:${pct}%;background:${color}"></div>` : ''}</div>
      <span class="sb-cmp-val">${m.fmt(x)}</span>
      <span class="sb-cmp-pct" style="color:${color || 'inherit'}">${pct != null ? ordinal(pct) : '<span class="sb-low" style="margin:0">low sample</span>'}</span></div>`;
  };
  let advHtml = '';
  if (va && vb) {
    const shared = advKeys(a).filter(k => advKeys(b).includes(k) && isNum(advMeta(a)[k].val(va.b, a)) && isNum(advMeta(b)[k].val(vb.b, b)));
    const advRows = shared.map(key =>
      `<div class="sb-cmp-row"><div class="sb-cmp-top"><span class="sb-stat-label">${advMeta(a)[key].label}</span></div>${line(a, va, key)}${line(b, vb, key)}</div>`).join('');
    if (advRows) advHtml = `<div class="sb-section"><div class="sb-section-title">Advanced Stats · percentile vs. own group</div>${advRows}
      <div class="sb-caption">${lastName(a)}: ${seasonLabel(va.season)}${va.qualified ? '' : ' (low sample)'} · ${lastName(b)}: ${seasonLabel(vb.season)}${vb.qualified ? '' : ' (low sample)'}</div></div>`;
  }

  const head = (pl, tag) => `<div>
      <div class="sb-cmp-tagline">${tag}</div>
      <div class="sb-cmp-name">${pl.jersey != null ? '#' + pl.jersey + ' ' : ''}${pl.name}</div>
      <div class="sb-cmp-sub">${pl.positionCode || ''}${pl.heightIn ? ' · ' + formatHeight(pl.heightIn) : ''}</div>
      <div class="sb-cmp-rating" style="color:${ratingColor(pl.rating)}">${pl.rating != null ? pl.rating : '—'}</div>
    </div>`;

  el.innerHTML = `
    <button class="sb-close" onclick="closeSidebar()" aria-label="Close">&times;</button>
    <div class="sb-cmp-head">${head(a, 'Starter')}${head(b, 'Substitute')}</div>
    <div class="sb-cmp-actions">
      <button class="sb-btn" onclick="closeCompare(event)">Back</button>
      <button class="sb-btn primary" onclick="swapFromCompare(event)">Swap in</button>
    </div>
    ${tableHtml}${advHtml}
    ${!tableHtml && !advHtml ? '<div class="sb-section"><div class="sb-empty">These players have no stats in common to compare.</div></div>' : ''}`;
  document.body.classList.add('sb-open');
  el.scrollTop = 0;
  setSelectedHighlight();
  syncURL();
}

// ══════════════════════════════════════════
// TEAM DROPDOWN
// ══════════════════════════════════════════
function buildTeamsDropdown() {
  const dd = document.getElementById('teamsDropdown');
  dd.innerHTML = TEAM_ABBRS.map(abbr => {
    const sel = abbr === currentTeam ? 'selected' : '';
    return `
      <div class="team-opt ${sel}" onclick="selectTeam('${abbr}')">
        <img class="team-logo team-logo-opt" src="${teamLogoUrl(abbr)}" alt="${abbr}" loading="lazy">
        <span>${abbr}</span>
      </div>
    `;
  }).join('');
}

function toggleTeamDropdown() {
  document.getElementById('teamsDropdown').classList.toggle('open');
}

function selectTeam(abbr) {
  closeSidebar();
  currentTeam = abbr;
  document.getElementById('teamsDropdown').classList.remove('open');
  buildTeamsDropdown();
  loadTeam(currentTeam).then(syncURL);
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.team-selector-wrap')) {
    document.getElementById('teamsDropdown').classList.remove('open');
  }
  if (!e.target.closest('.player-card') && !e.target.closest('.subs-pop')) {
    document.getElementById('subsPop').classList.remove('open');
    openPopoverPos = null;
  }
  // Click on empty rink closes the sidebar.
  if (sidebarZone && e.target.closest('.court-canvas') && !e.target.closest('.player-card')) closeSidebar();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sidebarZone) closeSidebar();
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('team') && TEAMS[urlParams.get('team')]) currentTeam = urlParams.get('team');
const urlPlayer = urlParams.get('player');

updateSbToggle();
buildTeamsDropdown();
loadTeam(currentTeam).then(() => {
  // Reopen the sidebar if ?player= is someone currently on the ice for this team; otherwise ignore it.
  if (sidebarOn && urlPlayer) {
    const zone = ZONE_ORDER.find(z => { const st = getStarter(z); return st && String(st.id) === urlPlayer; });
    if (zone) openSidebar(zone);
  }
});
</script>
